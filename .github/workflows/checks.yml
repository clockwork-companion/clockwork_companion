# Runs on every pull request into Dev or main (and by hand from the Actions tab).
# A red check means: don't merge yet. The log says what failed; screenshots are attached to the run.
#
# The browser tests run in parallel groups, so the wait is the slowest group, not all of them in a row.
# They use the Google Chrome already installed on GitHub's runners (PW_CHANNEL=chrome), so no browser
# is downloaded. Run them locally as before: without PW_CHANNEL they use Playwright's own Chromium.
#
# The "Protect main and Dev" ruleset requires the job named "check". It only passes when every other job
# passed, so keep its name. A new test goes into one of the groups under "tests" (pick the shortest).
name: Checks
on:
  pull_request:
    branches: [Dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and file checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }

      - name: sw.js is not committed (it's generated on every build)
        run: |
          if git ls-files --error-unmatch sw.js >/dev/null 2>&1; then
            echo "::error file=sw.js::sw.js is generated by the build and must not be committed. Run: git rm --cached sw.js (it's in .gitignore)."
            exit 1
          fi

      - name: Source files parse
        run: for f in src/*.js; do node --check "$f" || exit 1; done

      - name: Build the website
        run: python3 src/build.py --web "$RUNNER_TEMP/site"

      - name: index.html matches src/ (run "python3 src/build.py --web ." if this fails)
        run: |
          if [ -f index.html ] && ! cmp -s "$RUNNER_TEMP/site/index.html" index.html; then
            echo "::error file=index.html::index.html is out of date with src/. Run: python3 src/build.py --web . and commit the result."
            exit 1
          fi

      - name: Built page scripts parse
        run: python3 tests/check_scripts.py "$RUNNER_TEMP/site/index.html"

  tests:
    name: Browser tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # About 3½ minutes per group. Times are from the runs on 2026-10-26.
          - group: smoke test, every theme
            tests: smoke
          - group: Warding and Powdertinkering
            tests: warding powder_saved craft_unlock
          - group: Daemonology, Dreamwalking, Harmony
            tests: demonology dreamwalking harmony
          - group: workshop, Alchemy, fixes
            tests: workshop alchemy craft_magic_fixes powder_custom
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Build the website
        run: python3 src/build.py --web "$RUNNER_TEMP/site"

      - name: Install Playwright (the browser is the runner's Chrome)
        run: pip install "playwright>=1.44,<2"

      - name: Run the tests
        run: |
          failed=""
          for t in ${{ matrix.tests }}; do
            echo "::group::tests/$t.py"
            python3 "tests/$t.py" "$RUNNER_TEMP/site" smoke-shots || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::These tests failed:$failed (open their section in the log above)"
            exit 1
          fi

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots-${{ strategy.job-index }}
          path: smoke-shots
          if-no-files-found: ignore

  check:
    name: check
    needs: [build, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "build: ${{ needs.build.result }}, tests: ${{ needs.tests.result }}"
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.tests.result }}" = success ]
