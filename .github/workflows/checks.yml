# Runs on every pull request into Dev or main (and by hand from the Actions tab).
# A red check means: don't merge yet. The log says what failed; screenshots are attached to the run.
name: Checks
on:
  pull_request:
    branches: [Dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # installing the test browser alone can take 10 minutes on GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }

      - name: sw.js is not committed (it's generated on every build)
        run: |
          if git ls-files --error-unmatch sw.js >/dev/null 2>&1; then
            echo "::error file=sw.js::sw.js is generated by the build and must not be committed. Run: git rm --cached sw.js (it's in .gitignore)."
            exit 1
          fi

      - name: Source files parse
        run: for f in src/*.js; do node --check "$f" || exit 1; done

      - name: Build the website
        run: python3 src/build.py --web "$RUNNER_TEMP/site"

      - name: index.html matches src/ (run "python3 src/build.py --web ." if this fails)
        run: |
          if [ -f index.html ] && ! cmp -s "$RUNNER_TEMP/site/index.html" index.html; then
            echo "::error file=index.html::index.html is out of date with src/. Run: python3 src/build.py --web . and commit the result."
            exit 1
          fi

      - name: Built page scripts parse
        run: python3 tests/check_scripts.py "$RUNNER_TEMP/site/index.html"

      - name: Install the test browser
        run: |
          pip install "playwright>=1.44,<2"
          python -m playwright install --with-deps chromium

      - name: Smoke test (every theme, desktop and 390 px)
        run: python3 tests/smoke.py "$RUNNER_TEMP/site" smoke-shots

      - name: Workshop jobs between players (Firebase stand-in)
        run: python3 tests/workshop.py "$RUNNER_TEMP/site" smoke-shots

      - name: Crafting appears only with crafting skills
        run: python3 tests/craft_unlock.py "$RUNNER_TEMP/site"

      - name: Custom Powdertinkering parts
        run: python3 tests/powder_custom.py "$RUNNER_TEMP/site" smoke-shots

      - name: Saved Powdertinkering recipes
        run: python3 tests/powder_saved.py "$RUNNER_TEMP/site" smoke-shots

      - name: Warding (Magic tab)
        run: python3 tests/warding.py "$RUNNER_TEMP/site" smoke-shots

      - name: Occult Harmony (Magic tab)
        run: python3 tests/harmony.py "$RUNNER_TEMP/site" smoke-shots

      - name: Daemonology (Magic tab)
        run: python3 tests/demonology.py "$RUNNER_TEMP/site" smoke-shots

      - name: Dreamwalking (Magic tab)
        run: python3 tests/dreamwalking.py "$RUNNER_TEMP/site" smoke-shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
