<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clockwork Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Federant&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a printed-sheet look. Ink frames with bracket corners on sheet-grey paper,
   one brass accent for actions, semantic reds/greens only for vitals. */
:root {
  --paper: #e4e2df; --card: #f1f0ed; --sunk: #d9d6d2; --ink: #151413; --ink-2: #4b4844; --ink-3: #7a766f;
  --seal: #3a3632; --seal-2: #6e6862; --rule: #1d1b19; --bracket: color-mix(in srgb, var(--rule) 78%, transparent); --hair: #b9b5ae; --brass: #8a5d17; --brass-ink: #fff8ec; --brass-soft: #ead9bb;
  --blood: #922020; --blood-soft: #e9c9c4; --tox: #44702a; --tox-soft: #d3e2c6; --hunger: #8a6512; --hunger-soft: #eadcb8;
  --life: #1f5f78; --life-soft: #c8dde5; --warn: #9a5a00; --bad: #a32020; --good: #2f6b2f;
  --f-display: "Federant", "Palatino Linotype", Palatino, Georgia, serif;
  --f-head: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --pip: 17px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --seal: #0b0a09; --seal-2: #4a4540;
  --paper: #141312; --card: #1d1c1a; --sunk: #262421; --ink: #ebe7e0; --ink-2: #b2ada5; --ink-3: #85807a;
  --rule: #d9d4cb; --hair: #46423d; --brass: #d39d48; --brass-ink: #1a1306; --brass-soft: #3b2e19;
  --blood: #e0605a; --blood-soft: #4a1f1d; --tox: #8cc06a; --tox-soft: #263620; --hunger: #d9ab4b; --hunger-soft: #3b3018;
  --life: #6fb6d2; --life-soft: #1c3440; --warn: #e3a447; --bad: #ef6d66; --good: #7fc27f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --seal: #0b0a09; --seal-2: #4a4540;
  --paper: #141312; --card: #1d1c1a; --sunk: #262421; --ink: #ebe7e0; --ink-2: #b2ada5; --ink-3: #85807a;
  --rule: #d9d4cb; --hair: #46423d; --brass: #d39d48; --brass-ink: #1a1306; --brass-soft: #3b2e19;
  --blood: #e0605a; --blood-soft: #4a1f1d; --tox: #8cc06a; --tox-soft: #263620; --hunger: #d9ab4b; --hunger-soft: #3b3018;
  --life: #6fb6d2; --life-soft: #1c3440; --warn: #e3a447; --bad: #ef6d66; --good: #7fc27f; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { overflow-x: clip; max-width: 1180px; margin: 0 auto; padding-block: 14px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 3px solid var(--rule); }
.brand { font-family: var(--f-display); font-size: 30px; line-height: 1; letter-spacing: .02em; }
.brand small { font-family: var(--f-head); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-left: 8px; vertical-align: middle; }
.status { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.dot.live { background: var(--good); }
.dot.local { background: var(--warn); }

/* roster */
.roster { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; background: var(--card);
  border: 1.5px solid var(--hair); border-radius: 3px; text-align: left; min-width: 0; }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-current="true"] { border-color: var(--rule); box-shadow: inset 0 -3px 0 var(--brass); }
.chip .who { display: grid; line-height: 1.15; }
.chip b { font-weight: 700; font-size: 14px; white-space: nowrap; }
.chip span { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.chip .bar { height: 3px; background: var(--blood-soft); margin-top: 3px; }
.chip .bar i { display: block; height: 100%; background: var(--blood); }
.chip.add { padding: 5px 14px; font-family: var(--f-head); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; border-style: dashed; }
.thumb { width: 34px; height: 34px; flex: 0 0 34px; background: var(--sunk); border: 1px solid var(--rule); display: grid; place-items: center;
  font-family: var(--f-display); font-size: 16px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* frames echo the printed sheet's bracket corners */
.frame { position: relative; isolation: isolate; border-left: 5px solid var(--bracket); padding: 18px 0 22px 26px; }
.frame::before, .frame::after { content: ""; position: absolute; left: -5px; width: 40px; height: 5px; background: var(--bracket); }
.frame::before { top: 0; } .frame::after { bottom: 0; }
/* Scattered alchemical sigils. Each one gets its own position, size, tilt, strength and wear from the page.
   Drawn in the ink colour so they follow the theme. */
.sigil { position: absolute; z-index: -1; pointer-events: none; aspect-ratio: 1; --k: 1;
  left: var(--x); top: var(--y); width: calc(var(--s) * var(--k)); max-width: none; opacity: var(--o);
  transform: translate(-50%, -50%) rotate(var(--r)); background: var(--ink);
  -webkit-mask-image: var(--sigil), var(--wear, linear-gradient(#000, #000)); mask-image: var(--sigil), var(--wear, linear-gradient(#000, #000));
  -webkit-mask-size: contain, cover; mask-size: contain, cover; -webkit-mask-position: center; mask-position: center;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-composite: source-in; mask-composite: intersect; }
.fade-a { --wear: linear-gradient(115deg, #000 25%, transparent 88%); }
.fade-b { --wear: radial-gradient(circle at 30% 70%, #000 30%, transparent 75%); }

.h { font-family: var(--f-head); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 23px; line-height: 1.1;
  display: flex; align-items: center; gap: 10px; margin: 0 0 6px; text-wrap: balance; }
.h > span:not(.orn) { flex: 0 1 auto; }
/* an ornamental rule after each heading: line, gear-diamond, line */
.orn { flex: 1 1 auto; min-width: 40px; height: 14px; position: relative; }
.orn::before { content: ""; position: absolute; left: 0; right: 22px; top: 6px; border-top: 1.5px solid var(--hair); border-bottom: 1.5px solid var(--hair); height: 3px; }
.orn::after { content: ""; position: absolute; right: 4px; top: 0; width: 10px; height: 10px; border: 2px solid var(--brass); transform: rotate(45deg); background: var(--paper); }
.orn.has-btn::after { display: none; }
/* the clickable diamond: hollow = all skills, filled = invested only */
.diamond { position: absolute; right: 1px; top: -3px; width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; }
.diamond::before { content: ""; position: absolute; inset: 3px; border: 2px solid var(--brass); background: var(--paper); transform: rotate(45deg); transition: background .15s, box-shadow .15s; }
.diamond:hover::before { box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent); }
.diamond.on::before { background: var(--brass); }
.diamond:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.sub { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-3); max-width: 80ch; }
.ornate { font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .01em; text-transform: none; }
.panel { background: var(--card); border: 1.5px solid var(--hair); padding: 14px; min-width: 0; }

/* character header */
.head { display: grid; grid-template-columns: 148px minmax(0, 1fr) 270px; gap: 18px; padding: 18px 0; align-items: start; }
.portrait { width: 148px; aspect-ratio: 1; max-width: 100%; border: 4px solid var(--rule); background: var(--sunk); display: grid; place-items: center;
  font-family: var(--f-display); font-size: 54px; color: var(--ink-3); overflow: hidden; position: relative; }
.portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.15) contrast(1.05); }
.portrait .over { position: absolute; inset: auto 0 0 0; background: color-mix(in srgb, var(--rule) 82%, transparent); color: var(--paper);
  font: 600 11px/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; padding: 6px; text-align: center; opacity: 0; transition: opacity .15s; border: 0; }
.portrait:hover .over, .portrait:focus-within .over { opacity: 1; }
.namefield { font-family: var(--f-head); font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: .03em; width: 100%;
  border: 0; border-bottom: 3px solid var(--rule); background: transparent; padding: 0 0 2px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; margin-top: 12px; }
.field { display: grid; gap: 2px; min-width: 0; }
.field label, .lbl { font-family: var(--f-head); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.field input, .field select, .field textarea, .inp { border: 0; border-bottom: 1.5px solid var(--hair); background: transparent; padding: 3px 0; min-width: 0; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-bottom-color: var(--brass); outline: none; }
.field textarea { border: 1.5px solid var(--hair); padding: 6px 8px; resize: vertical; }

/* karma */
.karma { display: grid; gap: 10px; }
.karma .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--sunk); padding: 8px 10px; display: grid; }
.stat b { font: 600 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font: 600 11px/1.2 var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--rule); }
.seg button { border: 0; background: transparent; padding: 6px 4px; font: 600 12px/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--rule); color: var(--paper); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-3); font-size: 13px; }

/* buttons */
.btn { border: 1.5px solid var(--rule); background: transparent; padding: 6px 12px; font: 600 13px/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; border-radius: 2px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--brass); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 28px; height: 28px; border: 1.5px solid var(--hair); background: var(--card); font: 600 16px/1 var(--f-mono); display: inline-grid; place-items: center; border-radius: 2px; padding: 0; }
.iconbtn:hover { border-color: var(--rule); }

/* tabs: shaded folder tabs, each with its own tint, standing on a heavy rule */
.tabs { display: flex; gap: 6px; border-bottom: 6px solid var(--rule); margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs button { --tc: var(--brass); --ts: var(--brass-soft); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 11px 20px 10px; border: 1.5px solid var(--hair); border-bottom: 0; border-radius: 4px 4px 0 0;
  background: color-mix(in srgb, var(--ts) 45%, var(--sunk)); color: var(--ink-2); box-shadow: inset 0 3px 0 color-mix(in srgb, var(--tc) 55%, transparent);
  font: 700 15px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; }
.tabs .tab-vitals { --tc: var(--blood); --ts: var(--blood-soft); }
.tabs .tab-gear { --tc: var(--hunger); --ts: var(--hunger-soft); }
.tabs .tab-table { --tc: var(--life); --ts: var(--life-soft); }
.tabs button:hover { background: color-mix(in srgb, var(--ts) 75%, var(--sunk)); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--rule); border-color: var(--rule); color: var(--paper); box-shadow: inset 0 4px 0 var(--tc); }
.tabicon { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: var(--tc); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.tabpane { padding-top: 26px; display: grid; gap: 46px; grid-template-columns: minmax(0, 1fr); }
.tabpane > *, .frame, .two > *, .meters > * { min-width: 0; }

/* pips */
.pips { display: inline-flex; gap: 4px; align-items: center; }
.pip { width: var(--pip); height: var(--pip); border-radius: 50%; border: 2px solid var(--rule); background: transparent; padding: 0; flex: 0 0 auto; }
.pip.on { background: var(--rule); box-shadow: inset 0 0 0 2px var(--paper); }
.pip.capped { border-style: dotted; border-color: var(--ink-3); cursor: not-allowed; }
.pip.over { background: var(--bad); border-color: var(--bad); }
.pip:not(.capped):hover { border-color: var(--brass); }
.pips.big { --pip: 22px; gap: 6px; }

/* attributes */
.attrs { display: grid; gap: 4px; }
.attr { display: grid; grid-template-columns: 140px 132px minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 6px 0; border-bottom: 1.5px solid var(--hair); }
.attr .nm { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.attr.is-broken .nm { color: var(--bad); }
.valblock { display: flex; align-items: center; gap: 8px; }
.attr .val { font: 600 24px/1 var(--f-mono); min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.attr.is-broken .val { color: var(--bad); }
.attr .base { font: 11.5px/1.35 var(--f-mono); color: var(--ink-3); display: grid; min-width: 0; }
.attr .base b { font-weight: 600; color: var(--ink-2); }
.valblock .flag { white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 520px; }
.half { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; flex: 1 1 0; min-width: 0; }
.scale .end { font: 11px var(--f-mono); color: var(--ink-3); flex: 0 0 auto; width: 2ch; text-align: center; }
.cell { height: 20px; border: 1.5px solid var(--hair); background: transparent; padding: 0; border-radius: 1px; min-width: 0; }
.scale.low .cell { border-color: color-mix(in srgb, var(--hair) 65%, var(--bad)); }
.cell:hover { border-color: var(--brass); }
.cell.miss { background: repeating-linear-gradient(135deg, var(--bad) 0 3px, color-mix(in srgb, var(--bad) 55%, transparent) 3px 6px); border-color: var(--bad); }
.cell.up { background: var(--ink-2); border-color: var(--ink-2); }
.cell.bought { background: var(--brass); border-color: var(--brass); }
.cell.have { background: color-mix(in srgb, var(--ink-3) 18%, transparent); }
/* Sealed: a broken attribute's hard ceiling. Dark iron plates, cross-hatched, behind a heavy wall with a lock. */
.cell.sealed { background: repeating-linear-gradient(45deg, var(--seal) 0 3px, var(--seal-2) 3px 4.5px), var(--seal); border: 1.5px solid var(--seal); cursor: not-allowed; position: relative; }
.cell.sealed:hover { border-color: var(--seal); }
.cell.wall { overflow: visible; }
.cell.wall::before { content: ""; position: absolute; left: -6px; top: -6px; bottom: -6px; width: 4px; background: var(--rule); border-radius: 1px; }
.cell .lock { position: absolute; inset: 0; margin: auto; width: 10px; height: 12px; color: var(--paper); filter: drop-shadow(0 0 1px var(--seal)); }
.sealtext { font-weight: 600; color: var(--ink-2); }
.breakbtn { justify-self: start; margin-top: 2px; border-color: var(--bad); color: var(--bad); padding: 2px 8px; }
.mid { width: 36px; height: 32px; border: 2px solid var(--rule); background: var(--card); font: 600 13px var(--f-mono); padding: 0; flex: 0 0 auto; }
.mid.from-l { animation: midFromL .35s ease-out; } .mid.from-r { animation: midFromR .35s ease-out; }
@keyframes midFromL { from { transform: translateX(-60px); opacity: .2; } }
@keyframes midFromR { from { transform: translateX(60px); opacity: .2; } }
.mid.at { background: var(--rule); color: var(--paper); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px 24px; margin: 0 0 18px;
  padding: 14px 18px; background: color-mix(in srgb, var(--sunk) 70%, transparent); border: 1.5px solid var(--hair); }
.legend .item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; align-items: center; }
.legend .cell { width: 26px; height: 18px; display: inline-block; grid-row: span 2; }
.legend b { font: 600 12.5px/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; }
.legend small { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; }

/* skills */
.skillcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 32px; }
.sgroup h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 3px solid var(--rule); padding-bottom: 2px; }
.sgroup h3 small { font: 600 12px var(--f-mono); color: var(--ink-3); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto 46px; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--hair); }
.srow .n { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .m { font: 600 13px var(--f-mono); text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.srow .n em { font-style: normal; color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.srow.dim .n { color: var(--ink-3); }
.flag { font: 600 10.5px/1 var(--f-head); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border-radius: 2px; background: var(--sunk); color: var(--ink-2); vertical-align: 1px; }
.flag.warn { background: var(--hunger-soft); color: var(--warn); }
.flag.bad { background: var(--blood-soft); color: var(--bad); }
.flag.good { background: var(--tox-soft); color: var(--good); }
.flag.brass { background: var(--brass-soft); color: var(--brass); }

/* secondary */
.sec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.sec .srow { grid-template-columns: minmax(0, 1fr) auto 64px; }
.sec .pips { --pip: 19px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 11.5px var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 4px 6px; border-bottom: 3px solid var(--rule); white-space: nowrap; }
td { padding: 4px 6px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
td .inp { padding: 2px 0; }
td.num, th.num { text-align: right; }

/* vitals */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 14px; }
.meter { background: var(--card); border: 1.5px solid var(--hair); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.meter .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meter .t { font: 700 14px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; }
.meter .v { font: 600 26px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.meter .v small { font-size: 14px; color: var(--ink-3); }
.track { height: 12px; background: var(--sunk); border: 1px solid var(--hair); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; }
.track b { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--rule); opacity: .55; }
.meter .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.meter .ctl input { width: 64px; border: 1.5px solid var(--hair); background: var(--paper); padding: 3px 6px; font-family: var(--f-mono); }
.meter .note { font-size: 12.5px; color: var(--ink-2); }
/* exhaustion: every level and its effect; levels in force are tinted, the current one marked */
.exlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(6, auto); grid-auto-flow: column; gap: 5px 18px; }
.exrow { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 5px 10px 5px 5px;
  border: 1.5px solid var(--hair); background: var(--card); min-width: 0; }
.exrow:hover { border-color: var(--ink-2); }
.exn { width: 28px; height: 28px; display: grid; place-items: center; font: 600 14px var(--f-mono); border: 1.5px solid var(--hair); }
.ext { font-size: 13.5px; line-height: 1.3; color: var(--ink-2); }
.exrow.active { background: color-mix(in srgb, var(--blood-soft) 55%, var(--card)); border-color: color-mix(in srgb, var(--bad) 45%, var(--hair)); }
.exrow.active .ext { color: var(--ink); }
.exrow.active .exn { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.exrow.now { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.exrow.now:first-child { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.exrow.death .ext { color: var(--bad); font-weight: 600; }
.wounds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wound { border: 1.5px solid var(--hair); padding: 10px; display: grid; gap: 6px; background: var(--card); }
.wound .cnt { font: 600 24px var(--f-mono); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0; border-top: 3px solid var(--rule); }
.fact { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 1px; }
.fact b { font: 600 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.fact span { font: 600 11px var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cond { display: inline-flex; align-items: center; gap: 6px; background: var(--sunk); padding: 3px 4px 3px 9px; font-size: 13px; }
.cond button { border: 0; background: transparent; padding: 0 4px; font-size: 15px; line-height: 1; color: var(--ink-3); }
.log { font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; max-height: 180px; overflow: auto; }
.log time { font-family: var(--f-mono); color: var(--ink-3); margin-right: 8px; font-size: 12px; }

/* gear */
.load { display: grid; gap: 8px; }
.loadbar { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr; height: 16px; border: 1.5px solid var(--rule); position: relative; }
.loadbar span { border-right: 1px solid var(--hair); }
.loadbar span:nth-child(1) { background: var(--tox-soft); } .loadbar span:nth-child(2) { background: var(--hunger-soft); }
.loadbar span:nth-child(3) { background: color-mix(in srgb, var(--hunger-soft) 50%, var(--blood-soft)); } .loadbar span:nth-child(4) { background: var(--blood-soft); }
.loadbar span:nth-child(5) { background: color-mix(in srgb, var(--blood-soft) 50%, var(--bad)); border-right: 0; }
.loadbar .needle { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--rule); transition: left .2s; }
.loadscale { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr; font: 12px var(--f-mono); color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 14px; }
.wcard { background: var(--card); border: 1.5px solid var(--hair); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.wcard.worn { border-color: var(--rule); box-shadow: inset 4px 0 0 var(--brass); }
.wcard .title { display: flex; gap: 8px; align-items: center; }
.wcard .title input { font: 700 17px var(--f-head); letter-spacing: .03em; border: 0; border-bottom: 1.5px solid var(--hair); background: transparent; flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px 10px; }
.mini { display: grid; gap: 1px; min-width: 0; }
.mini label { font: 600 10.5px var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.mini input, .mini select { border: 0; border-bottom: 1.5px solid var(--hair); background: transparent; padding: 2px 0; width: 100%; min-width: 0; font-family: var(--f-mono); font-size: 14px; }
.calc { font: 600 13px var(--f-mono); color: var(--ink-2); }

/* karma panel: pool check and the GM's Free edit switch */
.poolwarn { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--warn); background: var(--hunger-soft); padding: 6px 8px; }
.freeallow { font-size: 13px; gap: 6px; }

/* gear: load figure, inventory and prosthetic tables */
.loadnum { font: 13px var(--f-mono); color: var(--ink-3); } .loadnum b { font: 600 24px var(--f-mono); color: var(--ink); }
.itable td.wide, .ptable td.wide { width: 100%; min-width: 180px; }
.itable td:first-child { min-width: 160px; }
.itable select, .ptable select { width: auto; min-width: 170px; }
@media (max-width: 560px) {
  .itable thead, .ptable thead { display: none; }
  .itable tr, .ptable tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; padding: 8px 0; border-bottom: 1px solid var(--hair); }
  .itable td, .ptable td { border: 0; padding: 0; min-width: 0 !important; }
  .itable td[colspan] { grid-column: 1 / -1; }
  .itable select, .ptable select { min-width: 0; width: 100%; }
  .coins { margin-left: 0; flex-wrap: wrap; }
}
.ptable td:first-child { min-width: 150px; }
.coins { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.coins label { font: 600 11.5px var(--f-head); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.coins .inp { width: 80px; font-family: var(--f-mono); text-align: right; }

/* tabletop */
.codebox { width: 100%; min-height: 120px; font: 12px/1.4 var(--f-mono); background: var(--sunk); border: 1.5px solid var(--hair); padding: 10px; resize: vertical; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }

/* empty + toast + confirm */
.empty { padding: 48px 0; display: grid; gap: 14px; justify-items: start; max-width: 60ch; }
.empty .ornate { font-size: 34px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--rule); color: var(--paper);
  padding: 9px 16px; font-size: 14px; z-index: 20; max-width: min(90vw, 520px); box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.confirm { background: var(--blood-soft); border: 1.5px solid var(--bad); padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { background: var(--hunger-soft); color: var(--ink); border-left: 4px solid var(--warn); padding: 8px 12px; font-size: 13.5px; margin-top: 10px; }

@media (max-width: 1100px) {
  .attr { grid-template-columns: 130px 124px minmax(0, 1fr); }
  .attr .base { grid-column: 2 / -1; }
}
@media (max-width: 760px) { .exlist { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-flow: row; } }
@media (max-width: 900px) {
  .head { grid-template-columns: 110px minmax(0, 1fr); }
  .head .karmawrap { grid-column: 1 / -1; }
  .portrait { width: 110px; font-size: 40px; }
  .skillcols, .sec, .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .frame { padding: 14px 0 18px 16px; border-left-width: 4px; }
  .frame::before, .frame::after { left: -4px; height: 4px; width: 30px; }
  .sigil { --k: .6; }
  .h { font-size: 20px; }
  :root { --pip: 15px; }
  .head { grid-template-columns: minmax(0, 1fr); }
  .namefield { font-size: 26px; }
  .attr { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; }
  .attr .scale { grid-column: 1 / -1; }
  .attr .base { grid-column: 1 / -1; display: flex; gap: 10px; }
  .cell { height: 18px; } .half { gap: 3px; } .mid { width: 32px; } .scale { gap: 6px; }
  .pips.big { --pip: 18px; gap: 4px; }
  .wounds { grid-template-columns: minmax(0, 1fr); }
  .tabs { gap: 4px; } .tabs button { flex: 1 1 0; justify-content: center; padding: 10px 6px 9px; font-size: 13px; letter-spacing: .05em; gap: 6px; }
  .tabs .tabicon { display: none; }
  .brand { font-size: 24px; }
}

/* ---------- GM table ---------- */
.viewseg { min-width: 220px; }
.top .viewseg { margin-left: auto; }
.campbar { gap: 6px; }
.campbar .lbl { margin-right: 4px; }
.gmgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 46px 40px; align-items: start; }
.deckbar { display: grid; grid-template-columns: repeat(3, minmax(0, 90px)) minmax(0, 1fr); gap: 10px; align-items: stretch; margin-bottom: 16px; }
.deckbtns { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.btn.big { padding: 11px 18px; font-size: 15px; }
.icard { border: 2px solid var(--rule); background: var(--card); padding: 16px; display: grid; gap: 12px; position: relative; box-shadow: 0 2px 0 var(--hair); }
.icard.kind-pc { border-top: 6px solid var(--brass); }
.icard.kind-enemy { border-top: 6px solid var(--bad); }
.icard.kind-effect { border-top: 6px solid var(--life); }
.icard.empty { border-style: dashed; border-color: var(--hair); text-align: center; justify-items: center; padding: 28px 16px; box-shadow: none; }
.icard.empty .ornate { font-size: 24px; }
.icard .iname { font: 700 24px/1.1 var(--f-head); letter-spacing: .03em; text-transform: uppercase; }
.thumb.lg { width: 48px; height: 48px; flex-basis: 48px; font-size: 22px; }
.kindmark { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; font: 700 22px var(--f-head); color: var(--paper); background: var(--bad); }
.kindmark.effect { background: var(--life); } .kindmark.pc { background: var(--brass); color: var(--brass-ink); }
.kindmark.sm { width: 24px; height: 24px; flex-basis: 24px; font-size: 13px; }
.effnote { margin: 0; font-size: 15px; max-width: 60ch; }
.lite { display: grid; gap: 8px; min-width: 0; }
.mbar { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.mbar .lbl { font-size: 11px; }
.mtrack { height: 9px; border: 1px solid var(--hair); position: relative; overflow: hidden; }
.mtrack i { position: absolute; inset: 0 auto 0 0; }
.mbar b { font: 600 13px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 7ch; text-align: right; }
.mbar b small { color: var(--ink-3); font-weight: 400; }
.hpctl { gap: 6px; }
.hpctl .inp { width: 60px; font-family: var(--f-mono); border: 1.5px solid var(--hair); padding: 3px 6px; background: var(--paper); }
.wbtns { display: inline-flex; gap: 4px; margin-left: auto; }
.litefacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 13.5px; }
.litefacts > span { min-width: 0; }
.litefacts .lbl { display: block; font-size: 10.5px; }
.badtext { color: var(--bad); }
.drawn { margin-top: 14px; }
.drawn ol, .upcoming { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: c; }
.drawn li { counter-increment: c; padding: 4px 10px 4px 8px; background: var(--sunk); font-size: 13px; border-left: 3px solid var(--hair); }
.drawn li::before { content: counter(c) ". "; font-family: var(--f-mono); color: var(--ink-3); font-size: 12px; }
.drawn li.now { background: var(--rule); color: var(--paper); }
.drawn li.skip, .upcoming li.skip { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1px; }
.k-pc { border-left-color: var(--brass) !important; } .k-enemy { border-left-color: var(--bad) !important; } .k-effect { border-left-color: var(--life) !important; }
.upcoming { flex-direction: column; flex-wrap: nowrap; }
.upcoming li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-left: 3px solid var(--hair); background: var(--card); font-size: 13.5px; }
.roster-list { display: grid; gap: 4px; margin-top: 6px; }
.crow { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 0; border-bottom: 1px solid var(--hair); }
.crow .cname { flex: 1; min-width: 0; }
.crow.out .cname { opacity: .5; text-decoration: line-through; }
.addpanel { display: grid; gap: 12px; margin-top: 8px; padding: 14px; background: color-mix(in srgb, var(--sunk) 70%, transparent); border: 1.5px solid var(--hair); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.addform { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.addform .grow { flex: 1 1 180px; } .addform .n { flex: 0 0 74px; } .addform .full { flex-basis: 100%; }
.addform .check { gap: 6px; font-size: 14px; padding-bottom: 4px; }
.addpanel select:disabled { opacity: .55; }
.partylist { display: grid; gap: 14px; }
.pcard { background: var(--card); border: 1.5px solid var(--hair); padding: 12px 14px; display: grid; gap: 10px; }
.pcard header { gap: 10px; flex-wrap: nowrap; }
.pcard .who, .icard .who { display: grid; gap: 2px; line-height: 1.2; }
.pcard .who b { font-size: 15px; } .pcard .who .muted { font-size: 12px; }
@media (max-width: 1000px) { .gmgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .deckbar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .deckbtns { grid-column: 1 / -1; justify-content: stretch; } .deckbtns .btn { flex: 1; }
  .litefacts { grid-template-columns: minmax(0, 1fr); }
  .wbtns { margin-left: 0; }
  .pcard header { flex-wrap: wrap; }
  .top .viewseg { margin-left: 0; order: 3; width: 100%; }
}
/* ---------- hover card ---------- */
.hovercard { position: fixed; z-index: 40; pointer-events: none; background: var(--rule); color: var(--paper); padding: 7px 11px 8px; min-width: 0; max-width: 240px; white-space: nowrap;
  display: grid; gap: 2px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 6px 18px rgb(0 0 0 / .28); border-top: 3px solid var(--brass); }
.hovercard b { font: 700 12px/1.3 var(--f-head); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.mouse { width: 11px; height: 16px; flex: 0 0 auto; vertical-align: -3px; color: currentColor; }
.hint .mouse { color: var(--ink-2); }
.hovercard em { font: 600 15px var(--f-mono); font-style: normal; color: var(--brass-soft); }
.hovercard.short { border-top-color: var(--bad); } .hovercard.short em { color: #f2b2aa; }
.hovercard.refund { border-top-color: var(--good); }
.hovercard.blocked { border-top-color: var(--ink-3); }
.hovercard.sealed { border-top-color: var(--bad); background: #0b0a09; color: #ece8e1; }
.hint { margin: -6px 0 14px; font-size: 12.5px; color: var(--ink-3); }

/* ---------- skill names open the side panel ---------- */
.sname { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.sname:hover, .sname:focus-visible { text-decoration-color: var(--brass); color: var(--ink); }
.emptyline { margin: 4px 0; }

/* ---------- skill side panel ---------- */
.sptable { display: grid; gap: 6px; padding: 12px; background: var(--paper); border: 1.5px solid var(--hair); border-top: 4px solid var(--brass); }
.sptable h4 { margin: 0; font: 700 14px var(--f-head); letter-spacing: .1em; text-transform: uppercase; }
.sptable .muted { margin: 0; font-size: 12.5px; }
.sptable table { font-size: 13px; }
.sptable th { font-size: 10.5px; padding: 3px 6px; border-bottom-width: 2px; }
.sptable td { padding: 4px 6px; vertical-align: top; }
.sptable td.k { font: 600 13px var(--f-mono); white-space: nowrap; color: var(--ink); }
.spanel { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--card); border-left: 5px solid var(--bracket);
  box-shadow: -12px 0 30px rgb(0 0 0 / .25); display: flex; flex-direction: column; animation: spIn .22s ease-out;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); outline: none; }
@keyframes spIn { from { transform: translateX(40px); opacity: 0; } }
.sphead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 10px; border-bottom: 1.5px solid var(--hair); }
.sphead h2 { margin: 2px 0 0; font: 700 26px/1.1 var(--f-head); text-transform: uppercase; letter-spacing: .04em; }
.spnow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 20px; background: var(--sunk); }
.spbody { overflow-y: auto; padding: 16px 20px 40px; display: grid; gap: 16px; align-content: start; }
.spdesc { margin: 0; font-size: 14.5px; }
.sprules { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 3px; }
.spbox { border: 1.5px solid var(--hair); padding: 8px 12px; font-size: 13.5px; }
.spbox summary { cursor: pointer; font: 600 12px var(--f-head); letter-spacing: .1em; text-transform: uppercase; }
.spbox ul { margin: 8px 0 2px; padding-left: 18px; display: grid; gap: 4px; }
.spgroup { display: grid; gap: 10px; }
.spgroup h3 { margin: 4px 0 0; font: 400 21px/1.2 var(--f-display); border-bottom: 2px solid var(--rule); padding-bottom: 3px; }
.flavor { margin: -4px 0 0; font-style: italic; color: var(--ink-3); font-size: 13.5px; }
.perk { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.perk p { margin: 4px 0 0; font-size: 14px; }
.plv { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font: 600 13px var(--f-mono); background: var(--card); }
.perk.got .plv { background: var(--rule); color: var(--paper); }
.perk.locked { opacity: .55; }
.perk.locked .plv { border-style: dashed; }
.pname { font: 600 14px var(--f-head); letter-spacing: .04em; text-transform: uppercase; }
.ptype { font: 600 10.5px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; background: var(--sunk); color: var(--ink-2); display: inline-block; }
.ptype.t-A { background: var(--brass-soft); color: var(--brass); }
.ptype.t-E { background: var(--life-soft); color: var(--life); }
.uchips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.uchips span { font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--hair); color: var(--ink-2); white-space: nowrap; }
@media (max-width: 560px) {
  .spanel { top: auto; height: 82vh; width: 100vw; border-left: 0; border-top: 5px solid var(--bracket); animation: spUp .22s ease-out; }
}
@keyframes spUp { from { transform: translateY(40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* ---------- website build: players panel, companions ---------- */
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }
.member { background: var(--card); border: 1.5px solid var(--hair); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mhead b { font-size: 15px; }
.mact { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.give { width: auto; max-width: 100%; font-size: 13px; }
.chip.comp { border-style: dashed; margin-left: -4px; }
.chip.comp .who > span:first-of-type { color: var(--brass); }

/* ---------- website build: table password gate, leave link ---------- */
.gate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: var(--paper); overflow: auto; }
.gatebox { width: min(440px, 100%); display: grid; gap: 14px; background: var(--card); }
.gatebox p { margin: 0; }
.linkbtn { border: 0; background: none; padding: 0 0 0 6px; color: var(--brass); text-decoration: underline; text-underline-offset: 2px; font: inherit; }

/* ---------- theme picker ---------- */
.skinpick { display: flex; align-items: center; gap: 6px; }
.skinpick select { border: 1.5px solid var(--hair); background: var(--card); color: var(--ink); padding: 4px 8px; border-radius: 2px;
  font: 600 12px/1.2 var(--f-head); letter-spacing: .06em; text-transform: uppercase; }

/* ================= THEMES =================
   Ledger (no data-skin) is the default printed-sheet look and follows the system light/dark setting.
   The others are complete looks with their own palette, type and shapes. */

/* ----- Steampunk: brass plates and rivets on dark mahogany ----- */
:root[data-skin="steam"] {
  --paper: #1b120d; --card: #2a1d15; --sunk: #3a2a1e; --ink: #f2e3c6; --ink-2: #d4bf9b; --ink-3: #a08a6a;
  --rule: #c99a4b; --bracket: #a8742f; --hair: #5c432e; --brass: #e6ad55; --brass-ink: #1b120d; --brass-soft: #4d3519;
  --seal: #0c0705; --seal-2: #4a3626; --blood: #e47a5f; --blood-soft: #4a2219; --tox: #a8c46a; --tox-soft: #2c3519;
  --hunger: #e0b050; --hunger-soft: #46341a; --life: #6fb2c2; --life-soft: #1d3338; --warn: #e6a64a; --bad: #f07b62; --good: #a8c46a;
  --f-display: "Rye", Georgia, serif; --f-head: "Alegreya Sans SC", "Arial Narrow", sans-serif; --f-body: "Alegreya", Georgia, serif; --f-mono: "Special Elite", "Courier New", monospace;

[data-skin="steam"] .h, [data-skin="steam"] .tabs button, [data-skin="steam"] .btn, [data-skin="steam"] .seg button { text-transform: none; letter-spacing: .04em; }
[data-skin="steam"] .h { font-weight: 800; font-size: 26px; }
[data-skin="steam"] .brand, [data-skin="steam"] .ornate { color: var(--brass); text-shadow: 0 1px 0 #000; }
[data-skin="steam"] .frame { border-left: 6px solid transparent; border-image: linear-gradient(#e6ad55, #8a5a22 50%, #e6ad55) 1; }
[data-skin="steam"] .frame::before, [data-skin="steam"] .frame::after { height: 10px; width: 54px; left: -6px; border-radius: 0 3px 3px 0;
  background: var(--rivet) 4px 50%/10px 10px no-repeat, var(--rivet) 40px 50%/10px 10px no-repeat, linear-gradient(#f0c470, #9b6a2c); box-shadow: 0 1px 0 #000; }
[data-skin="steam"] :is(.panel, .meter, .wcard, .wound, .pcard, .icard, .legend, .addpanel, .exrow, .spbox, .sptable) {
  background: var(--rivet) 3px 3px/10px 10px no-repeat, var(--rivet) calc(100% - 3px) 3px/10px 10px no-repeat,
    var(--rivet) 3px calc(100% - 3px)/10px 10px no-repeat, var(--rivet) calc(100% - 3px) calc(100% - 3px)/10px 10px no-repeat,

[data-skin="steam"] .btn { border-radius: 4px; border-color: #8a5f2c; background: linear-gradient(#3e2c1e, #2a1c13); }
[data-skin="steam"] .btn.primary, [data-skin="steam"] .seg button[aria-pressed="true"] { background: linear-gradient(#f3c877, #b07a2a); color: #241608; border-color: #6b4a1f; box-shadow: inset 0 1px 0 #ffe2a6; }
[data-skin="steam"] .seg { border-color: #8a5f2c; border-radius: 4px; overflow: hidden; }

[data-skin="steam"] .tabs button { border-color: #6b4a2b; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--ts) 70%, #3a2a1e), #2a1d15); }
[data-skin="steam"] .tabs button[aria-selected="true"] { background: linear-gradient(#f3c877, #b07a2a); color: #241608; border-color: #b07a2a; }

/* ----- Light: clean modern paper, soft cards, quiet colour ----- */
:root[data-skin="light"] {
  --paper: #f5f4f1; --card: #ffffff; --sunk: #edebe6; --ink: #1c1b19; --ink-2: #4a4742; --ink-3: #7b766e;
  --rule: #26241f; --bracket: rgb(38 36 31 / .18); --hair: #dedad3; --brass: #b06d12; --brass-ink: #ffffff; --brass-soft: #f6e6cb;
  --seal: #3a3632; --seal-2: #77706a; --blood: #c03a32; --blood-soft: #f7dcd8; --tox: #3f7d2e; --tox-soft: #dcebd3;

[data-skin="light"] .tabs button[aria-selected="true"] { background: var(--ink); }

/* ----- Retro terminal: amber phosphor on a CRT ----- */
:root[data-skin="retro"] {

[data-skin="retro"] .btn:hover, [data-skin="retro"] .iconbtn:hover { background: var(--ink); color: var(--paper); text-shadow: none; }

[data-skin="retro"] :is(.attr .val, .stat b, .meter .v, .wound .cnt) { font: 400 36px/1 var(--f-pixel); }
[data-skin="retro"] :is(.fact b, .exn, .mid, .mbar b, .srow .m) { font-family: var(--f-pixel); font-size: 21px; font-weight: 400; }
