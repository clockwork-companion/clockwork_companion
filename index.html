You gain proficiency in using Plate Armors."},{"l":5,"t":"P","x":"Proficiency losses to casting from wearing armor is lowered by your SP."},{"l":6,"t":"P","x":"Whenever your armor suffers any damage it can absorb, ignore the damage dealt to the armor. Can happen 1 times per round."}]},{"n":"Casting from a Tin Can","f":"Your familiarity of moving in armor allows you to start casting while wearing it.","p":[{"l":7,"t":"E","x":"You ignore all negative effects inflicted by your armor.","u":{"stamina":"1","ap":"1","turns":"3"}},{"l":7,"t":"P","x":"Proficiency losses to casting from wearing armor is lowered by 2xSP."},{"l":8,"t":"P","x":"TBD"},{"l":9,"t":"P","x":"TBD"}]},{"n":"A Shell of Metal","f":"Armor just feels like a secondary skin to you. You feel more comfortable in armor than outside it.","p":[{"l":10,"t":"P","x":"Proficiency losses to casting from wearing armor is lowered by your Armor Mastery modifier."},{"l":10,"t":"P","x":"TBD"}]}]},"Strong Back":{"d":"The skill for carrying more equipment with ease. Helps the adventurer by allowing him to carry more items without worrying about encumbrance. Also reduces the effects of encumbrance.","r":["Increases your Strong-back modifier by 3% per SP.","Increases the amount of Small Items you can carry for each encumbrance tier by 6 per SP."],"tips":["If you're a hoarder by nature this is the skill you want.","This skill is very helpful when the party lacks access to a mount or vehicle.","Characters in heavy armor can invest some points to mitigate the weight of heavier armors."],"gs":[{"n":"Pack-Mule","f":"You're starting to feel a little more comfortable with all these stuff that you carry on you.","p":[{"l":3,"t":"P","x":"You can carry an additional set of weapons in addition to your existing two without any penalties."},{"l":4,"t":"P","x":"You become Proficient in Athletics. You can use your Strong-Back modifier in place of your Athletics modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Hoarding Made Easy","f":"So what if you are a bit of a hoarder, isn't everyone?","p":[{"l":5,"t":"P","x":"You ignore the penalties from light encumbrance. You suffer the penalties of both light and medium encumbrance when you reach medium encumbrance."},{"l":6,"t":"P","x":"Whenever you use weapons with the Unwieldy property, you ignore the Unwieldy property of the weapon. Whenever you use weapons with the Unwieldy property, you gain 1 less AP."}]},{"n":"The World on My Shoulders","f":"The amount you can carry would break the backs of most others.","p":[{"l":7,"t":"P","x":"You ignore the penalties from medium encumbrance. You suffer the combined penalties when you reach heavy encumbrance."},{"l":8,"t":"P","x":"Whenever you use weapons with the Unwieldy property, you no longer gain 1 less AP."}]},{"n":"Atlas Unburdened","f":"The world on your shoulders is also your best weapon","p":[{"l":9,"t":"P","x":"You ignore the penalties from heavy encumbrance. You suffer the combined penalties when you reach severe encumbrance."},{"l":10,"t":"P","x":"You can wield a single Two-handed weapon as if it was One-handed. Allowing you to combine it with another One-hander or a Shield. If the Two-Hander used in this manner is Unwieldy, you gain 1 less AP."}]}]},"Pierce":{"d":"The skill for combatants that would like to favor visceral damage instead of accuracy.","r":["Replaces critical strikes.","Increases Pierce Chance by 1% per SP.","Finesse or Ranged Weapon"],"b":[{"title":"Piercing an opponent","lines":["When you pierce an opponent you circumvent its armor, finding weak points in it.","Your weapons attack is considered to have the Pierce(SP) property.","Multiple pierces on the same target from different sources cannot stack."]}],"gs":[{"n":"Cracks in the Armour","f":"No armor is perfect, and you're starting to learn their commonalities.","p":[{"l":3,"t":"P","x":"You learn the Pierce Attack action. Refer to Actions in Combat for a detailed explanation."},{"l":4,"t":"A","x":"For any attack you make with your weapon this turn, your weapons gain the Pierce(SP) property.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"Barrage","f":"Your attacks are increasingly finer tuned, you can worm your strikes into the depths of the armour, each closer to the heart than the last.","p":[{"l":5,"t":"P","x":"For every consecutive hit on a target, your weapons gains the Pierce(1) property consecutively. Attacking a new target, or failing to land a hit this round resets the pierce counter."},{"l":6,"t":"P","x":"Whenever you deal damage to an unarmored target or a target whose armor you've pierced completely, your attacks deal SP/2 bonus Piercing damage plus any leftover Pierce property."}]},{"n":"Between The Ribs","f":"Your strikes are maneuvered beyond the defense of your opponent. All that remains is the killing blow.","p":[{"l":7,"t":"E","x":"Your Pierce Chance increases by your SP.","u":{"stamina":"2","ap":"3","turns":"3"}},{"l":8,"t":"P","x":"You learn the Announce Crack action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Bore","f":"Armor is a minor impediment. You can see beyond the armour and its composition.","p":[{"l":9,"t":"P","x":"With Between the Ribs active, taking the Announce Crack action takes 1 less AP."},{"l":10,"t":"P","x":"With Between the Ribs active, any attacks that benefit from your Announce Crack action, provide Barrage stacks. With Between the Ribs active, 2 more attacks can benefit from your Announce Crack action."}]}]},"Precision":{"d":"The skill that governs the precision of your strikes.","r":["Increases your accuracy with attacks by 1% per SP."],"gs":[{"n":"Keen-Eye","f":"You begin to notice your vision tracing movement in the underbrush.","p":[{"l":3,"t":"A","x":"Your next attack is guaranteed to hit.","u":{"recharge":"Long rest","ap":"2","uses":"1"}},{"l":4,"t":"P","x":"You have learned to accumulate Focus stacks. Attacking within a round grants 1 stack of Focus. Each Focus stack increases your accuracy by 2%. You lose all stacks when you fail to attack this round, or take damage."}]},{"n":"Eyes of the Hawk","f":"You can focus on the smallest of details, track them across great distances. You bide your time, waiting for the perfect opportunity to strike.","p":[{"l":5,"t":"P","x":"You have learned to consume your Focus stacks for different effects, listed in the Focus Table. Focus stacks can be consumed before rolling for an attack. Only 1 Focus ability can be used per attack, given the attacker has enough Focus."},{"l":6,"t":"P","x":"When fighting with melee weapons generate and additional stack of Focus. When fighting with ranged weapons an additional effect can be used from the Focus Table per attack."}]},{"n":"Absolute Precision","f":"Your weapon follows your sight. You follow your weapon. Your weapon is your extension.","p":[{"l":7,"t":"P","x":"Your attacks gain the Reliable (n) property, equal to half the amount of focus stacks you have when making the attack."},{"l":8,"t":"P","x":"Whenever a designated attack you make hits, you generate 1 more Focus stack."}]},{"n":"Sight of Death","f":"And your extension brings with it death.","p":[{"l":9,"t":"E","x":"You regain all focus stacks you've spent this round at the end of the round. Lose all Focus when the effect ends. You cannot generate Focus. Melee fighters can benefit from multiple effects on the Focus Table.","u":{"stamina":"2","ap":"3","turns":"5"}},{"l":10,"t":"P","x":"You generate stacks during the Empowerment. Effects on the Focus Table can be stacked twice. You gain your Reliable(n) property as bonus damage."}]}]},"Alacrity":{"d":"The skill that governs how steady, quick and precise you are in using your hands and arms. Helps in any action that requires quick, steady hand movements like pickpocketing, disarming traps etc.","r":["Increases your Alacrity modifier by 3% per SP."],"b":[{"title":"Sleight of Hand","lines":["You can do a lot of things with your hands! Here are a few.","Lock-Picking: Requires Thievery Kit and Lockpicks. Lockpicks may be broken depending on your roll and the DC of the lock.","Trap-Disarming: You can attempt to disable traps. Requires Thievery Kit.","Pick-Pocketing: depending on your target item the DC gets harder or easier."]}],"gs":[{"n":"Fine-Tuned","f":"Your body responds to your thoughts, your muscles sewn into the wind.","p":[{"l":3,"t":"A","x":"You can switch a weapon set in a sheathe with a set in your bag.","u":{"recharge":"Long rest","ap":"1","uses":"1"}},{"l":4,"t":"P","x":"You gain proficiency in Sleight of Hand. You can use your Alacrity modifier in place of your Sleight of Hand modifier. If you are already proficient, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Minute Movement","f":"You control the very minutiae of your body.","p":[{"l":5,"t":"A","x":"You immediately gain 2 AP.","u":{"recharge":"Long rest","ap":"0","uses":"1"}},{"l":6,"t":"P","x":"You can use the extra AP gained from Minute Movement to attack again if you've already attacked this turn."}]},{"n":"Blur","f":"You can feel the fiber. Your body is yours to manipulate.","p":[{"l":7,"t":"P","x":"AP that can be reserved for reactions increases by 1."},{"l":8,"t":"P","x":"You can transfer up to 1 unspent AP to your following turn. Requires Medium Armor or lighter. This effect cannot occur more than once per round."}]},{"n":"True Haste","f":"No part of your body is foreign to you. You know the back of your palm like the twitch of your muscle fibers.","p":[{"l":9,"t":"P","x":"You can transfer up to 1 more unspent AP to your following turn. Requires Medium Armor or lighter. This effect cannot occur more than once per round."},{"l":10,"t":"E","x":"For any action you take this turn that costs up to 5 AP, the action takes 2 AP instead.","u":{"stamina":"1","ap":"2","turns":"4"}}]}]},"Tumble":{"d":"Skill for acrobatics and quick movement. Allows easy performing of acrobatics that would otherwise be dangerous to the character like climbing buildings, jumping large gaps, rolling etc.","r":["Increases your Tumble modifier by 3% per SP.","Increases movement per AP by 1 meters per 2 SP.","Increases jumping height and distance by 1/2 meters per SP.","Decreases fall damage by 1 per SP."],"tips":["Jack be Quick! is useful for almost every character that finds itself engaged in combat occasionally.","Movement speed is especially useful if you are aiming for a fast and nimble character.","In an urban campaign having a party member with Jack be Racin’! will open a lot of possibilities."],"gs":[{"n":"Jack be Nimble!","f":"You are much more nimble than the average person, rolling, jumping, running seems easy to you.","p":[{"l":3,"t":"P","x":"You become Proficient in Acrobatics. You can use your Tumble modifier in place of your Acrobatics modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"Taking the Get Up action costs 1 less AP."}]},{"n":"Jack be Quick!","f":"You are getting faster on your feet. You would have a solid chance at any race you enter.","p":[{"l":5,"t":"A","x":"Whenever you take a Move Action this turn, you move an additional SP/2 meters.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"A","x":"You gain advantage on your next Acrobatics check.","u":{"recharge":"Long rest","ap":"1","uses":"2"}}]},{"n":"Jack be Racin’!","p":[{"l":7,"t":"P","x":"Climbing and running over obstacles no longer hinder your movement and does not require an Acrobatics check. Climbing vertically without equipment or leverage no longer incurs disadvantage."},{"l":8,"t":"A","x":"The next Dexterity saving throw that you fail counts as a success instead.","u":{"recharge":"Long rest","uses":"2"}}]},{"n":"Seriously Jack, Slow Down","f":"Vertical, horizontal... Axis of movement is irrelevant to you. You just move as you please.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"When you fail a dexterity saving throw, you now take%50 damage. When you succeed a dexterity saving throw, you now take no damage."}]}]},"Evasion":{"d":"Dexterity based defense skill. Skill for dodging incoming blows to reduce damage.","r":["Increases your Evasion modifier by 1% per SP.","Increases your critical Evasion chance by 1%."],"tips":["Having a Defence skill will be beneficial to any character both in and out of combat.","If your hit points are not high enough this skill is a great way to reduce some damage that would be dealt to you each turn.","If your character has impaired strength or you're aiming for a dextrous character without any investment in strength, this is a great option.","Even with parry or shield mastery already invested, consider a3 point investment in evasion. Remember, this skill doesn't require a weapon or shield at the ready."],"b":[{"title":"Evading Attacks","lines":["You move out of the way of an attack.","Reduces incoming damage by half.","Only melee attacks can be evaded.","If you have armor or resistance to the damage type, final value is calculated after the division of damage.","You cannot evade area of effects, attack has to be directed at you.","If the attack inflicts a status ailment you are still affected by it.","When you critically evade reduces all incoming damage. Base chance for critical evasion is%5.","When you evade you can perform an Evasive Maneuver. Evasive Maneuver: After a successful evasion, you gain 2 meters of extra movement."]}],"gs":[{"n":"Slide to the Left! Slide to the Right!","f":"You learn the basics of dodging and evading.","p":[{"l":3,"t":"P","x":"You gain the ability to evade attacks. This is considered a form defending."},{"l":4,"t":"A","x":"You can choose to succeed an evasion roll without rolling. Usage has to be declared before the Defend roll and after the enemy Attack roll.","u":{"recharge":"Long rest","ap":"1*","uses":"2"}}]},{"n":"Criss Cross!","f":"You're getting faster. Time seems to slow down when you feel in danger.","p":[{"l":5,"t":"P","x":"Movement gained from your Evasive Maneuver increases by 2 meters. At the end of a round, you can use your reaction to make an Evasive Maneuver without having to evade an attack first."},{"l":6,"t":"P","x":"Movement from Evasive Maneuver triggers no attack of opportunity."}]},{"n":"I am a leaf on the wind!","f":"You fly like a butterfly! Stinging like a bee requires another skill...","p":[{"l":7,"t":"P","x":"You can evade projectiles now. You can evade area of effects now."},{"l":8,"t":"P","x":"After an evade, your next Attack action costs 1 less AP."}]},{"n":"Watch how i soar...","f":"Catching a fly mid flight with chopsticks is an easier job than hitting you.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"TBD"}]}]},"Subtlety":{"d":"The skill for hiding in plain sight. Investing in this skill allows the character to disguise itself better.","r":["Increases your Subtlety modifier by 3% per SP.","Increases your Sneak Attack damage by 1 bonus damage per SP.","Attacking from Stealth incurs advantage on the Attack Roll."],"tips":["Sneak Attack is your friend, use it.","Invest in some runes, and gadgets to make hiding and, if things go south, escaping easier. You are not invisible remember?"],"b":[{"title":"Sneak Attack! What is it?","lines":["Once per turn, you can deal an extra SP bonus damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a Finesse or Ranged weapon."]}],"gs":[{"n":"Behind you!","f":"You always had a talent for hide and seek as a child.","p":[{"l":3,"t":"P","x":"You become Proficient in Stealth. You can use your Subtlety modifier in place of your Stealth modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"You learn the Sneak Attack action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"What was that sound?","f":"Every nook and cranny is a new opportunity for you to disappear in.","p":[{"l":5,"t":"P","x":"If you have taken the Stealth Action and have not moved since, upon detection, you can roll an additional Stealth check. Whichever check is better, you may use that result."},{"l":6,"t":"P","x":"You can take the Sneak Attack Action if your target is engaged in melee combat with another combatant now."}]},{"n":"Check your Closet...","f":"Everyone can be looking at you but the matter are they seeing you?","p":[{"l":7,"t":"P","x":"If you have taken the Stealth Action and the environment is dimly lit or less, upon detection, you can roll an additional Stealth check. Whichever check is better, you may use that result."},{"l":8,"t":"P","x":"Taking the Sneak Attack action takes 1 AP less. Taking the Skill Attempt: Stealth action takes 1 AP less."}]},{"n":"I'm in your Walls...","f":"You are so good at hiding at this point, you could steal a man's eyes off and he wouldn't suspect a thing.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"TBD"}]}]},"Martial Arts":{"d":"The skill for unarmed martial prowess. Investing in this skill allows the character to use various fighting styles.","r":["Increases your Martial Arts modifier by 3% per SP.","Increases the number of Styles you can learn by 1 per 2 SP."],"b":[{"title":"What are Styles?","lines":["Martial Arts skill revolves around styles and shifting between them. Each styles includes 2 Active Abilities and 1 Passive ability. The passive ability can only be benefited from when its related stance is active. Shifting stances costs 2 AP."]}],"gs":[{"n":"Call of the Fist","p":[{"l":3,"t":"P","x":"Your first stance shift in combat costs 2 AP less."},{"l":4,"t":"A","x":"Your next martial arts Active ability costs 0 AP.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"To Temper the Body","p":[{"l":5,"t":"P","x":"Whenever a martial arts Active Ability lands, you to stance shift for 2 AP less."},{"l":6,"t":"P","x":"1 Style Passive of your choosing is now permanently active regardless of stance. You can change this passive over a short rest."}]},{"n":"Fists of Fury","p":[{"l":7,"t":"P","x":"Whenever you Riposte or make an Opportunity Attack, you can use an Active Ability along with the attack. You generate less AP equal to the abilities AP cost on your next turn."}]}]},"Durability":{"d":"The skill for resisting damage over time effects and general toughness for the character. A character with high durability is more resilient to abuse and is harder to kill in general.","r":["Increases your Durability modifier by 3% per SP.","Increases Hit Point total by 4 per SP."],"tips":["Invest in this! This is what keeps you alive!","At least 5 points is advisable for every character regardless of characters function.","7 points is advisable for melee character that are prone to face-to-face frontline combat.","At 10 points you become a force of nature that just will not be put down. So think about it maybe?"],"gs":[{"n":"Not Hot Enough","f":"You can sometimes shrug the effects of burning more easily and your skin begins to thicken.","p":[{"l":3,"t":"P","x":"You learn the Brace action. Refer to Actions in Combat for a detailed explanation."},{"l":4,"t":"P","x":"When take the Brace action, it takes +2 damage to wound you."}]},{"n":"Ox-Skin!","f":"Your skin seems to resist the effects of burning and melting more easily now. Doctors are conflicted about how this happens.","p":[{"l":5,"t":"P","x":"Brace action can be taken as a reaction now."},{"l":5,"t":"P","x":"If you can use Active abilities with your limbs, doing so no longer damages you."},{"l":6,"t":"P","x":"When you take the Brace action, any lingering damage over time effect on you deals only half as much damage."}]},{"n":"Iron-Man","f":"Things that would melt other peoples skin off does not seem to have that much of an effect on you. Yes it disturbs you but it just disturbs you.","p":[{"l":7,"t":"P","x":"It requires +2 damage to inflict a Wound on you by default."},{"l":8,"t":"E","x":"Taking the Brace action costs 1 less AP. Taking the Brace action reduces the incoming damage by half by default regardless of your damage mitigation. Taking the Brace action mitigates damage from all attacks that it can against the player for a round.","u":{"stamina":"1","ap":"3","turns":"5"}}]},{"n":"Storm, Earth and Fire! I don't care...","f":"Your skin is so calloused at this point, you could sharpen your sword on it if you wanted to. You are so used to damage and abuse that you mostly ignore it at this point.","p":[{"l":9,"t":"P","x":"Damage mitigation from taking the Brace action doubles."},{"l":10,"t":"P","x":"When you use the Iron-Man empowerment you gain the following additional benefits: Brace action mitigates Fire Damage. Brace action mitigates Cold Damage. Brace action mitigates Lightning Damage. Brace action mitigates Acid Damage."}]}]},"Metabolism":{"d":"The skill for health recovery and general speed of a characters metabolism. The more points you invest in this skill the quicker you can heal from grievous physical injuries like broken bones, deep cuts, bruises etc.","r":["Increases your Metabolism modifier by 3% per SP.","Increases your Hit Point recovery per long rest by 1 per SP."],"tips":["At least get this up to 3 if you do adventuring a lot. You get what I mean...","Investing in 5 points is useful for every character.","Invest in this skill if you are getting damaged frequently.","Very useful for tanky melee characters."],"gs":[{"n":"Fast Metabolism","f":"You are getting used to all the beating. Your wounds seems to heal a bit faster.","p":[{"l":3,"t":"P","x":"You regain 2xSP Hit Points during your next long rest. You recover no Stamina during your next long rest."},{"l":4,"t":"P","x":"Your Hit Point recovery per long rest now stacks with potions."}]},{"n":"Tis' a Flesh Wound!","f":"Any surface cuts and bruises you have suffered in combat seems to heal itself in a rather short time.","p":[{"l":5,"t":"E","x":"Any brew effect, that replenishes a vital and takes effect over a long rest, instead takes effect over your next short rest.","u":{"stamina":"1"}},{"l":6,"t":"P","x":"You learn the Regenerate action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Be Quick or Be Dead!","f":"Your metabolism is so fast you can absorb liquids at an incredible rate with some meditation.","p":[{"l":7,"t":"E","x":"During your next short rest, you recover two long rests worth of hit points. You recover no Stamina when you use this ability. Your active abilities do not recharge when you use this ability.","u":{"stamina":"1"}},{"l":8,"t":"P","x":"You can Regenerate additional temporary hit points up to your Metabolism modifier."}]},{"n":"Healing Factor","f":"Healing speed of your wounds can be seen with naked eye! What kind of sorcery is this?","p":[{"l":9,"t":"P","x":"You can take the Regenerate action 2 times per round now."},{"l":10,"t":"E","x":"Regenerate action costs 0 AP. Regenerate action recovers hit points equal to the maximum possible result the dice roll can have.","u":{"stamina":"1","ap":"3","turns":"5"}},{"l":10,"t":"P","x":"Any brew you drink that replenishes hit points during the Healing Factor empowerment affects you instantly. You lose an additional point of Stamina at the end of the empowerment when you use this effect."}]}]},"Belly":{"d":"Skill for gluttony! Governs eating and drinking poisonous consumables and increases toxic tolerance. Also related to how much you can eat at once.","r":["Increases your Belly modifier by 3% per SP.","Increases your Toxicity threshold by 2 per SP.","Increases your Cleanse dice by 1d4 per 2 SP."],"tips":["If you are a caster that uses life-force as a fuel for spellcasting investing up to Not a Picky Eater! is advisable."],"b":[{"title":"What is Toxicity?","lines":["Toxicity is a way of measuring how much toxic build up is left in your body after consuming potions and it is cleansed a certain amount during a long rest. A character cleanses 1d6 Toxicity per long rest by default."]}],"gs":[{"n":"Glutton!","f":"You eat a lot. Like... a lot!","p":[{"l":3,"t":"P","x":"You can eat up to 5 meals per long rest without getting sick. You can eat more rations per meal without getting sick."},{"l":4,"t":"P","x":"During your next long rest, you recover the maximum possible toxicity. You recover no other vitals."}]},{"n":"Not a Picky Eater!","f":"You really don't care about what you are eating as long as you can swallow it.","p":[{"l":5,"t":"E","x":"During your next short rest, you recover 2 long rests worth of toxicity.","u":{"stamina":"1"}},{"l":6,"t":"P","x":"When your toxicity is above half its threshold, all brews you imbibe impart 2 toxicity less."}]},{"n":"Can I Eat That?","f":"As someone who eats gastronomic equivalent of poison the real thing doesn't really bother you.","p":[{"l":7,"t":"P","x":"When your toxicity is above half its threshold, all brews on you last 2 times as long."},{"l":8,"t":"P","x":"When your toxicity is above half its threshold, you gain resistance to Poison damage."}]},{"n":"Toxic!","f":"Your very body is toxic, in a very physical sense.","p":[{"l":9,"t":"A","x":"A brew that would cause you to go above your toxicity threshold instead sets your toxicity to its threshold. You still retain the effects of the brew. This ability cannot be used if your toxicity is at its threshold.","u":{"recharge":"Long rest","ap":"1","uses":"1"}},{"l":10,"t":"P","x":"Succeeding a saving throw against a poison allows you to retain the effects of that poison within your blood. You can reuse that poison as you wish. 30BP's worth of blood corresponds to 1000 grams of unprocessed Powdertinkering or Brewing materials or can be used as a weapon oil made of that poison."}]}]},"Bleed Resistance":{"d":"Skill for resisting blood loss caused from suffering wounds and how losing blood affects your character.","r":["Increases your Blood Points by 40 per 2SP. (400 BP max)","Increases your Blood Point regeneration per long rest by 3 per SP. (40 BP per long rest max)","Increases your Bleed Resistance modifier by 3% per SP.","Increases your Blood Potency by 1d10 per 2 SP."],"tips":["If you are a caster that uses blood as a fuel for spellcasting investing up to Blood everywhere... I'm dying... is advisable.","Any close range fighter that suffers wounds frequently can also benefit from investing some points."],"b":[{"title":"What are Wounds?","lines":["When you take a certain amount of damage in a single attack, you suffer wounds. These bleed at the start of each round and causes blood loss. Refer to Bleeding and Wounds chapter for a detailed explanation on the numbers, fixing wounds and how to keep track of blood loss."]}],"gs":[{"n":"Oh no blood!","f":"Your body seems more adept at containing bleeding. Cuts on you seems to bleed less than they should be.","p":[{"l":3,"t":"P","x":"You learn the Apply Pressure action. Refer to Actions in Combat for a detailed explanation."},{"l":4,"t":"P","x":"You learn the Clot (Light) action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"I'm bleeding!","f":"Your blood seems to contain more life force and clots at an abnormal rate.","p":[{"l":5,"t":"P","x":"Any potion that grants BP now stacks with your own BP regeneration."},{"l":6,"t":"P","x":"You learn the Clot (Moderate) action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Blood everywhere... I'm dying...","f":"You regenerate blood at an unusually fast rate, clotting is starting to get a little ridiculous.","p":[{"l":7,"t":"P","x":"Taking the Apply Pressure action takes 1 less AP."},{"l":8,"t":"P","x":"When taking the Apply Pressure action, you can choose to spend 3 more AP. If you do so, your wounds do not bleed this turn."}]},{"n":"Oh wait I'm fine...","f":"Where do you even keep all that blood? How do you even function after losing so much of it? So many questions...","p":[{"l":9,"t":"A","x":"On your next short rest, you can regenerate BP equal to 3 times your Bleed Resistance modifier.","u":{"recharge":"Long rest","uses":"2"}},{"l":10,"t":"E","x":"You do not roll for potency, the roll is maximized. All actions provided by this skill cost 0 AP.","u":{"stamina":"2","ap":"3","turns":"5"}}]}]},"Deprivation":{"d":"Skill for resistance against starvation! Governs your characters resistance against lack of food.","r":["Increases your Deprivation modifier by 3% per SP.","Increases your Deprivation Points by 12 per SP."],"b":[{"title":"Lack of food and water...","lines":["A PC needs to eat and drink to stay alive and kicking. Not eating meals per day causes the PC to start losing DPs and will weaken the PC ending with its death eventually. The PCs resistance to lack of food is effected by this skill and its ENDURANCE score. Lack of water however is several times more problematic and death occurs in 4 days for every PC by default."]}],"gs":[{"n":"The Om!","f":"You don't really require as much food as other people. A side effect of adventuring perhaps?","p":[{"l":3,"t":"P","x":"Eating 2 meals of 1 ration each is enough to sustain you now as opposed to 3 meals of 1 ration each."}]},{"n":"The Nom!","f":"Your body seems content with very little amounts of sustenance.","p":[{"l":5,"t":"P","x":"You can resist lack of water for twice as much as normal people. Potions counts as 1 ration to you."}]},{"n":"The Om-Nom","f":"Anything other than water is basically food to you.","p":[{"l":7,"t":"P","x":"If anything causes you to lose more than 1 DP at once, like spellcasting, you can reroll the dices if you want. You must use the new value."}]},{"n":"The Om-Nom-Nom","f":"Water is pretty much food to you at this point.","p":[{"l":10,"t":"P","x":"TBD."}]}]},"Versatility":{"d":"Skill for improving active abilities! Governs how many times active abilities can be used and how they are recharged.","r":["Increases your Versatility modifier by 3% per SP."],"tips":["This is one of those skills that is useful to everyone. Invest up to 3 at least although 5 is advisable.","6th perk can be used to recover usages of Do it Harder!. (wink wink)"],"gs":[{"n":"Do it harder!","f":"You can tolerate the effects of using Active abilities and can use them a few more times it seems.","p":[{"l":3,"t":"A","x":"You recover 1 usage of an Active ability you've used. Using this Active cannot increase total usages of Actives above their maximum. Only Actives gained from perks equal to or below your Versatiliy SP can be regained this way.","u":{"recharge":"Long rest","ap":"3","uses":"2"}},{"l":4,"t":"P","x":"Active and Empowerment abilities cost 1 AP less to activate. This effect cannot reduce Active and Empowerment ability costs below 1 AP."}]},{"n":"Do it faster!","f":"You recover from using your abilities faster and can use them again sooner.","p":[{"l":5,"t":"P","x":"Do it Harder! recovers SP/2 usages now instead of 1."},{"l":6,"t":"P","x":"On your next short rest, you recover (SP/2) usages of an active ability of your choosing. Using this Active cannot increase total usages of Actives above their maximum."}]},{"n":"Do it better!","f":"You can further increase your mastery in using your abilities.","p":[{"l":7,"t":"P","x":"Empowerments cost 1 Stamina less."},{"l":8,"t":"P","x":"Active ability maximums increase by 1 for all active abilities."}]},{"n":"Just do it already...","f":"At the cost of straining your body you seem to use your abilities as many times as you want.","p":[{"l":9,"t":"P","x":"Using an Active ability while under the effects of an Empowerment increases the duration of that Empowerment by 1 turn. This effect cannot occur more than 1 times per turn."},{"l":10,"t":"E","x":"Using Active abilities takes 0 AP. Using Active abilities consumes 0 Uses. For each turn you keep this Empowerment active, you lose 1 stamina. All stamina loss from this Empowerment is applied at the end this Empowerment or after 1 minute has passed.","u":{"stamina":"*","ap":"3","turns":"3"}}]}]},"Conditioning":{"d":"Skill for resisting the effects of exhaustion. Allows the user to resist the effects of extreme exertion better.","r":["Increases your Conditioning modifier by 3% per SP."],"tips":["Any member of the Toriser clan should invest in some points to this as soon as possible.","Casters that use blood or life based energy can also benefit from investing up to Harder, Better, Faster, Stronger!.","Melee fighters that have access to empowerments can invest as an off-skill."],"b":[{"title":"What is Stamina?","lines":["Stamina represents the characters physical effort. An excess amount of exertion leaves an effect on the character that cannot be cleansed with a single long rest. These are represented by loss of Stamina stacks. There are certain skills that loses Stamina stacks with their abilities but any physical exertion can cause Stamina loss. For example traveling in extreme heat or cold, climbing or swimming for an extended amount of time, carrying very heavy loads etc. are a few examples. For a more extended explanation and the effects of each stack look under the Stamina section."]}],"gs":[{"n":"Just a few aching muscles!","p":[{"l":3,"t":"A","x":"You can roll your next roll as if you are at max Stamina.","u":{"recharge":"Long rest","ap":"1","uses":"3"}},{"l":4,"t":"A","x":"When you roll with disadvantage you can add your Conditioning modifier as a bonus to your roll. Disadvantage needs to be incurred by Stamina loss.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"Harder, Better, Faster, Stronger!","p":[{"l":5,"t":"P","x":"Losing 2 stacks of Stamina no longer affects you. You gain the effects of Stamina loss when you gain the 3rd stack. You still die after losing 10 stacks of Stamina."},{"l":6,"t":"P","x":"Taking a short rest recovers 1 more Stamina."}]},{"n":"What doesn't kill you...","p":[{"l":7,"t":"P","x":"Taking a long rest recovers 2 more Stamina."},{"l":8,"t":"P","x":"TBD"}]},{"n":"Makes you stronger!","p":[{"l":9,"t":"P","x":"Stamina lost from sources other than Death Saving throws affects you after combat. You can no longer die from Stamina loss. Any Stamina lost above 10 instead causes you to lose 5 hit points."},{"l":10,"t":"P","x":"TBD"}]}]},"Shield Mastery":{"d":"The skill for blocking incoming blows with the help of a shield to reduce damage. This provides the most complete defensive option out of all the guarding skills.","r":["Requires shields.","Increases your Block modifier by 1% per SP."],"tips":["Carry more than 1 shield... No seriously, carry more than 1 shield because the one you're carrying is going to break."],"b":[{"title":"Blocking Attacks","lines":["You block an incoming attack with your shield to reduce damage.","Requires a shield in hand.","Reduces incoming damage up to the soak pool of the shield. The shield suffers the incoming damage.","Both melee and ranged attacks can be blocked.","You can block area of effects attacks.","If the attack inflicts a status ailment you are still affected by the ailment."]}],"gs":[{"n":"Block","p":[{"l":3,"t":"P","x":"You gain the ability to block attacks. This is considered a form of defending."},{"l":4,"t":"A","x":"You can choose to succeed a block roll before rolling. Any damage that was blocked this way, is inflicted onto the shield instead.","u":{"recharge":"Long rest","ap":"1*","uses":"3"}}]},{"n":"Wall of Iron","p":[{"l":5,"t":"P","x":"You can use your block ability for any other ally within 2 meters of you in any direction. Any area of effect attack that you block, is also considered blocked for anyone behind you. Any creature that is up to 4 meters behind you at the time of the attack, suffers no damage."},{"l":6,"t":"P","x":"Your active block ability can now be used after you roll your block dice."}]},{"n":"Shield Charge","p":[{"l":7,"t":"A","x":"You gain the ability to perform a shield charge. You move up to 2 AP worth of movement. The target suffers the shields block value as bonus damage per 2 meters traveled. The target has to succeed on a Strength or Dexterity saving throw or be knocked prone.","u":{"recharge":"Long rest","ap":"4","uses":"3"}},{"l":8,"t":"P","x":"Any shield you're carrying, due to your proficiency in using them, suffers half damage from all sources. First damage your shield suffers each round is ignored."},{"l":9,"t":"P","x":"Your block is now a free action. Each consecutive block in the same round is subject to a +7% penalty."}]},{"n":"One Man Phalanx","p":[{"l":10,"t":"E","x":"At the start of each turn, you gain 4 times your shields block value as temporary hit points. Temporary hit points gained this way does not stack and cannot exceed 4 times your shields block value. Any hit points you lose from your temporary hit points is applied to the shield instead.","u":{"stamina":"1","ap":"3","turns":"5"}}]}]},"Demonology":{"d":"Skill for summoning and forming contracts with otherworldly beings in an attempt to control them. Represents characters knowledge in summoning these otherworldy beings called daemons.","r":["Increases your Demonology modifier by 3% per SP.","Increases the duration you can have an daemon summoned by half a hour per SP.","Increases the amount of summons you can perform a day by 1 per 2 SP."],"gs":[{"n":"You got a Friend in Me!","f":"You are starting to discover there are potential allies in the realms.","p":[{"l":3,"t":"A","x":"You can summon and form contracts with daemons. Each contract and what requires to establish it, depends on the daemon. Contracted daemons can be summoned to the prime plane by the contracted summoner."},{"l":4,"t":"A","x":"You can summon a daemon partially to use one of its abilities with a Demonology check. The daemon is not fully summoned and therefore cannot be damaged. Only works on abilities that manifest their effects in a single turn. The difficulty of the check is dependent on the strength of the ability.","u":{"recharge":"Long rest","ap":"1*","uses":"2"}}]},{"n":"A Call Beyond the Realms","f":"You are starting to know your neighbors.","p":[{"l":5,"t":"A","x":"You can boost an ability of your daemon using a Demonology check. The boost the ability receives is dependent on the ability. The difficulty of the check is dependent on the strength of the ability.","u":{"recharge":"Long rest","ap":"3","uses":"2"}},{"l":6,"t":"P","x":"Your partial summon ability can be used as many times as you want. Using your partial summon ability this way incurs a material cost. The material used and its cost is dependent on the strength of the ability."}]},{"n":"TBD","f":"Each daemon you summon is a force on its own.","p":[{"l":7,"t":"A","x":"Allows you to banish an daemon you desire back to its realm. Roll demonology against the daemon willpower. On a success, the daemon is banished to its realm. On a failure, the daemon is immune to banishment for the next 24 hours.","u":{"recharge":"Long rest","ap":"3","uses":"1"}},{"l":7,"t":"P","x":"The cost of summoning and dismissing a daemon is reduced by 1 AP. You generate 2 more AP each turn. These can only be used to activate the innate abilities of your daemons."},{"l":8,"t":"P","x":"Your boost ability can be used as many times as you want. Using your boost ability this way incurs a material cost. The material used and its cost is dependent on the strength of the ability."},{"l":9,"t":"P","x":"You can designate a Guardian daemon. This Guardian is no longer bound by the summon duration and can stay with you constantly. You can still summon daemons normally without having to dismiss your Guardian"}]},{"n":"Solomon Unchained","f":"You command an army.","p":[{"l":10,"t":"E","x":"You can summon up to 5 daemon you have contracted at the same time. The summonings done by this ability does not count towards your daily summon count.","u":{"stamina":"3","ap":"5","turns":"3"}}]}]},"Alchemy":{"d":"Alchemy can be described as fastening, slowing, reversing natural processes of a chemical reaction to an unnatural degree with the help of Alchemical circles and life based energy. Objects can be broken down or reconstructed in a chemical sense as well as in a physical sense. Meaning a compound can be broken down to its constructing elements, elements can be formed into compounds if such a compound exists, or objects can be repaired and translocated as the circle permits. Alchemy can be used for a variety of different applications. Possibilities are limited only by the users creativity and imagination. It can be a perfect supportive skill as well as a devastating offensive one. However there are certain rules that applies to every instance of Alchemy.","r":["Increases your Alchemy modifier by 3% per SP.","If unlocked, increases the amount of Life-Energy you can pull from the earth by 1d6 per 2 SP."],"tips":["Invest in Deprivation you will need it. Seriously.","Investing up to 3 points in Belly helps in replenishing your life energy reserves faster.","Starvation means exhaustion stacks. investing in Conditioning will help in mitigating these effects.","TBD"],"b":[{"title":"A Little History","lines":["Alchemy has an ancient and distinguished background. Although alchemy is mostly known for its uses during the middle ages, its origins can be traced all the way back to the ancient Egpyt. With the rise of the positive sciences, neglection and the following abandonment of magic the art of alchemy was mostly forgotten and was dethroned by chemistry and was mostly practiced in secret by cults and orders. Now with the rise of magic starts a new era for Alchemy. Alchemical Circles An Alchemical circle is a very precise geometric shape used in Alchemical operations. The circle can be described as a way to focus, guide and channel pure life energy released by the alchemist. The shape of it carries the instructions of how the life energy is going to be channeled into the manipulated object therefore the shape of the circle needs to be extremely precise. A half or wrongly drawn circle can create unpredictable effects and often leads to disaster. Every alchemical operation is carried out using an Alchemical circle of some sort and every circle can only achieve a singular action. Meaning moving a large piece of rock and breaking it down to a fine dust requires 2 separate circles. These separate circles can be intertwined to achieve both effects in the interest of drawing space, however time to draw these would not change and the alchemical prowess required to pull this off would be greater."]}],"gs":[{"n":"Nigredo","f":"This alchemy thing seems very useful for little repairs and party tricks!","p":[{"l":3,"t":"P","x":"You can manipulate chemical elements. The material you are trying to manipulate needs to be in its pure element form (like a block of copper, iron etc.) or can be extracted without a chemical process (mixtures, alloys etc.). Compounds cannot be manipulated."},{"l":4,"t":"P","x":"You have learned to draw life-energy from the nature itself akin to druids. Amount of energy you can draw is equal to (SP/2)d6. Circles of size Medium and above consumes at"}]},{"n":"Albedo","f":"You can make things disappear now! Now only if you knew how to bring them back...","p":[{"l":5,"t":"P","x":"You can manipulate chemical compounds. You can now command chemical elements to form compounds at will as long as you provide sufficient energy for the reaction, and the materials are present. Organic compounds cannot be manipulated."},{"l":6,"t":"P","x":"You can create a Signature Circle for yourself. Your Signature Circle can be of size Medium or below."}]},{"n":"Citrinitas","f":"Turns out there is more to this alchemy thing then mere party tricks. If no one likes your tricks you can burn the whole party down now! Or the whole neighborhood depending on how you feel.","p":[{"l":7,"t":"P","x":"You can manipulate organic compounds. Manipulating organic compounds is harder and requires more energy because of their complex nature."},{"l":8,"t":"P","x":"You can create Alchemical Arrays on your limbs now."},{"l":9,"t":"P","x":"You can create a 2nd Signature Circle for yourself. Your Signature Circle can be of size Large or below."},{"l":9,"t":"P","x":"You can re-roll Alchemy checks now. After you roll an Alchemy check but before the result is declared, you can choose to re-roll the check once. Using this passive causes you to lose the maximum possible number of deprivation points. You have to use the result of the second roll."}]},{"n":"Rubedo","f":"Laws of nature and equivalent exchange applies to everyone but sometimes you can bend them a little.","p":[{"l":10,"t":"E","x":"For any Alchemy attempt made, you draw the maximum possible energy. You need to be in a position that allows drawing of energy.","u":{"stamina":"2","ap":"2","turns":"3"}}]}]},"Engineering":{"d":"The skill for creating, maintaining and breaking down mechanical contraptions. Allows you to realize your own mechanical ideas into reality.","r":["Increases your Engineering modifier by 3% per SP."],"gs":[{"n":"Spark of Creation","f":"Your studies into the ways of technology allows you to understand the basic principle behind any machine.","p":[{"l":3,"t":"P","x":"You gain proficiency in Mechanical Insight. You can use your Engineering modifier in place of your Mechanical Insight modifier. If you are already proficient your skill bonus increases by your SP."},{"l":4,"t":"P","x":"You gain proficiency in Engineering. You can attempt to create, disassemble or repair mechanical contraptions using this skill."}]},{"n":"Ingenuity","f":"TBD","p":[{"l":5,"t":"P","x":"For any creation attempt that uses Engineering, before the result of the roll is declared, you can choose to reroll the Engineering check. You have to use the new roll."},{"l":6,"t":"P","x":"You gain proficiency in Machine Operation. You can use your Engineering modifier in place of your Machine Operation modifier. If you are already proficient your skill bonus increases by your SP."}]},{"n":"Magic of Intellect","f":"TBD","p":[{"l":7,"t":"P","x":"Whenever you fail on an engineering attempt that uses material components, only half of the materials are lost."},{"l":8,"t":"P","x":"TBD"},{"l":9,"t":"P","x":"TBD"}]},{"n":"God from Machine","f":"TBD","p":[{"l":10,"t":"P","x":"TBD."}]}]},"Robotics":{"d":"Science and magic are hard... and sometimes accidents happen. This skill is for when a particularly nasty accident happens and a part of you is lost with no hope of ever returning. An arm for example... or a leg.... or sometimes both...","r":["Increases your Robotics modifier by 3% per SP.","Increases the number of prosthetics you can operate simultaneously by 1 per 2 SP."],"tips":["This skill is for people who wants to specialize in prosthetics and use them as their main form of offense or defense. If you merely want a replacement for your arm, go for the Prosthetic Operation secondary skill.","Think big! Your limbs can easily be replaced now. Acquire a few different limbs with different functions and use them."],"b":[{"title":"How do they work?","lines":["Prosthetics are machines and require energy to work as machine do. Prosthetics are interfaced with the rest of your bodies functions and use the energy your body naturally generates. They are not as efficient as the rest of your body though and require a little more energy than the rest of you. Each prosthetic you have increases the amount of rations you need to consume daily by 1."]}],"gs":[{"n":"A Piece of Metal","f":"Well, a little accident is not going to stop you now is it?","p":[{"l":3,"t":"P","x":"You gain proficiency in Prosthetic Operation. You can use your Engineering modifier in place of your Prosthetic Operation modifier. If you are already proficient your skill bonus increases by your SP."},{"l":4,"t":"P","x":"TBD"}]},{"n":"A Limb of Metal","f":"Maybe that accident was for the best! Turns out you can \"further\" this limbs function.","p":[{"l":5,"t":"A","x":"You gain advantage on the next Robotics check you rolled for the activation of your Transformative or Expansive prosthetic.","u":{"recharge":"Long rest","ap":"0","uses":"2"}},{"l":6,"t":"P","x":"You gain proficiency in Expansive Prosthetic Operation."}]},{"n":"A Heart of Metal","f":"Your can now process how to use a \"different\" prosthetic. Ever wondered how a spider would move with 8 legs? Well now you can find out...","p":[{"l":7,"t":"P","x":"You gain proficiency in Transformative Prosthetic Operation."},{"l":8,"t":"P","x":"TBD"},{"l":9,"t":"P","x":"The amount of prosthetics you can use doubles."}]},{"n":"A Mind of Metal","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Lore":{"d":"The skill for representing the characters academical knowledge. Further investing in this skill increases the characters aptitude in acquiring further knowledge and recalling what has been learned.","r":["Increases your Lore modifier by 3% per SP."],"gs":[{"n":"Student of the Academics","f":"You knowledge of the world is starting to accumulate to something useful.","p":[{"l":3,"t":"P","x":"You gain proficiency in Appraisal. If you are already proficient your skill bonus increases by your SP. This skill's modifier can be used instead of Appraisal."},{"l":4,"t":"P","x":"Number of pages you can read daily doubles. B o o k w o r m Reading is like breathing to you, regardless of the subject."}]},{"n":"Bookworm","p":[{"l":5,"t":"P","x":"You learn how to write in shorthand. Choose if you want to use a common shorthand cipher, or devise your own. Devising your own means only you can read them, where as the alternative can be read by anyone who knows shorthand. Shorthand allows you to take notes as fast as a person can speak. Without missing a single word."},{"l":6,"t":"P","x":"Allows you to skim through any piece of information in a very short time. Ask a question, then roll a Lore check. On a success your question will be answered to the best of the informations contents. The time this takes is dependent on the difficulty and length of the text."}]},{"n":"Statistical Probability","f":"Your knowledge comes up in surprisingly useful ways. Who would have thought that book from a couple of years ago would save your life?","p":[{"l":7,"t":"P","x":"For any situation you are in, you can roll a lore check to gain a piece of insight. Can be used 2 times per long rest."},{"l":8,"t":"P","x":"You gain eidetic memory. You no longer need to roll Mind checks to remember pieces of information you have seen before. Any piece of knowledge you have seen before, you can remember with perfect clarity. Recalling an exact text however, still requires a Mind check. You gain advantage on this check."},{"l":9,"t":"P","x":"TBD"}]},{"n":"Perfect Recall","f":"You mind is a library and you have the index in your hands.","p":[{"l":10,"t":"P","x":"You gain photographic memory. You no longer need to roll Mind checks to remember pieces of information you have encountered before. Any piece of knowledge you encounter before, regardless of the sensory organ used to perceive it, you can remember with perfect clarity."}]}]},"Armor Maintenance":{"d":"The skill for creating, repairing and improving any type of armor.","r":["Increases your Armor Maintenance modifier by 3% per SP.","You gain additional Tune Armor choices from the Tune Armor Options table at skill levels 6,7,8,9 and 10 in addition to the one you gain at skill level 5."],"tips":["1 to 20 21 to 40 2 2 1 4 3 2 30 x Armor 20 x Armor Value Value Value 8 6 4 4 3 2 4 3 2 4 3 2"],"gs":[{"n":"Is that a dent?","f":"You learn how to repair and craft armor now. You're not the best at it though...","p":[{"l":3,"t":"P","x":"You can now repair damaged suits of armor now. Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation. • You are knowledgeable in repairing armor and use your Armor Maintenance modifier for doing so. You can now craft mundane suits of armor."},{"l":4,"t":"P","x":"Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation. • You are knowledgeable in crafting armor and use your Armor Maintenance modifier for doing so."}]},{"n":"A Personal Touch...","f":"You learn how to fine tune armor to an individual's needs.","p":[{"l":5,"t":"P","x":"You gain the ability to Tune Armor to better fit a person. Choose 1 Tune Armor option from the Assist Options table. This choice cannot be changed."},{"l":6,"t":"P","x":"You can carve Runeslots onto pieces of armor now. Roll an Armor Maintenance check against DC 60. The DC gets harder by 20% per existing rune slot on the armor. Costs (10 x Armor repair cost) to attempt."}]},{"n":"Artisans Mark","f":"Your understanding of armor allows you to craft exquisite pieces of armor now.","p":[{"l":7,"t":"P","x":"You gain an additional use of Tune Armor per long rest. You can use Tune Armor on two unique armor sets at once or a single armor set twice. You cannot use the same Tune Armor option on the same set of armor twice."},{"l":8,"t":"P","x":"You can now craft Artisan properties onto armor. Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation."},{"l":9,"t":"P","x":"You can use Tune Armor on up to 5 sets of armor at once. You gain a stack of Exhaustion. This takes 3 hours to complete."}]},{"n":"Forge Master","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Weapon Maintenance":{"d":"The skill for creating, repairing and otherwise improving any type of weapon. This skill can used to improve both melee and ranged weapons.","r":["Increases your Weapon Maintenance modifier by 3% per SP."],"tips":["Uses 5d4 4d4 3d4 2d4 1d4"],"gs":[{"n":"Is that a dent?","f":"You learn how to repair and craft mundane weapons now.","p":[{"l":3,"t":"P","x":"You can now craft, repair and salvage mundane weapons. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation. You are knowledgeable in handling both ranged and melee weapons and use your Weapon Maintenance modifier to do so."},{"l":4,"t":"P","x":"You can now Runecarve onto weapons. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."}]},{"n":"Sharper than usual...","f":"You learn how to fine tune weapons to a persons specific needs.","p":[{"l":5,"t":"P","x":"You gain the ability to Tune Weapons to better fit the wielder. Refer to the Tune Weapons rules at the end of this skill for a more detailed explanation."},{"l":5,"t":"P","x":"You can now craft, repair and salvage weapons using Exotic Materials. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."},{"l":6,"t":"A","x":"You can elect to implement a property you failed in, in addition to the detriment.","u":{"recharge":"Long rest","uses":"1"}}]},{"n":"Man at Arms","f":"Your understanding of weaponry allows you to craft exquisite weapons now.","p":[{"l":7,"t":"P","x":"You can choose a second Weapon Property when crafting a weapon now. You can fail twice before the crafting process ends when making or improving a weapon."},{"l":8,"t":"P","x":"For Tuning weapons crafted by you, Uses of your tuning is always the maximum possible value."},{"l":9,"t":"P","x":"You can craft or rework existing weapons into Masterwork weapons now. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."}]},{"n":"Artisans Mark","p":[{"l":10,"t":"P","x":"Anytime you tune a weapon you've crafted or masterworked and that tuning is used in combat, you gain 1 Artisans Mark for each use of that tuning."}]}]},"Brewing":{"d":"The skill for creating helpful potions. Allows the user to craft consumables that can cure, buff and strengthen party members in a variety of ways. These consumables are usually significantly cheaper to make than their vendor counterparts.","r":["Increases your Brewing modifier by 3% per SP.","Increases your known catalysts by 1 per 3 SP (4 at SP 10)."],"tips":["Your party needs this skill. Make someone get it. Listen to the tip box... Tip box is your friend...","Dont just craft healing potions, craft supportive potions as well.","Crafting combat support potions in the early SP levels will usually yield highly toxic potions. Craft off combat potions till your brewing is up to 5 or so."],"gs":[{"n":"A little more than Cooking","f":"Just like cooking! But with a few extra steps...","p":[{"l":3,"t":"P","x":"You can now brew potions. Refer to the Brewing rules under the Crafting section for a more detailed explanation."},{"l":4,"t":"P","x":"You become Proficient in Cooking. You can use your Brewing modifier in place of your Cooking modifier. If you are already proficient, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Something Wild, Something Glowy","f":"Adding volatile things to your brews had some nice effects apparently! At least sometimes...","p":[{"l":5,"t":"P","x":"You learn to use Catalysts for your brews. Refer to Catalysts table under the Crafting section for a more detailed explanation. You have knowledge in using 1 catalyst of your choosing."},{"l":5,"t":"P","x":"You can increment your brews to make them more potent now. Refer to Incrementing Brews under the Crafting section for a more detailed explanation."},{"l":6,"t":"P","x":"You can use extra materials to make the brewing process easier. Refer to Incrementing Brews under the Crafting section for a more detailed explanation."}]},{"n":"Multitasking with Herbs","f":"Your brews increase in potency further.","p":[{"l":7,"t":"P","x":"Your brews can now hold an additional effect. Refer to Potent Brew under the Crafting section for a more detailed explanation. Takes twice as long to brew The same effect can be stacked twice."},{"l":8,"t":"P","x":"You can adjust your brews to your specific needs now. Your brews can manifest their effects when consumed in smaller increments now."},{"l":9,"t":"P","x":"When calculating the toxicity of Potent Brews, you roll toxicity for both brews but only use the higher roll as opposed to the addition of the two."},{"l":9,"t":"P","x":"When crafting Potent brews, increments to one of the brews increments the other one as well."}]},{"n":"Bottled Miracle","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Powdertinker":{"d":"The skill for creating custom ammunition, weapon oils, explosives and other consumables. Allows the user to forge customized ammo for specific situations. These consumables are usually significantly more powerful than their run of the mill, vendor sold counterparts.","r":["Increases your Powdertinker modifier by 3% per SP."],"tips":["For a party that has a lot of fighters, this skill can be an amazing support skill that can boost the parties damage output significantly.","As a solo fighter this skill can increase your effectiveness and situational control in combat.","Can be costly to craft a lot of consumables, so watch out!"],"gs":[{"n":"Tinkerling","f":"Contrary to most scientists, you're starting to learn to make things explode when you want them to.","p":[{"l":3,"t":"P","x":"You become Proficient in Powdertinkering. Refer to the Powdertinkering rules under the Crafting section for a more detailed explanation. You can use custom Coats for munitions. You can fail once when making a munition."},{"l":4,"t":"P","x":"You can incorporate custom Cores and Tips into your munitions."}]},{"n":"Novice Tinker","f":"You're beginning to understand that there's more to ammunitions than simply large explosions. Your craft begins to gain depth.","p":[{"l":5,"t":"A","x":"You can elect to implement a property you failed in, in addition to the detriment.","u":{"recharge":"Long rest","ap":"2"}},{"l":6,"t":"P","x":"You can fail twice before the crafting process ends when making a munition."}]},{"n":"Expert Tinker","f":"Each one of your works are like perfectly designed gifts of pain and torment. Your craft is distinguishably well-made.","p":[{"l":7,"t":"P","x":"You can incorporate Status properties into your munitions. You can incorporate Area properties into your munitions."},{"l":8,"t":"P","x":"For each unused failure left after the crafting procedure, you produce an additional half-clip of munitions."}]},{"n":"Master o' Munitions","f":"Using your craft is almost like cheating - it becomes increasingly harder to fail in killing when utilizing your products.","p":[{"l":9,"t":"P","x":"You get an additional clip of munitions out of every crafting block."},{"l":10,"t":"A","x":"Ignore 1 detriment in a crafting procedure.","u":{"recharge":"Long rest","ap":"2"}}]}]},"Awareness":{"d":"The skill for the characters grasp on their surroundings, and how they might change at a moments notice.","r":["Increases your Awareness modifier by 3% per SP."],"gs":[{"n":"Observant","f":"You are, by nature perhaps, more attentive to details than most.","p":[{"l":3,"t":"P","x":"You become Proficient in Investigation. You can use your Awareness modifier for any Investigation roll. If you are already Proficient in Investigation, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"You become Proficient in Perception. You can use your Awareness modifier for any Perception roll. If you are already Proficient in Perception, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Expectant","f":"You are becoming very good at detecting subtle hints around you, both in people and in your environment.","p":[{"l":5,"t":"P","x":"You become Proficient in Insight. You can use your Awareness modifier in place of your Insight modifier. If you are already Proficient in Insight, refer to the Skill Bonuses section under Secondary Skills."},{"l":6,"t":"P","x":"Any time you are surprised in combat, roll an Awareness check contested against a check made by the opponent as a part of its surprise round. s = You are no longer surprised. f = You are considered surprised."},{"l":6,"t":"P","x":"For secondary skills gained from this skill, taking the Skill Attempt action costs 1 AP less. For secondary skills gained from this skill, Skill Attempt action can be taken as a Reaction."}]},{"n":"Unblinded","f":"Your other senses allow you to get by without the use of sight most of the time.","p":[{"l":7,"t":"P","x":"Whenever a creature attempts to attack you with advantage, roll an Awareness check. Any time you are attacked with advantage, roll an Awareness check contested against the opponents attack roll. s = The opponents attack loses its advantage."},{"l":8,"t":"P","x":"Anytime you are blinded or deprived of sensory input in any way you can roll an Awareness check. s = You are considered not blinded. f = Blinded condition persists. In combat, the Awareness check will be rolled each turn. Out of combat, the Awareness check will be rolled per action named."},{"l":9,"t":"P","x":"You can sense hostile intent directed towards you. At the start of your turn in combat, you can ask the GM for any opponents that intend to attack you this round. At any time outside of combat, you can roll an Insight check to determine any hostile intent directed towards you."}]},{"n":"Future Sight","f":"Your awareness almost allows you to see into the near future.","p":[{"l":10,"t":"E","x":"While this Empowerment is active, after an enemy has played its turn, you can choose to take your turn as if the enemy has not yet played it up to three times. Doing so consumes a charge. The effect ends when all 3 charges are expended.","u":{"stamina":"2","ap":"2","turns":"10"}}]}]},"Medicine":{"d":"The skill for knowledge of anatomy and the human body, and how to cure it if the need arises.","r":["Increases your Medicine modifier by 3% per SP."],"tips":["This is a very useful support skill. A character with Medicine in a party will help tremendously with reducing potion costs and getting back into shape after a fight.","Few abilities exist in the rulebook that can prevent death in a combat scenario. This skill includes one of them. Keep that in mind while building your character. 61 to 80 Above 80 — — — — 1 — 1 — — — — — 6 4 2 1 2d10 2d8 2d6 2d4 5 4 3 2 5 4 3 2 1d10 1d8 1d6 1d4 2 2 1 1"],"gs":[{"n":"An apple a day...","f":"Your basic understanding in healing gives you certain benefits in physical injuries.","p":[{"l":3,"t":"P","x":"You become Proficient in First Aid. You can use your Medicine modifier in place of your First Aid modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"A","x":"Your next First Aid check gains advantage. You can decide to use this ability after failing a First Aid check.","u":{"recharge":"Long rest","ap":"1","uses":"2"}}]},{"n":"...keeps the doctor away!","f":"A little advice here, a little treatment there...","p":[{"l":5,"t":"P","x":"You gain the ability to Assist your allies. You can use any Assist option from the Assist Options table"},{"l":6,"t":"P","x":"You can always Assist yourself if you desire. Assisting yourself does not count toward the daily limit."}]},{"n":"The Doctor Is In","f":"Your knowledge in medicine allows you to delay certain death now. For a little while.","p":[{"l":7,"t":"A","x":"You can undo Exhaustion stacks gained from rolling death saving throws as long as it is not the last one. Roll a Medicine check against a DC of 30. If you succeed, 2 stacks of Exhaustion gained from failing death saving throws are undone. The DC gets harder for each target by 10% for each subsequent try, whether it be success or failure. This ability takes a turn to use.","u":{"ap":"4"}},{"l":8,"t":"P","x":"You can Assist two people at once or a single person twice now. You cannot use the same Assist type on the same person twice."}]},{"n":"Asclepius Reborn","f":"Your skill in healing rivals that of an entire team of doctors at this point.","p":[{"l":9,"t":"E","x":"You can Assist up to 5 people at once. This takes 3 hours to complete. You cannot Assist yourself after using this Empowerment.","u":{"stamina":"2"}},{"l":10,"t":"P","x":"TBD"}]}]},"Warding":{"d":"TBD.","r":["Increases your Warding modifier by 3% per SP.","Increases your Sigils per AP by 3 per SP."],"tips":["This is the closest thing to fantasy spell casting in the system probably.","Chaining the 3 Active Abilities pump the power of a Ward can result in devastating results.","For the Active of The First Epic, remember that adjectives are also Words of Power. It might come in handy when you want to inscribe a very very very big fireball."],"b":[{"title":"Warding in Combat","lines":["Warding Magic as presented is a very open ended system but requires a certain amount of book keeping and experimentation. As a player, try not to come up with very complex Wards on the spot. Instead try to come up with Ward sentences beforehand and experiment in combat."]}],"gs":[{"n":"The Mightier Pen","f":"In turns out, words DO have power.","p":[{"l":3,"t":"P","x":"You can inscribe Formulaic Wards. Refer to Formulaic Wards for a detailed explanation. You can only use Warding out of combat."},{"l":4,"t":"P","x":"You can inscribe Ritual Wards. Refer to Ritual Wards for a detailed explanation."}]},{"n":"Works of a Writer","f":"After all the reading, a question comes to you: \"Can I write my own?\".","p":[{"l":5,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, you can use 2xSigils per AP, but you accumulate 2x Fatigue.","u":{"ap":"0","uses":"3"}},{"l":5,"t":"P","x":"You can inscribe Spontaneous Wards and use Words of Power. Refer to Spontaneous Wards and Words of Power for a detailed explanation."},{"l":6,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, you accumulate no Fatigue.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"P","x":"When inscribing Wards, you can repeat the same Adjective multiple times, amplifying the effect."}]},{"n":"The First Epic","f":"Your skill in Warding grows as does your vocabulary.","p":[{"l":7,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, up to 3 Words of Power of your choosing costs 1 Sigil to inscribe.","u":{"recharge":"Long rest","ap":"1","uses":"3"}},{"l":7,"t":"P","x":"When inscribing Wards, you can use Conjunctions to create more complex Wards."},{"l":8,"t":"P","x":"You can inscribe Wards as reactions."}]},{"n":"Shade of Erebus","f":"Sigils fly from your fingers, altering reality, bending fate.","p":[{"l":9,"t":"P","x":"When inscribing Wards, Adverbs cost 1 Sigil less. When inscribing Wards, Subjects cost 3 Sigils less."},{"l":10,"t":"P","x":"TBD"}]}]},"Sangromancy":{"d":"Sangromancy is the manipulation of blood.... TBD.","r":["Increases your Sangromancy modifier by 3% per SP.","Increases the amount of blood manipulations you can sustain by 1 per 2 SP."],"gs":[{"n":"aa","f":"TBD","p":[{"l":3,"t":"P","x":"You can can control your blood and direct it against a single target. You can only direct your blood to inflict curses. These Curses are explained in the curses section of Sangromancy."}]},{"n":"Bloodletting","f":"TBD","p":[{"l":5,"t":"P","x":"You can control your blood against multiple targets now. You can shape and forge your blood into creations now. These Creations are explained in the creations section of Sangromancy."}]},{"n":"cc","f":"TBD","p":[{"l":7,"t":"P","x":"Your curses no longer requires verbal components. Only somatic gestures. You can shape and forge your blood into constructs now. These Constructs are explained in the constructs section of Sangromancy. You can use any source of blood to fuel your incantations. You cannot bend the blood within a living body. Using stale blood that was drawn further back than an hour results in doubling the cost of any incantation in terms of BP required."}]},{"n":"dd","f":"TBD","p":[{"l":10,"t":"P","x":"Your incantations and creations no longer have any upkeep costs to maintain."}]}]},"Dreamwalking":{"d":"There are few places more dangerous for the waking soul to be than the realm of the dream.","r":["Increases your Dreamwalking modifier by 3% per SP."],"tips":["Dreamrealm is a dangerous place. Do not take it lightly, as you can easily die there.","Dreamwalking is more of a supportive skill until you invest a considerable amount of points into it. The combat potential start to come into play with the dreamsphere."],"gs":[{"n":"Close your eyes","f":"In the place you travel every night, you've found a whole new world.","p":[{"l":3,"t":"P","x":"You can enter the dream realm at will now. You have to be asleep to do this. Roll a dreamwalking check, depending on your characters physical condition, GM will decide on a difficulty. On a success you enter the dream realm on a failure you simply fall asleep. On a very high failure however you enter the realm with a calamity."},{"l":4,"t":"P","x":"You gain the ability to transpose objects. Refer to Transposition for a detailed explanation."}]},{"n":"Bring me a dream!","f":"The dreams come easily to you know.","p":[{"l":5,"t":"A","x":"You can send items to the dream realm at will now. Anytime you want to do this roll a dreamwalking check. If the check succeeds, you send the item successfully, if the check fails, the item disappears till your next long rest. Each item put inside the realm increases the toll of the user depending on the size of the object. Only works on inanimate objects that you are touching and can lift. All items will return to the material plane if the user does not renew the binding each day which is done by a rolling a dreamwalking roll and succeeding. Doing this takes 3 minutes of concentrating.","u":{"ap":"1"}},{"l":5,"t":"P","x":"You gain the ability to translocate objects. Refer to Translocation for a detailed explanation."},{"l":6,"t":"A","x":"You next roll that relies on observation (Perception, Insight, Investigation) gains advantage. Increases toll till the next long rest by 5%.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"P","x":"Entering the dream realm no longer requires a dreamwalking check and always succeeds as long as you can fall asleep. You can enter the dream realm while performing a mundane task that does not require active mental contribution. (walking, riding a horse etc.) Doing this increases the toll by 15% for the duration of the visit to the dream realm."}]},{"n":"Awakened Dreamer","f":"You have gained the ability to manifest a part of the dreamrealm for a short time.","p":[{"l":7,"t":"A","x":"You gain the ability to create Dreamspheres in the waking world. Refer to Dreamspheres for a detailed explanation.","u":{"recharge":"Long rest","ap":"2","uses":"3"}},{"l":7,"t":"P","x":"You gain the ability to Transfigure objects. Refer to Transfiguration for a detailed explanation."},{"l":8,"t":"P","x":"You gain the ability to pull other willing people into the dream realm now. Roll a dreamwalking check with the added toll from the travelers joining you, if you succeed you and the travelers enter the dream realm. Once inside the dream realm, all travelers make their own separate checks and are independent of you. You can take as many travelers with you as you wish. All travelers have to be within 20 meters of the dreamwalker and within dreamwalkers sight. Increases the toll by 8% per traveler for the duration of the visit to the dream realm."}]},{"n":"Morpheus beckons","f":"The realm you have mastered now follows you to the waking world. To help you bend it to your will.","p":[{"l":9,"t":"P","x":"Creating a Dreamsphere now costs 1 less AP. You can delay the creation of dreamspheres by up to a minute after you have declared your intent to create one."},{"l":10,"t":"P","x":"You gain the ability to create and manipulate Dreamseeds. Refer to Dreamseeds for a detailed explanation."}]}]},"Occult: Harmony":{"d":"Skill for controlling the flow of your bodies spiritual energy trough the mastery of chakras. Represents a characters mastery over this spiritual energy and provides ways of manipulating it to the characters benefit.","r":["You learn harmonic elements at skill levels 5,7 and 10 in addition to the one you gain at perk level 3."],"gs":[{"n":"Beyond Meditation","f":"Your studies into meditation and body strengthening techniques are leading to interesting results.","p":[{"l":3,"t":"P","x":"You gain the ability to reinforce the Opening chakra. You can only reinforce chakras with elements that you know."},{"l":3,"t":"P","x":"You gain knowledge in 1 harmonic element from the Harmonic Elements table. Once chosen, this choice becomes permanent and cannot be changed. This allows you to reinforce your chakra points with the chosen element. You gain additional harmonic elements as you level, detailed in the Rules section."},{"l":4,"t":"P","x":"You gain the ability to reinforce the Life chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Gates to the Subtle Body","f":"You discover more chakras in your body and learn to push your body even further.","p":[{"l":5,"t":"P","x":"You gain the ability to reinforce the Pain chakra. You can only reinforce chakras with elements that you know."},{"l":5,"t":"A","x":"You can change the Reinforcement on a Chakra of your choice.","u":{"recharge":"Long rest","ap":"2","uses":"3"}},{"l":6,"t":"P","x":"You gain the ability to reinforce the Healing chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Limits of Mortal Coil","f":"Your mastery over the chakras pushes you beyond the limits of what the human body is capable of.","p":[{"l":7,"t":"P","x":"You gain the ability to reinforce the Limit chakra. You can only reinforce chakras with elements that you know."},{"l":7,"t":"E","x":"You gain the ability to Release your chakra points. Refer to Releasing Chakras for a detailed explanation.","u":{"stamina":"*","ap":"0"}},{"l":8,"t":"P","x":"You gain the ability to reinforce the Wonder chakra. You can only reinforce chakras with elements that you know."},{"l":9,"t":"P","x":"You gain the ability to reinforce the View chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Master of the Subtle Body","f":"You gain complete mastery over your chakra points. To the points that you can ward of death till the very end.","p":[{"l":10,"t":"P","x":"You gain the ability to reinforce the Death and chakra. You can only reinforce chakras with elements that you know."},{"l":10,"t":"E","x":"You can change the reinforcements on all your chakras. Takes 1 minute of meditation to complete.","u":{"stamina":"2"}}]}]},"Hunting":{"d":"Skill for salvaging monster corpses for trophies that gives beneficial effects to the user, also represents general efficiency in dispatching monsters. Some explanations about hunters, the hunting skill and the nature of trophies is explained below. A Hunters Guide to Trophies! What a trophy is and what it does is explained below.","r":["Increases your Hunting modifier by 3% per SP.","Increases the maximum level of trophy you can use by 1 per SP starting at skill level 4.","You gain knowledge in 1 additional mythology per SP starting at level 3."],"tips":["For any group that runs into the supernatural frequently, having a hunter around can make things a lot easier.","Hunters excel with a lot of preparation. You need to know what you will be fighting against. Acquiring trophies and looking for potential weaknesses to exploit in anything you are hunting is crucial."],"b":[{"title":"Okay! I killed a monster! What now?","lines":["Here is a short list of steps to get your hands on your fresh new trophy!","First ask your GM about the level of the trophy. Got it? Great! Lets say it is a level 3 chimera trophy. This means the trophy will have 6 properties.","Now roll a Hunting check and look at the Salvaging Roll table to see what you got. Let's say you rolled a final result of -14. Okay the table says 6 positive attributes. Well a trophy can't have all positive attributes so we have 5 positive attributes.","Okay now time to see if the last one is negative or void. Just roll a Hunting check. Lets say the final result was 62. Well the last attribute is negative.","You got a great level 3 trophy with 5 positive and 1 negative attribute!","Last and most important step! Relentlessly harass your GM for the trophy card! If you would have rolled -32 result would be the same because level 3 trophy. If you would have rolled 53 you would have 1 negative and would roll 5 times for the rest of the attributes to see for void or negative."]}],"gs":[{"n":"A Taste of the Unknown","f":"You start to pierce the veil. All that dwells in child stories and folk tales are real it seems... and someone needs to take care of them.","p":[{"l":3,"t":"P","x":"You gain proficiency in using trophies. You can only attune level 1 trophies. Level 2 to 5 trophies cannot be activated by a novice hunter."},{"l":3,"t":"P","x":"You gain knowledge in a Mythology of your choice. For any Lore check rolled recall information regarding this Mythology, you use your Hunting modifier as the bonus instead. You gain additional mythologies as you level, detailed in the Rules section."},{"l":4,"t":"P","x":"You gain proficiency in salvaging trophies. Refer to Salvaging Trophies section for a detailed explanation."}]},{"n":"Hunt for the Living!","f":"Apparently the things that looked so invincible can be killed with the right knowledge!","p":[{"l":5,"t":"E","x":"You have learned to Release trophies. Releasing a trophy doubles its numerical values. The trophy being released needs to be attuned and belted.","u":{"stamina":"1","ap":"1","turns":"3"}},{"l":6,"t":"E","x":"You have learned to attune more trophies than 1. You can attune 1 more trophy in addition to your already attuned one. Both trophies need to be belted. One of the trophies needs to be attuned.","u":{"stamina":"1","ap":"1","turns":"3"}}]},{"n":"Hunt for the Dead!","f":"These creatures are a disease upon the world and you are the cure. Whether it be cauterizing it, amputating it or killing it outright, you seem hellbent on ridding the world of this plague.","p":[{"l":7,"t":"P","x":"You become a renowned hunter. Your reputation and your kills are heard by other hunters of the land. You also earn a title appropriate to your personality or perhaps fighting style. The title is determined by the GM. You have an easier time talking
