<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Clockwork Companion — web build backend.
   On claude.ai the page gets shared saving from the artifact runtime (window.claude.use). On its own website it
   gets the same thing from Firebase instead: this file provides a stand-in window.claude with the same
   db / assets interface, plus a "table" service (who is signed in, their role, the members list).

   Players sign in with Google, then type the table password once per device.
   Everything for one group lives under tables/<key>/…, where <key> is a hash of the table password.
   The person who creates a table is its GM; the GM can make other members GMs.
   GMs see every character; players see only the characters assigned to them. The database rules enforce this. */
(() => {
  const cfg = window.CLOCKWORK_FIREBASE;
  const configured = !!(cfg && cfg.apiKey && cfg.projectId && window.firebase);
  const KEY = "cw-table-key";
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

  async function tableKey(password) {
    const bytes = new TextEncoder().encode("clockwork-table:" + password.trim().toLowerCase());
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  let fs = null, auth = null, root = "", me = null;   // me: { uid, role, name }
  const portraits = {};   // asset id -> data URL

  const db = {
    // Players may only read their own characters, so their list is narrowed to the ones assigned to them.
    collection: name => {
      const ref = fs.collection(`${root}/${name}`);
      return name === "characters" && me.role !== "gm" ? ref.where("players", "array-contains", me.uid) : ref;
    },
    doc: path => fs.doc(`${root}/${path}`),
  };
  const assets = {
    async upload(file, previousId) {
      if (file.size > 20 * 1024 * 1024) throw { code: "too_large" };
      const data = await shrinkImage(file);   // defined in app.js
      const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await fs.doc(`${root}/portraits/${id}`).set({ data, t: Date.now() });
      portraits[id] = data;
      if (previousId && previousId !== id) fs.doc(`${root}/portraits/${previousId}`).delete().catch(() => {});
      return { id };
    },
    urlFor: id => portraits[id] || "",
    remove: id => fs.doc(`${root}/portraits/${id}`).delete().catch(() => {}),
  };
  const table = {
    get uid() { return me.uid; }, get role() { return me.role; }, get name() { return me.name; },
    members: (cb, err) => fs.collection(`${root}/members`).onSnapshot(s => cb(s.docs.map(d => Object.assign({ uid: d.id }, d.data()))), err || (() => {})),
    setRole: (uid, role) => fs.doc(`${root}/members/${uid}`).update({ role }),
    remove: uid => fs.doc(`${root}/members/${uid}`).delete(),
  };

  // ---- joining a table ----
  let opened;
  const ready = new Promise(res => (opened = res));
  const profile = u => ({ name: (u.email || "player").split("@")[0] });

  async function join(key, user, claim) {
    const metaRef = fs.doc(`tables/${key}/meta/table`), meRef = fs.doc(`tables/${key}/members/${user.uid}`);
    const meta = await metaRef.get();
    if (!meta.exists) return { error: "missing" };
    const owner = meta.data().owner;
    if (!owner && claim === undefined) return { error: "unclaimed" };   // a table made before GM roles existed
    if (!owner && claim) await metaRef.update({ owner: user.uid });
    const mine = await meRef.get();
    let role;
    if (mine.exists) { role = mine.data().role; await meRef.update(profile(user)).catch(() => {}); }
    else { role = owner === user.uid || claim ? "gm" : "player"; await meRef.set(Object.assign({ role, joined: Date.now() }, profile(user))); }
    root = `tables/${key}`; lsSet(KEY, key);
    fs.doc(`users/${user.uid}`).set({ table: key }).catch(() => {});   // so signing in on another device finds this table
    me = { uid: user.uid, role, name: profile(user).name };
    // If the GM changes this person's role, reload so they get the right view; if they're removed, send them out.
    meRef.onSnapshot(s => {
      if (!s.exists) { lsSet(KEY, null); alertLeft(); return; }
      if (s.data().role !== me.role) location.reload();
    }, () => {});
    fs.collection(`${root}/portraits`).onSnapshot(snap => {
      snap.docs.forEach(d => { portraits[d.id] = d.data().data; });
      window.dispatchEvent(new Event("cw-portraits"));
    }, () => {});
    started = true; opened(db);
    return { ok: true };
  }
  function alertLeft() {
    fs.doc(`users/${auth.currentUser.uid}`).delete().catch(() => {});
    root = ""; gate(auth.currentUser, "The GM has removed you from this table. Ask them for the table password to join again.");
  }

  // ---- accounts: a username and password, kept by Firebase. The username becomes a made-up email address
  // behind the scenes (Firebase's password sign-in needs one), so nobody has to give a real email. ----
  const cleanName = u => u.trim().toLowerCase();
  const validName = u => /^[a-z0-9][a-z0-9_.-]{1,23}$/.test(u);
  const emailFor = u => `${u}@${cfg.projectId}.firebaseapp.com`;
  const authError = code => ({
    "auth/invalid-credential": "That username and password don't match.", "auth/wrong-password": "That username and password don't match.",
    "auth/user-not-found": "That username and password don't match.", "auth/email-already-in-use": "That username is taken. Pick another.",
    "auth/weak-password": "Use at least 6 characters for the password.", "auth/too-many-requests": "Too many tries. Wait a minute and try again.",
    "auth/operation-not-allowed": "Username sign-in isn't switched on in Firebase yet (Authentication → Sign-in method → Email/Password).",
    "auth/network-request-failed": "Couldn't reach the server. Check your connection.",
  }[code] || "That didn't work. Try again.");

  // ---- the gate, drawn with the app's own styles so it follows the theme ----
  let box = null;
  function gate(user, note, key) {
    if (box) box.remove();
    box = document.createElement("div");
    box.className = "gate";
    document.body.appendChild(box);
    if (user) return tableStep(user, note, key);
    let mode = "in";
    const draw = msg => {
      box.innerHTML = `<form class="frame gatebox" novalidate>
        <div class="brand">Clockwork<small>Companion</small></div>
        <div class="seg" role="group" aria-label="Account"><button type="button" data-m="in" aria-pressed="${mode === "in"}">Sign in</button><button type="button" data-m="up" aria-pressed="${mode === "up"}">New player</button></div>
        <div class="field"><label for="gate-user">Username</label><input id="gate-user" autocomplete="username" autocapitalize="none" spellcheck="false" /></div>
        <div class="field"><label for="gate-pass">Password</label><input id="gate-pass" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}" /></div>
        ${mode === "up" ? `<div class="field"><label for="gate-table">Table password</label><input id="gate-table" type="password" autocomplete="off" /><small class="muted">Your GM gives you this. You only need it once.</small></div>` : ""}
        <p class="gate-msg muted" role="status"></p>
        <div class="row"><button class="btn primary" type="submit">${mode === "in" ? "Sign in" : "Create my account"}</button></div>
      </form>`;
      const q = s => box.querySelector(s), say = t => { q(".gate-msg").textContent = t || ""; };
      say(msg);
      box.querySelectorAll("[data-m]").forEach(b => (b.onclick = () => { mode = b.dataset.m; draw(); }));
      q("form").onsubmit = async e => {
        e.preventDefault();
        const name = cleanName(q("#gate-user").value), pass = q("#gate-pass").value;
        if (!validName(name)) { say("Usernames are 2–24 letters or numbers (dots, dashes and underscores are fine too)."); return; }
        if (mode === "in") {
          say("Signing in…");
          try { await auth.signInWithEmailAndPassword(emailFor(name), pass); } catch (err) { say(authError(err && err.code)); }
          return;
        }
        const tpw = q("#gate-table").value;
        if (pass.length < 6) { say("Use at least 6 characters for the password."); return; }
        if (!tpw.trim()) { say("Type the table password your GM gave you."); return; }
        say("Checking the table…");
        try {
          const key = await tableKey(tpw);
          pendingSignup = { key, name };
          await auth.createUserWithEmailAndPassword(emailFor(name), pass);   // onAuthStateChanged takes it from here
        } catch (err) { pendingSignup = null; say(authError(err && err.code)); }
      };
      setTimeout(() => q("#gate-user").focus(), 50);
    };
    draw(note);
  }

  // Signed in but not (yet) in a table: ask for the table password, create a table, or claim an old one.
  function tableStep(user, note, key) {
    box.innerHTML = `<form class="frame gatebox" novalidate>
        <div class="brand">Clockwork<small>Companion</small></div>
        <p>Signed in as <b></b>. <button type="button" class="linkbtn gate-out">Sign out</button></p>
        <div class="field"><label for="gate-table">Table password</label><input id="gate-table" type="password" autocomplete="off" /></div>
        <p class="gate-msg muted" role="status"></p>
        <div class="row"><button class="btn primary" type="submit">Open table</button><button class="btn gate-new" type="button" hidden>Create a new table with this password</button></div>
        <div class="row gate-claim" hidden><button class="btn primary" type="button" data-claim="1">I'm the GM: claim this table</button><button class="btn" type="button" data-claim="0">Join as a player</button></div>
      </form>`;
    const q = s => box.querySelector(s), say = t => { q(".gate-msg").textContent = t || ""; };
    q("b").textContent = shortName(user);
    q(".gate-out").onclick = () => auth.signOut();
    let pending = key || null;
    const tryJoin = async (k, claim) => {
      const r = await join(k, user, claim);
      if (r.ok) { box.remove(); box = null; return; }
      pending = k;
      if (r.error === "missing") { q(".gate-new").hidden = false; say("No table uses that password yet. Check it with your GM, or create a new table if you're the GM."); }
      if (r.error === "unclaimed") { q(".gate-claim").hidden = false; say("This table doesn't have a GM yet. If you run it, claim it now. Everyone else joins as a player."); }
    };
    q("form").onsubmit = async e => {
      e.preventDefault(); const v = q("#gate-table").value; if (!v.trim()) { say("Type the table password first."); return; }
      q(".gate-new").hidden = true; q(".gate-claim").hidden = true; say("Checking…");
      try { await tryJoin(await tableKey(v)); } catch { say("Couldn't reach the table just now. Check your connection and try again."); }
    };
    q(".gate-new").onclick = async () => {
      try { await fs.doc(`tables/${pending}/meta/table`).set({ created: Date.now(), owner: user.uid }); await tryJoin(pending); }
      catch { say("Couldn't create the table. Check the database rules in Firebase."); }
    };
    box.querySelectorAll("[data-claim]").forEach(b => (b.onclick = async () => {
      try { await tryJoin(pending, b.dataset.claim === "1"); } catch { say("Couldn't join just now. Try again."); }
    }));
    say(note);
    if (pending) tryJoin(pending).catch(() => say("Couldn't reach the table just now."));
    setTimeout(() => q("#gate-table").focus(), 50);
  }
  const shortName = u => (u.email || "").split("@")[0] || "player";
  let pendingSignup = null;

  window.CW_WEB = {
    configured,
    leave() { lsSet(KEY, null); (auth ? auth.signOut() : Promise.resolve()).then(() => location.reload()); },
  };
  if (!configured) return;   // no Firebase settings yet: the app runs in this-browser-only mode

  firebase.initializeApp(cfg);
  fs = firebase.firestore();
  auth = firebase.auth();
  window.claude = {
    use(name) {
      if (name === "db") return ready;
      if (name === "assets") return ready.then(() => assets);
      if (name === "table") return ready.then(() => table);
      return Promise.resolve(null);   // downloads use the browser's own
    },
  };
  let started = false;
  const start = () => auth.onAuthStateChanged(async user => {
    if (!user) { if (started) location.reload(); else gate(null); return; }
    if (started) return;
    const signup = pendingSignup; pendingSignup = null;
    let key = signup ? signup.key : lsGet(KEY);
    if (!key) { try { const u = await fs.doc(`users/${user.uid}`).get(); if (u.exists) key = u.data().table; } catch {} }
    if (key) {
      try { const r = await join(key, user); if (r.ok) { if (box) { box.remove(); box = null; } return; } } catch {}
      lsSet(KEY, null);
    }
    gate(user, "", key);
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
<script>
/* Clockwork rules engine — Clockwork Rulebook 2020.1.
   Pure functions only: given a character, compute everything the sheet derives. */
const CW = (() => {
  const ATTRS = [
    { k: "STR", n: "Strength" }, { k: "DEX", n: "Dexterity" }, { k: "END", n: "Endurance" },
    { k: "MND", n: "Mind" }, { k: "WIL", n: "Willpower" }, { k: "WIS", n: "Wisdom" }, { k: "PRS", n: "Presence" },
  ];

  // Order matches the printed sheet (used by the Tabletop Simulator script too).
  // pct = % added to the skill's modifier per skill point (chance skills are 1%, the rest 3%).
  const SKILL_GROUPS = [
    { attr: "STR", skills: [["Maim", 1], ["Bash", 1], ["Cleave", 1], ["Parry", 1], ["Armor Mastery", 3], ["Strong Back", 3]] },
    { attr: "DEX", skills: [["Tumble", 3], ["Pierce", 1], ["Precision", 1], ["Subtlety", 3], ["Alacrity", 3], ["Martial Arts", 3], ["Evasion", 1]] },
    { attr: "END", skills: [["Belly", 3], ["Deprivation", 3], ["Bleed Resistance", 3], ["Durability", 3], ["Shield Mastery", 1], ["Conditioning", 3], ["Versatility", 3], ["Metabolism", 3]] },
    { attr: "MND", skills: [["Demonology", 3], ["Alchemy", 3], ["Engineering", 3], ["Robotics", 3], ["Lore", 3]] },
    { attr: "WIS", skills: [["Armor Maintenance", 3], ["Weapon Maintenance", 3], ["Brewing", 3], ["Powdertinker", 3], ["Awareness", 3], ["Medicine", 3]] },
    { attr: "WIL", skills: [["Warding", 3], ["Sangromancy", 3], ["Dreamwalking", 3], ["Occult: Harmony", 3]] },
    { attr: "PRS", skills: [["Taming", 3], ["Leadership", 3], ["Runecrafting", 3], ["Hunting", 3], ["Perform", 3]] },
  ];
  const ATTR_NAME = Object.fromEntries(ATTRS.map(a => [a.k, a.n]));
  const SKILLS = {};
  SKILL_GROUPS.forEach(g => g.skills.forEach(([n, pct]) => { SKILLS[n] = { attr: g.attr, pct }; }));

  const CASTING = ["Sangromancy", "Warding", "Demonology", "Alchemy", "Dreamwalking"];

  const WEAPON_TYPES = [
    ["Slashing", "STR"], ["Piercing", "STR"], ["Bludgeoning", "STR"], ["Unarmed", "STR"], ["Motorized", "STR"], ["Improvised", "STR"],
    ["Rifles", "DEX"], ["Pistols", "DEX"], ["Sniper Rifles", "DEX"], ["Shotguns", "DEX"], ["Explosives", "DEX"],
    ["Stringed", "DEX"], ["Throwing", "DEX"], ["Finesse", "DEX"], ["Heavy", "DEX"],
  ];
  const WEAPON_ATTR = Object.fromEntries(WEAPON_TYPES);

  // [name, attribute, connected primary skill, primary level that grants proficiency, karma cost of levels 1/2/3]
  const SECONDARY = [
    ["Athletics", "STR", "Strong Back", 4, [3, 7, 10]],
    ["Acrobatics", "DEX", "Tumble", 3, [3, 7, 10]],
    ["Machine Operation", "DEX", "Engineering", 6, [2, 5, 8]],
    ["First Aid", "DEX", "Medicine", 3, [2, 5, 7]],
    ["Riding", "DEX", "Taming", 5, [2, 4, 7]],
    ["Forgery", "DEX", null, 0, [3, 5, 8]],
    ["Stealth", "DEX", "Subtlety", 3, [3, 5, 9]],
    ["Sleight of Hand", "DEX", "Alacrity", 4, [4, 6, 12]],
    ["Entrada", "END", null, 0, [2, 4, 7]],
    ["Land Navigation", "MND", null, 0, [5, 6, 8]],
    ["Naval Navigation", "MND", null, 0, [5, 6, 8]],
    ["Sky Navigation", "MND", null, 0, [5, 6, 8]],
    ["Appraisal", "MND", "Lore", 3, [4, 5, 6]],
    ["Investigation", "MND", "Awareness", 3, [3, 4, 8]],
    ["Mechanical Insight", "MND", "Engineering", 3, [3, 5, 7]],
    ["Prosthetic Operation", "MND", "Robotics", 3, [5, 7, 8]],
    ["Sailing", "WIS", null, 0, [4, 5, 7]],
    ["Sky-Sailing", "WIS", null, 0, [4, 6, 8]],
    ["Cooking", "WIS", "Brewing", 4, [2, 4, 7]],
    ["Insight", "WIS", "Awareness", 5, [3, 4, 8]],
    ["Perception", "WIS", "Awareness", 4, [2, 4, 6]],
    ["Foraging", "WIS", null, 0, [5, 7, 9]],
    ["Persuasion", "PRS", "Leadership", 3, [3, 7, 10]],
    ["Deception", "PRS", "Perform", 3, [3, 7, 10]],
    ["Intimidate", "PRS", null, 0, [3, 7, 10]],
    ["Animal Handling", "PRS", "Taming", 3, [2, 5, 7]],
  ].map(([name, attr, primary, at, cost]) => ({ name, attr, primary, at, cost }));
  const SECONDARY_BY_NAME = Object.fromEntries(SECONDARY.map(s => [s.name, s]));

  const SIZES = { small: 1, medium: 2, large: 4, huge: 8 };
  // Inventory sizes: [key, label, slots per stack, how many fit in one stack]. Bundles and ammo stack into one small slot.
  const ITEM_SIZES = [["small", "Small", 1, 1], ["medium", "Medium", 2, 1], ["large", "Large", 4, 1], ["huge", "Huge", 8, 1],
    ["bundle", "Bundle · 10 a slot", 1, 10], ["ammo", "Ammo · 50 a slot", 1, 50]];
  const ITEM_SIZE = Object.fromEntries(ITEM_SIZES.map(([k, label, slots, per]) => [k, { label, slots, per }]));
  const PROSTHETIC_TYPES = ["Replacement limb", "Added limb", "Replacement organ", "Implant", "Other"];

  const ARMOR = {
    light:  { label: "Light",  av: [1, 4],   str: 0,  am: 0, repairPerAV: 50,  repairDie: "d6"  },
    medium: { label: "Medium", av: [5, 7],   str: 10, am: 0, repairPerAV: 70,  repairDie: "d8"  },
    heavy:  { label: "Heavy",  av: [8, 11],  str: 13, am: 3, repairPerAV: 100, repairDie: "d10" },
    plate:  { label: "Plate",  av: [12, 15], str: 15, am: 5, repairPerAV: 150, repairDie: "d12" },
  };

  const ENCUMBRANCE = [
    { name: "Unencumbered",        mult: 3, explore: "10 km/h", day: "40 km", defend: 0,   move: 0 },
    { name: "Lightly Encumbered",  mult: 4, explore: "5 km/h",  day: "20 km", defend: -10, move: -2 },
    { name: "Heavily Encumbered",  mult: 5, explore: "2 km/h",  day: "10 km", defend: -20, move: -4 },
    { name: "Severely Encumbered", mult: 6, explore: "1 km/h",  day: "5 km",  defend: -40, move: -8 },
    { name: "Over Encumbered",     mult: 7, explore: "Speed 0", day: "Speed 0", defend: null, move: null },
  ];

  const WOUNDS = { light: { dmg: 6, bleed: 8, fix: "Dressing · 5 AP · bandages" },
                   moderate: { dmg: 8, bleed: 14, fix: "Stitches · 1 minute · medical kit" },
                   mortal: { dmg: 12, bleed: 20, fix: "Surgery · 1 short rest · surgery kit" } };

  const EXHAUSTION = [
    "No effect",
    "The GM can botch your rolls (once a round in combat, or once per 5 checks outside it)",
    "You cannot take reactions",
    "Disadvantage on secondary skill checks and saving throws",
    "Critical fumble chance doubles",
    "Disadvantage on ability checks and attack rolls",
    "You cannot critically succeed",
    "Hit point maximum halved",
    "You cannot use Active Abilities or Empowerments",
    "Any vital loss rolled on dice takes the maximum instead",
    "Death",
  ];

  const PROFICIENCY = [[10, "Master"], [7, "Adept"], [5, "Proficient"], [3, "Competent"], [0, "Inexperienced"]];

  // ---------- helpers ----------
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const num = v => (Number.isFinite(+v) ? +v : 0);
  // Karma: buying level n costs n (level 1 = 1, level 10 = 10), so reaching level n from 0 costs 1 + 2 + … + n (0 → 10 = 55).
  const tri = n => (n * (n + 1)) / 2;
  const karmaBetween = (from, to) => tri(to) - tri(from);

  function blankCharacter() {
    const attrs = {}; ATTRS.forEach(a => (attrs[a.k] = { base: 10, value: 10 }));
    const skills = {}; Object.keys(SKILLS).forEach(s => (skills[s] = 0));
    const weapons = {}; WEAPON_TYPES.forEach(([w]) => (weapons[w] = 0));
    const secondary = {}; SECONDARY.forEach(s => (secondary[s.name] = 0));
    return {
      v: 1, name: "", player: "", campaign: "", profession: "", faction: "", age: "", height: "", weight: "",
      portraitAsset: "", portraitUrl: "", notes: "",
      karma: 0, pool: 0,
      attrs, skills, weaponSkills: weapons, secondary,
      vitals: { hp: null, bp: null, dp: null, tox: 0, exhaustion: 0, staminaLost: 0,
                wounds: { light: 0, moderate: 0, mortal: 0 }, conditions: [] },
      prosthetics: [], coins: 0,
      items: [], weapons: [], armor: [], log: [],
    };
  }

  // Fill in any fields an older or partial character is missing.
  function normalize(c) {
    const b = blankCharacter();
    const out = Object.assign({}, b, c || {});
    out.attrs = Object.assign({}, b.attrs, c && c.attrs);
    ATTRS.forEach(a => { const v = out.attrs[a.k]; out.attrs[a.k] = typeof v === "number" ? { base: v, value: v } : Object.assign({ base: 10, value: 10 }, v); });
    out.skills = Object.assign({}, b.skills, c && c.skills);
    out.weaponSkills = Object.assign({}, b.weaponSkills, c && c.weaponSkills);
    out.secondary = Object.assign({}, b.secondary, c && c.secondary);
    out.vitals = Object.assign({}, b.vitals, c && c.vitals);
    out.vitals.wounds = Object.assign({}, b.vitals.wounds, c && c.vitals && c.vitals.wounds);
    ["items", "weapons", "armor", "log"].forEach(k => (out[k] = Array.isArray(out[k]) ? out[k] : []));
    if (!Array.isArray(out.vitals.conditions)) out.vitals.conditions = [];
    // Older sheets: a prosthetic count becomes that many unnamed entries; per-slot items become bundles or ammo.
    if (!Array.isArray(out.prosthetics)) out.prosthetics = Array.from({ length: Math.max(0, num(out.prosthetics)) }, (_, i) => ({ id: "pr" + i, name: "", type: PROSTHETIC_TYPES[0], props: "" }));
    out.items = out.items.map(it => (it.per > 1 && (it.size || "small") === "small" ? Object.assign({}, it, { size: it.per >= 50 ? "ammo" : "bundle", per: undefined }) : it));
    return out;
  }

  const attr = (c, k) => num(c.attrs[k] && c.attrs[k].value);
  const attrBase = (c, k) => num(c.attrs[k] && c.attrs[k].base);
  // Attributes run 0–20 with 10 as the median. Below 10 an attribute is "broken".
  // Karma counts levels above a threshold: 10 for most attributes, so 16 → 17 is level 7 and costs 7.
  // An attribute that STARTED broken uses its starting value as its own "10" instead:
  // a starting 6 pays 1 for 7, 2 for 8, 3 for 9 … and tops out at 16 (threshold + 10).
  const attrThreshold = (c, k) => Math.min(10, attrBase(c, k));
  const attrCap = (c, k) => Math.min(20, attrThreshold(c, k) + 10);
  const attrCost = (c, k, from, to) => { const t = attrThreshold(c, k); return tri(Math.max(0, to - t)) - tri(Math.max(0, from - t)); };
  const sk = (c, n) => num(c.skills[n]);

  // A skill can't be higher than its governing attribute, and tops out at 10.
  // A skill (or weapon skill) can hold as many points as its attribute has above 10:
  // Mind 16 allows 6 in Alchemy; a broken attribute (below 10) allows none.
  const pointsAbove10 = v => clamp(v - 10, 0, 10);
  const skillCap = (c, name) => pointsAbove10(attr(c, SKILLS[name].attr));
  const weaponCap = (c, type) => pointsAbove10(attr(c, WEAPON_ATTR[type]));
  // Secondary skills: attribute below 10 → level 1, below 14 → level 2, 14+ → level 3.
  function secondaryCap(c, name) {
    const a = attr(c, SECONDARY_BY_NAME[name].attr);
    return a < 10 ? 1 : a < 14 ? 2 : 3;
  }
  const secondaryCost = (name, from, to) => SECONDARY_BY_NAME[name].cost.slice(from, to).reduce((s, x) => s + x, 0);

  function proficiency(level) { for (const [at, n] of PROFICIENCY) if (level >= at) return n; return "Inexperienced"; }

  // Everything with pips, in one place: where its level lives, its ceiling, its governing attribute and its Karma price.
  // kind: "attr" | "skill" | "weapon" | "sec". cost(from, to) is the price of raising from → to (to > from).
  const LEVELS = {
    attr:   { max: 20, get: (c, n) => attr(c, n), put: (x, n, v) => { x.attrs[n].value = v; }, cap: (c, n) => attrCap(c, n),
              attrOf: n => n, cost: (c, n, a, b) => attrCost(c, n, a, b) },
    skill:  { max: 10, get: (c, n) => num(c.skills[n]), put: (x, n, v) => { x.skills[n] = v; }, cap: (c, n) => skillCap(c, n),
              attrOf: n => SKILLS[n].attr, cost: (c, n, a, b) => karmaBetween(a, b) },
    weapon: { max: 10, get: (c, n) => num(c.weaponSkills[n]), put: (x, n, v) => { x.weaponSkills[n] = v; }, cap: (c, n) => weaponCap(c, n),
              attrOf: n => WEAPON_ATTR[n], cost: (c, n, a, b) => karmaBetween(a, b) },
    sec:    { max: 3, get: (c, n) => num(c.secondary[n]), put: (x, n, v) => { x.secondary[n] = v; }, cap: (c, n) => secondaryCap(c, n),
              attrOf: n => SECONDARY_BY_NAME[n].attr, cost: (c, n, a, b) => secondaryCost(n, a, b) },
  };
  // Karma change for moving a level from → to: positive to raise, negative (a refund) to lower.
  const levelDelta = (c, kind, n, from, to) => { const L = LEVELS[kind]; return to >= from ? L.cost(c, n, from, to) : -L.cost(c, n, to, from); };

  function karmaSpent(c) {
    let attrs = 0, skills = 0, weapons = 0, secondary = 0;
    ATTRS.forEach(a => { attrs += attrCost(c, a.k, attrBase(c, a.k), attr(c, a.k)); });
    Object.keys(SKILLS).forEach(s => (skills += tri(sk(c, s))));
    WEAPON_TYPES.forEach(([w]) => (weapons += tri(num(c.weaponSkills[w]))));
    SECONDARY.forEach(s => (secondary += secondaryCost(s.name, 0, num(c.secondary[s.name]))));
    return { attrs, skills, weapons, secondary, total: attrs + skills + weapons + secondary };
  }

  // ---------- armor ----------
  function armorCastingRelief(c) {
    const am = sk(c, "Armor Mastery");
    if (am >= 10) return 3 * am;   // reduced by the Armor Mastery modifier
    if (am >= 7) return 2 * am;
    if (am >= 5) return am;
    return 0;
  }
  function armorCheck(c, a) {
    const t = ARMOR[a.type] || ARMOR.light;
    const problems = [];
    if (attr(c, "STR") < t.str) problems.push(`Needs Strength ${t.str}`);
    if (t.am && sk(c, "Armor Mastery") < t.am) problems.push(`Needs Armor Mastery ${t.am} for proficiency`);
    const av = num(a.av);
    if (av < t.av[0] || av > t.av[1]) problems.push(`${t.label} armor has an Armor Value of ${t.av[0]}–${t.av[1]}`);
    const soakBonus = sk(c, "Armor Mastery") >= 4 ? 3 * sk(c, "Armor Mastery") : 0;
    return { ok: problems.length === 0, problems, soakMax: num(a.soakMax) + soakBonus, soakBonus,
             repairCost: t.repairPerAV * av, repairDie: t.repairDie };
  }
  function wornArmor(c) { return c.armor.find(a => a.worn) || null; }

  function armorPenalties(c) {
    const a = wornArmor(c);
    const out = { casting: 0, dexSkills: 0, stealth: 0, stealthDisadv: false, entrada: 0, saves: 0, travel: 0, armor: a };
    if (!a) return out;
    const av = num(a.av);
    out.casting = Math.max(0, 2 * av - armorCastingRelief(c));
    if (a.type === "medium") out.stealth = av;
    if (a.type === "heavy" || a.type === "plate") { out.dexSkills = av; out.stealthDisadv = true; }
    if (a.type === "heavy") out.entrada = 2 * av;
    if (a.type === "plate") { out.saves = av; out.travel = 2 * av; }
    return out;
  }

  // Modifier (in %) for a primary skill, after armor penalties. Never below 0.
  // p: the character's armorPenalties, passed in when rendering many skills at once.
  function skillModifier(c, name, p = armorPenalties(c)) {
    const s = SKILLS[name]; let m = sk(c, name) * s.pct;
    if (CASTING.includes(name)) m -= p.casting;
    if (s.attr === "DEX") m -= p.dexSkills;
    return Math.max(0, m);
  }

  function secondaryBonus(c, name, p = armorPenalties(c)) {
    const s = SECONDARY_BY_NAME[name];
    const lvl = num(c.secondary[name]);
    const primLvl = s.primary ? sk(c, s.primary) : 0;
    const viaPrimary = s.primary && primLvl >= s.at;
    let bonus, source;
    if (lvl > 0 && viaPrimary) { bonus = 7 * lvl + 2 * primLvl; source = `${7 * lvl}% + 2×${s.primary}`; }
    else if (viaPrimary) { bonus = 3 * primLvl; source = `${s.primary} modifier`; }
    else if (lvl > 0) { bonus = 7 * lvl; source = `Level ${lvl}`; }
    else { bonus = 0; source = attr(c, s.attr) < 10 ? "Untrained · disadvantage" : "Untrained · flat d100"; }
    // armor and prosthetic penalties
    if (name === "Stealth") bonus -= p.stealth + 4 * c.prosthetics.length;
    if (name === "Entrada") bonus -= p.entrada + 7 * c.prosthetics.length;
    if (s.attr === "DEX") bonus -= p.dexSkills;
    const disadv = (name === "Stealth" && p.stealthDisadv) || (lvl === 0 && !viaPrimary && attr(c, s.attr) < 10);
    return { bonus: Math.max(0, bonus), source, disadv, trained: !!(lvl > 0 || viaPrimary) };
  }

  // ---------- vitals ----------
  function vitalsMax(c) {
    const end = clamp(attr(c, "END"), 0, 20);
    const br = sk(c, "Bleed Resistance"), belly = sk(c, "Belly");
    const hp = 2 * end + 4 * sk(c, "Durability");
    return {
      // Exhaustion 7 halves the hit point maximum (effects build up, so it stays halved at 8 and 9).
      hp: num(c.vitals && c.vitals.exhaustion) >= 7 ? Math.floor(hp / 2) : hp,
      bp: Math.min(400, 200 + 20 * br),
      dp: 4 * end + 12 * sk(c, "Deprivation"),
      tox: end + 2 * belly,
    };
  }
  function bloodExhaustion(bp) { return bp > 100 ? 0 : 1 + Math.floor((100 - bp) / 20); }
  function hungerExhaustion(dp) { return [25, 20, 15, 10, 5].filter(t => dp <= t).length; }

  function derived(c) {
    const max = vitalsMax(c);
    const v = c.vitals;
    // A stored value can sit above a maximum that has since dropped (lower Endurance, Exhaustion 7), so cap it.
    const fill = (k, m) => (v[k] == null ? m : clamp(num(v[k]), 0, m));
    const cur = { hp: fill("hp", max.hp), bp: fill("bp", max.bp), dp: fill("dp", max.dp), tox: Math.max(0, num(v.tox)) };
    const belly = sk(c, "Belly"), br = sk(c, "Bleed Resistance"), end = attr(c, "END");
    const woundBonus = sk(c, "Durability") >= 7 ? 2 : 0;
    const bleed = Object.entries(WOUNDS).reduce((s, [k, w]) => s + w.bleed * num(v.wounds[k]), 0);
    const enc = encumbrance(c);
    const baseMove = 10 + sk(c, "Tumble");
    const move = enc.tier.move == null ? 0 : Math.max(0, baseMove + enc.effectiveMove);
    let rationsPerMeal = 2;
    if (belly >= 3) rationsPerMeal = end <= 5 ? 5 : end <= 8 ? 6 : 7;
    return {
      max, cur,
      hpRegen: 2 + sk(c, "Metabolism"),
      bpRegen: 10 + 3 * br,
      cleanse: "1d6" + (Math.floor(belly / 2) ? ` + ${Math.floor(belly / 2)}d4` : ""),
      cleanseDice: { d6: 1, d4: Math.floor(belly / 2) },
      potency: Math.floor(br / 2) ? `${Math.floor(br / 2)}d10` : "—",
      woundAt: { light: 6 + woundBonus, moderate: 8 + woundBonus, mortal: 12 + woundBonus },
      bleedPerTurn: bleed,
      exhaustionFromBlood: bloodExhaustion(cur.bp),
      exhaustionFromHunger: hungerExhaustion(cur.dp),
      overToxic: cur.tox > max.tox,
      move, baseMove, climb: Math.floor(move / 2),
      mealsPerDay: sk(c, "Deprivation") >= 3 ? 2 : 3,
      rationsPerDay: (sk(c, "Deprivation") >= 3 ? 2 : 3) + c.prosthetics.length,
      rationsPerMeal,
      exhaustionEffect: EXHAUSTION[clamp(num(v.exhaustion), 0, 10)],
      enc,
      karma: karmaSpent(c),
      armor: armorPenalties(c),
    };
  }

  // ---------- encumbrance ----------
  function itemUnits(it) {
    const per = Math.max(1, num(it.per) || 1);
    const z = ITEM_SIZE[it.size] || ITEM_SIZE.small;
    return Math.ceil(num(it.qty) / Math.max(z.per, per)) * z.slots;
  }
  function encumbrance(c) {
    const unit = attr(c, "STR") + 2 * sk(c, "Strong Back");
    const freeSets = sk(c, "Strong Back") >= 3 ? 3 : 2;
    let load = 0;
    const lines = [];
    c.items.forEach(it => { const u = itemUnits(it); load += u; if (u) lines.push([it.name || "Item", u]); });   // everything listed is carried
    if (num(c.coins) > 0) { const u = Math.ceil(num(c.coins) / 100); load += u; lines.push(["Coins", u]); }
    // Weapons: the first sets ride free; shields always count as large; spares count by size.
    let setsUsed = 0;
    c.weapons.forEach(w => {
      if (w.where === "stash") return;
      if (w.shield) { load += 4; lines.push([w.name || "Shield", 4]); return; }
      const slots = num(w.hands) === 2 ? 1 : 0.5;
      if (w.where !== "pack" && setsUsed + slots <= freeSets) { setsUsed += slots; return; }
      const u = SIZES[w.size] || 2; load += u; lines.push([w.name || "Weapon", u]);
    });
    c.armor.forEach(a => {
      if (a.where === "stash") return;
      const u = a.type === "plate" ? 8 : a.type === "heavy" ? 4 : (a.worn ? 0 : 2);
      if (u) { load += u; lines.push([a.name || "Armor", u]); }
    });
    // Unencumbered up to 3 × unit, then one tier per extra unit; past 6 × unit is Over Encumbered.
    let idx = ENCUMBRANCE.findIndex(t => load <= t.mult * unit);
    if (idx === -1) idx = 4;
    const tier = ENCUMBRANCE[idx];
    // Strong Back 5/7/9 ignore the penalties of the light/heavy/severe tiers.
    const sb = sk(c, "Strong Back");
    const ignored = sb >= 9 ? 3 : sb >= 7 ? 2 : sb >= 5 ? 1 : 0;
    const penalised = idx > 0 && idx < 4 && idx <= ignored ? ENCUMBRANCE[0] : tier;
    return { unit, load, capacity: 3 * unit, limits: ENCUMBRANCE.map(t => t.mult * unit), tierIndex: idx, tier,
             effective: penalised, effectiveMove: penalised.move || 0, ignored: penalised !== tier, freeSets, setsUsed, lines };
  }

  // ---------- weapons ----------
  function weaponLine(c, w) {
    const lvl = num(c.weaponSkills[w.skill]);
    const accuracy = lvl >= 3 ? lvl + sk(c, "Precision") + num(w.accuracy) : num(w.accuracy) < 0 ? num(w.accuracy) : 0;
    return { level: lvl, proficiency: proficiency(lvl), accuracy, crit: num(w.crit) };
  }

  // ---------- rests ----------
  function rollDie(sides) { return 1 + Math.floor(Math.random() * sides); }
  function shortRest(c) {
    const v = c.vitals; const lines = [];
    if (num(v.staminaLost) > 0) { v.staminaLost = Math.max(0, num(v.staminaLost) - 1 - (sk(c, "Conditioning") >= 6 ? 1 : 0)); lines.push("Recovered Stamina"); }
    return lines.join(" · ") || "Short rest";
  }
  function longRest(c) {
    const d = derived(c); const v = c.vitals; const parts = [];
    const hp = Math.min(d.max.hp, d.cur.hp + d.hpRegen); parts.push(`HP +${hp - d.cur.hp}`); v.hp = hp;
    const bp = Math.min(d.max.bp, d.cur.bp + d.bpRegen); parts.push(`Blood +${bp - d.cur.bp}`); v.bp = bp;
    let roll = rollDie(6); for (let i = 0; i < d.cleanseDice.d4; i++) roll += rollDie(4);
    const tox = Math.max(0, d.cur.tox - roll); parts.push(`Toxicity −${d.cur.tox - tox} (rolled ${roll})`); v.tox = tox;
    const st = Math.max(0, num(v.staminaLost) - 2 - (sk(c, "Conditioning") >= 7 ? 2 : 0)); if (st !== num(v.staminaLost)) parts.push("Stamina recovered"); v.staminaLost = st;
    return "Long rest: " + parts.join(" · ");
  }

  function rollAttribute() { const r = [rollDie(8), rollDie(8), rollDie(8)].sort((a, b) => a - b); return Math.max(6, r[1] + r[2]); }

  // ---------- Tabletop Simulator export ----------
  function toTabletop(c) {
    const d = derived(c);
    const attrs = {}, attrBases = {}; ATTRS.forEach(a => { attrs[a.k] = attr(c, a.k); attrBases[a.k] = attrBase(c, a.k); });
    const skills = {}; Object.keys(SKILLS).forEach(s => { if (sk(c, s)) skills[s] = sk(c, s); });
    const weap = WEAPON_TYPES.map(([w]) => [w, num(c.weaponSkills[w])]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    const sec = SECONDARY.map(s => [s.name, num(c.secondary[s.name])]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    return {
      cw: 1, id: c.id || "", name: c.name, profession: c.profession, faction: c.faction,
      age: c.age, height: c.height, weight: c.weight, karma: num(c.karma), pool: num(c.pool),

  // Merge a code exported from the Tabletop Simulator sheet back into a character.
  function fromTabletop(c, t) {
    if (!t || t.cw !== 1) throw new Error("That isn't a Clockwork code. Copy it from the sheet's Export button.");
    const n = normalize(JSON.parse(JSON.stringify(c)));
    ["name", "profession", "faction", "age", "height", "weight"].forEach(k => { if (typeof t[k] === "string" && t[k]) n[k] = t[k]; });
    if (Number.isFinite(t.karma)) n.karma = t.karma;
    if (Number.isFinite(t.pool)) n.pool = t.pool;
    if (t.attrs) ATTRS.forEach(a => { if (Number.isFinite(t.attrs[a.k])) n.attrs[a.k].value = t.attrs[a.k]; });
    if (t.skills) Object.keys(SKILLS).forEach(s => (n.skills[s] = Number.isFinite(t.skills[s]) ? t.skills[s] : 0));
    if (Array.isArray(t.weapons)) t.weapons.forEach(([w, l]) => { if (w in n.weaponSkills && Number.isFinite(l)) n.weaponSkills[w] = l; });
    if (Array.isArray(t.secondary)) t.secondary.forEach(([s, l]) => { if (s in n.secondary && Number.isFinite(l)) n.secondary[s] = l; });
    if (t.vitals) {
      const v = t.vitals;
      ["hp", "bp", "dp", "tox", "exhaustion", "staminaLost"].forEach(k => { if (Number.isFinite(v[k])) n.vitals[k] = v[k]; });
      if (v.wounds) ["light", "moderate", "mortal"].forEach(k => { if (Number.isFinite(v.wounds[k])) n.vitals.wounds[k] = v.wounds[k]; });
    }
    return n;
  }

acter like climbing buildings, jumping large gaps, rolling etc.","r":["Increases your Tumble modifier by 3% per SP.","Increases movement per AP by 1 meters per 2 SP.","Increases jumping height and distance by 1/2 meters per SP.","Decreases fall damage by 1 per SP."],"tips":["Jack be Quick! is useful for almost every character that finds itself engaged in combat occasionally.","Movement speed is especially useful if you are aiming for a fast and nimble character.","In an urban campaign having a party member with Jack be Racin’! will open a lot of possibilities."],"gs":[{"n":"Jack be Nimble!","f":"You are much more nimble than the average person, rolling, jumping, running seems easy to you.","p":[{"l":3,"t":"P","x":"You become Proficient in Acrobatics. You can use your Tumble modifier in place of your Acrobatics modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"Taking the Get Up action costs 1 less AP."}]},{"n":"Jack be Quick!","f":"You are getting faster on your feet. You would have a solid chance at any race you enter.","p":[{"l":5,"t":"A","x":"Whenever you take a Move Action this turn, you move an additional SP/2 meters.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"A","x":"You gain advantage on your next Acrobatics check.","u":{"recharge":"Long rest","ap":"1","uses":"2"}}]},{"n":"Jack be Racin’!","p":[{"l":7,"t":"P","x":"Climbing and running over obstacles no longer hinder your movement and does not require an Acrobatics check. Climbing vertically without equipment or leverage no longer incurs disadvantage."},{"l":8,"t":"A","x":"The next Dexterity saving throw that you fail counts as a success instead.","u":{"recharge":"Long rest","uses":"2"}}]},{"n":"Seriously Jack, Slow Down","f":"Vertical, horizontal... Axis of movement is irrelevant to you. You just move as you please.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"When you fail a dexterity saving throw, you now take%50 damage. When you succeed a dexterity saving throw, you now take no damage."}]}]},"Evasion":{"d":"Dexterity based defense skill. Skill for dodging incoming blows to reduce damage.","r":["Increases your Evasion modifier by 1% per SP.","Increases your critical Evasion chance by 1%."],"tips":["Having a Defence skill will be beneficial to any character both in and out of combat.","If your hit points are not high enough this skill is a great way to reduce some damage that would be dealt to you each turn.","If your character has impaired strength or you're aiming for a dextrous character without any investment in strength, this is a great option.","Even with parry or shield mastery already invested, consider a3 point investment in evasion. Remember, this skill doesn't require a weapon or shield at the ready."],"b":[{"title":"Evading Attacks","lines":["You move out of the way of an attack.","Reduces incoming damage by half.","Only melee attacks can be evaded.","If you have armor or resistance to the damage type, final value is calculated after the division of damage.","You cannot evade area of effects, attack has to be directed at you.","If the attack inflicts a status ailment you are still affected by it.","When you critically evade reduces all incoming damage. Base chance for critical evasion is%5.","When you evade you can perform an Evasive Maneuver. Evasive Maneuver: After a successful evasion, you gain 2 meters of extra movement."]}],"gs":[{"n":"Slide to the Left! Slide to the Right!","f":"You learn the basics of dodging and evading.","p":[{"l":3,"t":"P","x":"You gain the ability to evade attacks. This is considered a form defending."},{"l":4,"t":"A","x":"You can choose to succeed an evasion roll without rolling. Usage has to be declared before the Defend roll and after the enemy Attack roll.","u":{"recharge":"Long rest","ap":"1*","uses":"2"}}]},{"n":"Criss Cross!","f":"You're getting faster. Time seems to slow down when you feel in danger.","p":[{"l":5,"t":"P","x":"Movement gained from your Evasive Maneuver increases by 2 meters. At the end of a round, you can use your reaction to make an Evasive Maneuver without having to evade an attack first."},{"l":6,"t":"P","x":"Movement from Evasive Maneuver triggers no attack of opportunity."}]},{"n":"I am a leaf on the wind!","f":"You fly like a butterfly! Stinging like a bee requires another skill...","p":[{"l":7,"t":"P","x":"You can evade projectiles now. You can evade area of effects now."},{"l":8,"t":"P","x":"After an evade, your next Attack action costs 1 less AP."}]},{"n":"Watch how i soar...","f":"Catching a fly mid flight with chopsticks is an easier job than hitting you.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"TBD"}]}]},"Subtlety":{"d":"The skill for hiding in plain sight. Investing in this skill allows the character to disguise itself better.","r":["Increases your Subtlety modifier by 3% per SP.","Increases your Sneak Attack damage by 1 bonus damage per SP.","Attacking from Stealth incurs advantage on the Attack Roll."],"tips":["Sneak Attack is your friend, use it.","Invest in some runes, and gadgets to make hiding and, if things go south, escaping easier. You are not invisible remember?"],"b":[{"title":"Sneak Attack! What is it?","lines":["Once per turn, you can deal an extra SP bonus damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a Finesse or Ranged weapon."]}],"gs":[{"n":"Behind you!","f":"You always had a talent for hide and seek as a child.","p":[{"l":3,"t":"P","x":"You become Proficient in Stealth. You can use your Subtlety modifier in place of your Stealth modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"You learn the Sneak Attack action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"What was that sound?","f":"Every nook and cranny is a new opportunity for you to disappear in.","p":[{"l":5,"t":"P","x":"If you have taken the Stealth Action and have not moved since, upon detection, you can roll an additional Stealth check. Whichever check is better, you may use that result."},{"l":6,"t":"P","x":"You can take the Sneak Attack Action if your target is engaged in melee combat with another combatant now."}]},{"n":"Check your Closet...","f":"Everyone can be looking at you but the matter are they seeing you?","p":[{"l":7,"t":"P","x":"If you have taken the Stealth Action and the environment is dimly lit or less, upon detection, you can roll an additional Stealth check. Whichever check is better, you may use that result."},{"l":8,"t":"P","x":"Taking the Sneak Attack action takes 1 AP less. Taking the Skill Attempt: Stealth action takes 1 AP less."}]},{"n":"I'm in your Walls...","f":"You are so good at hiding at this point, you could steal a man's eyes off and he wouldn't suspect a thing.","p":[{"l":9,"t":"P","x":"TBD"},{"l":10,"t":"P","x":"TBD"}]}]},"Martial Arts":{"d":"The skill for unarmed martial prowess. Investing in this skill allows the character to use various fighting styles.","r":["Increases your Martial Arts modifier by 3% per SP.","Increases the number of Styles you can learn by 1 per 2 SP."],"b":[{"title":"What are Styles?","lines":["Martial Arts skill revolves around styles and shifting between them. Each styles includes 2 Active Abilities and 1 Passive ability. The passive ability can only be benefited from when its related stance is active. Shifting stances costs 2 AP."]}],"gs":[{"n":"Call of the Fist","p":[{"l":3,"t":"P","x":"Your first stance shift in combat costs 2 AP less."},{"l":4,"t":"A","x":"Your next martial arts Active ability costs 0 AP.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"To Temper the Body","p":[{"l":5,"t":"P","x":"Whenever a martial arts Active Ability lands, you to stance shift for 2 AP less."},{"l":6,"t":"P","x":"1 Style Passive of your choosing is now permanently active regardless of stance. You can change this passive over a short rest."}]},{"n":"Fists of Fury","p":[{"l":7,"t":"P","x":"Whenever you Riposte or make an Opportunity Attack, you can use an Active Ability along with the attack. You generate less AP equal to the abilities AP cost on your next turn."}]}]},"Durability":{"d":"The skill for resisting damage over time effects and general toughness for the character. A character with high durability is more resilient to abuse and is harder to kill in general.","r":["Increases your Durability modifier by 3% per SP.","Increases Hit Point total by 4 per SP."],"tips":["Invest in this! This is what keeps you alive!","At least 5 points is advisable for every character regardless of characters function.","7 points is advisable for melee character that are prone to face-to-face frontline combat.","At 10 points you become a force of nature that just will not be put down. So think about it maybe?"],"gs":[{"n":"Not Hot Enough","f":"You can sometimes shrug the effects of burning more easily and your skin begins to thicken.","p":[{"l":3,"t":"P","x":"You learn the Brace action. Refer to Actions in Combat for a detailed explanation."},{"l":4,"t":"P","x":"When take the Brace action, it takes +2 damage to wound you."}]},{"n":"Ox-Skin!","f":"Your skin seems to resist the effects of burning and melting more easily now. Doctors are conflicted about how this happens.","p":[{"l":5,"t":"P","x":"Brace action can be taken as a reaction now."},{"l":5,"t":"P","x":"If you can use Active abilities with your limbs, doing so no longer damages you."},{"l":6,"t":"P","x":"When you take the Brace action, any lingering damage over time effect on you deals only half as much damage."}]},{"n":"Iron-Man","f":"Things that would melt other peoples skin off does not seem to have that much of an effect on you. Yes it disturbs you but it just disturbs you.","p":[{"l":7,"t":"P","x":"It requires +2 damage to inflict a Wound on you by default."},{"l":8,"t":"E","x":"Taking the Brace action costs 1 less AP. Taking the Brace action reduces the incoming damage by half by default regardless of your damage mitigation. Taking the Brace action mitigates damage from all attacks that it can against the player for a round.","u":{"stamina":"1","ap":"3","turns":"5"}}]},{"n":"Storm, Earth and Fire! I don't care...","f":"Your skin is so calloused at this point, you could sharpen your sword on it if you wanted to. You are so used to damage and abuse that you mostly ignore it at this point.","p":[{"l":9,"t":"P","x":"Damage mitigation from taking the Brace action doubles."},{"l":10,"t":"P","x":"When you use the Iron-Man empowerment you gain the following additional benefits: Brace action mitigates Fire Damage. Brace action mitigates Cold Damage. Brace action mitigates Lightning Damage. Brace action mitigates Acid Damage."}]}]},"Metabolism":{"d":"The skill for health recovery and general speed of a characters metabolism. The more points you invest in this skill the quicker you can heal from grievous physical injuries like broken bones, deep cuts, bruises etc.","r":["Increases your Metabolism modifier by 3% per SP.","Increases your Hit Point recovery per long rest by 1 per SP."],"tips":["At least get this up to 3 if you do adventuring a lot. You get what I mean...","Investing in 5 points is useful for every character.","Invest in this skill if you are getting damaged frequently.","Very useful for tanky melee characters."],"gs":[{"n":"Fast Metabolism","f":"You are getting used to all the beating. Your wounds seems to heal a bit faster.","p":[{"l":3,"t":"P","x":"You regain 2xSP Hit Points during your next long rest. You recover no Stamina during your next long rest."},{"l":4,"t":"P","x":"Your Hit Point recovery per long rest now stacks with potions."}]},{"n":"Tis' a Flesh Wound!","f":"Any surface cuts and bruises you have suffered in combat seems to heal itself in a rather short time.","p":[{"l":5,"t":"E","x":"Any brew effect, that replenishes a vital and takes effect over a long rest, instead takes effect over your next short rest.","u":{"stamina":"1"}},{"l":6,"t":"P","x":"You learn the Regenerate action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Be Quick or Be Dead!","f":"Your metabolism is so fast you can absorb liquids at an incredible rate with some meditation.","p":[{"l":7,"t":"E","x":"During your next short rest, you recover two long rests worth of hit points. You recover no Stamina when you use this ability. Your active abilities do not recharge when you use this ability.","u":{"stamina":"1"}},{"l":8,"t":"P","x":"You can Regenerate additional temporary hit points up to your Metabolism modifier."}]},{"n":"Healing Factor","f":"Healing speed of your wounds can be seen with naked eye! What kind of sorcery is this?","p":[{"l":9,"t":"P","x":"You can take the Regenerate action 2 times per round now."},{"l":10,"t":"E","x":"Regenerate action costs 0 AP. Regenerate action recovers hit points equal to the maximum possible result the dice roll can have.","u":{"stamina":"1","ap":"3","turns":"5"}},{"l":10,"t":"P","x":"Any brew you drink that replenishes hit points during the Healing Factor empowerment affects you instantly. You lose an additional point of Stamina at the end of the empowerment when you use this effect."}]}]},"Belly":{"d":"Skill for gluttony! Governs eating and drinking poisonous consumables and increases toxic tolerance. Also related to how much you can eat at once.","r":["Increases your Belly modifier by 3% per SP.","Increases your Toxicity threshold by 2 per SP.","Increases your Cleanse dice by 1d4 per 2 SP."],"tips":["If you are a caster that uses life-force as a fuel for spellcasting investing up to Not a Picky Eater! is advisable."],"b":[{"title":"What is Toxicity?","lines":["Toxicity is a way of measuring how much toxic build up is left in your body after consuming potions and it is cleansed a certain amount during a long rest. A character cleanses 1d6 Toxicity per long rest by default."]}],"gs":[{"n":"Glutton!","f":"You eat a lot. Like... a lot!","p":[{"l":3,"t":"P","x":"You can eat up to 5 meals per long rest without getting sick. You can eat more rations per meal without getting sick."},{"l":4,"t":"P","x":"During your next long rest, you recover the maximum possible toxicity. You recover no other vitals."}]},{"n":"Not a Picky Eater!","f":"You really don't care about what you are eating as long as you can swallow it.","p":[{"l":5,"t":"E","x":"During your next short rest, you recover 2 long rests worth of toxicity.","u":{"stamina":"1"}},{"l":6,"t":"P","x":"When your toxicity is above half its threshold, all brews you imbibe impart 2 toxicity less."}]},{"n":"Can I Eat That?","f":"As someone who eats gastronomic equivalent of poison the real thing doesn't really bother you.","p":[{"l":7,"t":"P","x":"When your toxicity is above half its threshold, all brews on you last 2 times as long."},{"l":8,"t":"P","x":"When your toxicity is above half its threshold, you gain resistance to Poison damage."}]},{"n":"Toxic!","f":"Your very body is toxic, in a very physical sense.","p":[{"l":9,"t":"A","x":"A brew that would cause you to go above your toxicity threshold instead sets your toxicity to its threshold. You still retain the effects of the brew. This ability cannot be used if your toxicity is at its threshold.","u":{"recharge":"Long rest","ap":"1","uses":"1"}},{"l":10,"t":"P","x":"Succeeding a saving throw against a poison allows you to retain the effects of that poison within your blood. You can reuse that poison as you wish. 30BP's worth of blood corresponds to 1000 grams of unprocessed Powdertinkering or Brewing materials or can be used as a weapon oil made of that poison."}]}]},"Bleed Resistance":{"d":"Skill for resisting blood loss caused from suffering wounds and how losing blood affects your character.","r":["Increases your Blood Points by 40 per 2SP. (400 BP max)","Increases your Blood Point regeneration per long rest by 3 per SP. (40 BP per long rest max)","Increases your Bleed Resistance modifier by 3% per SP.","Increases your Blood Potency by 1d10 per 2 SP."],"tips":["If you are a caster that uses blood as a fuel for spellcasting investing up to Blood everywhere... I'm dying... is advisable.","Any close range fighter that suffers wounds frequently can also benefit from investing some points."],"b":[{"title":"What are Wounds?","lines":["When you take a certain amount of damage in a single attack, you suffer wounds. These bleed at the start of each round and causes blood loss. Refer to Bleeding and Wounds chapter for a detailed explanation on the numbers, fixing wounds and how to keep track of blood loss."]}],"gs":[{"n":"Oh no blood!","f":"Your body seems more adept at containing bleeding. Cuts on you seems to bleed less than they should be.","p":[{"l":3,"t":"P","x":"You learn the Apply Pressure action. Refer to Actions in Combat for a detailed explanation."},{"l":4,"t":"P","x":"You learn the Clot (Light) action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"I'm bleeding!","f":"Your blood seems to contain more life force and clots at an abnormal rate.","p":[{"l":5,"t":"P","x":"Any potion that grants BP now stacks with your own BP regeneration."},{"l":6,"t":"P","x":"You learn the Clot (Moderate) action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Blood everywhere... I'm dying...","f":"You regenerate blood at an unusually fast rate, clotting is starting to get a little ridiculous.","p":[{"l":7,"t":"P","x":"Taking the Apply Pressure action takes 1 less AP."},{"l":8,"t":"P","x":"When taking the Apply Pressure action, you can choose to spend 3 more AP. If you do so, your wounds do not bleed this turn."}]},{"n":"Oh wait I'm fine...","f":"Where do you even keep all that blood? How do you even function after losing so much of it? So many questions...","p":[{"l":9,"t":"A","x":"On your next short rest, you can regenerate BP equal to 3 times your Bleed Resistance modifier.","u":{"recharge":"Long rest","uses":"2"}},{"l":10,"t":"E","x":"You do not roll for potency, the roll is maximized. All actions provided by this skill cost 0 AP.","u":{"stamina":"2","ap":"3","turns":"5"}}]}]},"Deprivation":{"d":"Skill for resistance against starvation! Governs your characters resistance against lack of food.","r":["Increases your Deprivation modifier by 3% per SP.","Increases your Deprivation Points by 12 per SP."],"b":[{"title":"Lack of food and water...","lines":["A PC needs to eat and drink to stay alive and kicking. Not eating meals per day causes the PC to start losing DPs and will weaken the PC ending with its death eventually. The PCs resistance to lack of food is effected by this skill and its ENDURANCE score. Lack of water however is several times more problematic and death occurs in 4 days for every PC by default."]}],"gs":[{"n":"The Om!","f":"You don't really require as much food as other people. A side effect of adventuring perhaps?","p":[{"l":3,"t":"P","x":"Eating 2 meals of 1 ration each is enough to sustain you now as opposed to 3 meals of 1 ration each."}]},{"n":"The Nom!","f":"Your body seems content with very little amounts of sustenance.","p":[{"l":5,"t":"P","x":"You can resist lack of water for twice as much as normal people. Potions counts as 1 ration to you."}]},{"n":"The Om-Nom","f":"Anything other than water is basically food to you.","p":[{"l":7,"t":"P","x":"If anything causes you to lose more than 1 DP at once, like spellcasting, you can reroll the dices if you want. You must use the new value."}]},{"n":"The Om-Nom-Nom","f":"Water is pretty much food to you at this point.","p":[{"l":10,"t":"P","x":"TBD."}]}]},"Versatility":{"d":"Skill for improving active abilities! Governs how many times active abilities can be used and how they are recharged.","r":["Increases your Versatility modifier by 3% per SP."],"tips":["This is one of those skills that is useful to everyone. Invest up to 3 at least although 5 is advisable.","6th perk can be used to recover usages of Do it Harder!. (wink wink)"],"gs":[{"n":"Do it harder!","f":"You can tolerate the effects of using Active abilities and can use them a few more times it seems.","p":[{"l":3,"t":"A","x":"You recover 1 usage of an Active ability you've used. Using this Active cannot increase total usages of Actives above their maximum. Only Actives gained from perks equal to or below your Versatiliy SP can be regained this way.","u":{"recharge":"Long rest","ap":"3","uses":"2"}},{"l":4,"t":"P","x":"Active and Empowerment abilities cost 1 AP less to activate. This effect cannot reduce Active and Empowerment ability costs below 1 AP."}]},{"n":"Do it faster!","f":"You recover from using your abilities faster and can use them again sooner.","p":[{"l":5,"t":"P","x":"Do it Harder! recovers SP/2 usages now instead of 1."},{"l":6,"t":"P","x":"On your next short rest, you recover (SP/2) usages of an active ability of your choosing. Using this Active cannot increase total usages of Actives above their maximum."}]},{"n":"Do it better!","f":"You can further increase your mastery in using your abilities.","p":[{"l":7,"t":"P","x":"Empowerments cost 1 Stamina less."},{"l":8,"t":"P","x":"Active ability maximums increase by 1 for all active abilities."}]},{"n":"Just do it already...","f":"At the cost of straining your body you seem to use your abilities as many times as you want.","p":[{"l":9,"t":"P","x":"Using an Active ability while under the effects of an Empowerment increases the duration of that Empowerment by 1 turn. This effect cannot occur more than 1 times per turn."},{"l":10,"t":"E","x":"Using Active abilities takes 0 AP. Using Active abilities consumes 0 Uses. For each turn you keep this Empowerment active, you lose 1 stamina. All stamina loss from this Empowerment is applied at the end this Empowerment or after 1 minute has passed.","u":{"stamina":"*","ap":"3","turns":"3"}}]}]},"Conditioning":{"d":"Skill for resisting the effects of exhaustion. Allows the user to resist the effects of extreme exertion better.","r":["Increases your Conditioning modifier by 3% per SP."],"tips":["Any member of the Toriser clan should invest in some points to this as soon as possible.","Casters that use blood or life based energy can also benefit from investing up to Harder, Better, Faster, Stronger!.","Melee fighters that have access to empowerments can invest as an off-skill."],"b":[{"title":"What is Stamina?","lines":["Stamina represents the characters physical effort. An excess amount of exertion leaves an effect on the character that cannot be cleansed with a single long rest. These are represented by loss of Stamina stacks. There are certain skills that loses Stamina stacks with their abilities but any physical exertion can cause Stamina loss. For example traveling in extreme heat or cold, climbing or swimming for an extended amount of time, carrying very heavy loads etc. are a few examples. For a more extended explanation and the effects of each stack look under the Stamina section."]}],"gs":[{"n":"Just a few aching muscles!","p":[{"l":3,"t":"A","x":"You can roll your next roll as if you are at max Stamina.","u":{"recharge":"Long rest","ap":"1","uses":"3"}},{"l":4,"t":"A","x":"When you roll with disadvantage you can add your Conditioning modifier as a bonus to your roll. Disadvantage needs to be incurred by Stamina loss.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"Harder, Better, Faster, Stronger!","p":[{"l":5,"t":"P","x":"Losing 2 stacks of Stamina no longer affects you. You gain the effects of Stamina loss when you gain the 3rd stack. You still die after losing 10 stacks of Stamina."},{"l":6,"t":"P","x":"Taking a short rest recovers 1 more Stamina."}]},{"n":"What doesn't kill you...","p":[{"l":7,"t":"P","x":"Taking a long rest recovers 2 more Stamina."},{"l":8,"t":"P","x":"TBD"}]},{"n":"Makes you stronger!","p":[{"l":9,"t":"P","x":"Stamina lost from sources other than Death Saving throws affects you after combat. You can no longer die from Stamina loss. Any Stamina lost above 10 instead causes you to lose 5 hit points."},{"l":10,"t":"P","x":"TBD"}]}]},"Shield Mastery":{"d":"The skill for blocking incoming blows with the help of a shield to reduce damage. This provides the most complete defensive option out of all the guarding skills.","r":["Requires shields.","Increases your Block modifier by 1% per SP."],"tips":["Carry more than 1 shield... No seriously, carry more than 1 shield because the one you're carrying is going to break."],"b":[{"title":"Blocking Attacks","lines":["You block an incoming attack with your shield to reduce damage.","Requires a shield in hand.","Reduces incoming damage up to the soak pool of the shield. The shield suffers the incoming damage.","Both melee and ranged attacks can be blocked.","You can block area of effects attacks.","If the attack inflicts a status ailment you are still affected by the ailment."]}],"gs":[{"n":"Block","p":[{"l":3,"t":"P","x":"You gain the ability to block attacks. This is considered a form of defending."},{"l":4,"t":"A","x":"You can choose to succeed a block roll before rolling. Any damage that was blocked this way, is inflicted onto the shield instead.","u":{"recharge":"Long rest","ap":"1*","uses":"3"}}]},{"n":"Wall of Iron","p":[{"l":5,"t":"P","x":"You can use your block ability for any other ally within 2 meters of you in any direction. Any area of effect attack that you block, is also considered blocked for anyone behind you. Any creature that is up to 4 meters behind you at the time of the attack, suffers no damage."},{"l":6,"t":"P","x":"Your active block ability can now be used after you roll your block dice."}]},{"n":"Shield Charge","p":[{"l":7,"t":"A","x":"You gain the ability to perform a shield charge. You move up to 2 AP worth of movement. The target suffers the shields block value as bonus damage per 2 meters traveled. The target has to succeed on a Strength or Dexterity saving throw or be knocked prone.","u":{"recharge":"Long rest","ap":"4","uses":"3"}},{"l":8,"t":"P","x":"Any shield you're carrying, due to your proficiency in using them, suffers half damage from all sources. First damage your shield suffers each round is ignored."},{"l":9,"t":"P","x":"Your block is now a free action. Each consecutive block in the same round is subject to a +7% penalty."}]},{"n":"One Man Phalanx","p":[{"l":10,"t":"E","x":"At the start of each turn, you gain 4 times your shields block value as temporary hit points. Temporary hit points gained this way does not stack and cannot exceed 4 times your shields block value. Any hit points you lose from your temporary hit points is applied to the shield instead.","u":{"stamina":"1","ap":"3","turns":"5"}}]}]},"Demonology":{"d":"Skill for summoning and forming contracts with otherworldly beings in an attempt to control them. Represents characters knowledge in summoning these otherworldy beings called daemons.","r":["Increases your Demonology modifier by 3% per SP.","Increases the duration you can have an daemon summoned by half a hour per SP.","Increases the amount of summons you can perform a day by 1 per 2 SP."],"gs":[{"n":"You got a Friend in Me!","f":"You are starting to discover there are potential allies in the realms.","p":[{"l":3,"t":"A","x":"You can summon and form contracts with daemons. Each contract and what requires to establish it, depends on the daemon. Contracted daemons can be summoned to the prime plane by the contracted summoner."},{"l":4,"t":"A","x":"You can summon a daemon partially to use one of its abilities with a Demonology check. The daemon is not fully summoned and therefore cannot be damaged. Only works on abilities that manifest their effects in a single turn. The difficulty of the check is dependent on the strength of the ability.","u":{"recharge":"Long rest","ap":"1*","uses":"2"}}]},{"n":"A Call Beyond the Realms","f":"You are starting to know your neighbors.","p":[{"l":5,"t":"A","x":"You can boost an ability of your daemon using a Demonology check. The boost the ability receives is dependent on the ability. The difficulty of the check is dependent on the strength of the ability.","u":{"recharge":"Long rest","ap":"3","uses":"2"}},{"l":6,"t":"P","x":"Your partial summon ability can be used as many times as you want. Using your partial summon ability this way incurs a material cost. The material used and its cost is dependent on the strength of the ability."}]},{"n":"TBD","f":"Each daemon you summon is a force on its own.","p":[{"l":7,"t":"A","x":"Allows you to banish an daemon you desire back to its realm. Roll demonology against the daemon willpower. On a success, the daemon is banished to its realm. On a failure, the daemon is immune to banishment for the next 24 hours.","u":{"recharge":"Long rest","ap":"3","uses":"1"}},{"l":7,"t":"P","x":"The cost of summoning and dismissing a daemon is reduced by 1 AP. You generate 2 more AP each turn. These can only be used to activate the innate abilities of your daemons."},{"l":8,"t":"P","x":"Your boost ability can be used as many times as you want. Using your boost ability this way incurs a material cost. The material used and its cost is dependent on the strength of the ability."},{"l":9,"t":"P","x":"You can designate a Guardian daemon. This Guardian is no longer bound by the summon duration and can stay with you constantly. You can still summon daemons normally without having to dismiss your Guardian"}]},{"n":"Solomon Unchained","f":"You command an army.","p":[{"l":10,"t":"E","x":"You can summon up to 5 daemon you have contracted at the same time. The summonings done by this ability does not count towards your daily summon count.","u":{"stamina":"3","ap":"5","turns":"3"}}]}]},"Alchemy":{"d":"Alchemy can be described as fastening, slowing, reversing natural processes of a chemical reaction to an unnatural degree with the help of Alchemical circles and life based energy. Objects can be broken down or reconstructed in a chemical sense as well as in a physical sense. Meaning a compound can be broken down to its constructing elements, elements can be formed into compounds if such a compound exists, or objects can be repaired and translocated as the circle permits. Alchemy can be used for a variety of different applications. Possibilities are limited only by the users creativity and imagination. It can be a perfect supportive skill as well as a devastating offensive one. However there are certain rules that applies to every instance of Alchemy.","r":["Increases your Alchemy modifier by 3% per SP.","If unlocked, increases the amount of Life-Energy you can pull from the earth by 1d6 per 2 SP."],"tips":["Invest in Deprivation you will need it. Seriously.","Investing up to 3 points in Belly helps in replenishing your life energy reserves faster.","Starvation means exhaustion stacks. investing in Conditioning will help in mitigating these effects.","TBD"],"b":[{"title":"A Little History","lines":["Alchemy has an ancient and distinguished background. Although alchemy is mostly known for its uses during the middle ages, its origins can be traced all the way back to the ancient Egpyt. With the rise of the positive sciences, neglection and the following abandonment of magic the art of alchemy was mostly forgotten and was dethroned by chemistry and was mostly practiced in secret by cults and orders. Now with the rise of magic starts a new era for Alchemy. Alchemical Circles An Alchemical circle is a very precise geometric shape used in Alchemical operations. The circle can be described as a way to focus, guide and channel pure life energy released by the alchemist. The shape of it carries the instructions of how the life energy is going to be channeled into the manipulated object therefore the shape of the circle needs to be extremely precise. A half or wrongly drawn circle can create unpredictable effects and often leads to disaster. Every alchemical operation is carried out using an Alchemical circle of some sort and every circle can only achieve a singular action. Meaning moving a large piece of rock and breaking it down to a fine dust requires 2 separate circles. These separate circles can be intertwined to achieve both effects in the interest of drawing space, however time to draw these would not change and the alchemical prowess required to pull this off would be greater."]}],"gs":[{"n":"Nigredo","f":"This alchemy thing seems very useful for little repairs and party tricks!","p":[{"l":3,"t":"P","x":"You can manipulate chemical elements. The material you are trying to manipulate needs to be in its pure element form (like a block of copper, iron etc.) or can be extracted without a chemical process (mixtures, alloys etc.). Compounds cannot be manipulated."},{"l":4,"t":"P","x":"You have learned to draw life-energy from the nature itself akin to druids. Amount of energy you can draw is equal to (SP/2)d6. Circles of size Medium and above consumes at"}]},{"n":"Albedo","f":"You can make things disappear now! Now only if you knew how to bring them back...","p":[{"l":5,"t":"P","x":"You can manipulate chemical compounds. You can now command chemical elements to form compounds at will as long as you provide sufficient energy for the reaction, and the materials are present. Organic compounds cannot be manipulated."},{"l":6,"t":"P","x":"You can create a Signature Circle for yourself. Your Signature Circle can be of size Medium or below."}]},{"n":"Citrinitas","f":"Turns out there is more to this alchemy thing then mere party tricks. If no one likes your tricks you can burn the whole party down now! Or the whole neighborhood depending on how you feel.","p":[{"l":7,"t":"P","x":"You can manipulate organic compounds. Manipulating organic compounds is harder and requires more energy because of their complex nature."},{"l":8,"t":"P","x":"You can create Alchemical Arrays on your limbs now."},{"l":9,"t":"P","x":"You can create a 2nd Signature Circle for yourself. Your Signature Circle can be of size Large or below."},{"l":9,"t":"P","x":"You can re-roll Alchemy checks now. After you roll an Alchemy check but before the result is declared, you can choose to re-roll the check once. Using this passive causes you to lose the maximum possible number of deprivation points. You have to use the result of the second roll."}]},{"n":"Rubedo","f":"Laws of nature and equivalent exchange applies to everyone but sometimes you can bend them a little.","p":[{"l":10,"t":"E","x":"For any Alchemy attempt made, you draw the maximum possible energy. You need to be in a position that allows drawing of energy.","u":{"stamina":"2","ap":"2","turns":"3"}}]}]},"Engineering":{"d":"The skill for creating, maintaining and breaking down mechanical contraptions. Allows you to realize your own mechanical ideas into reality.","r":["Increases your Engineering modifier by 3% per SP."],"gs":[{"n":"Spark of Creation","f":"Your studies into the ways of technology allows you to understand the basic principle behind any machine.","p":[{"l":3,"t":"P","x":"You gain proficiency in Mechanical Insight. You can use your Engineering modifier in place of your Mechanical Insight modifier. If you are already proficient your skill bonus increases by your SP."},{"l":4,"t":"P","x":"You gain proficiency in Engineering. You can attempt to create, disassemble or repair mechanical contraptions using this skill."}]},{"n":"Ingenuity","f":"TBD","p":[{"l":5,"t":"P","x":"For any creation attempt that uses Engineering, before the result of the roll is declared, you can choose to reroll the Engineering check. You have to use the new roll."},{"l":6,"t":"P","x":"You gain proficiency in Machine Operation. You can use your Engineering modifier in place of your Machine Operation modifier. If you are already proficient your skill bonus increases by your SP."}]},{"n":"Magic of Intellect","f":"TBD","p":[{"l":7,"t":"P","x":"Whenever you fail on an engineering attempt that uses material components, only half of the materials are lost."},{"l":8,"t":"P","x":"TBD"},{"l":9,"t":"P","x":"TBD"}]},{"n":"God from Machine","f":"TBD","p":[{"l":10,"t":"P","x":"TBD."}]}]},"Robotics":{"d":"Science and magic are hard... and sometimes accidents happen. This skill is for when a particularly nasty accident happens and a part of you is lost with no hope of ever returning. An arm for example... or a leg.... or sometimes both...","r":["Increases your Robotics modifier by 3% per SP.","Increases the number of prosthetics you can operate simultaneously by 1 per 2 SP."],"tips":["This skill is for people who wants to specialize in prosthetics and use them as their main form of offense or defense. If you merely want a replacement for your arm, go for the Prosthetic Operation secondary skill.","Think big! Your limbs can easily be replaced now. Acquire a few different limbs with different functions and use them."],"b":[{"title":"How do they work?","lines":["Prosthetics are machines and require energy to work as machine do. Prosthetics are interfaced with the rest of your bodies functions and use the energy your body naturally generates. They are not as efficient as the rest of your body though and require a little more energy than the rest of you. Each prosthetic you have increases the amount of rations you need to consume daily by 1."]}],"gs":[{"n":"A Piece of Metal","f":"Well, a little accident is not going to stop you now is it?","p":[{"l":3,"t":"P","x":"You gain proficiency in Prosthetic Operation. You can use your Engineering modifier in place of your Prosthetic Operation modifier. If you are already proficient your skill bonus increases by your SP."},{"l":4,"t":"P","x":"TBD"}]},{"n":"A Limb of Metal","f":"Maybe that accident was for the best! Turns out you can \"further\" this limbs function.","p":[{"l":5,"t":"A","x":"You gain advantage on the next Robotics check you rolled for the activation of your Transformative or Expansive prosthetic.","u":{"recharge":"Long rest","ap":"0","uses":"2"}},{"l":6,"t":"P","x":"You gain proficiency in Expansive Prosthetic Operation."}]},{"n":"A Heart of Metal","f":"Your can now process how to use a \"different\" prosthetic. Ever wondered how a spider would move with 8 legs? Well now you can find out...","p":[{"l":7,"t":"P","x":"You gain proficiency in Transformative Prosthetic Operation."},{"l":8,"t":"P","x":"TBD"},{"l":9,"t":"P","x":"The amount of prosthetics you can use doubles."}]},{"n":"A Mind of Metal","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Lore":{"d":"The skill for representing the characters academical knowledge. Further investing in this skill increases the characters aptitude in acquiring further knowledge and recalling what has been learned.","r":["Increases your Lore modifier by 3% per SP."],"gs":[{"n":"Student of the Academics","f":"You knowledge of the world is starting to accumulate to something useful.","p":[{"l":3,"t":"P","x":"You gain proficiency in Appraisal. If you are already proficient your skill bonus increases by your SP. This skill's modifier can be used instead of Appraisal."},{"l":4,"t":"P","x":"Number of pages you can read daily doubles. B o o k w o r m Reading is like breathing to you, regardless of the subject."}]},{"n":"Bookworm","p":[{"l":5,"t":"P","x":"You learn how to write in shorthand. Choose if you want to use a common shorthand cipher, or devise your own. Devising your own means only you can read them, where as the alternative can be read by anyone who knows shorthand. Shorthand allows you to take notes as fast as a person can speak. Without missing a single word."},{"l":6,"t":"P","x":"Allows you to skim through any piece of information in a very short time. Ask a question, then roll a Lore check. On a success your question will be answered to the best of the informations contents. The time this takes is dependent on the difficulty and length of the text."}]},{"n":"Statistical Probability","f":"Your knowledge comes up in surprisingly useful ways. Who would have thought that book from a couple of years ago would save your life?","p":[{"l":7,"t":"P","x":"For any situation you are in, you can roll a lore check to gain a piece of insight. Can be used 2 times per long rest."},{"l":8,"t":"P","x":"You gain eidetic memory. You no longer need to roll Mind checks to remember pieces of information you have seen before. Any piece of knowledge you have seen before, you can remember with perfect clarity. Recalling an exact text however, still requires a Mind check. You gain advantage on this check."},{"l":9,"t":"P","x":"TBD"}]},{"n":"Perfect Recall","f":"You mind is a library and you have the index in your hands.","p":[{"l":10,"t":"P","x":"You gain photographic memory. You no longer need to roll Mind checks to remember pieces of information you have encountered before. Any piece of knowledge you encounter before, regardless of the sensory organ used to perceive it, you can remember with perfect clarity."}]}]},"Armor Maintenance":{"d":"The skill for creating, repairing and improving any type of armor.","r":["Increases your Armor Maintenance modifier by 3% per SP.","You gain additional Tune Armor choices from the Tune Armor Options table at skill levels 6,7,8,9 and 10 in addition to the one you gain at skill level 5."],"tips":["1 to 20 21 to 40 2 2 1 4 3 2 30 x Armor 20 x Armor Value Value Value 8 6 4 4 3 2 4 3 2 4 3 2"],"gs":[{"n":"Is that a dent?","f":"You learn how to repair and craft armor now. You're not the best at it though...","p":[{"l":3,"t":"P","x":"You can now repair damaged suits of armor now. Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation. • You are knowledgeable in repairing armor and use your Armor Maintenance modifier for doing so. You can now craft mundane suits of armor."},{"l":4,"t":"P","x":"Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation. • You are knowledgeable in crafting armor and use your Armor Maintenance modifier for doing so."}]},{"n":"A Personal Touch...","f":"You learn how to fine tune armor to an i
