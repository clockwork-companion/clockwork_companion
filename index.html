    [],
    ["2,2", "2,6", "6,2", "6,6"],
    ["2,2", "2,4", "2,6", "4,2", "4,6", "6,2", "6,4", "6,6"],
    ["3,3", "3,4", "3,5", "4,3", "4,5", "5,3", "5,4", "5,5", "4,4"],
    ["1,2", "3,2", "5,2", "7,2", "1,6", "3,6", "5,6", "7,6"],
    ["2,2", "2,3", "2,5", "2,6", "6,2", "6,3", "6,5", "6,6"],
    ["1,1", "1,7", "7,1", "7,7", "3,3", "3,5", "5,3", "5,5"],
    ["2,1", "2,2", "2,3", "6,5", "6,6", "6,7"],
  ];
  function generate(floorNo) {
    const id = ART.id, R = Math.random, ri = n => Math.floor(R() * n), pick = a => a[ri(a.length)];
    for (let attempt = 0; attempt < 40; attempt++) {
      const want = Math.min(16, 7 + floorNo + ri(2));
      const key = (x, y) => y * GW + x, rooms = new Map(), edges = [];
      const s0 = [ri(GW), ri(GH)]; rooms.set(key(...s0), { x: s0[0], y: s0[1] });
      for (let tries = 0; rooms.size < want && tries < 500; tries++) {
        const a = pick([...rooms.values()]), [dx, dy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]), nx = a.x + dx, ny = a.y + dy;
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || rooms.has(key(nx, ny))) continue;
        rooms.set(key(nx, ny), { x: nx, y: ny }); edges.push([key(a.x, a.y), key(nx, ny)]);
      }
      const adj = new Map([...rooms.keys()].map(k => [k, []])); edges.forEach(([a, b]) => { adj.get(a).push(b); adj.get(b).push(a); });
      const start = key(...s0), dist = new Map([[start, 0]]), q = [start];
      while (q.length) { const k = q.shift(); for (const n of adj.get(k)) if (!dist.has(n)) { dist.set(n, dist.get(k) + 1); q.push(n); } }
      const leaves = [...rooms.keys()].filter(k => k !== start && adj.get(k).length === 1);
      if (!leaves.length) continue;
      const exit = leaves.sort((a, b) => dist.get(b) - dist.get(a))[0];
      const others = [...rooms.keys()].filter(k => k !== start && k !== exit).sort((a, b) => dist.get(b) - dist.get(a));
      if (!others.length) continue;
      const keyRoom = others[ri(Math.max(1, Math.ceil(others.length / 2)))];
      // a loop or two (never into the exit room) so the layout isn't a pure tree
      for (const [k, r] of rooms) for (const [dx, dy] of [[1, 0], [0, 1]]) { const n = key(r.x + dx, r.y + dy);
        if (r.x + dx < GW && r.y + dy < GH && rooms.has(n) && k !== exit && n !== exit && !adj.get(k).includes(n) && R() < .18) { edges.push([k, n]); adj.get(k).push(n); adj.get(n).push(k); } }

      const grid = new Int16Array(MW * MH).fill(id.steel + 1), ftex = new Int16Array(MW * MH).fill(id.stone2), owner = new Int16Array(MW * MH).fill(-1);
      const at = (x, y) => y * MW + x, theme = new Map();
      for (const [k, r] of rooms) {
        const t = k === exit ? THEMES[6] : pick(THEMES); theme.set(k, t);
        for (let y = r.y * SL; y <= r.y * SL + SL; y++) for (let x = r.x * SL; x <= r.x * SL + SL; x++)

      }
      for (const [k, r] of rooms) {
        const t = theme.get(k), layout = k === start || k === exit ? pick([ROOMS[0], ROOMS[1]]) : pick(ROOMS), fx = R() < .5, fy = R() < .5;
        for (let y = 1; y < SL; y++) for (let x = 1; x < SL; x++) { const c = at(r.x * SL + x, r.y * SL + y); grid[c] = 0; ftex[c] = id[t.floor]; owner[c] = k; }

      const DOOR = id.door + 1, LOCK = id.locked + 1, LEVER = id.lever + 1;
      let exitDoor = null;
      for (const [a, b] of edges) {
        const A = rooms.get(a), B = rooms.get(b), horiz = A.y === B.y, wx = horiz ? Math.max(A.x, B.x) * SL : A.x * SL + 5, wy = horiz ? A.y * SL + 5 : Math.max(A.y, B.y) * SL;
        const isExit = a === exit || b === exit, kind = isExit ? "lock" : R() < .22 ? "wide" : R() < .12 ? "open" : "door";
        if (kind === "door" || kind === "lock") { grid[at(wx, wy)] = kind === "lock" ? LOCK : DOOR; if (isExit) exitDoor = [wx, wy, horiz]; }

      const cx = E.x * SL + 5, cy = E.y * SL + 5;

      grid[at(...lever)] = LEVER;
      // reachability check from the start room centre, treating doors as passable
      const S = rooms.get(start), sx = S.x * SL + 5, sy = S.y * SL + 5;
      if (grid[at(sx, sy)]) grid[at(sx, sy)] = 0;
      const seen = new Uint8Array(MW * MH), st = [at(sx, sy)]; seen[st[0]] = 1;
      while (st.length) { const c = st.pop(), x = c % MW, y = (c - x) / MW;
        for (const n of [c + 1, c - 1, c + MW, c - MW]) { const nx = n % MW, ny = (n - nx) / MW; if (Math.abs(nx - x) + Math.abs(ny - y) !== 1 || seen[n]) continue;
          if (grid[n] === 0 || grid[n] === DOOR || grid[n] === LOCK) { seen[n] = 1; if (grid[n] === 0 || grid[n] === DOOR || grid[n] === LOCK) st.push(n); } } }

      const free = k => { const r = rooms.get(k), out = [];
        for (let y = 1; y < SL; y++) for (let x = 1; x < SL; x++) { const c = at(r.x * SL + x, r.y * SL + y);
          if (grid[c] === 0 && seen[c] && !used.has(c) && ![c + 1, c - 1, c + MW, c - MW].some(n => grid[n] === DOOR || grid[n] === LOCK || grid[n] === LEVER)) out.push(c); }
        return out; };
      const place = (k, kind, extra = {}) => { const f = free(k); if (!f.length) return null; const c = pick(f); used.add(c);

          if (f.length) { const c = pick(f); used.add(c); ents.push({ kind: pick(t.deco), deco: true, x: c % MW + .5, y: Math.floor(c / MW) + .5, alive: true }); } }
        if (k === start) { place(k, "ammo", { item: true }); continue; }

        for (let i = 0; i < nEn; i++) { const sol = R() < soldierP;
          place(k, sol ? "s" : "m", { foe: true, hp: (sol ? 30 : 45) + (floorNo - 1) * 6, awake: false, cd: 1 + R(), atk: 0, hurt: 0, anim: R() * 4, die: 0 }); }
        if (R() < .55) place(k, floorNo > 2 && R() < .3 ? "bigammo" : "ammo", { item: true });
        if (R() < .38) place(k, R() < .25 ? "bighealth" : "health", { item: true });
        if (R() < .33) place(k, pick(["cup", "cup", "crown", "chest"]), { item: true });
      }
      if (!place(keyRoom, "key", { item: true })) continue;
      // face the first way out of the start room
      const firstN = adj.get(start)[0], FN = rooms.get(firstN), ang = Math.atan2(FN.y - S.y, FN.x - S.x);
      return { grid, ftex, owner, ents, exit, start: { x: sx + .5, y: sy + .5, ang }, foes: ents.filter(e => e.foe).length, rooms: rooms.size };
    }

  }

  function launch() {
    if (open || document.getElementById("cw-egg")) return; open = true;
    const wrap = document.createElement("div"); wrap.id = "cw-doom";
    wrap.innerHTML = `<div class="box" role="dialog" aria-label="Furnace Below, a hidden game"><canvas width="${W}" height="${H}" tabindex="0"></canvas>
      <div class="tb"><button class="fs" aria-label="Full screen" title="Full screen">⛶</button><button class="x" aria-label="Close" title="Close">×</button></div>
      <button class="fire" aria-label="Fire">FIRE</button>
      <form hidden><input maxlength="16" placeholder="Your name" aria-label="Your name for the high scores" autocomplete="nickname" /><button type="submit">Save</button></form></div>`;
    document.body.appendChild(wrap);
    const cv = wrap.querySelector("canvas"), g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
    const img = g.createImageData(W, VH), buf = new Uint32Array(img.data.buffer), zbuf = new Float32Array(W);
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const keys = {}, touch = { f: 0, s: 0, fire: false }, pts = {};
    let L = null, P = null, bolts = [], st = { mode: "loading", t0: 0, msg: "", msgT: 0 }, raf = 0, last = 0, err = "";

    // high scores
    const form = wrap.querySelector("form"), nameBox = form.querySelector("input"), saveBtn = form.querySelector("button");
    const ref = scoresRef(); let top = [], board = ref ? "loading" : "offline", pending = null, note = "";
    const unsub = ref ? ref.orderBy("score", "desc").limit(3).onSnapshot(
      q => { top = q.docs.map(d => d.data()).map(x => ({ name: String(x.name || "?").slice(0, 16), score: +x.score || 0, floor: +x.floor || 1 })); board = "live"; },
      () => { board = "offline"; }) : null;

      const name = nameBox.value.trim().slice(0, 16); if (!name || !pending || !ref) return;
      saveBtn.disabled = true; store.set("cw-egg-name", name);

        .then(() => { note = "Saved to the high scores."; hideForm(); }).catch(() => { note = "Couldn't save the score just now."; hideForm(); })
        .finally(() => { saveBtn.disabled = false; }); });

    const say = (m, t = 2.4) => { st.msg = m; st.msgT = t; };
    const newGame = () => { P = { x: 0, y: 0, dx: 1, dy: 0, cx: 0, cy: .66, hp: 100, ammo: 20, key: false, kills: 0, score: 0, floor: 1, bob: 0, recoil: 0, hurt: 0, glow: 0, floorT: 0, floorKills: 0, treasure: 0 };

    const enterFloor = () => { L = generate(P.floor); bolts = []; P.key = false; P.floorT = 0; P.floorKills = 0; P.treasure = 0;
      P.x = L.start.x; P.y = L.start.y; P.dx = Math.cos(L.start.ang); P.dy = Math.sin(L.start.ang); P.cx = -P.dy * .66; P.cy = P.dx * .66;
