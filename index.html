.gp-gem { position: absolute; z-index: 3; left: 50%; top: -13px; width: 22px; height: 22px; transform: translateX(-50%) rotate(45deg);
  background: radial-gradient(circle at 35% 35%, #fff4d2, #ffb04a 40%, #8f2a0c 100%); border: 2px solid var(--gold); box-shadow: 0 0 0 2px #0c0805, 0 0 16px 3px rgb(255 150 60 / .55); }

.gate-tabs { display: flex; justify-content: center; gap: 30px; margin: -4px 0 4px; border-bottom: 1px solid rgb(201 161 92 / .22); }
.gate-tabs button { position: relative; border: 0; background: none; padding: 4px 2px 10px; cursor: pointer; color: #9c825e;
  font: 600 14px "Cinzel", Georgia, serif; letter-spacing: .16em; text-transform: uppercase; }
.gate-tabs button:hover { color: #e9d3a6; }
.gate-tabs button[aria-pressed="true"] { color: var(--gold-hi); text-shadow: 0 0 10px rgb(255 170 80 / .45); }
.gate-tabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 8px rgb(255 170 80 / .7); }
.gate-field { display: grid; gap: 6px; }
.gate-field label { font: 600 11px "Cinzel", Georgia, serif; letter-spacing: .22em; text-transform: uppercase; color: #c9a15c; }
.gate-field small { font-size: 13px; font-style: italic; color: #a58c68; }
.gate-field input { width: 100%; padding: 11px 13px; border-radius: 3px; border: 1px solid #5c4020; background: #0b0806; color: #f6e8c8;
  font: 17px "Alegreya", Georgia, serif; box-shadow: inset 0 2px 8px rgb(0 0 0 / .85), 0 1px 0 rgb(255 210 140 / .07); transition: border-color .15s, box-shadow .15s; }
.gate-field input:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 2px 8px rgb(0 0 0 / .85), 0 0 0 1px rgb(226 178 90 / .4), 0 0 14px rgb(255 160 70 / .25); }
.gate-msg { margin: 0; min-height: 1.3em; text-align: center; font-style: italic; font-size: 14.5px; color: #e0c088; }
.gate-msg:empty { min-height: 0; margin-top: -14px; }

/* buttons: an ember-red seal with a gold rim for the main action, darker iron for the rest */
.gate-btn { justify-self: center; min-width: min(240px, 100%); padding: 12px 30px; cursor: pointer; border-radius: 4px;
  font: 700 15px "Cinzel", Georgia, serif; letter-spacing: .16em; text-transform: uppercase; color: #ffe8b5;
  text-shadow: 0 1px 0 #3a0c04, 0 0 10px rgb(255 170 80 / .45);
  background: linear-gradient(180deg, #d0552a 0%, #9a2a14 47%, #6c170b 53%, #8f2c13 100%);
  border: 2px solid #e0aa55; box-shadow: 0 0 0 1px #2a0e06, inset 0 1px 0 rgb(255 220 170 / .55), inset 0 -3px 6px rgb(0 0 0 / .35), 0 6px 18px rgb(0 0 0 / .6);
  transition: filter .15s, box-shadow .15s, transform .05s; }
.gate-btn:hover { filter: brightness(1.12) saturate(1.1); box-shadow: 0 0 0 1px #2a0e06, inset 0 1px 0 rgb(255 220 170 / .6), inset 0 -3px 6px rgb(0 0 0 / .35), 0 6px 18px rgb(0 0 0 / .6), 0 0 22px rgb(255 120 50 / .45); }
.gate-btn:active { transform: translateY(1px); }
.gate-btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.gate-btn.alt { color: #ecd7aa; text-shadow: 0 1px 0 #000; background: linear-gradient(180deg, #4b3a29 0%, #2e2219 50%, #241a12 51%, #33261b 100%); border-color: #9a6c2c; font-size: 13px; }
.gate-btn[hidden], .gate-claim[hidden] { display: none; }
.gate-claim { display: grid; gap: 10px; justify-items: center; }
.gate-who { margin: 0; text-align: center; color: #c8b28c; font-size: 15px; }
.gate-who b { color: var(--gold-hi); font-weight: 500; }
.gate-link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--gold); font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.gate-foot { margin: 10px 0 0; font: 500 11px "Cinzel", Georgia, serif; letter-spacing: .26em; text-transform: uppercase; color: #6f5a3f; text-align: center; }
@media (max-width: 480px) {
  .gate-panel { padding: 30px 20px 24px; }
  .gate .crest { width: 92px; height: 92px; }
  .gate-tag { letter-spacing: .2em; font-size: 10.5px; } .gate-tag::before, .gate-tag::after { width: 22px; }
  .gate .g1 { width: 420px; left: -200px; bottom: -180px; } .gate .g2 { width: 280px; right: -130px; top: -110px; }
}
/* ---------- website build: sign-out link ---------- */
.linkbtn { border: 0; background: none; padding: 0 0 0 6px; color: var(--brass); text-decoration: underline; text-underline-offset: 2px; font: inherit; }

/* ---------- sigil emblems (a character's face when there's no portrait) ---------- */
.emblem { display: block; width: 100%; height: 100%; background: var(--em, var(--brass));
  -webkit-mask: var(--sigil) center / 82% no-repeat; mask: var(--sigil) center / 82% no-repeat; }
.thumb .emblem, .portrait .emblem { background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--em, var(--brass)) 55%, #fff), var(--em, var(--brass)) 60%); }
.portrait .emblem { -webkit-mask-size: 78%; mask-size: 78%; }

/* ---------- new character: choose a road ---------- */
.gx-veil { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .55); backdrop-filter: blur(3px); animation: rIn .15s ease-out; }
.gx-choose { position: relative; width: min(640px, 100%); background: var(--card); border: 1.5px solid var(--rule); padding: 28px 26px 22px; display: grid; gap: 18px; box-shadow: 0 24px 60px rgb(0 0 0 / .45); }
.gx-choose h2 { margin: 0; font-size: 28px; text-align: center; }
.gx-x { position: absolute; right: 10px; top: 10px; }
.gx-roads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.gx-road { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 20px 16px 18px; background: var(--paper); border: 1.5px solid var(--hair); cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
.gx-road:hover { border-color: var(--brass); transform: translateY(-2px); box-shadow: 0 10px 24px rgb(0 0 0 / .18); }
.gx-road.main { border-color: var(--brass); box-shadow: inset 0 3px 0 var(--brass); }
.gx-road .emblem { width: 74px; height: 74px; --em: var(--brass); }
.gx-road b { font: 700 17px var(--f-head); letter-spacing: .08em; text-transform: uppercase; }
.gx-road span { font-size: 14px; color: var(--ink-2); }
.gx-blank { justify-self: center; font-size: 13px; }
@media (max-width: 560px) { .gx-roads { grid-template-columns: minmax(0, 1fr); } .gx-road { grid-template-columns: 56px minmax(0, 1fr); justify-items: start; text-align: left; gap: 2px 14px; padding: 14px; } .gx-road .emblem { grid-row: span 2; width: 56px; height: 56px; } }

/* ---------- the guide ---------- */
.genesis { position: fixed; inset: 0; z-index: 46; display: grid; grid-template-rows: auto minmax(0, 1fr); color: var(--ink);
  background: radial-gradient(900px 600px at 50% 0%, color-mix(in srgb, var(--brass) 14%, transparent), transparent 70%), var(--paper); animation: rIn .2s ease-out; }
.gx-top { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1.5px solid var(--hair); background: var(--card); }
.gx-steps { list-style: none; display: flex; gap: 4px; margin: 0 auto; padding: 0; overflow-x: auto; scrollbar-width: none; }
.gx-steps li { display: flex; align-items: center; gap: 7px; padding: 4px 10px; font: 600 12px var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.gx-steps li span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--hair); font: 600 11px var(--f-mono); }
.gx-steps li.done { color: var(--ink-2); } .gx-steps li.done span { background: var(--ink-2); border-color: var(--ink-2); color: var(--paper); }
.gx-steps li.now { color: var(--brass); } .gx-steps li.now span { border-color: var(--brass); background: var(--brass); color: var(--brass-ink); box-shadow: 0 0 0 3px var(--brass-soft); }
.gx-body { overflow-y: auto; padding: 28px 16px 40px; }
.gx-step { width: min(760px, 100%); margin: 0 auto; display: grid; gap: 18px; animation: gxIn .35s ease-out; }
@keyframes gxIn { from { opacity: 0; transform: translateY(10px); } }
.gx-kicker { margin: 0; text-align: center; font: italic 15px var(--f-body); color: var(--brass); }
.gx-title { margin: -8px 0 0; text-align: center; font: 400 clamp(28px, 5vw, 40px)/1.15 var(--f-display); }
.gx-lede { margin: -4px auto 0; max-width: 60ch; text-align: center; color: var(--ink-2); }
.gx-form { display: grid; gap: 16px; width: min(520px, 100%); margin: 0 auto; }
.gx-form .field input, .gx-form .field select { font-size: 16px; padding: 6px 0; }
.gx-big { font: 400 26px var(--f-display) !important; }
.gx-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.gx-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--hair); }
.gx-abandon { justify-self: center; font-size: 13px; color: var(--bad); }
.center { text-align: center; }

/* likeness */
.gx-facegrid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
.gx-face { display: grid; justify-items: center; gap: 10px; }
.gx-face > i, .gx-face > img { width: 120px; height: 120px; border: 3px solid var(--rule); background: var(--sunk); object-fit: cover; }
.gx-face > i.emblem { background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--em) 55%, #fff), var(--em) 60%); -webkit-mask-size: 82%; mask-size: 82%; border: 0; }
.gx-face.big > i, .gx-face.big > img { width: 180px; height: 180px; }
.gx-face.big > i.emblem { filter: drop-shadow(0 0 16px color-mix(in srgb, var(--em) 50%, transparent)); }
.gx-face b { font: 400 20px var(--f-display); text-align: center; }
.gx-modes { margin-bottom: 12px; }
.gx-sigils { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 10px 0 14px; }
.gx-sigil { aspect-ratio: 1; padding: 8px; background: var(--card); border: 1.5px solid var(--hair); cursor: pointer; }
.gx-sigil .emblem { -webkit-mask-size: 92%; mask-size: 92%; }
.gx-sigil:hover { border-color: var(--ink-2); } .gx-sigil.on { border-color: var(--brass); box-shadow: inset 0 0 0 2px var(--brass-soft); }
.gx-hues { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.gx-custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-left: 4px; }
.gx-custom input { width: 34px; height: 28px; padding: 0; border: 1.5px solid var(--hair); background: none; }

/* fate: dice */
.gx-tray { display: grid; justify-items: center; align-content: center; gap: 10px; min-height: 190px; }
.gx-dice { display: flex; justify-content: center; align-items: center; gap: 18px; }
.d8 { width: 76px; height: 86px; position: relative; display: grid; place-items: center; transition: opacity .3s, filter .3s, transform .3s; }
.d8::before { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 38%, 100% 62%, 50% 100%, 0 62%, 0 38%);
  background: linear-gradient(160deg, color-mix(in srgb, var(--brass) 55%, #fff) 0%, var(--brass) 45%, color-mix(in srgb, var(--brass) 55%, #000) 100%); }
.d8::after { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 38%, 50% 50%, 0 38%); background: rgb(255 255 255 / .18); }
.d8 span { position: relative; z-index: 1; margin-top: 8px; font: 700 30px var(--f-mono); color: var(--brass-ink); text-shadow: 0 1px 0 rgb(255 255 255 / .25); }
.d8.idle { opacity: .45; }
.gx-tray.rolling .d8 { animation: tumble .32s linear infinite; animation-delay: calc(var(--i) * -.1s); }
@keyframes tumble { 0% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-14px) rotate(25deg); } 50% { transform: translateY(0) rotate(-12deg) scale(.95); } 75% { transform: translateY(-8px) rotate(-30deg); } 100% { transform: translateY(0) rotate(0); } }
.d8.low { opacity: .3; filter: grayscale(1); transform: scale(.86); }
.d8.low span::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 3px; background: var(--bad); transform: rotate(-20deg); }
.gx-sum { min-height: 72px; display: grid; justify-items: center; align-content: start; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .35s cubic-bezier(.2, 1.6, .4, 1); }
.gx-sum.show { opacity: 1; transform: none; }
.gx-sum b { font: 700 58px/1 var(--f-mono); }
.gx-sum b.hi { color: var(--brass); text-shadow: 0 0 22px color-mix(in srgb, var(--brass) 60%, transparent); }
.gx-sum b.lo { color: var(--bad); }
.gx-sum small { color: var(--ink-3); font: 12px var(--f-mono); }
.gx-rollbtns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.gx-set { display: grid; justify-items: center; gap: 6px; }
.gx-slots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
.gx-slot { display: grid; justify-items: center; padding: 6px 0 8px; border: 1.5px dashed var(--hair); background: var(--card); }
.gx-slot small { font: 600 10.5px var(--f-head); letter-spacing: .1em; color: var(--ink-3); }
.gx-slot b { font: 700 24px var(--f-mono); color: var(--ink-3); }
.gx-slot.got { border-style: solid; border-color: var(--ink-2); animation: pop .35s ease-out; } .gx-slot.got b { color: var(--ink); }
.gx-slot.hi { border-color: var(--brass); box-shadow: inset 0 -3px 0 var(--brass); } .gx-slot.hi b { color: var(--brass); }
.gx-slot.lo { border-color: var(--bad); } .gx-slot.lo b { color: var(--bad); }
.gx-slot.next { border-color: var(--brass); border-style: dashed; animation: breathe 1.6s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: none; } }
@keyframes breathe { 50% { box-shadow: 0 0 0 3px var(--brass-soft); } }

/* choose a set */
.gx-sets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.gx-pick { display: grid; gap: 10px; justify-items: center; padding: 18px 14px; background: var(--card); border: 1.5px solid var(--hair); cursor: pointer; }
.gx-pick.on { border-color: var(--brass); box-shadow: inset 0 0 0 2px var(--brass-soft), 0 8px 22px rgb(0 0 0 / .15); }
.gx-vals { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.gx-vals b { min-width: 34px; padding: 4px 0; text-align: center; font: 700 18px var(--f-mono); border: 1px solid var(--hair); background: var(--paper); }
.gx-vals b.hi { color: var(--brass); border-color: var(--brass); } .gx-vals b.lo { color: var(--bad); border-color: var(--bad); }

/* shape: place rolls on attributes */
.gx-hand { position: sticky; top: -28px; z-index: 2; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 12px 0; background: var(--paper); }
.gx-chip { width: 54px; height: 54px; font: 700 22px var(--f-mono); border: 2px solid var(--ink-2); background: var(--card); color: var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .2s; }
.gx-chip.hi { border-color: var(--brass); color: var(--brass); } .gx-chip.lo { border-color: var(--bad); color: var(--bad); }
.gx-chip.held { transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px var(--brass-soft), 0 8px 18px rgb(0 0 0 / .25); background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.gx-chip.used { opacity: .22; cursor: default; }
.gx-attrs { display: grid; gap: 8px; }
.gx-attr { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; background: var(--card); border: 1.5px solid var(--hair); cursor: pointer; }
.gx-attr.target { border-style: dashed; border-color: var(--brass); }
.gx-attr.filled { border-style: solid; border-color: var(--ink-2); }
.gx-an b { display: block; font: 400 21px var(--f-display); } .gx-an small { color: var(--ink-3); font-size: 13px; }
.gx-av { display: grid; justify-items: end; } .gx-av b { font: 700 28px/1 var(--f-mono); } .gx-av small { font-size: 12px; color: var(--ink-3); } .gx-av i { font: 24px var(--f-mono); color: var(--hair); }
.gx-attr.hi .gx-av b { color: var(--brass); } .gx-attr.lo .gx-av b, .gx-attr.lo .gx-av small { color: var(--bad); }
.gx-shapebtns { justify-content: center; }

/* awaken */
.gx-awaken { justify-items: center; text-align: center; }
.gx-awaken .gx-face { animation: awaken 1.2s ease-out; }
@keyframes awaken { 0% { opacity: 0; transform: scale(.6) rotate(-20deg); filter: brightness(2.2) blur(4px); } 60% { opacity: 1; filter: brightness(1.4); } 100% { transform: none; filter: none; } }
.gx-name { margin-top: 0; }
.gx-final { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; width: 100%; }
.gx-fa { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border: 1.5px solid var(--hair); background: var(--card); }
.gx-fa small { font: 600 10.5px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.gx-fa b { font: 700 24px var(--f-mono); } .gx-fa.hi b { color: var(--brass); } .gx-fa.lo b { color: var(--bad); }
.gx-awaken .gx-nav { width: 100%; }

@media (max-width: 560px) {
  .gx-steps li { padding: 4px 4px; font-size: 0; gap: 0; } .gx-steps li.now { font-size: 11px; gap: 6px; }
  .gx-body { padding: 20px 14px 32px; }
  .gx-two, .gx-sets { grid-template-columns: minmax(0, 1fr); }
  .gx-facegrid { grid-template-columns: minmax(0, 1fr); }
  .gx-sigils { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .d8 { width: 60px; height: 68px; } .d8 span { font-size: 24px; } .gx-dice { gap: 12px; } .gx-tray { min-height: 160px; } .gx-sum b { font-size: 46px; } .gx-sum { min-height: 62px; }
  .gx-slots { gap: 4px; } .gx-slot b { font-size: 19px; }
  .gx-attr { grid-template-columns: minmax(0, 1fr) 96px; padding: 10px; } .gx-an small { font-size: 12px; }
  .gx-chip { width: 46px; height: 46px; font-size: 19px; }
  .gx-final { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .gx-nav .muted { order: 3; width: 100%; text-align: center; }
}

/* ---------- theme picker ---------- */
.skinpick { display: flex; align-items: center; gap: 6px; }
.skinpick select { border: 1.5px solid var(--hair); background: var(--card); color: var(--ink); padding: 4px 8px; border-radius: 2px;
  font: 600 12px/1.2 var(--f-head); letter-spacing: .06em; text-transform: uppercase; }

/* ================= THEMES =================
   Ledger (no data-skin) is the default printed-sheet look and follows the system light/dark setting.
   The others are complete looks with their own palette, type and shapes. */

/* ----- Steampunk: brass plates and rivets on dark mahogany ----- */
:root[data-skin="steam"] {
  --paper: #1b120d; --card: #2a1d15; --sunk: #3a2a1e; --ink: #f2e3c6; --ink-2: #d4bf9b; --ink-3: #a08a6a;
  --rule: #c99a4b; --bracket: #a8742f; --hair: #5c432e; --brass: #e6ad55; --brass-ink: #1b120d; --brass-soft: #4d3519;

  --hunger: #e0b050; --hunger-soft: #46341a; --life: #6fb2c2; --life-soft: #1d3338; --warn: #e6a64a; --bad: #f07b62; --good: #a8c46a;
  --f-display: "Rye", Georgia, serif; --f-head: "Alegreya Sans SC", "Arial Narrow", sans-serif; --f-body: "Alegreya", Georgia, serif; --f-mono: "Special Elite", "Courier New", monospace;

[data-skin="steam"] .h, [data-skin="steam"] .tabs button, [data-skin="steam"] .btn, [data-skin="steam"] .seg button { text-transform: none; letter-spacing: .04em; }
[data-skin="steam"] .h { font-weight: 800; font-size: 26px; }
[data-skin="steam"] .brand, [data-skin="steam"] .ornate { color: var(--brass); text-shadow: 0 1px 0 #000; }
[data-skin="steam"] .frame { border-left: 6px solid transparent; border-image: linear-gradient(#e6ad55, #8a5a22 50%, #e6ad55) 1; }
[data-skin="steam"] .frame::before, [data-skin="steam"] .frame::after { height: 10px; width: 54px; left: -6px; border-radius: 0 3px 3px 0;
  background: var(--rivet) 4px 50%/10px 10px no-repeat, var(--rivet) 40px 50%/10px 10px no-repeat, linear-gradient(#f0c470, #9b6a2c); box-shadow: 0 1px 0 #000; }
[data-skin="steam"] :is(.panel, .meter, .wcard, .wound, .pcard, .icard, .legend, .addpanel, .exrow, .perkcard, .spbox, .sptable) {
  background: var(--rivet) 3px 3px/10px 10px no-repeat, var(--rivet) calc(100% - 3px) 3px/10px 10px no-repeat,
    var(--rivet) 3px calc(100% - 3px)/10px 10px no-repeat, var(--rivet) calc(100% - 3px) calc(100% - 3px)/10px 10px no-repeat,

[data-skin="steam"] .btn.primary, [data-skin="steam"] .seg button[aria-pressed="true"] { background: linear-gradient(#f3c877, #b07a2a); color: #241608; border-color: #6b4a1f; box-shadow: inset 0 1px 0 #ffe2a6; }

[data-skin="steam"] .pip { border-color: #c99a4b; }

:root[data-skin="light"] {

  --seal: #3a3632; --seal-2: #77706a; --blood: #c03a32; --blood-soft: #f7dcd8; --tox: #3f7d2e; --tox-soft: #dcebd3;

[data-skin="retro"] .attr .nm, [data-skin="retro"] .sgroup h3, [data-skin="retro"] .spgroup h3 { font-family: var(--f-head); font-size: 24px; }

[data-skin="retro"] ::selection { background: var(--ink); color: var(--paper); }

[data-skin="glass"] :is(.panel, .meter, .wcard, .wound, .pcard, .icard, .legend, .addpanel, .exrow, .perkcard, .spbox, .sptable, .chip, .stat) { border: 1px solid rgb(255 255 255 / .14); border-radius: 16px; background: rgb(255 255 255 / .07); box-shadow: inset 0 1px 0 rgb(255 255 255 / .12); }
[data-skin="glass"] .exn, [data-skin="glass"] .plv { border-radius: 50%; }

[data-skin="glass"] .seg { overflow: hidden; padding: 2px; } [data-skin="glass"] .seg button { border-radius: 999px; }
[data-skin="glass"] .seg button[aria-pressed="true"] { background: rgb(255 255 255 / .9); color: #111428; }
[data-skin="glass"] .tabs { border-bottom: 0; gap: 4px; padding: 4px; border-radius: 999px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .16);
  -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); width: max-content; max-width: 100%; }
[data-skin="glass"] .tabs button { border: 0; border-radius: 999px; background: transparent; box-shadow: none; padding: 9px 18px; }
[data-skin="glass"] .tabs button:hover { background: rgb(255 255 255 / .1); }
[data-skin="glass"] .tabs button[aria-selected="true"] { background: rgb(255 255 255 / .92); color: #111428; box-shadow: 0 4px 14px rgb(0 0 0 / .2); }
[data-skin="glass"] .portrait { border: 1px solid rgb(255 255 255 / .3); border-radius: 22px; }
[data-skin="glass"] .cell { border-radius: 6px; border-width: 1px; } [data-skin="glass"] .mid { border-radius: 10px; border-width: 1px; background: rgb(255 255 255 / .12); }
[data-skin="glass"] .mid.at { background: #fff; color: #111428; }
[data-skin="glass"] .pip.on { background: #fff; border-color: #fff; box-shadow: inset 0 0 0 2px #2a2d55; }
[data-skin="glass"] .track, [data-skin="glass"] .mtrack { border-radius: 999px; border-color: transparent; }
[data-skin="glass"] .sgroup h3 { border-bottom: 1px solid var(--hair); }
[data-skin="glass"] th { border-bottom-width: 1px; }
[data-skin="glass"] .spanel { background: rgb(22 24 46 / .72); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border-left: 1px solid rgb(255 255 255 / .2); }
[data-skin="glass"] .hovercard, [data-skin="glass"] .toast { background: rgb(20 22 44 / .82); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border-radius: 12px; border: 1px solid rgb(255 255 255 / .18); color: var(--ink); }
[data-skin="glass"] .orn::before { border-color: rgb(255 255 255 / .22); }
[data-skin="glass"] .orn::after, [data-skin="glass"] .diamond::before { background: #1a1d38; }
[data-skin="glass"] .diamond.on::before { background: var(--brass); }
[data-skin="glass"] .banner { border-radius: 14px; background: rgb(255 209 102 / .14); }

/* ----- Fantasy: pen and paper on parchment, rubricated in red ----- */
:root[data-skin="fantasy"] {
  --paper: #efe2c3; --card: #f6ecd2; --sunk: #e5d4ac; --ink: #2b1c0f; --ink-2: #4f3a25; --ink-3: #7c6545;
  --rule: #3a2614; --bracket: #5a3c1e; --hair: #c5ad80; --brass: #8f1d17; --brass-ink: #fbf2dc; --brass-soft: #edcdb9;
  --seal: #3a2614; --seal-2: #7c6545; --blood: #a3261f; --blood-soft: #ecc6b8; --tox: #4c6a20; --tox-soft: #d7e0b4;
  --hunger: #8a5a12; --hunger-soft: #ecd7a6; --life: #2b5a7c; --life-soft: #cfdde3; --warn: #8a5a12; --bad: #9c1c1c; --good: #3f6a26;
  --f-display: "IM Fell English SC", "Palatino Linotype", serif; --f-head: "Cinzel", "Trajan Pro", Georgia, serif; --f-body: "EB Garamond", Garamond, Georgia, serif; --f-mono: "EB Garamond", Garamond, Georgia, serif;
  color-scheme: light;
}
[data-skin="fantasy"] body { font-size: 16.5px; background:
  radial-gradient(600px 400px at 12% 18%, rgb(150 110 50 / .12), transparent 70%), radial-gradient(500px 420px at 88% 64%, rgb(140 95 40 / .1), transparent 70%),
  radial-gradient(1400px 900px at 50% 50%, transparent 55%, rgb(110 70 25 / .22) 100%), var(--paper); background-attachment: fixed; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .h { font-weight: 700; letter-spacing: .08em; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .h > span:not(.orn) { display: inline-block; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .h > span:not(.orn)::first-letter { color: var(--brass); font-size: 1.25em; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .frame { border: 2px solid var(--rule); border-radius: 12px; padding: 24px 24px 24px;
  box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--rule); background: rgb(246 236 210 / .55); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .frame::before { content: "❦"; left: 50%; top: -15px; width: auto; height: auto; padding: 0 10px; transform: translateX(-50%); background: var(--paper); color: var(--brass); font-size: 22px; line-height: 1; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .frame::after { display: none; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) :is(.panel, .meter, .wcard, .wound, .pcard, .icard, .legend, .addpanel, .exrow, .perkcard, .spbox, .sptable) { border: 1.5px solid var(--rule); border-radius: 8px; box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px var(--hair); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .exrow.active { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--blood-soft) 55%, var(--card)), inset 0 0 0 4px var(--bad); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) :is(.attr .val, .stat b, .meter .v, .fact b, .wound .cnt, .exn, .mid, .mbar b, .srow .m, .calc) { font-weight: 600; font-feature-settings: "lnum", "tnum"; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .attr .val { font-size: 28px; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .btn { border-radius: 3px; font-weight: 600; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .btn.primary, :is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .seg button[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .tabs { border-bottom: 5px double var(--rule); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .tabs button { border-color: var(--rule); border-radius: 10px 10px 0 0; font-size: 15px; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .tabs button[aria-selected="true"] { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); box-shadow: none; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .tabs button[aria-selected="true"] .tabicon { stroke: var(--brass-ink); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .portrait { border: 3px double var(--rule); border-radius: 50%; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .portrait img { filter: sepia(.35) contrast(1.05); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .pip.on { background: var(--ink); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .cell.bought { background: var(--brass); border-color: var(--brass); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .mid { border-radius: 50%; width: 36px; height: 36px; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .sgroup h3 { border-bottom: 3px double var(--rule); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .sigil { opacity: calc(var(--o) * 1.5); }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .hovercard { background: #2b1c0f; color: #f6ecd2; border-top-color: #c9483c; }
:is([data-skin="fantasy"], [data-skin="fantasy-dark"]) .hovercard em { color: #f0c7a8; }

<script src="firebase-config.js"></script>
<script>
/* Clockwork Companion — web build backend.
   On claude.ai the page gets shared saving from the artifact runtime (window.claude.use). On its own website it
   gets the same thing from Firebase instead: this file provides a stand-in window.claude with the same
   db / assets interface, plus a "table" service (who is signed in, their role, the members list).

   Players sign in with Google, then type the table password once per device.
   Everything for one group lives under tables/<key>/…, where <key> is a hash of the table password.
   The person who creates a table is its GM; the GM can make other members GMs.
   GMs see every character; players see only the characters assigned to them. The database rules enforce this. */
(() => {
  const cfg = window.CLOCKWORK_FIREBASE;
  const configured = !!(cfg && cfg.apiKey && cfg.projectId && window.firebase);
  const KEY = "cw-table-key";
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

  async function tableKey(password) {
    const bytes = new TextEncoder().encode("clockwork-table:" + password.trim().toLowerCase());
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  let fs = null, auth = null, root = "", me = null;   // me: { uid, role, name }
  const portraits = {};   // asset id -> data URL

  const db = {
    // Players may only read their own characters, so their list is narrowed to the ones assigned to them.
    collection: name => {
      const ref = fs.collection(`${root}/${name}`);
      return name === "characters" && me.role !== "gm" ? ref.where("players", "array-contains", me.uid) : ref;
    },
    doc: path => fs.doc(`${root}/${path}`),
  };
  const assets = {
    async upload(file, previousId) {
      if (file.size > 20 * 1024 * 1024) throw { code: "too_large" };
      const data = await shrinkImage(file);   // defined in app.js
      const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await fs.doc(`${root}/portraits/${id}`).set({ data, t: Date.now() });
      portraits[id] = data;
      if (previousId && previousId !== id) fs.doc(`${root}/portraits/${previousId}`).delete().catch(() => {});
      return { id };
    },
    urlFor: id => portraits[id] || "",
    remove: id => fs.doc(`${root}/portraits/${id}`).delete().catch(() => {}),
  };
  const table = {
    get uid() { return me.uid; }, get role() { return me.role; }, get name() { return me.name; },
    members: (cb, err) => fs.collection(`${root}/members`).onSnapshot(s => cb(s.docs.map(d => Object.assign({ uid: d.id }, d.data()))), err || (() => {})),
    setRole: (uid, role) => fs.doc(`${root}/members/${uid}`).update({ role }),
    remove: uid => fs.doc(`${root}/members/${uid}`).delete(),
  };

  // ---- joining a table ----
  let opened;
  const ready = new Promise(res => (opened = res));
  const profile = u => ({ name: (u.email || "player").split("@")[0] });

  async function join(key, user, claim) {
    const metaRef = fs.doc(`tables/${key}/meta/table`), meRef = fs.doc(`tables/${key}/members/${user.uid}`);
    const meta = await metaRef.get();
    if (!meta.exists) return { error: "missing" };
    const owner = meta.data().owner;
    if (!owner && claim === undefined) return { error: "unclaimed" };   // a table made before GM roles existed
    if (!owner && claim) await metaRef.update({ owner: user.uid });
    const mine = await meRef.get();
    let role;
    if (mine.exists) { role = mine.data().role; await meRef.update(profile(user)).catch(() => {}); }
    else { role = owner === user.uid || claim ? "gm" : "player"; await meRef.set(Object.assign({ role, joined: Date.now() }, profile(user))); }
    root = `tables/${key}`; lsSet(KEY, key);
    fs.doc(`users/${user.uid}`).set({ table: key }).catch(() => {});   // so signing in on another device finds this table
    me = { uid: user.uid, role, name: profile(user).name };
    // If the GM changes this person's role, reload so they get the right view; if they're removed, send them out.
    meRef.onSnapshot(s => {
      if (!s.exists) { lsSet(KEY, null); alertLeft(); return; }
      if (s.data().role !== me.role) location.reload();
    }, () => {});
    fs.collection(`${root}/portraits`).onSnapshot(snap => {
      snap.docs.forEach(d => { portraits[d.id] = d.data().data; });
      window.dispatchEvent(new Event("cw-portraits"));
    }, () => {});
    started = true; opened(db);
    return { ok: true };
  }
  function alertLeft() {
    fs.doc(`users/${auth.currentUser.uid}`).delete().catch(() => {});
    root = ""; gate(auth.currentUser, "The GM has removed you from this table. Ask them for the table password to join again.");
  }

  // ---- accounts: a username and password, kept by Firebase. The username becomes a made-up email address
  // behind the scenes (Firebase's password sign-in needs one), so nobody has to give a real email. ----
  const cleanName = u => u.trim().toLowerCase();
  const validName = u => /^[a-z0-9][a-z0-9_.-]{1,23}$/.test(u);
  const emailFor = u => `${u}@${cfg.projectId}.firebaseapp.com`;
  const authError = code => ({
    "auth/invalid-credential": "That username and password don't match.", "auth/wrong-password": "That username and password don't match.",
    "auth/user-not-found": "That username and password don't match.", "auth/email-already-in-use": "That username is taken. Pick another.",
    "auth/weak-password": "Use at least 6 characters for the password.", "auth/too-many-requests": "Too many tries. Wait a minute and try again.",
    "auth/operation-not-allowed": "Username sign-in isn't switched on in Firebase yet (Authentication → Sign-in method → Email/Password).",
    "auth/network-request-failed": "Couldn't reach the server. Check your connection.",
  }[code] || "That didn't work. Try again.");

  // ---- the gate: a forge-lit sign-in scene of its own, the same whatever theme a player picks ----
  // An outline gear as an SVG path: teeth around the rim and a round hole in the middle.
  function gearPath(teeth, outer, inner, hole, c = 100) {
    const step = (Math.PI * 2) / teeth, pt = (a, r) => `${(c + r * Math.cos(a)).toFixed(1)} ${(c + r * Math.sin(a)).toFixed(1)}`;
    let d = "";
    for (let i = 0; i < teeth; i++) { const a = i * step; d += (i ? "L" : "M") + pt(a, inner) + "L" + pt(a + step * 0.12, outer) + "L" + pt(a + step * 0.42, outer) + "L" + pt(a + step * 0.54, inner); }
    return d + `Z M${c + hole} ${c} A${hole} ${hole} 0 1 0 ${c - hole} ${c} A${hole} ${hole} 0 1 0 ${c + hole} ${c} Z`;
  }
  const gearSvg = (cls, teeth, outer, inner, hole) => `<svg class="gear ${cls}" viewBox="0 0 200 200"><path fill-rule="evenodd" d="${gearPath(teeth, outer, inner, hole)}"/><circle cx="100" cy="100" r="${hole - 14}" fill="none" stroke="currentColor" stroke-width="6"/></svg>`;
  const corner = cls => `<svg class="gp-corner ${cls}" viewBox="0 0 48 48" aria-hidden="true"><path d="M3 45V12a9 9 0 0 1 9-9h33" fill="none" stroke="url(#gate-gold)" stroke-width="3"/><path d="M10 38V17a7 7 0 0 1 7-7h21" fill="none" stroke="url(#gate-gold)" stroke-width="1.2" opacity=".75"/><path d="M17 26c0-5 4-9 9-9" fill="none" stroke="url(#gate-gold)" stroke-width="1.4"/><circle cx="10" cy="10" r="4" fill="url(#gate-gold)"/><circle cx="10" cy="10" r="1.4" fill="#2a1a0c"/></svg>`;
  const SCENE = `<div class="gate-bg" aria-hidden="true">
      ${gearSvg("g1", 18, 98, 84, 58)}${gearSvg("g2", 14, 98, 82, 50)}${gearSvg("g3", 10, 98, 78, 44)}${gearSvg("g4", 22, 98, 88, 66)}
      <i class="steam s1"></i><i class="steam s2"></i><i class="steam s3"></i>
      <div class="embers">${Array.from({ length: 16 }, (_, i) => `<i style="--x:${(i * 61) % 100}%;--d:${9 + ((i * 7) % 8)}s;--w:${(i * 3) % 5 - 2}vw;--delay:-${(i * 1.7).toFixed(1)}s"></i>`).join("")}</div>
    </div>
    <svg width="0" height="0" style="position:absolute"><defs>
      <linearGradient id="gate-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7b0"/><stop offset=".5" stop-color="#d49a45"/><stop offset="1" stop-color="#8a5a22"/></linearGradient>
      <radialGradient id="gate-gem" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#fff4d2"/><stop offset=".35" stop-color="#ffb04a"/><stop offset="1" stop-color="#8f2a0c"/></radialGradient>
    </defs></svg>
    <button type="button" class="installbtn gate-install" data-install-btn data-tip="Install the Companion as an app" aria-label="Install the Companion as an app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v10.5m0 0-4.2-4.2M12 14l4.2-4.2M4.5 14.5v3.2A2.3 2.3 0 0 0 6.8 20h10.4a2.3 2.3 0 0 0 2.3-2.3v-3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <main class="gate-wrap">
      <header class="gate-crest">
        <svg class="crest" viewBox="0 0 200 200" aria-hidden="true">
          <g class="crest-gear"><path fill="url(#gate-gold)" fill-rule="evenodd" d="${gearPath(24, 98, 86, 72)}"/></g>
          <circle cx="100" cy="100" r="66" fill="#140d08" stroke="url(#gate-gold)" stroke-width="3"/>
          <circle cx="100" cy="100" r="56" fill="none" stroke="#6b4a20" stroke-width="1.5" stroke-dasharray="2 5"/>
          <path d="M100 50 L122 100 L100 150 L78 100 Z" fill="url(#gate-gem)" stroke="#fbe7b0" stroke-width="1.5"/>
          <path d="M100 50 L100 150 M78 100 L122 100 M100 50 L90 100 L100 150 M100 50 L110 100 L100 150" fill="none" stroke="#fff1c8" stroke-width=".8" opacity=".55"/>
          <path d="M60 100h-14M154 100h-14M100 40v-6M100 166v-6" stroke="url(#gate-gold)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h1>Clockwork</h1>
        <p class="gate-tag"><span>Tales of Steam and Magick</span></p>
      </header>
      <div class="gate-plate">${corner("tl")}${corner("tr")}${corner("bl")}${corner("br")}<i class="gp-gem" aria-hidden="true"></i>
        <form class="gate-panel" novalidate></form></div>
      <p class="gate-foot">The companion ledger for your table</p>
    </main>`;
  let box = null;
  function gate(user, note, key) {
    if (box) box.remove();
    box = document.createElement("div");
    box.className = "gate";
    box.innerHTML = SCENE;
    document.body.appendChild(box);
    if (user) return tableStep(user, note, key);
    let mode = "in";
    const draw = msg => {
      box.querySelector(".gate-panel").innerHTML = `
        <div class="gate-tabs" role="group" aria-label="Account"><button type="button" data-m="in" aria-pressed="${mode === "in"}">Sign in</button><button type="button" data-m="up" aria-pressed="${mode === "up"}">New player</button></div>
        <div class="gate-field"><label for="gate-user">Username</label><input id="gate-user" autocomplete="username" autocapitalize="none" spellcheck="false" /></div>
        <div class="gate-field"><label for="gate-pass">Password</label><input id="gate-pass" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}" /></div>
        ${mode === "up" ? `<div class="gate-field"><label for="gate-table">Table password</label><input id="gate-table" type="password" autocomplete="off" /><small>Your GM gives you this. You only need it once.</small></div>` : ""}
        <p class="gate-msg" role="status"></p>
        <button class="gate-btn" type="submit">${mode === "in" ? "Enter" : "Create my account"}</button>`;
      const q = s => box.querySelector(s), say = t => { q(".gate-msg").textContent = t || ""; };
      say(msg);
      box.querySelectorAll("[data-m]").forEach(b => (b.onclick = () => { mode = b.dataset.m; draw(); }));
      q("form").onsubmit = async e => {
        e.preventDefault();
        const name = cleanName(q("#gate-user").value), pass = q("#gate-pass").value;
        if (!validName(name)) { say("Usernames are 2–24 letters or numbers (dots, dashes and underscores are fine too)."); return; }
        if (mode === "in") {
          say("Signing in…");
          try { await auth.signInWithEmailAndPassword(emailFor(name), pass); } catch (err) { say(authError(err && err.code)); }
          return;
        }
        const tpw = q("#gate-table").value;
        if (pass.length < 6) { say("Use at least 6 characters for the password."); return; }
        if (!tpw.trim()) { say("Type the table password your GM gave you."); return; }
        say("Checking the table…");
        try {
          const key = await tableKey(tpw);
          pendingSignup = { key, name };
          await auth.createUserWithEmailAndPassword(emailFor(name), pass);   // onAuthStateChanged takes it from here
        } catch (err) { pendingSignup = null; say(authError(err && err.code)); }
      };
      setTimeout(() => q("#gate-user").focus(), 50);
    };
    draw(note);
  }

  // Signed in but not (yet) in a table: ask for the table password, create a table, or claim an old one.
  function tableStep(user, note, key) {
    box.querySelector(".gate-panel").innerHTML = `
        <p class="gate-who">Signed in as <b></b> · <button type="button" class="gate-link gate-out">Sign out</button></p>
        <div class="gate-field"><label for="gate-table">Table password</label><input id="gate-table" type="password" autocomplete="off" /></div>
        <p class="gate-msg" role="status"></p>
        <button class="gate-btn" type="submit">Open table</button>
        <button class="gate-btn alt gate-new" type="button" hidden>Create a new table with this password</button>
        <div class="gate-claim" hidden><button class="gate-btn" type="button" data-claim="1">I'm the GM: claim this table</button><button class="gate-btn alt" type="button" data-claim="0">Join as a player</button></div>`;
    const q = s => box.querySelector(s), say = t => { q(".gate-msg").textContent = t || ""; };
    q("b").textContent = shortName(user);
    q(".gate-out").onclick = () => auth.signOut();
    let pending = key || null;
    const tryJoin = async (k, claim) => {
      const r = await join(k, user, claim);
      if (r.ok) { box.remove(); box = null; return; }
      pending = k;
      if (r.error === "missing") { q(".gate-new").hidden = false; say("No table uses that password yet. Check it with your GM, or create a new table if you're the GM."); }
      if (r.error === "unclaimed") { q(".gate-claim").hidden = false; say("This table doesn't have a GM yet. If you run it, claim it now. Everyone else joins as a player."); }
    };
    q("form").onsubmit = async e => {
      e.preventDefault(); const v = q("#gate-table").value; if (!v.trim()) { say("Type the table password first."); return; }
      q(".gate-new").hidden = true; q(".gate-claim").hidden = true; say("Checking…");
      try { await tryJoin(await tableKey(v)); } catch { say("Couldn't reach the table just now. Check your connection and try again."); }
    };
    q(".gate-new").onclick = async () => {
      try { await fs.doc(`tables/${pending}/meta/table`).set({ created: Date.now(), owner: user.uid }); await tryJoin(pending); }
      catch { say("Couldn't create the table. Check the database rules in Firebase."); }
    };
    box.querySelectorAll("[data-claim]").forEach(b => (b.onclick = async () => {
      try { await tryJoin(pending, b.dataset.claim === "1"); } catch { say("Couldn't join just now. Try again."); }
    }));
    say(note);
    if (pending) tryJoin(pending).catch(() => say("Couldn't reach the table just now."));
    setTimeout(() => q("#gate-table").focus(), 50);
  }
  const shortName = u => (u.email || "").split("@")[0] || "player";
  let pendingSignup = null;

  window.CW_WEB = {
    configured,
    reason: configured ? "" : cfg && cfg.apiKey ? "offline" : "noconfig",   // why shared saving is off, if it is
    leave() { lsSet(KEY, null); (auth ? auth.signOut() : Promise.resolve()).then(() => location.reload()); },
  };
  if (!configured) return;   // no Firebase settings yet: the app runs in this-browser-only mode

  const gateFonts = document.createElement("link");
  gateFonts.rel = "stylesheet";
  gateFonts.href = "https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap";
  document.head.appendChild(gateFonts);
  firebase.initializeApp(cfg);
  fs = firebase.firestore();
  // Keep a copy of this table's data on the device, so sheets open and edits queue up when the connection drops.
  // (Fails quietly in private windows or when another tab already owns the copy.)
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch {}
  auth = firebase.auth();
  window.claude = {
    use(name) {
      if (name === "db") return ready;
      if (name === "assets") return ready.then(() => assets);
      if (name === "table") return ready.then(() => table);
      return Promise.resolve(null);   // downloads use the browser's own
    },
  };
  let started = false;
  const start = () => auth.onAuthStateChanged(async user => {
    if (!user) { if (started) location.reload(); else gate(null); return; }
    if (started) return;
    const signup = pendingSignup; pendingSignup = null;
    let key = signup ? signup.key : lsGet(KEY);
    if (!key) { try { const u = await fs.doc(`users/${user.uid}`).get(); if (u.exists) key = u.data().table; } catch {} }
    if (key) {
      try { const r = await join(key, user); if (r.ok) { if (box) { box.remove(); box = null; } return; } } catch {}
      lsSet(KEY, null);
    }
    gate(user, "", key);
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
<script>
/* Clockwork Companion: installable app. Registers the offline worker (sw.js) and, when a newer version has been
   published, offers a one-line "reload" notice instead of switching the page under someone mid-session. */
(() => {
  if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || document.getElementById("cw-update")) return;
    const bar = document.createElement("div"); bar.id = "cw-update"; bar.setAttribute("role", "status");
    bar.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9000;display:flex;gap:10px;align-items:center;" +
      "padding:8px 12px;max-width:calc(100vw - 32px);background:#1b130b;color:#ffe2a8;border:1px solid #b88a3c;border-radius:6px;font:14px system-ui,sans-serif;box-shadow:0 6px 24px rgb(0 0 0 / .4)";
    bar.innerHTML = '<span>A new version of the app is ready.</span><button type="button" style="font:inherit;font-weight:600;padding:4px 10px;border:1px solid #e0b462;background:#8a2e1c;color:#ffe2a8;border-radius:4px;cursor:pointer">Reload</button><button type="button" aria-label="Not now" style="font:inherit;background:none;border:0;color:#c9a56a;cursor:pointer">×</button>';
    const [reload, later] = bar.querySelectorAll("button");
    reload.onclick = () => location.reload(); later.onclick = () => bar.remove();
    document.body.appendChild(bar);
  });
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });

  // ---- the install-app button (data-install-btn, in the header and on the sign-in screen) ----
  // It shows only when installing is possible: Chrome/Edge/Android offer an install prompt; iPhone and iPad have no
  // prompt, so there the button explains Share → Add to Home Screen. Already installed: no button.
  const root = document.documentElement;
  const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const apple = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let offer = null;
  const mark = v => { if (v && !standalone()) root.dataset.install = v; else delete root.dataset.install; };
  if (apple) mark("ios");
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); offer = e; mark("prompt"); });
  addEventListener("appinstalled", () => { offer = null; mark(""); });
  const help = btn => {
    const old = document.querySelector(".installhelp"); if (old) { old.remove(); return; }
    const tip = document.createElement("div"); tip.className = "installhelp"; tip.setAttribute("role", "status");
    tip.innerHTML = apple ? "To install: tap <b>Share</b> <span aria-hidden=\"true\">⬆︎</span>, then <b>Add to Home Screen</b>."
                          : "To install: open your browser's menu and choose <b>Install app</b> (or <b>Add to Home screen</b>).";
    document.body.appendChild(tip);
    const r = btn.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.top = Math.min(innerHeight - tip.offsetHeight - 8, r.bottom + 8) + "px";
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
    setTimeout(() => document.addEventListener("pointerdown", function off(ev) { if (!tip.contains(ev.target)) { tip.remove(); document.removeEventListener("pointerdown", off); } }), 0);
  };
  document.addEventListener("click", async e => {
    const btn = e.target.closest && e.target.closest("[data-install-btn]"); if (!btn) return;
    e.preventDefault();
    if (!offer) { help(btn); return; }
    const o = offer; offer = null;
    try { await o.prompt(); const r = await o.userChoice; mark(r && r.outcome === "accepted" ? "" : apple ? "ios" : ""); } catch { mark(""); }
  });
})();
</script>
<script>
/* Clockwork rules engine — Clockwork Rulebook 2020.1.
   Pure functions only: given a character, compute everything the sheet derives. */
const CW = (() => {
  const ATTRS = [
    { k: "STR", n: "Strength" }, { k: "DEX", n: "Dexterity" }, { k: "END", n: "Endurance" },
    { k: "MND", n: "Mind" }, { k: "WIL", n: "Willpower" }, { k: "WIS", n: "Wisdom" }, { k: "PRS", n: "Presence" },
  ];

  // Order matches the printed sheet (used by the Tabletop Simulator script too).
  // pct = % added to the skill's modifier per skill point (chance skills are 1%, the rest 3%).
  const SKILL_GROUPS = [
    { attr: "STR", skills: [["Maim", 1], ["Bash", 1], ["Cleave", 1], ["Parry", 1], ["Armor Mastery", 3], ["Strong Back", 3]] },
    { attr: "DEX", skills: [["Tumble", 3], ["Pierce", 1], ["Precision", 1], ["Subtlety", 3], ["Alacrity", 3], ["Martial Arts", 3], ["Evasion", 1]] },
    { attr: "END", skills: [["Belly", 3], ["Deprivation", 3], ["Bleed Resistance", 3], ["Durability", 3], ["Shield Mastery", 1], ["Conditioning", 3], ["Versatility", 3], ["Metabolism", 3]] },
    { attr: "MND", skills: [["Demonology", 3], ["Alchemy", 3], ["Engineering", 3], ["Robotics", 3], ["Lore", 3]] },
    { attr: "WIS", skills: [["Armor Maintenance", 3], ["Weapon Maintenance", 3], ["Brewing", 3], ["Powdertinker", 3], ["Awareness", 3], ["Medicine", 3]] },
    { attr: "WIL", skills: [["Warding", 3], ["Sangromancy", 3], ["Dreamwalking", 3], ["Occult: Harmony", 3]] },
    { attr: "PRS", skills: [["Taming", 3], ["Leadership", 3], ["Runecrafting", 3], ["Hunting", 3], ["Perform", 3]] },
  ];
  const ATTR_NAME = Object.fromEntries(ATTRS.map(a => [a.k, a.n]));
  const SKILLS = {};
  SKILL_GROUPS.forEach(g => g.skills.forEach(([n, pct]) => { SKILLS[n] = { attr: g.attr, pct }; }));

  const CASTING = ["Sangromancy", "Warding", "Demonology", "Alchemy", "Dreamwalking"];

  const WEAPON_TYPES = [
    ["Slashing", "STR"], ["Piercing", "STR"], ["Bludgeoning", "STR"], ["Unarmed", "STR"], ["Motorized", "STR"], ["Improvised", "STR"],
    ["Rifles", "DEX"], ["Pistols", "DEX"], ["Sniper Rifles", "DEX"], ["Shotguns", "DEX"], ["Explosives", "DEX"],
    ["Stringed", "DEX"], ["Throwing", "DEX"], ["Finesse", "DEX"], ["Heavy", "DEX"],
  ];
  const WEAPON_ATTR = Object.fromEntries(WEAPON_TYPES);
  // Rulebook: every ranged weapon has a Clip, an optimal and maximum range and a reload cost; melee weapons reach 2 m.
  const RANGED_WEAPONS = ["Rifles", "Pistols", "Sniper Rifles", "Shotguns", "Explosives", "Stringed", "Throwing", "Heavy"];
  // A shield is picked from the same weapon skill list ("Shield"); older sheets marked it with a checkbox.
  const weaponKind = w => (w.shield || w.skill === "Shield" ? "shield" : RANGED_WEAPONS.includes(w.skill) ? "ranged" : "melee");

  // [name, attribute, connected primary skill, primary level that grants proficiency, karma cost of levels 1/2/3]
  const SECONDARY = [
    ["Athletics", "STR", "Strong Back", 4, [3, 7, 10]],
    ["Acrobatics", "DEX", "Tumble", 3, [3, 7, 10]],
    ["Machine Operation", "DEX", "Engineering", 6, [2, 5, 8]],
    ["First Aid", "DEX", "Medicine", 3, [2, 5, 7]],
    ["Riding", "DEX", "Taming", 5, [2, 4, 7]],
    ["Forgery", "DEX", null, 0, [3, 5, 8]],
    ["Stealth", "DEX", "Subtlety", 3, [3, 5, 9]],
    ["Sleight of Hand", "DEX", "Alacrity", 4, [4, 6, 12]],
    ["Entrada", "END", null, 0, [2, 4, 7]],
    ["Land Navigation", "MND", null, 0, [5, 6, 8]],
    ["Naval Navigation", "MND", null, 0, [5, 6, 8]],
    ["Sky Navigation", "MND", null, 0, [5, 6, 8]],
    ["Appraisal", "MND", "Lore", 3, [4, 5, 6]],
    ["Investigation", "MND", "Awareness", 3, [3, 4, 8]],
    ["Mechanical Insight", "MND", "Engineering", 3, [3, 5, 7]],
    ["Prosthetic Operation", "MND", "Robotics", 3, [5, 7, 8]],
    ["Sailing", "WIS", null, 0, [4, 5, 7]],
    ["Sky-Sailing", "WIS", null, 0, [4, 6, 8]],
    ["Cooking", "WIS", "Brewing", 4, [2, 4, 7]],
    ["Insight", "WIS", "Awareness", 5, [3, 4, 8]],
    ["Perception", "WIS", "Awareness", 4, [2, 4, 6]],
    ["Foraging", "WIS", null, 0, [5, 7, 9]],
    ["Persuasion", "PRS", "Leadership", 3, [3, 7, 10]],
    ["Deception", "PRS", "Perform", 3, [3, 7, 10]],
    ["Intimidate", "PRS", null, 0, [3, 7, 10]],
    ["Animal Handling", "PRS", "Taming", 3, [2, 5, 7]],
  ].map(([name, attr, primary, at, cost]) => ({ name, attr, primary, at, cost }));
  const SECONDARY_BY_NAME = Object.fromEntries(SECONDARY.map(s => [s.name, s]));

  const SIZES = { small: 1, medium: 2, large: 4, huge: 8 };
  // Inventory sizes: [key, label, slots per stack, how many fit in one stack]. Bundles and ammo stack into one small slot.
  const ITEM_SIZES = [["small", "Small", 1, 1], ["medium", "Medium", 2, 1], ["large", "Large", 4, 1], ["huge", "Huge", 8, 1],
    ["bundle", "Bundle · 10 a slot", 1, 10], ["ammo", "Ammo · 50 a slot", 1, 50]];
  const ITEM_SIZE = Object.fromEntries(ITEM_SIZES.map(([k, label, slots, per]) => [k, { label, slots, per }]));
  const PROSTHETIC_TYPES = ["Replacement limb", "Added limb", "Replacement organ", "Implant", "Other"];

  const ARMOR = {
    light:  { label: "Light",  av: [1, 4],   str: 0,  am: 0, repairPerAV: 50,  repairDie: "d6"  },
    medium: { label: "Medium", av: [5, 7],   str: 10, am: 0, repairPerAV: 70,  repairDie: "d8"  },
    heavy:  { label: "Heavy",  av: [8, 11],  str: 13, am: 3, repairPerAV: 100, repairDie: "d10" },
    plate:  { label: "Plate",  av: [12, 15], str: 15, am: 5, repairPerAV: 150, repairDie: "d12" },
  };

  const ENCUMBRANCE = [
    { name: "Unencumbered",        mult: 3, explore: "10 km/h", day: "40 km", defend: 0,   move: 0 },
    { name: "Lightly Encumbered",  mult: 4, explore: "5 km/h",  day: "20 km", defend: -10, move: -2 },
    { name: "Heavily Encumbered",  mult: 5, explore: "2 km/h",  day: "10 km", defend: -20, move: -4 },
    { name: "Severely Encumbered", mult: 6, explore: "1 km/h",  day: "5 km",  defend: -40, move: -8 },
    { name: "Over Encumbered",     mult: 7, explore: "Speed 0", day: "Speed 0", defend: null, move: null },
  ];

  const WOUNDS = { light: { dmg: 6, bleed: 8, fix: "Dressing · 5 AP · bandages" },
                   moderate: { dmg: 8, bleed: 14, fix: "Stitches · 1 minute · medical kit" },
                   mortal: { dmg: 12, bleed: 20, fix: "Surgery · 1 short rest · surgery kit" } };

  const EXHAUSTION = [
    "No effect",
    "The GM can botch your rolls (once a round in combat, or once per 5 checks outside it)",
    "You cannot take reactions",
    "Disadvantage on secondary skill checks and saving throws",
    "Critical fumble chance doubles",
    "Disadvantage on ability checks and attack rolls",
    "You cannot critically succeed",
    "Hit point maximum halved",
    "You cannot use Active Abilities or Empowerments",
    "Any vital loss rolled on dice takes the maximum instead",
    "Death",
  ];

  const PROFICIENCY = [[10, "Master"], [7, "Adept"], [5, "Proficient"], [3, "Competent"], [0, "Inexperienced"]];

  // ---------- helpers ----------
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const num = v => (Number.isFinite(+v) ? +v : 0);
  // Karma: buying level n costs n (level 1 = 1, level 10 = 10), so reaching level n from 0 costs 1 + 2 + … + n (0 → 10 = 55).
  const tri = n => (n * (n + 1)) / 2;
  const karmaBetween = (from, to) => tri(to) - tri(from);

  function blankCharacter() {
    const attrs = {}; ATTRS.forEach(a => (attrs[a.k] = { base: 10, value: 10 }));
    const skills = {}; Object.keys(SKILLS).forEach(s => (skills[s] = 0));
    const weapons = {}; WEAPON_TYPES.forEach(([w]) => (weapons[w] = 0));
    const secondary = {}; SECONDARY.forEach(s => (secondary[s.name] = 0));
    return {
      v: 1, name: "", player: "", campaign: "", profession: "", faction: "", age: "", height: "", weight: "",
      portraitAsset: "", portraitUrl: "", notes: "",
      karma: 0, pool: 0,
      attrs, skills, weaponSkills: weapons, secondary,
      vitals: { hp: null, bp: null, dp: null, tox: 0, exhaustion: 0, staminaLost: 0,
                wounds: { light: 0, moderate: 0, mortal: 0 }, conditions: [] },
      prosthetics: [], coins: 0,
      items: [], weapons: [], armor: [], log: [],
      craft: { supplies: { container: 0 }, bonus: 0, batch: {}, recipe: { type: "rifle" }, ledger: [],
               armor: { forge: false, bonus: 0, recipe: { type: "medium", av: 5, soak: 50, plusAV: 0, plusSoak: 0, name: "" }, ledger: [] } },
      talents: [], uses: {},
    };
  }

  // Fill in any fields an older or partial character is missing.
  function normalize(c) {
    const b = blankCharacter();
    const out = Object.assign({}, b, c || {});
    out.attrs = Object.assign({}, b.attrs, c && c.attrs);
    ATTRS.forEach(a => { const v = out.attrs[a.k]; out.attrs[a.k] = typeof v === "number" ? { base: v, value: v } : Object.assign({ base: 10, value: 10 }, v); });
    out.skills = Object.assign({}, b.skills, c && c.skills);
    out.weaponSkills = Object.assign({}, b.weaponSkills, c && c.weaponSkills);
    out.secondary = Object.assign({}, b.secondary, c && c.secondary);
    out.vitals = Object.assign({}, b.vitals, c && c.vitals);
    out.vitals.wounds = Object.assign({}, b.vitals.wounds, c && c.vitals && c.vitals.wounds);
    ["items", "weapons", "armor", "log", "talents"].forEach(k => (out[k] = Array.isArray(out[k]) ? out[k] : []));
    out.uses = out.uses && typeof out.uses === "object" ? out.uses : {};
    // Stamina lost and Exhaustion are one track: each Stamina stack lost is a level of Exhaustion.
    // Older sheets kept them apart, so take the higher of the two. staminaLost stays as a mirror for the Tabletop sheet.
    out.vitals.exhaustion = clamp(Math.max(num(out.vitals.exhaustion), num(out.vitals.staminaLost)), 0, 10);
    out.vitals.staminaLost = out.vitals.exhaustion;
    if (!Array.isArray(out.vitals.conditions)) out.vitals.conditions = [];
    out.craft = Object.assign({}, b.craft, out.craft);
    ["supplies", "batch"].forEach(k => (out.craft[k] = Object.assign({}, b.craft[k], out.craft[k])));
    out.craft.recipe = Object.assign({ type: "rifle" }, out.craft.recipe);
    if (!Array.isArray(out.craft.ledger)) out.craft.ledger = [];
    out.craft.armor = Object.assign({}, b.craft.armor, out.craft.armor);
    out.craft.armor.recipe = Object.assign({}, b.craft.armor.recipe, out.craft.armor.recipe);
    if (!Array.isArray(out.craft.armor.ledger)) out.craft.armor.ledger = [];
    // Older sheets: a prosthetic count becomes that many unnamed entries; per-slot items become bundles or ammo.
    if (!Array.isArray(out.prosthetics)) out.prosthetics = Array.from({ length: Math.max(0, num(out.prosthetics)) }, (_, i) => ({ id: "pr" + i, name: "", type: PROSTHETIC_TYPES[0], props: "" }));
    out.items = out.items.map(it => (it.per > 1 && (it.size || "small") === "small" ? Object.assign({}, it, { size: it.per >= 50 ? "ammo" : "bundle", per: undefined }) : it));
    return out;
  }

  const attr = (c, k) => num(c.attrs[k] && c.attrs[k].value);
  const attrBase = (c, k) => num(c.attrs[k] && c.attrs[k].base);
  // Attributes run 0–20 with 10 as the median. Below 10 an attribute is "broken".
  // Karma counts levels above a threshold: 10 for most attributes, so 16 → 17 is level 7 and costs 7.
  // An attribute that STARTED broken uses its starting value as its own "10" instead:
  // a starting 6 pays 1 for 7, 2 for 8, 3 for 9 … and tops out at 16 (threshold + 10).
  const attrThreshold = (c, k) => Math.min(10, attrBase(c, k));
  const attrCap = (c, k) => Math.min(20, attrThreshold(c, k) + 10);
  const attrCost = (c, k, from, to) => { const t = attrThreshold(c, k); return tri(Math.max(0, to - t)) - tri(Math.max(0, from - t)); };
  const sk = (c, n) => num(c.skills[n]);

  // A skill can't be higher than its governing attribute, and tops out at 10.

  // Mind 16 allows 6 in Alchemy; a broken attribute (below 10) allows none.
  const pointsAbove10 = v => clamp(v - 10, 0, 10);
  const skillCap = (c, name) => pointsAbove10(attr(c, SKILLS[name].attr));
  const weaponCap = (c, type) => pointsAbove10(attr(c, WEAPON_ATTR[type]));
  // Secondary skills: attribute below 10 → level 1, below 14 → level 2, 14+ → level 3.
  function secondaryCap(c, name) {
    const a = attr(c, SECONDARY_BY_NAME[name].attr);

  const secondaryCost = (name, from, to) => SECONDARY_BY_NAME[name].cost.slice(from, to).reduce((s, x) => s + x, 0);

  function proficiency(level) { for (const [at, n] of PROFICIENCY) if (level >= at) return n; return "Inexperienced"; }

  // Everything with pips, in one place: where its level lives, its ceiling, its governing attribute and its Karma price.
  // kind: "attr" | "skill" | "weapon" | "sec". cost(from, to) is the price of raising from → to (to > from).
  const LEVELS = {
    attr:   { max: 20, get: (c, n) => attr(c, n), put: (x, n, v) => { x.attrs[n].value = v; }, cap: (c, n) => attrCap(c, n),
              attrOf: n => n, cost: (c, n, a, b) => attrCost(c, n, a, b) },
    skill:  { max: 10, get: (c, n) => num(c.skills[n]), put: (x, n, v) => { x.skills[n] = v; }, cap: (c, n) => skillCap(c, n),
              attrOf: n => SKILLS[n].attr, cost: (c, n, a, b) => karmaBetween(a, b) },
    weapon: { max: 10, get: (c, n) => num(c.weaponSkills[n]), put: (x, n, v) => { x.weaponSkills[n] = v; }, cap: (c, n) => weaponCap(c, n),
              attrOf: n => WEAPON_ATTR[n], cost: (c, n, a, b) => karmaBetween(a, b) },
    sec:    { max: 3, get: (c, n) => num(c.secondary[n]), put: (x, n, v) => { x.secondary[n] = v; }, cap: (c, n) => secondaryCap(c, n),
              attrOf: n => SECONDARY_BY_NAME[n].attr, cost: (c, n, a, b) => secondaryCost(n, a, b) },
  };
  // Karma change for moving a level from → to: positive to raise, negative (a refund) to lower.
  const levelDelta = (c, kind, n, from, to) => { const L = LEVELS[kind]; return to >= from ? L.cost(c, n, from, to) : -L.cost(c, n, to, from); };

  function karmaSpent(c) {
    let attrs = 0, skills = 0, weapons = 0, secondary = 0;
    ATTRS.forEach(a => { attrs += attrCost(c, a.k, attrBase(c, a.k), attr(c, a.k)); });
    Object.keys(SKILLS).forEach(s => (skills += tri(sk(c, s))));
    WEAPON_TYPES.forEach(([w]) => (weapons += tri(num(c.weaponSkills[w]))));
    SECONDARY.forEach(s => (secondary += secondaryCost(s.name, 0, num(c.secondary[s.name]))));
    return { attrs, skills, weapons, secondary, total: attrs + skills + weapons + secondary };
  }

  // ---------- armor ----------
  function armorCastingRelief(c) {
    const am = sk(c, "Armor Mastery");

    if (am >= 7) return 2 * am;
    if (am >= 5) return am;

  }
  function armorCheck(c, a) {
    const t = ARMOR[a.type] || ARMOR.light;

    if (attr(c, "STR") < t.str) problems.push(`Needs Strength ${t.str}`);
    if (t.am && sk(c, "Armor Mastery") < t.am) problems.push(`Needs Armor Mastery ${t.am} for proficiency`);
    const av = num(a.av);
    if (av < t.av[0] || av > t.av[1]) problems.push(`${t.label} armor has an Armor Value of ${t.av[0]}–${t.av[1]}`);
    const soakBonus = sk(c, "Armor Mastery") >= 4 ? 3 * sk(c, "Armor Mastery") : 0;

  function armorPenalties(c) {
    const a = wornArmor(c);

    if (!a) return out;
    const av = num(a.av);
    out.casting = Math.max(0, 2 * av - armorCastingRelief(c));
    if (a.type === "medium") out.stealth = av;

    if (a.type === "heavy") out.entrada = 2 * av;
    if (a.type === "plate") { out.saves = av; out.travel = 2 * av; }

  }

  // Modifier (in %) for a primary skill, after armor penalties. Never below 0.
  // p: the character's armorPenalties, passed in when rendering many skills at once.
  function skillModifier(c, name, p = armorPenalties(c)) {
    const s = SKILLS[name]; let m = sk(c, name) * s.pct;

  function secondaryBonus(c, name, p = armorPenalties(c)) {

    const primLvl = s.primary ? sk(c, s.primary) : 0;
    const viaPrimary = s.primary && primLvl >= s.at;
    let bonus, source;
    if (lvl > 0 && viaPrimary) { bonus = 7 * lvl + 2 * primLvl; source = `${7 * lvl}% + 2×${s.primary}`; }
    else if (viaPrimary) { bonus = 3 * primLvl; source = `${s.primary} modifier`; }

  }

  // ---------- vitals ----------
  function vitalsMax(c) {

  function derived(c) {
    const max = vitalsMax(c);
    const v = c.vitals;
    // A stored value can sit above a maximum that has since dropped (lower Endurance, Exhaustion 7), so cap it.
    const fill = (k, m) => (v[k] == null ? m : clamp(num(v[k]), 0, m));
    const cur = { hp: fill("hp", max.hp), bp: fill("bp", max.bp), dp: fill("dp", max.dp), tox: Math.max(0, num(v.tox)) };
    const belly = sk(c, "Belly"), br = sk(c, "Bleed Resistance"), end = attr(c, "END");

    const enc = encumbrance(c);
    const baseMove = 10 + sk(c, "Tumble");
    const move = enc.tier.move == null ? 0 : Math.max(0, baseMove + enc.effectiveMove);
    let rationsPerMeal = 2;
    if (belly >= 3) rationsPerMeal = end <= 5 ? 5 : end <= 8 ? 6 : 7;
    return {
      max, cur,
      hpRegen: 2 + sk(c, "Metabolism"),
      bpRegen: 10 + 3 * br,
      cleanse: "1d6" + (Math.floor(belly / 2) ? ` + ${Math.floor(belly / 2)}d4` : ""),
      cleanseDice: { d6: 1, d4: Math.floor(belly / 2) },
      potency: Math.floor(br / 2) ? `${Math.floor(br / 2)}d10` : "—",
      woundAt: { light: 6 + woundBonus, moderate: 8 + woundBonus, mortal: 12 + woundBonus },
      bleedPerTurn: bleed,
      exhaustionFromBlood: bloodExhaustion(cur.bp),
      exhaustionFromHunger: hungerExhaustion(cur.dp),
      overToxic: cur.tox > max.tox,
      move, baseMove, climb: Math.floor(move / 2),
      mealsPerDay: sk(c, "Deprivation") >= 3 ? 2 : 3,
      rationsPerDay: (sk(c, "Deprivation") >= 3 ? 2 : 3) + c.prosthetics.length,
      rationsPerMeal,

  // ---------- encumbrance ----------
  function itemUnits(it) {
    const per = Math.max(1, num(it.per) || 1);
    const z = ITEM_SIZE[it.size] || ITEM_SIZE.small;
    return Math.ceil(num(it.qty) / Math.max(z.per, per)) * z.slots;
  }
  function encumbrance(c) {

    let load = 0;
    const lines = [];
    c.items.forEach(it => { const u = itemUnits(it); load += u; if (u) lines.push([it.name || "Item", u]); });   // everything listed is carried
    if (num(c.coins) > 0) { const u = Math.ceil(num(c.coins) / 100); load += u; lines.push(["Coins", u]); }
    // Weapons: the first sets ride free; shields always count as large; spares count by size.
    let setsUsed = 0;
    c.weapons.forEach(w => {
      if (w.where === "stash") return;
      if (w.shield || w.skill === "Shield") { load += 4; lines.push([w.name || "Shield", 4]); return; }
      const slots = num(w.hands) === 2 ? 1 : 0.5;
      if (w.where !== "pack" && setsUsed + slots <= freeSets) { setsUsed += slots; return; }
      const u = SIZES[w.size] || 2; load += u; lines.push([w.name || "Weapon", u]);
    });
    c.armor.forEach(a => {
      if (a.where === "stash") return;
      const u = a.type === "plate" ? 8 : a.type === "heavy" ? 4 : (a.worn ? 0 : 2);
      if (u) { load += u; lines.push([a.name || "Armor", u]); }
    });

    let idx = ENCUMBRANCE.findIndex(t => load <= t.mult * unit);
    if (idx === -1) idx = 4;
    const tier = ENCUMBRANCE[idx];

    const sb = sk(c, "Strong Back");
    const ignored = sb >= 9 ? 3 : sb >= 7 ? 2 : sb >= 5 ? 1 : 0;
    const penalised = idx > 0 && idx < 4 && idx <= ignored ? ENCUMBRANCE[0] : tier;
    return { unit, load, capacity: 3 * unit, limits: ENCUMBRANCE.map(t => t.mult * unit), tierIndex: idx, tier,

  }

  // ---------- weapons ----------
  function weaponLine(c, w) {
    const lvl = num(c.weaponSkills[w.skill]);
    const accuracy = lvl >= 3 ? lvl + sk(c, "Precision") + num(w.accuracy) : num(w.accuracy) < 0 ? num(w.accuracy) : 0;
    return { level: lvl, proficiency: proficiency(lvl), accuracy, crit: num(w.crit) };
  }

  // ---------- rests ----------
  function rollDie(sides) { return 1 + Math.floor(Math.random() * sides); }
  // Stamina stacks (Exhaustion levels): set both fields so the Tabletop sheet's two counters stay in step.
  function setStamina(c, n) { c.vitals.exhaustion = c.vitals.staminaLost = clamp(Math.round(num(n)), 0, 10); }
  // Uses spent on Active abilities and talents live in c.uses, keyed "p:<skill>:<level>" or "t:<talent id>".
  function useRecharge(c, key) {
    if (key.startsWith("t:")) { const t = (c.talents || []).find(x => "t:" + x.id === key); return t ? t.recharge || "" : ""; }
    const [, skill, lv] = key.split(":"); const sd = typeof SKILL_DATA !== "undefined" && SKILL_DATA.skills[skill];
    const pk = sd && sd.gs.flatMap(g => g.p).find(p => String(p.l) === lv);
    return pk && pk.u ? pk.u.recharge || "" : "";
  }
  function refreshUses(c, short) {
    const u = c.uses || {}; let n = 0;
    Object.keys(u).forEach(k => { if (num(u[k]) && (!short || useRecharge(c, k) === "Short rest")) { delete u[k]; n++; } });
    c.uses = u; return n;
  }
  function shortRest(c) {

    if (st !== num(v.exhaustion)) lines.push(`Stamina recovered (${num(v.exhaustion)} → ${st} lost)`); setStamina(c, st);
    if (refreshUses(c, true)) lines.push("Short-rest abilities recharged");

  }
  function longRest(c) {

    const bp = Math.min(d.max.bp, d.cur.bp + d.bpRegen); parts.push(`Blood +${bp - d.cur.bp}`); v.bp = bp;

    if (st !== num(v.exhaustion)) parts.push(`Stamina ${num(v.exhaustion)} → ${st} lost`); setStamina(c, st);

    return "Long rest: " + parts.join(" · ");
  }

  // The rulebook roll for one attribute: 3d8, set the lowest die aside, add the other two; never below 6.
  function rollAttributeDetail() {
    const dice = [rollDie(8), rollDie(8), rollDie(8)];
    const low = dice.indexOf(Math.min(...dice));
    const sum = dice.reduce((s, d, i) => (i === low ? s : s + d), 0);
    return { dice, low, sum, total: Math.max(6, sum) };
  }
  function rollAttribute() { return rollAttributeDetail().total; }
  // One line per attribute for the creation guide.
  const ATTR_BLURB = {
    STR: "Brute power. Carrying, lifting and most melee weapons.",
    DEX: "Nimbleness and speed. Stealth, thievery and most ranged weapons.",
    END: "Toughness. Hit points, hunger and how much punishment you can take.",
    MND: "Raw brain power. Learning, invention and critical thinking.",
    WIL: "Mental resolve. Shrugging off the mind's assaults and some schools of magic.",
    WIS: "Knowledge and patience. Fitting into the world and crafts that take learning.",
    PRS: "Force of personality. Leading, persuading and holding a room.",
  };

  // ---------- Powdertinkering (rulebook 2020.1, Crafting chapter 16.2) ----------
  // A munition is built in steps: the Coat first (always), then each Tip, the Area, the Core and each Status.

    { k: "sniper",   n: "Sniper ammo",       w: "Sniper Rifles", shape: "sniper",  a: [1, 1, 0, 1, 1], batch: 4, size: "ammo" },
    { k: "shotgun",  n: "Shotgun shells",    w: "Shotguns",      shape: "shell",   a: [1, 0, 0, 1, 1], batch: 4, size: "ammo" },
    { k: "heavy",    n: "Heavy weapon ammo", w: "Heavy",         shape: "heavy",   a: [1, 1, 1, 1, 1], batch: 4, size: "ammo" },
    { k: "stringed", n: "Arrows and bolts",  w: "Stringed",      shape: "arrow",   a: [1, 1, 0, 1, 1], batch: 4, size: "ammo" },

  const COATS = [["Piercing", "The default coat: the munition deals piercing damage."],

  const TIPS = [["Precise", true, "Attack rolls that fire it gain the Rating to their accuracy."],

  const ELEMENTS = ["Fire", "Cold", "Electric", "Poison", "Acid", "Radiant", "Necrotic"];

    ["Blinding Shot", "Radiant", "Blinded for Rating turns."],
    ["Hallowed Scar", "Radiant", "Outlined in a radiant glow, always visible. Attacks against it have advantage until resisted."],
    ["Arc", "Electric", "Creatures starting their turn within 1 m of the target take Rating electric damage."],
    ["Shocked", "Electric", "Recovers 1 less AP each turn until resisted."],
    ["Soul Sear", "Necrotic", "Can't use reactions or legendary actions other than the Resist action."],
    ["Decay", "Necrotic", "Can't regenerate hit points or use Active abilities."],
    ["Corrode", "Acid", "Natural armor unusable up to Rating damage; worn armor takes 2×Rating damage."],
    ["Dissolve", "Acid", "Weapons corroded: their damage drops by Rating/2 until the target spends 3 AP cleaning them."],
    ["Toxin", "Poison", "Rating/2 poison damage each turn until resisted."],
    ["Acrimony", "Poison", "Saving throws of one attribute (shooter's choice) drop by Rating until resisted."],

  const PT_GRAMS = 200;

  // What this character's Powdertinker level allows (perks Tinkerling → Master o' Munitions).
  function ptState(c) {
    const lvl = sk(c, "Powdertinker");

    const mod = skillModifier(c, "Powdertinker") + num(cr.bonus);

      lvl, mod, bonus: num(cr.bonus),

Attack action, if your attack hits, you may take a single 2m step for 0 AP. If doing so places a creature within your threatened area, that creature becomes a legal target for your additional Cleave attack(s) as long as it meets all the other prerequisites."},{"l":10,"t":"P","x":"Whenever you take the Cleave Attack action and reduce a targets hitpoints to 0 with said action, 2 AP. These AP can only be used to take the Cleave Attack action."}]}]},"Parry":{"d":"The skill for deflecting incoming blows to reduce damage. This skill grows your character in a defensive way. Although not protective as equipping a shield, this skill provides an effective way to defend yourself and is useful for every character that can hold a melee weapon.","r":["Requires melee weapons.","Increases your Parry modifier by 1% per SP."],"b":[{"title":"Parrying Attacks","lines":["You deflect an incoming attack to reduce damage.","Requires a weapon in hand.","Reduces incoming damage by half.","Only melee attacks can be parried.","If you have armor or resistance to the damage type, damage reduction from Parry is calculated first.","You cannot parry area of effects, attack has to be directed at you.","If the attack inflicts a status ailment you are still affected by the ailment."]}],"gs":[{"n":"Guard","f":"You try to defend yourself in a basic manner.","p":[{"l":3,"t":"P","x":"You gain the ability to parry attacks. This is considered a form of defending."},{"l":4,"t":"A","x":"You can choose to succeed a parry roll without rolling. Usage has to be declared before the Defend roll and after the enemy Attack roll.","u":{"recharge":"Long rest","ap":"1*","uses":"2"}}]},{"n":"Riposte","f":"Immediately after you parry you react with a counter-attack.","p":[{"l":5,"t":"A","x":"You can Riposte, immediately after you parry an attack. When you do you gain 2 AP. AP gained from this skill can only be used to take the Attack action. Attacks has to be taken with the weapon set used in parrying.","u":{"recharge":"Long rest","ap":"0*","uses":"2"}},{"l":6,"t":"P","x":"Your Guard ability can now be used after rolling your Parry dice."}]},{"n":"Bullet-Time","f":"Your reaction speed with your weapons are beginning to exceed human levels. You can deflect bullets and projectiles now.","p":[{"l":7,"t":"P","x":"You can Parry projectiles now. You cannot Riposte when you Parry projectiles. Parried explosives have a 50% chance of exploding."},{"l":8,"t":"P","x":"Taking the Defend action to Parry costs 1 AP less. Each consecutive Parry in the same round is subject to a +4% penalty."}]},{"n":"Leaf in the Wind","f":"Your forgo any form of offense and fully focus on defense. You enter a trance like state that greatly increases your reaction time and only retaliate when sustaining a hit.","p":[{"l":9,"t":"P","x":"Whenever you attempt to Parry an attack, if your roll is less than your Parry Modifier, and your parry succeeded, you can Riposte."},{"l":10,"t":"E","x":"You assume a defensive stance. Your Parry chance triples. You gain 2 AP less each turn. You cannot take the Attack action while under the effects of this Empowerment.","u":{"stamina":"2","ap":"3","turns":"5"}}]}]},"Armor Mastery":{"d":"The skill for using heavier types of armor effectively. Heavier types of armor require increasing amounts of familiarity to use effectively.","r":["Increases your Armor Mastery modifier by 3% per SP."],"tips":["Melee fighters without much use for casting can think about investing in this skill up to the third perk.","If you want to be a plate armored spell-slinging bad ass, invest away!."],"gs":[{"n":"Covered in Rings","f":"You are starting to learn how to use heavier sets of armor.","p":[{"l":3,"t":"P","x":"You gain proficiency in using Heavy Armors."},{"l":4,"t":"P","x":"Whenever you are wearing armor, the armors maximum Soak Pool increases by your Armor Mastery modifier."}]},{"n":"Covered in Plates","f":"Your competency in wearing armor allows you to wear plate armor now.","p":[{"l":5,"t":"P","x":"
