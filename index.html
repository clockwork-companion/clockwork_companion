ndividual's needs.","p":[{"l":5,"t":"P","x":"You gain the ability to Tune Armor to better fit a person. Choose 1 Tune Armor option from the Assist Options table. This choice cannot be changed."},{"l":6,"t":"P","x":"You can carve Runeslots onto pieces of armor now. Roll an Armor Maintenance check against DC 60. The DC gets harder by 20% per existing rune slot on the armor. Costs (10 x Armor repair cost) to attempt."}]},{"n":"Artisans Mark","f":"Your understanding of armor allows you to craft exquisite pieces of armor now.","p":[{"l":7,"t":"P","x":"You gain an additional use of Tune Armor per long rest. You can use Tune Armor on two unique armor sets at once or a single armor set twice. You cannot use the same Tune Armor option on the same set of armor twice."},{"l":8,"t":"P","x":"You can now craft Artisan properties onto armor. Refer to the Armor Maintenance rules under the Crafting section for a more detailed explanation."},{"l":9,"t":"P","x":"You can use Tune Armor on up to 5 sets of armor at once. You gain a stack of Exhaustion. This takes 3 hours to complete."}]},{"n":"Forge Master","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Weapon Maintenance":{"d":"The skill for creating, repairing and otherwise improving any type of weapon. This skill can used to improve both melee and ranged weapons.","r":["Increases your Weapon Maintenance modifier by 3% per SP."],"tips":["Uses 5d4 4d4 3d4 2d4 1d4"],"gs":[{"n":"Is that a dent?","f":"You learn how to repair and craft mundane weapons now.","p":[{"l":3,"t":"P","x":"You can now craft, repair and salvage mundane weapons. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation. You are knowledgeable in handling both ranged and melee weapons and use your Weapon Maintenance modifier to do so."},{"l":4,"t":"P","x":"You can now Runecarve onto weapons. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."}]},{"n":"Sharper than usual...","f":"You learn how to fine tune weapons to a persons specific needs.","p":[{"l":5,"t":"P","x":"You gain the ability to Tune Weapons to better fit the wielder. Refer to the Tune Weapons rules at the end of this skill for a more detailed explanation."},{"l":5,"t":"P","x":"You can now craft, repair and salvage weapons using Exotic Materials. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."},{"l":6,"t":"A","x":"You can elect to implement a property you failed in, in addition to the detriment.","u":{"recharge":"Long rest","uses":"1"}}]},{"n":"Man at Arms","f":"Your understanding of weaponry allows you to craft exquisite weapons now.","p":[{"l":7,"t":"P","x":"You can choose a second Weapon Property when crafting a weapon now. You can fail twice before the crafting process ends when making or improving a weapon."},{"l":8,"t":"P","x":"For Tuning weapons crafted by you, Uses of your tuning is always the maximum possible value."},{"l":9,"t":"P","x":"You can craft or rework existing weapons into Masterwork weapons now. Refer to the Weapon Maintenance rules under the Crafting section for a more detailed explanation."}]},{"n":"Artisans Mark","p":[{"l":10,"t":"P","x":"Anytime you tune a weapon you've crafted or masterworked and that tuning is used in combat, you gain 1 Artisans Mark for each use of that tuning."}]}]},"Brewing":{"d":"The skill for creating helpful potions. Allows the user to craft consumables that can cure, buff and strengthen party members in a variety of ways. These consumables are usually significantly cheaper to make than their vendor counterparts.","r":["Increases your Brewing modifier by 3% per SP.","Increases your known catalysts by 1 per 3 SP (4 at SP 10)."],"tips":["Your party needs this skill. Make someone get it. Listen to the tip box... Tip box is your friend...","Dont just craft healing potions, craft supportive potions as well.","Crafting combat support potions in the early SP levels will usually yield highly toxic potions. Craft off combat potions till your brewing is up to 5 or so."],"gs":[{"n":"A little more than Cooking","f":"Just like cooking! But with a few extra steps...","p":[{"l":3,"t":"P","x":"You can now brew potions. Refer to the Brewing rules under the Crafting section for a more detailed explanation."},{"l":4,"t":"P","x":"You become Proficient in Cooking. You can use your Brewing modifier in place of your Cooking modifier. If you are already proficient, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Something Wild, Something Glowy","f":"Adding volatile things to your brews had some nice effects apparently! At least sometimes...","p":[{"l":5,"t":"P","x":"You learn to use Catalysts for your brews. Refer to Catalysts table under the Crafting section for a more detailed explanation. You have knowledge in using 1 catalyst of your choosing."},{"l":5,"t":"P","x":"You can increment your brews to make them more potent now. Refer to Incrementing Brews under the Crafting section for a more detailed explanation."},{"l":6,"t":"P","x":"You can use extra materials to make the brewing process easier. Refer to Incrementing Brews under the Crafting section for a more detailed explanation."}]},{"n":"Multitasking with Herbs","f":"Your brews increase in potency further.","p":[{"l":7,"t":"P","x":"Your brews can now hold an additional effect. Refer to Potent Brew under the Crafting section for a more detailed explanation. Takes twice as long to brew The same effect can be stacked twice."},{"l":8,"t":"P","x":"You can adjust your brews to your specific needs now. Your brews can manifest their effects when consumed in smaller increments now."},{"l":9,"t":"P","x":"When calculating the toxicity of Potent Brews, you roll toxicity for both brews but only use the higher roll as opposed to the addition of the two."},{"l":9,"t":"P","x":"When crafting Potent brews, increments to one of the brews increments the other one as well."}]},{"n":"Bottled Miracle","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Powdertinker":{"d":"The skill for creating custom ammunition, weapon oils, explosives and other consumables. Allows the user to forge customized ammo for specific situations. These consumables are usually significantly more powerful than their run of the mill, vendor sold counterparts.","r":["Increases your Powdertinker modifier by 3% per SP."],"tips":["For a party that has a lot of fighters, this skill can be an amazing support skill that can boost the parties damage output significantly.","As a solo fighter this skill can increase your effectiveness and situational control in combat.","Can be costly to craft a lot of consumables, so watch out!"],"gs":[{"n":"Tinkerling","f":"Contrary to most scientists, you're starting to learn to make things explode when you want them to.","p":[{"l":3,"t":"P","x":"You become Proficient in Powdertinkering. Refer to the Powdertinkering rules under the Crafting section for a more detailed explanation. You can use custom Coats for munitions. You can fail once when making a munition."},{"l":4,"t":"P","x":"You can incorporate custom Cores and Tips into your munitions."}]},{"n":"Novice Tinker","f":"You're beginning to understand that there's more to ammunitions than simply large explosions. Your craft begins to gain depth.","p":[{"l":5,"t":"A","x":"You can elect to implement a property you failed in, in addition to the detriment.","u":{"recharge":"Long rest","ap":"2"}},{"l":6,"t":"P","x":"You can fail twice before the crafting process ends when making a munition."}]},{"n":"Expert Tinker","f":"Each one of your works are like perfectly designed gifts of pain and torment. Your craft is distinguishably well-made.","p":[{"l":7,"t":"P","x":"You can incorporate Status properties into your munitions. You can incorporate Area properties into your munitions."},{"l":8,"t":"P","x":"For each unused failure left after the crafting procedure, you produce an additional half-clip of munitions."}]},{"n":"Master o' Munitions","f":"Using your craft is almost like cheating - it becomes increasingly harder to fail in killing when utilizing your products.","p":[{"l":9,"t":"P","x":"You get an additional clip of munitions out of every crafting block."},{"l":10,"t":"A","x":"Ignore 1 detriment in a crafting procedure.","u":{"recharge":"Long rest","ap":"2"}}]}]},"Awareness":{"d":"The skill for the characters grasp on their surroundings, and how they might change at a moments notice.","r":["Increases your Awareness modifier by 3% per SP."],"gs":[{"n":"Observant","f":"You are, by nature perhaps, more attentive to details than most.","p":[{"l":3,"t":"P","x":"You become Proficient in Investigation. You can use your Awareness modifier for any Investigation roll. If you are already Proficient in Investigation, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"You become Proficient in Perception. You can use your Awareness modifier for any Perception roll. If you are already Proficient in Perception, refer to the Skill Bonuses section under Secondary Skills."}]},{"n":"Expectant","f":"You are becoming very good at detecting subtle hints around you, both in people and in your environment.","p":[{"l":5,"t":"P","x":"You become Proficient in Insight. You can use your Awareness modifier in place of your Insight modifier. If you are already Proficient in Insight, refer to the Skill Bonuses section under Secondary Skills."},{"l":6,"t":"P","x":"Any time you are surprised in combat, roll an Awareness check contested against a check made by the opponent as a part of its surprise round. s = You are no longer surprised. f = You are considered surprised."},{"l":6,"t":"P","x":"For secondary skills gained from this skill, taking the Skill Attempt action costs 1 AP less. For secondary skills gained from this skill, Skill Attempt action can be taken as a Reaction."}]},{"n":"Unblinded","f":"Your other senses allow you to get by without the use of sight most of the time.","p":[{"l":7,"t":"P","x":"Whenever a creature attempts to attack you with advantage, roll an Awareness check. Any time you are attacked with advantage, roll an Awareness check contested against the opponents attack roll. s = The opponents attack loses its advantage."},{"l":8,"t":"P","x":"Anytime you are blinded or deprived of sensory input in any way you can roll an Awareness check. s = You are considered not blinded. f = Blinded condition persists. In combat, the Awareness check will be rolled each turn. Out of combat, the Awareness check will be rolled per action named."},{"l":9,"t":"P","x":"You can sense hostile intent directed towards you. At the start of your turn in combat, you can ask the GM for any opponents that intend to attack you this round. At any time outside of combat, you can roll an Insight check to determine any hostile intent directed towards you."}]},{"n":"Future Sight","f":"Your awareness almost allows you to see into the near future.","p":[{"l":10,"t":"E","x":"While this Empowerment is active, after an enemy has played its turn, you can choose to take your turn as if the enemy has not yet played it up to three times. Doing so consumes a charge. The effect ends when all 3 charges are expended.","u":{"stamina":"2","ap":"2","turns":"10"}}]}]},"Medicine":{"d":"The skill for knowledge of anatomy and the human body, and how to cure it if the need arises.","r":["Increases your Medicine modifier by 3% per SP."],"tips":["This is a very useful support skill. A character with Medicine in a party will help tremendously with reducing potion costs and getting back into shape after a fight.","Few abilities exist in the rulebook that can prevent death in a combat scenario. This skill includes one of them. Keep that in mind while building your character. 61 to 80 Above 80 — — — — 1 — 1 — — — — — 6 4 2 1 2d10 2d8 2d6 2d4 5 4 3 2 5 4 3 2 1d10 1d8 1d6 1d4 2 2 1 1"],"gs":[{"n":"An apple a day...","f":"Your basic understanding in healing gives you certain benefits in physical injuries.","p":[{"l":3,"t":"P","x":"You become Proficient in First Aid. You can use your Medicine modifier in place of your First Aid modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"A","x":"Your next First Aid check gains advantage. You can decide to use this ability after failing a First Aid check.","u":{"recharge":"Long rest","ap":"1","uses":"2"}}]},{"n":"...keeps the doctor away!","f":"A little advice here, a little treatment there...","p":[{"l":5,"t":"P","x":"You gain the ability to Assist your allies. You can use any Assist option from the Assist Options table"},{"l":6,"t":"P","x":"You can always Assist yourself if you desire. Assisting yourself does not count toward the daily limit."}]},{"n":"The Doctor Is In","f":"Your knowledge in medicine allows you to delay certain death now. For a little while.","p":[{"l":7,"t":"A","x":"You can undo Exhaustion stacks gained from rolling death saving throws as long as it is not the last one. Roll a Medicine check against a DC of 30. If you succeed, 2 stacks of Exhaustion gained from failing death saving throws are undone. The DC gets harder for each target by 10% for each subsequent try, whether it be success or failure. This ability takes a turn to use.","u":{"ap":"4"}},{"l":8,"t":"P","x":"You can Assist two people at once or a single person twice now. You cannot use the same Assist type on the same person twice."}]},{"n":"Asclepius Reborn","f":"Your skill in healing rivals that of an entire team of doctors at this point.","p":[{"l":9,"t":"E","x":"You can Assist up to 5 people at once. This takes 3 hours to complete. You cannot Assist yourself after using this Empowerment.","u":{"stamina":"2"}},{"l":10,"t":"P","x":"TBD"}]}]},"Warding":{"d":"TBD.","r":["Increases your Warding modifier by 3% per SP.","Increases your Sigils per AP by 3 per SP."],"tips":["This is the closest thing to fantasy spell casting in the system probably.","Chaining the 3 Active Abilities pump the power of a Ward can result in devastating results.","For the Active of The First Epic, remember that adjectives are also Words of Power. It might come in handy when you want to inscribe a very very very big fireball."],"b":[{"title":"Warding in Combat","lines":["Warding Magic as presented is a very open ended system but requires a certain amount of book keeping and experimentation. As a player, try not to come up with very complex Wards on the spot. Instead try to come up with Ward sentences beforehand and experiment in combat."]}],"gs":[{"n":"The Mightier Pen","f":"In turns out, words DO have power.","p":[{"l":3,"t":"P","x":"You can inscribe Formulaic Wards. Refer to Formulaic Wards for a detailed explanation. You can only use Warding out of combat."},{"l":4,"t":"P","x":"You can inscribe Ritual Wards. Refer to Ritual Wards for a detailed explanation."}]},{"n":"Works of a Writer","f":"After all the reading, a question comes to you: \"Can I write my own?\".","p":[{"l":5,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, you can use 2xSigils per AP, but you accumulate 2x Fatigue.","u":{"ap":"0","uses":"3"}},{"l":5,"t":"P","x":"You can inscribe Spontaneous Wards and use Words of Power. Refer to Spontaneous Wards and Words of Power for a detailed explanation."},{"l":6,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, you accumulate no Fatigue.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"P","x":"When inscribing Wards, you can repeat the same Adjective multiple times, amplifying the effect."}]},{"n":"The First Epic","f":"Your skill in Warding grows as does your vocabulary.","p":[{"l":7,"t":"A","x":"Next time you inscribe a Ward that is not a Ritual Ward, up to 3 Words of Power of your choosing costs 1 Sigil to inscribe.","u":{"recharge":"Long rest","ap":"1","uses":"3"}},{"l":7,"t":"P","x":"When inscribing Wards, you can use Conjunctions to create more complex Wards."},{"l":8,"t":"P","x":"You can inscribe Wards as reactions."}]},{"n":"Shade of Erebus","f":"Sigils fly from your fingers, altering reality, bending fate.","p":[{"l":9,"t":"P","x":"When inscribing Wards, Adverbs cost 1 Sigil less. When inscribing Wards, Subjects cost 3 Sigils less."},{"l":10,"t":"P","x":"TBD"}]}]},"Sangromancy":{"d":"Sangromancy is the manipulation of blood.... TBD.","r":["Increases your Sangromancy modifier by 3% per SP.","Increases the amount of blood manipulations you can sustain by 1 per 2 SP."],"gs":[{"n":"aa","f":"TBD","p":[{"l":3,"t":"P","x":"You can can control your blood and direct it against a single target. You can only direct your blood to inflict curses. These Curses are explained in the curses section of Sangromancy."}]},{"n":"Bloodletting","f":"TBD","p":[{"l":5,"t":"P","x":"You can control your blood against multiple targets now. You can shape and forge your blood into creations now. These Creations are explained in the creations section of Sangromancy."}]},{"n":"cc","f":"TBD","p":[{"l":7,"t":"P","x":"Your curses no longer requires verbal components. Only somatic gestures. You can shape and forge your blood into constructs now. These Constructs are explained in the constructs section of Sangromancy. You can use any source of blood to fuel your incantations. You cannot bend the blood within a living body. Using stale blood that was drawn further back than an hour results in doubling the cost of any incantation in terms of BP required."}]},{"n":"dd","f":"TBD","p":[{"l":10,"t":"P","x":"Your incantations and creations no longer have any upkeep costs to maintain."}]}]},"Dreamwalking":{"d":"There are few places more dangerous for the waking soul to be than the realm of the dream.","r":["Increases your Dreamwalking modifier by 3% per SP."],"tips":["Dreamrealm is a dangerous place. Do not take it lightly, as you can easily die there.","Dreamwalking is more of a supportive skill until you invest a considerable amount of points into it. The combat potential start to come into play with the dreamsphere."],"gs":[{"n":"Close your eyes","f":"In the place you travel every night, you've found a whole new world.","p":[{"l":3,"t":"P","x":"You can enter the dream realm at will now. You have to be asleep to do this. Roll a dreamwalking check, depending on your characters physical condition, GM will decide on a difficulty. On a success you enter the dream realm on a failure you simply fall asleep. On a very high failure however you enter the realm with a calamity."},{"l":4,"t":"P","x":"You gain the ability to transpose objects. Refer to Transposition for a detailed explanation."}]},{"n":"Bring me a dream!","f":"The dreams come easily to you know.","p":[{"l":5,"t":"A","x":"You can send items to the dream realm at will now. Anytime you want to do this roll a dreamwalking check. If the check succeeds, you send the item successfully, if the check fails, the item disappears till your next long rest. Each item put inside the realm increases the toll of the user depending on the size of the object. Only works on inanimate objects that you are touching and can lift. All items will return to the material plane if the user does not renew the binding each day which is done by a rolling a dreamwalking roll and succeeding. Doing this takes 3 minutes of concentrating.","u":{"ap":"1"}},{"l":5,"t":"P","x":"You gain the ability to translocate objects. Refer to Translocation for a detailed explanation."},{"l":6,"t":"A","x":"You next roll that relies on observation (Perception, Insight, Investigation) gains advantage. Increases toll till the next long rest by 5%.","u":{"recharge":"Long rest","ap":"1","uses":"2"}},{"l":6,"t":"P","x":"Entering the dream realm no longer requires a dreamwalking check and always succeeds as long as you can fall asleep. You can enter the dream realm while performing a mundane task that does not require active mental contribution. (walking, riding a horse etc.) Doing this increases the toll by 15% for the duration of the visit to the dream realm."}]},{"n":"Awakened Dreamer","f":"You have gained the ability to manifest a part of the dreamrealm for a short time.","p":[{"l":7,"t":"A","x":"You gain the ability to create Dreamspheres in the waking world. Refer to Dreamspheres for a detailed explanation.","u":{"recharge":"Long rest","ap":"2","uses":"3"}},{"l":7,"t":"P","x":"You gain the ability to Transfigure objects. Refer to Transfiguration for a detailed explanation."},{"l":8,"t":"P","x":"You gain the ability to pull other willing people into the dream realm now. Roll a dreamwalking check with the added toll from the travelers joining you, if you succeed you and the travelers enter the dream realm. Once inside the dream realm, all travelers make their own separate checks and are independent of you. You can take as many travelers with you as you wish. All travelers have to be within 20 meters of the dreamwalker and within dreamwalkers sight. Increases the toll by 8% per traveler for the duration of the visit to the dream realm."}]},{"n":"Morpheus beckons","f":"The realm you have mastered now follows you to the waking world. To help you bend it to your will.","p":[{"l":9,"t":"P","x":"Creating a Dreamsphere now costs 1 less AP. You can delay the creation of dreamspheres by up to a minute after you have declared your intent to create one."},{"l":10,"t":"P","x":"You gain the ability to create and manipulate Dreamseeds. Refer to Dreamseeds for a detailed explanation."}]}]},"Occult: Harmony":{"d":"Skill for controlling the flow of your bodies spiritual energy trough the mastery of chakras. Represents a characters mastery over this spiritual energy and provides ways of manipulating it to the characters benefit.","r":["You learn harmonic elements at skill levels 5,7 and 10 in addition to the one you gain at perk level 3."],"gs":[{"n":"Beyond Meditation","f":"Your studies into meditation and body strengthening techniques are leading to interesting results.","p":[{"l":3,"t":"P","x":"You gain the ability to reinforce the Opening chakra. You can only reinforce chakras with elements that you know."},{"l":3,"t":"P","x":"You gain knowledge in 1 harmonic element from the Harmonic Elements table. Once chosen, this choice becomes permanent and cannot be changed. This allows you to reinforce your chakra points with the chosen element. You gain additional harmonic elements as you level, detailed in the Rules section."},{"l":4,"t":"P","x":"You gain the ability to reinforce the Life chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Gates to the Subtle Body","f":"You discover more chakras in your body and learn to push your body even further.","p":[{"l":5,"t":"P","x":"You gain the ability to reinforce the Pain chakra. You can only reinforce chakras with elements that you know."},{"l":5,"t":"A","x":"You can change the Reinforcement on a Chakra of your choice.","u":{"recharge":"Long rest","ap":"2","uses":"3"}},{"l":6,"t":"P","x":"You gain the ability to reinforce the Healing chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Limits of Mortal Coil","f":"Your mastery over the chakras pushes you beyond the limits of what the human body is capable of.","p":[{"l":7,"t":"P","x":"You gain the ability to reinforce the Limit chakra. You can only reinforce chakras with elements that you know."},{"l":7,"t":"E","x":"You gain the ability to Release your chakra points. Refer to Releasing Chakras for a detailed explanation.","u":{"stamina":"*","ap":"0"}},{"l":8,"t":"P","x":"You gain the ability to reinforce the Wonder chakra. You can only reinforce chakras with elements that you know."},{"l":9,"t":"P","x":"You gain the ability to reinforce the View chakra. You can only reinforce chakras with elements that you know."}]},{"n":"Master of the Subtle Body","f":"You gain complete mastery over your chakra points. To the points that you can ward of death till the very end.","p":[{"l":10,"t":"P","x":"You gain the ability to reinforce the Death and chakra. You can only reinforce chakras with elements that you know."},{"l":10,"t":"E","x":"You can change the reinforcements on all your chakras. Takes 1 minute of meditation to complete.","u":{"stamina":"2"}}]}]},"Hunting":{"d":"Skill for salvaging monster corpses for trophies that gives beneficial effects to the user, also represents general efficiency in dispatching monsters. Some explanations about hunters, the hunting skill and the nature of trophies is explained below. A Hunters Guide to Trophies! What a trophy is and what it does is explained below.","r":["Increases your Hunting modifier by 3% per SP.","Increases the maximum level of trophy you can use by 1 per SP starting at skill level 4.","You gain knowledge in 1 additional mythology per SP starting at level 3."],"tips":["For any group that runs into the supernatural frequently, having a hunter around can make things a lot easier.","Hunters excel with a lot of preparation. You need to know what you will be fighting against. Acquiring trophies and looking for potential weaknesses to exploit in anything you are hunting is crucial."],"b":[{"title":"Okay! I killed a monster! What now?","lines":["Here is a short list of steps to get your hands on your fresh new trophy!","First ask your GM about the level of the trophy. Got it? Great! Lets say it is a level 3 chimera trophy. This means the trophy will have 6 properties.","Now roll a Hunting check and look at the Salvaging Roll table to see what you got. Let's say you rolled a final result of -14. Okay the table says 6 positive attributes. Well a trophy can't have all positive attributes so we have 5 positive attributes.","Okay now time to see if the last one is negative or void. Just roll a Hunting check. Lets say the final result was 62. Well the last attribute is negative.","You got a great level 3 trophy with 5 positive and 1 negative attribute!","Last and most important step! Relentlessly harass your GM for the trophy card! If you would have rolled -32 result would be the same because level 3 trophy. If you would have rolled 53 you would have 1 negative and would roll 5 times for the rest of the attributes to see for void or negative."]}],"gs":[{"n":"A Taste of the Unknown","f":"You start to pierce the veil. All that dwells in child stories and folk tales are real it seems... and someone needs to take care of them.","p":[{"l":3,"t":"P","x":"You gain proficiency in using trophies. You can only attune level 1 trophies. Level 2 to 5 trophies cannot be activated by a novice hunter."},{"l":3,"t":"P","x":"You gain knowledge in a Mythology of your choice. For any Lore check rolled recall information regarding this Mythology, you use your Hunting modifier as the bonus instead. You gain additional mythologies as you level, detailed in the Rules section."},{"l":4,"t":"P","x":"You gain proficiency in salvaging trophies. Refer to Salvaging Trophies section for a detailed explanation."}]},{"n":"Hunt for the Living!","f":"Apparently the things that looked so invincible can be killed with the right knowledge!","p":[{"l":5,"t":"E","x":"You have learned to Release trophies. Releasing a trophy doubles its numerical values. The trophy being released needs to be attuned and belted.","u":{"stamina":"1","ap":"1","turns":"3"}},{"l":6,"t":"E","x":"You have learned to attune more trophies than 1. You can attune 1 more trophy in addition to your already attuned one. Both trophies need to be belted. One of the trophies needs to be attuned.","u":{"stamina":"1","ap":"1","turns":"3"}}]},{"n":"Hunt for the Dead!","f":"These creatures are a disease upon the world and you are the cure. Whether it be cauterizing it, amputating it or killing it outright, you seem hellbent on ridding the world of this plague.","p":[{"l":7,"t":"P","x":"You become a renowned hunter. Your reputation and your kills are heard by other hunters of the land. You also earn a title appropriate to your personality or perhaps fighting style. The title is determined by the GM. You have an easier time talking to other hunters, they respect and fear you. You have an easier time finding employment. There may even be personal summons from nobility."},{"l":7,"t":"P","x":"You gain proficiency in combining trophies. Refer to Combining Trophies section for a detailed explanation."},{"l":8,"t":"P","x":"When combining trophies, you can ignore a single hunting roll and try again. This does not burn the giver trophy and does not affect the recipient trophy. This can only occur 1 times per giver trophy. This triples the cost of combination for that combination attempt."},{"l":9,"t":"P","x":"Active abilities acquired from this skill can be used simultaneously with each other. Active abilities acquired from this skill consume 1 less AP."}]},{"n":"What do the Monsters Fear?","f":"You literally become the thing monsters scare their pups with. You are a legend among man and monster alike.","p":[{"l":10,"t":"P","x":"Your aura is death to whoever you approach with killing intent. You are literally what the monsters are afraid of. Any creature you state a killing intent against has to make a Wisdom saving throw contested against a Presence check you roll. s = The creature is immune to your fear effect for 24 hours. f = The creature is Frightened of you. If you own a trophy on your belt against the creature, you are trying to frighten the monster has disadvantage on its Wisdom saving throw. If the trophy against the monster is active, you have advantage on your Presence check."},{"l":10,"t":"P","x":"When fighting a creature, if you have a trophy against the monster and it is active, you gain a Legendary Action each round. The Legendary Action can be taken after the creatures turn. The Legendary Action is worth 2 AP. The Legendary Action can be used to take the attack action even if you've attacked this turn."}]}]},"Taming":{"d":"Skill for taming animal companions to be used in combat and other functions. Further investment in the skill turns the animal companion into a formidable supernatural creature in its own right. Animal Companions TBD","r":["Increases your Taming modifier by 3% per SP."],"gs":[{"n":"Wild Touch","f":"TBD","p":[{"l":3,"t":"P","x":"You gain proficiency in Animal Handling. You can use your Taming modifier in place of your Animal Handling modifier. If you are already proficient your skill bonus increases by your SP. You gain the ability to bond with an animal to create an animal companion. Read the rules on Animal Companions above. You can only bond with animals of size small or below."}]},{"n":"Hearth of the Phoenix","f":"TBD","p":[{"l":5,"t":"M","x":"You learn how to create a Beast-Hearth. Read the rules on Beast-Hearth above. You gain proficiency in Riding. You can use your Taming modifier in place of your Riding modifier. If you are already proficient your skill bonus increases by your SP. You can bond with animals of size medium or below. Your animal companion reaches size medium at this point."}]},{"n":"Beast Whisperer","f":"TBD","p":[{"l":7,"t":"P","x":"You can talk with your animal companion now. You can bond with animals of size large or below. Your animal companion reaches size large at this point."}]},{"n":"TBD","f":"TBD","p":[{"l":10,"t":"P","x":"TBD"}]}]},"Leadership":{"d":"Skill for instilling confidence and boosting morale of an adventuring group. Allows the user to guide his fellows in a variety of ways.","r":["Increases your Leadership modifier by 3% per SP."],"b":[{"title":"Auras","lines":["Auras are the collective name given to the inspiration those around you feel by your leadership ability. Mechanically auras are bound by the following rules:","Auras can give 1 type of beneficial bonus at any one time.","Bonus bestowed is equal to half the leaders modifier in that skill.","Auras bonus cannot be higher than the leaders Leadership modifier.","Type of bonus given by an aura can be changed with a short rest.","A creature requires line of sight to the leader to be able to benefit from the aura.","A creature can only benefit from a the aura of a single leader at any one time.","An aura lasts only 1 round. The leader can extend the auras duration for 1 more round for 1 AP each turn.","You cannot provide an aura on a skill you're not proficient at."]}],"gs":[{"n":"Leader of the Pack","f":"You begin to guide and lead your subjects. It seems to be working...","p":[{"l":3,"t":"P","x":"You become Proficient in Persuasion. You can use your Leadership modifier in place of your Persuasion modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"P","x":"You gain the ability to cast beneficial auras. Refer to the Auras section for a detailed explanation."}]},{"n":"To Guide the Flock","f":"Your leadership ability not only benefits your subjects but also your allies around you.","p":[{"l":5,"t":"A","x":"You can change your auras effect to another one of your choosing.","u":{"recharge":"Long rest","ap":"1*","uses":"3"}},{"l":6,"t":"P","x":"You learn the Command: Bolster action. You learn the Command: Move action. Refer to Actions in Combat for a detailed explanation."}]},{"n":"Shot-Caller","f":"Those under your command seems to inherently trust you.","p":[{"l":7,"t":"P","x":"You learn the Command: Retaliate action. You learn the Command: Warn action. Refer to Actions in Combat for a detailed explanation."},{"l":8,"t":"A","x":"Taking a Command action affects all eligible targets of your choosing instead of one target.","u":{"recharge":"Long rest","ap":"1","uses":"3"}}]},{"n":"Polaris","f":"You power in guiding those around you is unmatched.","p":[{"l":9,"t":"P","x":"Command: Bolster action bestows 1 more AP. AP cost of sustaining auras is reduced by 1. Your auras now effect you."},{"l":9,"t":"P","x":"Your can sustain 2 auras simultaneously now. Only 1 of these auras are affected by the active abilities and empowerments of this skill."},{"l":10,"t":"E","x":"Anyone effected by an aura cast by you, gains advantage on its rolls for the skill that the aura provides the bonus for. The affected creature can choose to benefit from the auras bonus or the advantage. You cannot benefit from the auras bonus and the advantage at the same time.","u":{"stamina":"1","ap":"2","turns":"3"}}]}]},"Perform":{"d":"Represents a characters extra ordinary ability in certain fields. A skill the character mastered so profoundly that each usage of this skill creates a performance. So much so that she can inspire people around her.","r":["Increases your Perform modifier by 3% per SP.","Increases the Perform bonus to your chosen skills by 1% per SP.","Increases the Inspiration bonus you can give by 1d6% per 2 SP.","Increases the number of times you can Inspire or Demoralize per short rest by 1 per 2 SP.","You gain an inspired skill at skill levels 5,7 and 10 in addition to the one you gained at perk level 3."],"tips":["For a vertical character investing in some points will be very useful to get a little extra bonus to your vertical skills.","This is also a very useful support skill to help allies in combat.","For supporter characters choosing this skill, picking at least 1 inspired skill to be an easily usable one would be advisable. This way you can use it in any setting without raising suspicion. Like a musical instrument."],"gs":[{"n":"Master","f":"Your usages of your chosen profession is efficient as well as beautiful.","p":[{"l":3,"t":"P","x":"You become Proficient in Deception. You can use your Perform modifier in place of your Deception modifier. If you are already Proficient, refer to the Skill Bonuses section under Secondary Skills."},{"l":4,"t":"A","x":"One of your known skills permanently becomes an inspired skill. Choose a skill, weapon skill or a secondary skill. Any time you roll a check using the inspired skill, you can add your Perform bonus to skill checks done with this skill. You gain additional inspired skills as you level, detailed in the Rules section.","u":{"recharge":"Short rest","ap":"1","uses":"3"}}]},{"n":"Adept","f":"You have devoted such effort to the perfection of your chosen skills that seeing you use them inspires people around you.","p":[{"l":5,"t":"A","x":"Any time you use an inspired skill, you can also inspire an ally. Name an ally before using an inspired skill, if the skill is successful, your ally gains an Inspiration. For the next hour, your ally can use this Inspiration to add your Inspiration bonus to any of his or her skill checks.","u":{"ap":"1"}},{"l":6,"t":"P","x":"Whenever an inspired skill suffers disadvantage, you can expand a use of your Master ability to negate this disadvantage. Allies you have inspired can use their inspiration to negate a disadvantaged roll in place of benefiting from your inspiration bonus."}]},{"n":"Ingenious","f":"Your level in certain skills now instills fear in your enemies.","p":[{"l":7,"t":"A","x":"Any time you use one of your inspired skills, you can also demoralize an enemy. Name an enemy before using one of your inspired skills, if your skill is successful, your enemy is demoralized. The next time this enemy rolls a skill check, subtract your Inspiration bonus from the check.","u":{"ap":"1"}},{"l":8,"t":"P","x":"Your Perform bonus applies to your inspired skills permanently now. Using the Master ability doubles this bonus for your next roll."}]},{"n":"Virtuoso","f":"Your mastery in your chosen skills is the stuff of legends. Songs will be written to your abilities long after your times.","p":[{"l":9,"t":"P","x":"Demoralize lasts for a round on enemies now as opposed to a single roll. Roll your Inspiration bonus once per round. Every enemy affected by your demoralize suffers this penalty."},{"l":10,"t":"E","x":"Any time you inspire or demoralize, you can use it as an area of effect instead. Doing so demoralizes every enemy and inspires every ally that can perceive your performance.","u":{"stamina":"1","ap":"2"}}]}]},"Runecrafting":{"d":"Almost every mythology throughout history has various charms, totems, trinkets and other objects of power to help their believers in a variety of ways. Providing protection, increasing and boosting different aspects of the body, aiding in divinations are some examples. Runecrafting is the collective name given to the skill for creating these objects of power. Runestones Runestones are the name given to the objects of power created using runecrafting. These object do not necessarily have to be created using the Scandinavian runic alphabet and can be created using any of the rituals that can be found in different mythologies throughout the world.","r":["Increases your Runecrafting modifier by 3% per SP."],"gs":[{"n":"Interest in Jewelry","f":"Who thought your interest in jewelry could be helpful?","p":[{"l":3,"t":"P","x":"You gain the ability to identify the enchantments on runestones you've found. Identifying process takes an hour to complete."},{"l":4,"t":"P","x":"You become proficient in enchanting gems into runestones. You can only enchant semi-precious gems. Refer to the Runestones headline under the Crafting section for a more detailed explanation."}]},{"n":"Over-Accessorize","f":"You now have a perfectly justified reason to chase after shiny things. Hurray!","p":[{"l":5,"t":"P","x":"You can also enchant precious gem stones now."},{"l":5,"t":"P","x":"You can now use extra materials during enchanting to gain a bonus to your Runecrafting modifier. For each extra 50 rubles you spend in materials, your Runecrafting modifier is increased by 1% for your enchanting attempt. Cannot be used for Hoaxstones."},{"l":6,"t":"P","x":"You gain the ability to create temporary runestones, called Hoaxstones, to use in a state of emergency. Refer to Hoaxstones under the Crafting section for a more detailed explanation."}]},{"n":"Stones of Power","f":"Each jewelry is a weapon on its own.","p":[{"l":7,"t":"P","x":"Your runestones can now hold an additional effect. Refer to Potent Runestones under the Crafting section for a more detailed explanation. Requires 2x time to enchant. 2 of the same effect can be stacked."},{"l":8,"t":"P","x":"Whenever you are enchanting and roll a runecrafting check for it, you can roll it again if you are dissatisfied with the result. The materials used in the enchanting are lost and needs to be replaced for the second attempt. This effect can only happen once for a gemstone. You have to use the second result if you roll it."},{"l":9,"t":"P","x":"You can now extract runes from items without ruining the item or the rune."}]},{"n":"Rune Sage","f":"Holding a stone you enchant can turn a peasant into a warrior.","p":[{"l":10,"t":"P","x":"You can move enchantments between runestones."},{"l":10,"t":"P","x":"You can merge 2 runestones into a Potent Runestone."}]}]}},"secondary":{"Appraisal":"Lets a character work out what invested items do. Each successful roll reveals one magical property of the item. An item can be appraised twice; after that each attempt costs materials for extra tools.","Prosthetic Operation":"Lets a character replace their limbs with prosthetics. Each level allows the use of one prosthetic.","Cooking":"Turns regular rations into cooked rations, 5 at a time, one hour per batch. A better roll spends fewer rations for the same 5 cooked ones. Cooked rations expire at the next long rest.","Foraging":"Gathers food, brewing herbs, medical supplies, powdertinker supplies or repair materials in the wild against the area's Foraging DC. Each further 10% on the roll yields the amount again."}};

  "Hunting": [
    { title: "Salvaging Roll", cols: ["Roll", "Trophy properties"], rows: [

      ["31 – 50", "1 positive attribute"], ["21 – 30", "2 positive attributes"], ["11 – 20", "3 positive attributes"], ["1 – 10", "4 positive attributes"],

    { title: "Combining Roll", cols: ["Roll", "Receiver trophy properties"], rows: [
      ["80 or above", "Failure to transfer attribute"], ["below 80", "No positive attributes"], ["below 60", "1 positive attribute"], ["below 50", "2 positive attributes"],
      ["below 30", "3 positive attributes"], ["below 20", "4 positive attributes"], ["below 10", "5 positive attributes"], ["below 0", "6 positive attributes"],

<script>
const { h, render } = preact;
const { useState, useEffect, useMemo, useRef } = preactHooks;
const html = htm.bind(h);
const R = CW;
const num = R.num;
// Characters arrive as plain stored objects. Normalising and deriving them is cached per object,
// so a character is only re-computed when it actually changes (every edit produces a new object).
const normCache = new WeakMap(), derivedCache = new WeakMap();
const norm = c => { let n = normCache.get(c); if (!n) { n = R.normalize(c); normCache.set(c, n); normCache.set(n, n); } return n; };
const derive = c => { const n = norm(c); let d = derivedCache.get(n); if (!d) { d = R.derived(n); derivedCache.set(n, d); } return d; };
// Prepend a line to a character's log (newest first, 40 kept).
const addLog = (x, m) => { x.log = [{ t: Date.now(), m }, ...(x.log || [])].slice(0, 40); };

/* ================= storage ================= */
// Shared characters live in the artifact's database ("characters" collection).
// Without it (signed out, preview) the page falls back to this browser only.
const use = name => (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null));
const LS_KEY = "cw-companion-chars";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const rid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = o => JSON.parse(JSON.stringify(o));

const Store = {
  mode: "loading", db: null, table: null, members: [], uid: null, assets: null, downloads: null, readOnly: false,
  listeners: new Set(), chars: {}, encounter: null,
  emit() { this.listeners.forEach(f => f(this)); },
  async init() {
    // On claude.ai the runtime answers within seconds; on the website it waits for the table password, so no timeout.
    const fallback = window.CW_WEB ? null : setTimeout(() => { if (this.mode === "loading") this.goLocal(); }, 11000);
    window.addEventListener("cw-portraits", () => this.emit());
    const [db, user] = await Promise.all([use("db"), use("user")]);
    clearTimeout(fallback);
    if (!db) { this.goLocal(); return; }
    this.db = db; this.mode = "live";
    try { this.uid = user ? await user.id() : null; } catch {}
    try { const can = user ? await user.can("data.write") : null; if (can === false) this.readOnly = true; } catch {}
    db.collection("characters").onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { next[d.id] = Object.assign({}, d.data(), { id: d.id }); });
      this.chars = next; this.emit();
    }, err => { this.error = err && err.code; this.emit(); });
    db.doc("encounters/current").onSnapshot(snap => {
      // ignore echoes older than what this page already shows
      const e = snap.exists ? snap.data() : null;
      if (!this.encounter || !e || (e.t || 0) >= (this.encounter.t || 0)) { this.encounter = e; this.emit(); }
    }, () => {});
    this.emit();
    use("assets").then(a => { this.assets = a; this.emit(); });
    // On the website: who is signed in and their role. GMs also get the list of everyone at the table.
    use("table").then(t => { if (!t) return; this.table = t; if (t.role === "gm") t.members(ms => { this.members = ms; this.emit(); }); this.emit(); });
    use("downloads").then(d => { this.downloads = d; this.emit(); });
  },
  goLocal() { this.mode = "local"; this.chars = lsGet(LS_KEY, {}); this.encounter = lsGet("cw-encounter", null); this.emit(); },
  encQueue: Promise.resolve(),
  saveEncounter(e) {
    e = clean(e); e.t = Date.now(); this.encounter = e; this.emit();
    if (this.mode !== "live") { lsSet("cw-encounter", e); return; }
    this.encQueue = this.encQueue.then(() => this.db.doc("encounters/current").set(e)).catch(err => {
      toast(err && err.code === "invalid_argument" ? "You can watch the initiative deck but not change it." : "Couldn't save the initiative deck just now. Try that again.");
    });
  },
  queues: {}, timers: {},
  save(c, delay = 650) {
    clearTimeout(this.timers[c.id]);
    this.timers[c.id] = setTimeout(() => this.flush(c), delay);
  },
  flush(c) {
    const body = clean(c); delete body.id;
    if (this.mode !== "live") { this.chars = Object.assign({}, this.chars, { [c.id]: Object.assign(body, { id: c.id }) }); lsSet(LS_KEY, this.chars); this.emit(); return Promise.resolve(); }
    const prev = this.queues[c.id] || Promise.resolve();
    const p = prev.then(() => this.db.doc("characters/" + c.id).set(body)).catch(e => {
      if (e && e.code === "invalid_argument") { this.readOnly = true; toast("You can view these characters but not change them. Ask the owner to invite you as an Editor."); }
      else if (e && e.code === "quota_exceeded") toast("The character store is full. Delete an old character to make room.");
      else toast("Couldn't save just now. Your change will retry on the next edit.");
      this.emit();
    });
    this.queues[c.id] = p; return p;
  },
  async remove(id) {
    if (this.mode !== "live") { const n = Object.assign({}, this.chars); delete n[id]; this.chars = n; lsSet(LS_KEY, n); this.emit(); return; }
    await this.db.doc("characters/" + id).delete();
  },
};

// GMs (and everyone on claude.ai, where there are no roles) see every character and the GM table.
const isGM = () => !Store.table || Store.table.role === "gm";
const playersOf = c => (Array.isArray(c.players) ? c.players : []);
// Characters in roster order: alphabetical, each followed by its companions.
function rosterOrder(chars) {
  const byName = (a, b) => (a.name || "").localeCompare(b.name || "");
  const ids = new Set(chars.map(c => c.id));
  const tops = chars.filter(c => !c.companionOf || !ids.has(c.companionOf)).sort(byName);
  return tops.flatMap(t => [t, ...chars.filter(c => c.companionOf === t.id).sort(byName)]);
}

/* ================= toast ================= */
let toastFn = () => {};
const toast = msg => toastFn(msg);
function Toaster() {
  const [msg, setMsg] = useState(""); const t = useRef();
  toastFn = m => { setMsg(m); clearTimeout(t.current); t.current = setTimeout(() => setMsg(""), 3400); };
  return msg ? html`<div class="toast" role="status">${msg}</div>` : null;
}

/* ================= hover card ================= */
// A small floating card that explains what clicking a pip or cell would do, and what it costs.
let tipSet = () => {};
const tip = {
  show(el, content) { if (!content) return; tipSet({ r: el.getBoundingClientRect(), content }); },
  hide() { tipSet(null); },
};
function HoverCard() {
  const [t, setT] = useState(null);
  tipSet = setT;
  useEffect(() => { const h = () => setT(null); window.addEventListener("scroll", h, true); return () => window.removeEventListener("scroll", h, true); }, []);
  if (!t) return null;
  const { r, content } = t;
  const below = r.top < 110;
  const left = Math.max(130, Math.min(window.innerWidth - 130, r.left + r.width / 2));
  return html`<div class=${"hovercard " + (content.tone || "")} role="tooltip"
    style=${`left:${left}px;top:${below ? r.bottom + 10 : r.top - 10}px;transform:translate(-50%, ${below ? "0" : "-100%"})`}>
    <b>${content.title}</b>${(content.lines || []).filter(Boolean).map(l => html`<span>${l}</span>`)}</div>`;
}
// A tiny mouse with the left or right button lit, used in the hover card.
const Mouse = ({ side }) => html`<svg class="mouse" viewBox="0 0 14 20" aria-hidden="true">
  <rect x="1" y="1" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="7" y1="1.5" x2="7" y2="8" stroke="currentColor" stroke-width="1.2"/><line x1="1.5" y1="8" x2="12.5" y2="8" stroke="currentColor" stroke-width="1.2"/>
  <path d=${side === "R" ? "M7.6 2 a5.4 5.4 0 0 1 4.8 5.4 v0.6 h-4.8 z" : "M6.4 2 a5.4 5.4 0 0 0 -4.8 5.4 v0.6 h4.8 z"} fill="var(--brass)"/></svg>`;
// What changing a level would mean: cost or refund, and whether it is allowed.
// raiseBtn / lowerBtn: which mouse button does it (left raises, right lowers).
// The current level and ceiling of anything with pips. Free edit lifts an attribute's ceiling to 20.
const levelState = (c, mode, kind, name) => {
  const L = R.LEVELS[kind];
  return { L, from: L.get(c, name), cap: kind === "attr" && mode === "build" ? 20 : L.cap(c, name), label: kind === "attr" ? R.ATTR_NAME[name] : name };
};
// Free edit changes levels without spending Karma, so the pool (Karma earned) moves by however much the
// Karma spent changes. That keeps "pool = unspent + spent" true, so a later refund can never exceed what was earned.
// (An attribute's starting value moves with it in Free edit, so any points that were bought become natural.)
function freePoolDelta(c, kind, name, to) {
  const x = clean(c); R.LEVELS[kind].put(x, name, to); if (kind === "attr") x.attrs[name].base = to;
  return R.karmaSpent(x).total - R.karmaSpent(c).total;
}
const signed = n => (n > 0 ? "+" : "−") + Math.abs(n);
function levelTip(c, mode, kind, name, to, raiseBtn = "L", lowerBtn = "R") {
  const { L, from, cap, label } = levelState(c, mode, kind, name);
  const have = num(c.karma);
  if (to === from) return { title: `${label} ${to}`, lines: ["Current level"] };
  if (to > from && to > cap) {
    if (kind === "attr") return { tone: "sealed", title: "Sealed", lines: [`Started broken at ${c.attrs[name].base}. Karma stops at ${cap}.`] };
    const at = L.attrOf(name);
    return { tone: "blocked", title: "Out of reach", lines: [`${R.ATTR_NAME[at]} ${R.attr(c, at)} allows ${kind === "sec" ? "level " : ""}${cap}`] };
  }
  if (to < from && kind === "attr" && mode === "karma" && to < R.attrBase(c, name))
    return { tone: "blocked", title: "Starting value", lines: [`${label} started at ${R.attrBase(c, name)}. Free edit can lower it further.`] };
  const raise = to > from, delta = R.levelDelta(c, kind, name, from, to);
  const head = html`<${Mouse} side=${raise ? raiseBtn : lowerBtn} /> to ${raise ? "raise" : "lower"} to ${to}`;
  if (mode === "build") { const dp = freePoolDelta(c, kind, name, to); return { tone: raise ? "" : "refund", title: head, lines: [dp ? html`Free edit · <em>pool ${signed(dp)}</em>` : "Free edit · pool unchanged"] }; }
  return { tone: !raise ? "refund" : delta > have ? "short" : "ok", title: head,
    lines: [html`<em>${raise ? delta : "+" + -delta} Karma</em> · ${have} → ${have - delta}`] };
}

/* ================= small parts ================= */
function Pips({ value, max = 10, cap = max, onSet, label, big, tipFor }) {
  const out = [];
  for (let i = 1; i <= max; i++) {
    const on = i <= value, capped = i > cap && !on, over = on && i > cap;
    // Left-click an empty pip to raise to it; right-click (long-press on a phone) a filled pip to lower below it.
    const target = on ? i - 1 : i;
    const go = () => { onSet(target); if (tipFor) setTimeout(() => tip.hide(), 0); };
    out.push(html`<button type="button" class=${"pip" + (on ? " on" : "") + (capped ? " capped" : "") + (over ? " over" : "")}
      aria-label=${on ? `${label}: lower to ${i - 1}` : `${label}: raise to ${i}`} aria-pressed=${on}
      onMouseEnter=${e => tipFor && tip.show(e.currentTarget, tipFor(target))} onMouseLeave=${() => tip.hide()}
      onFocus=${e => tipFor && tip.show(e.currentTarget, tipFor(target))} onBlur=${() => tip.hide()}
      onClick=${e => { if (!on) go(); else if (e.detail) toast("Right-click (long-press on a phone) to lower."); else go(); }}
      onContextMenu=${e => { e.preventDefault(); if (on) go(); }}></button>`);
  }
  return html`<span class=${"pips" + (big ? " big" : "")} role="group" aria-label=${label}>${out}</span>`;
}
function Field({ id, label, value, onInput, type = "text", list, placeholder }) {
  return html`<div class="field"><label for=${id}>${label}</label>
    <input id=${id} type=${type} value=${value ?? ""} list=${list} placeholder=${placeholder} onInput=${e => onInput(e.target.value)} /></div>`;
}
function Mini({ id, label, value, onInput, type = "number", step, min }) {
  return html`<div class="mini"><label for=${id}>${label}</label>
    <input id=${id} type=${type} step=${step} min=${min} value=${value ?? ""} onInput=${e => onInput(type === "number" ? (e.target.value === "" ? "" : +e.target.value) : e.target.value)} /></div>`;
}
const pct = n => `${n}%`;
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const portraitSrc = c => (!c || !c.portraitAsset ? "" : Store.assets && Store.assets.urlFor ? Store.assets.urlFor(c.portraitAsset) : "/_blob/" + c.portraitAsset);
// Shrink an image to a small JPEG data URL (portraits in backups, and on the website's database).
async function shrinkImage(blob, max = 360) {
  const img = await createImageBitmap(blob);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.82);
}
// Save a text file: the runtime's downloads where offered, otherwise an ordinary browser download.
async function saveFile(filename, data) {
  if (Store.downloads) return Store.downloads.save({ filename, data });
  const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
// A character's small square portrait, or their initials.
const Thumb = ({ c, name, lg }) => html`<span class=${"thumb" + (lg ? " lg" : "")}>${portraitSrc(c) ? html`<img src=${portraitSrc(c)} alt="" />` : initials(c ? c.name : name)}</span>`;
const subtitle = c => [c.profession, c.campaign].filter(Boolean).join(" · ") || "No profession yet";

/* ================= themes ================= */
// Each theme is a set of colour, type and shape overrides keyed on <html data-skin>. Fonts load only when picked.
const GF = "https://fonts.googleapis.com/css2?display=swap&family=";
const SKINS = [
  ["ledger", "Ledger", null],
  ["steam", "Steampunk", GF + "Rye&family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite"],
  ["light", "Light", GF + "Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600"],
  ["retro", "Retro terminal", GF + "VT323"],
  ["glass", "Glass", GF + "Inter:wght@400;500;600;700"],
  ["fantasy", "Fantasy", GF + "IM+Fell+English+SC&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400"],
];
function applySkin(key) {
  const skin = SKINS.find(x => x[0] === key) || SKINS[0], root = document.documentElement;
  if (skin[0] === "ledger") delete root.dataset.skin; else root.dataset.skin = skin[0];
  if (skin[2] && !document.querySelector(`link[data-skin-font="${skin[0]}"]`)) {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = skin[2]; l.dataset.skinFont = skin[0]; document.head.appendChild(l);
  }
}
applySkin(lsGet("cw-skin", "ledger"));   // before the first paint, so the page never flashes the default theme
function SkinPicker() {
  const [skin, setSkin] = useState(() => lsGet("cw-skin", "ledger"));
  useEffect(() => { applySkin(skin); lsSet("cw-skin", skin); }, [skin]);
  return html`<label class="skinpick"><span class="lbl">Theme</span>
    <select value=${skin} onChange=${e => setSkin(e.target.value)}>${SKINS.map(([k, n]) => html`<option value=${k}>${n}</option>`)}</select></label>`;
}

/* ================= app ================= */
function App() {
  const [, force] = useState(0);
  const [drafts, setDrafts] = useState({});
  const [sel, setSel] = useState(() => lsGet("cw-sel", null));
  const [tab, setTab] = useState(() => (["sheet", "vitals", "gear", "table"].includes(location.hash.slice(1)) ? location.hash.slice(1) : lsGet("cw-tab", "sheet")));
  const lastEdit = useRef({});
  const [view, setView] = useState(() => (location.hash === "#gm" ? "gm" : lsGet("cw-view", "chars")));
  useEffect(() => lsSet("cw-view", view), [view]);

  useEffect(() => { const f = () => force(x => x + 1); Store.listeners.add(f); Store.init(); return () => Store.listeners.delete(f); }, []);

  // Drop a draft once the store has caught up, or when someone else edited it and we've been idle.
  useEffect(() => {
    let changed = false; const next = Object.assign({}, drafts);
    Object.keys(next).forEach(id => {
      const s = Store.chars[id];
      if (!s) return;
      if (s._rev === next[id]._rev || Date.now() - (lastEdit.current[id] || 0) > 4000) { delete next[id]; changed = true; }
    });
    if (changed) setDrafts(next);
  });

  const all = Object.assign({}, Store.chars, drafts);
  const list = rosterOrder(Object.values(all));
  const gm = isGM();
  if (!gm && view === "gm") setView("chars");
  const current = sel && all[sel] ? norm(all[sel]) : null;
  useEffect(() => { if (!current && list.length) setSel(list[0].id); }, [list.length, !!current]);
  useEffect(() => lsSet("cw-sel", sel), [sel]);
  useEffect(() => lsSet("cw-tab", tab), [tab]);

  const updateChar = (id, fn) => {
    const src = all[id]; if (!src) return;
    if (Store.readOnly) { toast("You can view this character but not change it."); return; }
    const next = clean(norm(src)); next.id = id; fn(next); next._rev = rid(); next.updatedAt = Date.now();
    lastEdit.current[id] = Date.now();
    setDrafts(d => Object.assign({}, d, { [id]: next }));
    Store.save(next);
  };
  const update = fn => { if (current) updateChar(current.id, fn); };
  const openChar = id => { setSel(id); setView("chars"); setTab("sheet"); window.scrollTo(0, 0); };

  // A new character belongs to the player who made it. A companion belongs to whoever plays its master.
  const create = (rolled, master) => {
    if (Store.readOnly) { toast("You can view these characters but not add new ones."); return; }
    const c = R.blankCharacter(); c.id = rid(); c.name = master ? "New companion" : "New character"; c.ownerId = Store.uid || ""; c.createdAt = Date.now();
    if (Store.table) c.players = gm ? (master ? playersOf(master).slice() : []) : [Store.table.uid];
    if (master) { c.companionOf = master.id; c.campaign = master.campaign || ""; }
    if (rolled) R.ATTRS.forEach(a => { const v = R.rollAttribute(); c.attrs[a.k] = { base: v, value: v }; });
    c._rev = rid();
    lastEdit.current[c.id] = Date.now();
    setDrafts(d => Object.assign({}, d, { [c.id]: c })); setSel(c.id); setTab("sheet");
    Store.flush(c);
    toast(master ? `Companion added for ${master.name || "this character"}.` : rolled ? "Rolled 3d8, kept the best two, minimum 6." : "Character created.");
  };
  const remove = async id => { const gone = all[id]; await Store.remove(id);
    if (gone && gone.portraitAsset && Store.assets && Store.assets.remove) Store.assets.remove(gone.portraitAsset); setDrafts(d => { const n = Object.assign({}, d); delete n[id]; return n; }); setSel(null); toast("Character deleted."); };

}

/* ---------- level changes with karma ---------- */
function setLevel(c, update, mode, kind, name, to) {
  const { L, from, cap, label } = levelState(c, mode, kind, name);
  to = R.clamp(to, 0, L.max);
  if (to === from) return;
  if (kind === "attr" && mode === "karma" && to < R.attrBase(c, name)) { toast(`${label} can't go below its starting ${R.attrBase(c, name)} while spending Karma. Switch to Free edit to change it.`); return; }
  if (to > from && to > cap) {
    toast(kind === "sec" ? `${name} is capped at level ${cap} by its attribute.`
      : kind === "attr" ? (R.attrBase(c, name) < 10 ? `${label} started broken at ${R.attrBase(c, name)}, so its ceiling is ${cap}.` : `${label} is already at the maximum of 20.`)
      : cap === 0 ? `${name} needs its attribute above 10 before it can take any points.` : `${name} can hold ${cap} point${cap > 1 ? "s" : ""}, one for each point its attribute has above 10.`);
    return;
  }
  const cost = R.levelDelta(c, kind, name, from, to);
  if (mode === "karma" && cost > num(c.karma)) { toast(`That costs ${cost} Karma. ${c.name || "This character"} has ${num(c.karma)}.`); return; }
  update(x => {
    const dp = mode === "build" ? freePoolDelta(x, kind, name, to) : 0;
    L.put(x, name, to);
    if (kind === "attr" && mode === "build") x.attrs[name].base = to;
    if (mode === "karma") { x.karma = num(x.karma) - cost; addLog(x, `${label} ${from} → ${to} (${cost > 0 ? "−" + cost : "+" + -cost} Karma)`); }
    else { x.pool = num(x.pool) + dp; addLog(x, `Free edit: ${label} ${from} → ${to}${dp ? ` (pool ${signed(dp)})` : ""}`); }
  });
}

/* ================= sigils ================= */
// A seeded scatter of faint sigils for a section: same seed, same layout on every visit.
const SIGIL_SHAPES = ["attr", "skill", "weap", "sec", "note", "gears", "astro", "glyphs", "elements", "broken"];
const WEARS = ["", "wr-1", "wr-2", "wr-3", "fade-a", "fade-b", "wr-1", "wr-2"];
function seeded(seed) {
  let h = 2166136261; for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function Sigils({ seed, n = 1, lead, side = "r" }) {
  // One main sigil hugging the chosen side, plus (if n > 1) one small faint one on the other side.
  // Sections alternate sides down the page so neighbouring sigils never pile up.
  const r = seeded(seed); const pool = SIGIL_SHAPES.filter(x => x !== lead); const out = [];
  for (let i = 0; i < Math.min(n, 2); i++) {
    const main = i === 0;
    const shape = main && lead ? lead : pool.splice(Math.floor(r() * pool.length), 1)[0];
    const right = main ? side === "r" : side !== "r";
    const size = Math.round(main ? 240 + r() * 140 : 110 + r() * 60);
    const x = Math.round(main ? (right ? 76 + r() * 16 : 8 + r() * 16) : (right ? 88 + r() * 8 : 4 + r() * 10));
    const y = Math.round(main ? 28 + r() * 30 : 72 + r() * 18);
    const rot = Math.round(r() * 70 - 35);
    const op = (main ? 0.05 + r() * 0.035 : 0.03 + r() * 0.015).toFixed(3);
    const wear = WEARS[Math.floor(r() * WEARS.length)];
    out.push(html`<i class=${`sigil sg-${shape} ${wear}`} aria-hidden="true" style=${`--x:${x}%;--y:${y}%;--s:${size}px;--r:${rot}deg;--o:${op}`}></i>`);
  }
  return out;
}

/* ================= attributes ================= */
function AttrRow({ c, a, mode, set }) {
  // One bar of ten cells with a moving 10 marker.
  // Broken (below 10): the 10 sits at the right end and red cells show how far short the attribute is.
  // At 10 or above: the 10 jumps to the left end and the cells fill toward 20.
  // Left-click a cell to raise the attribute to it; right-click a filled cell to lower it.
  const v = R.attr(c, a.k), base = R.attrBase(c, a.k), ceiling = R.attrCap(c, a.k), cap = mode === "build" ? 20 : ceiling;
  const diff = v - 10, broken = v < 10;
  const showTip = (e, to) => tip.show(e.currentTarget, to === null ? { title: `${a.n} ${v}`, lines: [html`<${Mouse} side="L" /> raise · <${Mouse} side="R" /> lower`] } : levelTip(c, mode, "attr", a.k, to, "L", "R"));
  const cellFor = (val, cls, extra) => {
    const filled = val <= v;
    const raiseTo = val, lowerTo = val - 1;
    return html`<button type="button" class=${"cell " + cls} aria-label=${filled ? `Lower ${a.n} to ${lowerTo}` : `Raise ${a.n} to ${raiseTo}`}
      onMouseEnter=${e => showTip(e, cls.includes("sealed") ? raiseTo : filled ? lowerTo : raiseTo)} onMouseLeave=${() => tip.hide()}
      onClick=${() => { if (!filled) { set(raiseTo); tip.hide(); } else toast("Right-click (long-press on a phone) to lower."); }}
      onContextMenu=${e => { e.preventDefault(); if (filled) { set(lowerTo); tip.hide(); } }}
      onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); set(filled ? lowerTo : raiseTo); } }}>${extra || ""}</button>`;
  };
  const cells = [];
  if (broken) {
    for (let x = 0; x <= 9; x++) {        // cell x stands for the attribute's (x+1)th point
      const val = x + 1, missing = val > v, bought = !missing && val > base;
      cells.push(cellFor(val, missing ? "miss" : bought ? "bought" : "have"));
    }
  } else {
    let walled = false;
    for (let x = 11; x <= 20; x++) {
      const on = v >= x, bought = on && x > Math.max(base, 10), sealed = !on && x > cap;
      const wall = sealed && !walled; if (sealed) walled = true;
      cells.push(cellFor(x, (on ? (bought ? "bought" : "up") : "") + (sealed ? " sealed" : "") + (wall ? " wall" : ""), wall ? html`<svg class="lock" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1" fill="currentColor"/><path d="M3.5 6V4a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>` : ""));
    }
  }
  const mid = html`<button type="button" class=${"mid" + (v === 10 ? " at" : "") + (broken ? " from-l" : " from-r")} aria-label=${`Set ${a.n} to 10`}
    onMouseEnter=${e => showTip(e, v === 10 ? null : 10)} onMouseLeave=${() => tip.hide()}
    onClick=${() => { if (v < 10) { set(10); tip.hide(); } }} onContextMenu=${e => { e.preventDefault(); if (v > 10) { set(10); tip.hide(); } }}>10</button>`;
  const state = diff < 0 ? html`<span class="flag bad">Broken ${diff}</span>` : diff > 0 ? html`<span class="flag">+${diff}</span>` : html`<span class="flag">Median</span>`;
  return html`<div class=${"attr" + (broken ? " is-broken" : "")}>
    <span class="nm">${a.n}</span>
    <span class="valblock"><span class="val">${v}</span>${state}</span>
    <span class=${"scale " + (broken ? "low" : "high")} role="group" aria-label=${`${a.n} scale`}>
      ${broken ? html`<span class="end">0</span><span class="half">${cells}</span>${mid}` : html`${mid}<span class="half">${cells}</span><span class="end">20</span>`}
    </span>
    <span class="base">${base < 10 ? html`<span>started ${base}</span>` : ""}<span>${ceiling < 20 ? html`<b class="sealtext">sealed at ${ceiling}</b>` : "limit 20"}</span>
      ${mode === "build" && !broken && html`<button type="button" class="btn small breakbtn" title=${`Make ${a.n} a broken attribute (drops it to 9). Left-click the bar to go lower.`} onClick=${() => set(9)}>Break</button>`}</span>
  </div>`;
}

/* ================= sheet tab ================= */
function SheetTab({ c, d, update, mode, invested, toggleInv, openSkill }) {
  // The brass diamond on a section heading: filled shows only invested skills, hollow shows them all.
  const diamond = (k, what) => html`<span class="orn has-btn"><button type="button" class=${"diamond" + (invested[k] ? " on" : "")} aria-pressed=${invested[k]}
    aria-label=${invested[k] ? `Show all ${what}` : `Show only invested ${what}`} onClick=${() => toggleInv(k)}
    onMouseEnter=${e => tip.show(e.currentTarget, { title: invested[k] ? "Invested only" : "All " + what, lines: [invested[k] ? `Click to show all ${what}` : `Click to show only ${what} with points`] })} onMouseLeave=${() => tip.hide()}></button></span>`;
  const set = (kind, name) => to => setLevel(c, update, mode, kind, name, to);
  const tipFn = (kind, name) => to => levelTip(c, mode, kind, name, to, "L", "R");
  const p = d.armor;
  const nameBtn = (kind, n, extra) => html`<button type="button" class="n sname" onClick=${() => openSkill(kind, n)} title=${`What ${n} grants at each level`}>${n}${extra || ""}</button>`;
  const groups = R.SKILL_GROUPS.map(g => ({ g, rows: g.skills.filter(([n]) => !invested.skills || num(c.skills[n]) > 0) })).filter(x => x.rows.length);
  const weap = ["STR", "DEX"].map(at => ({ at, rows: R.WEAPON_TYPES.filter(w => w[1] === at && (!invested.weapons || num(c.weaponSkills[w[0]]) > 0)) })).filter(x => x.rows.length);
  const secs = R.SECONDARY.map(sk => ({ sk, b: R.secondaryBonus(c, sk.name, p) })).filter(x => !invested.sec || x.b.trained);
  const none = what => html`<p class="muted emptyline">No ${what} invested yet. Click the diamond to show them all.</p>`;
  // How many points an attribute allows in its skills, shown beside each group's heading.
  const allowance = at => { const av = R.attr(c, at); return html`<small>${av < 10 ? "broken · no points" : `up to ${R.pointsAbove10(av)}`}</small>`; };
  return html`<div class="tabpane">
    <section class="frame"><${Sigils} seed="attributes" n=${2} lead="attr" side="r" /><h2 class="h"><span>Attributes</span><i class="orn" aria-hidden="true"></i></h2><p class="sub">Ten is the measure of common folk. Fall below it and the attribute is broken.</p>
      <div class="legend">
        <span class="item"><i class="cell miss"></i><b>Broken</b><small>Points below 10 the character is missing</small></span>
        <span class="item"><i class="cell up"></i><b>Natural</b><small>Points above 10 from character creation</small></span>
        <span class="item"><i class="cell bought"></i><b>Bought</b><small>Points raised with Karma</small></span>
        <span class="item"><i class="cell sealed"></i><b>Sealed</b><small>Karma can never raise a broken attribute past here</small></span>
      </div>
      <p class="hint"><${Mouse} side="L" /> Left-click to raise · <${Mouse} side="R" /> right-click to lower (long-press on a phone) · hover for the Karma cost. Skill pips work the same way.${mode === "build" ? " In Free edit, Break turns an attribute into a broken one." : ""}</p>
      <div class="attrs">${R.ATTRS.map(a => html`<${AttrRow} key=${a.k} c=${c} a=${a} mode=${mode} set=${set("attr", a.k)} />`)}</div>
    </section>

    <section class="frame"><${Sigils} seed="skills" n=${1} lead="skill" side="l" /><h2 class="h"><span>Skills</span>${diamond("skills", "skills")}</h2><p class="sub">Modifier shown after armor penalties. Click a skill's name to see what each level grants. ${p.armor ? `Wearing ${p.armor.name || "armor"}: casting −${p.casting}%${p.dexSkills ? `, Dexterity skills −${p.dexSkills}%` : ""}.` : ""}</p>
      ${groups.length ? html`<div class="skillcols">${groups.map(({ g, rows }) => html`<div class="sgroup"><h3>${R.ATTR_NAME[g.attr]}${allowance(g.attr)}</h3>
          ${rows.map(([n]) => { const lv = num(c.skills[n]); const cap = R.skillCap(c, n); const mod = R.skillModifier(c, n, p);
            return html`<div class=${"srow" + (lv ? "" : " dim")}>${nameBtn("skill", n, html`${lv > cap ? html` <span class="flag bad">over cap</span>` : ""}${R.CASTING.includes(n) && lv && p.casting ? html` <span class="flag warn">armor</span>` : ""}`)}
              <${Pips} value=${lv} cap=${cap} label=${n} onSet=${set("skill", n)} tipFor=${tipFn("skill", n)} /><span class="m">${lv ? pct(mod) : "—"}</span></div>`; })}</div>`)}</div>` : none("skills")}
    </section>

    <section class="frame"><${Sigils} seed="weaponry" n=${1} lead="weap" side="r" /><h2 class="h"><span>Weaponry</span>${diamond("weapons", "weapon skills")}</h2><p class="sub">Proficiency at 3, 5, 7 and 10. Accuracy needs Competent (3) and adds Precision.</p>
      ${weap.length ? html`<div class="skillcols">${weap.map(({ at, rows }) => html`<div class="sgroup"><h3>${R.ATTR_NAME[at]} weapons${allowance(at)}</h3>
        ${rows.map(([w]) => { const lv = num(c.weaponSkills[w]);
          return html`<div class=${"srow" + (lv ? "" : " dim")}>${nameBtn("weapon", w, lv ? html`<em>${R.proficiency(lv)}</em>` : "")}
            <${Pips} value=${lv} cap=${R.weaponCap(c, w)} label=${w} onSet=${set("weapon", w)} tipFor=${tipFn("weapon", w)} /><span class="m">${lv >= 3 ? "+" + pct(lv + num(c.skills.Precision)) : "—"}</span></div>`; })}</div>`)}</div>` : none("weapon skills")}
    </section>

    <section class="frame"><${Sigils} seed="secondary" n=${1} lead="sec" side="l" /><h2 class="h"><span>Secondary skills</span>${diamond("sec", "secondary skills")}</h2><p class="sub">7% per level. Some come free with a primary skill, and then stack with it.</p>
      ${secs.length ? html`<div class="sec">${secs.map(({ sk, b }) => { const lv = num(c.secondary[sk.name]); const cap = R.secondaryCap(c, sk.name);
        return html`<div class=${"srow" + (b.trained ? "" : " dim")}>${nameBtn("sec", sk.name, html`<em>${b.source}</em>${b.disadv ? html` <span class="flag warn">disadv.</span>` : ""}`)}
          <${Pips} value=${lv} max=${3} cap=${cap} label=${sk.name} onSet=${set("sec", sk.name)} tipFor=${tipFn("sec", sk.name)} /><span class="m">${b.trained ? pct(b.bonus) : "—"}</span></div>`; })}</div>` : none("secondary skills")}
