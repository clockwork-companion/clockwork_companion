      addLog(x, `Armor repair: ${txt} (${f.plan.cost} g ${f.plan.mat} materials, ${f.count}${f.plan.die})`);
    });
    patch({ done: true, phase: "done", total, gainedFinal: gained });
  };

  /* ---------- craft: up to two rolls; a failure leaves a flaw, a second loses the suit ---------- */
  const startCraft = () => {
    if (cp.block) return;
    const plan = cp, name = (rc.name || "").trim() || `${plan.t.label} armor`;
    setRun({ kind: "craft", phase: "heat", plan, name, rolls: [], flaws: 0, mod: st.mod });
    const roll = n => {
      patch({ phase: "rolling", roll: null });
      later(() => {
        const r = R.rollDie(100), ok = r - st.mod < plan.dc;
        patch(g => ({ roll: { r, total: r - st.mod, ok }, rolls: [...g.rolls, { r, total: r - st.mod, ok }] }));
        if (ok) later(() => finishCraft(true), 500);
        else if (n === 0) later(() => { patch(g => ({ phase: "flaw", flaws: g.flaws + 1 })); later(() => roll(1), 1500); }, 600);
        else later(() => finishCraft(false), 700);
      }, 1400);
    };
    later(() => roll(0), 900);
  };
  const finishCraft = ok => {
    const f = runRef.current; if (!f) return;
    const nm = f.name + (f.flaws ? ` · ${f.flaws} flaw` : "");
    update(x => {
      x.craft.supplies[f.plan.type] = Math.max(0, num(x.craft.supplies[f.plan.type]) - f.plan.cost);
      if (ok) x.armor.push({ id: rid(), name: nm, type: f.plan.type, av: f.plan.finalAV, soak: f.plan.finalSoak, soakMax: f.plan.finalSoak, worn: false, where: "pack" });
      addLedger(x, { kind: "craft", name: ok ? `Crafted ${nm} (AV ${f.plan.finalAV}, Soak ${f.plan.finalSoak})` : `Lost ${f.name} in the forge`, scrap: !ok, det: ok ? f.flaws : 0,
        rolls: f.rolls.map(r => `${r.r}−${f.mod}=${r.total} vs ${f.plan.dc} ${r.ok ? "✓" : "✗"}`) });
      addLog(x, ok ? `Armor crafting: made ${nm} (${f.plan.cost} g ${f.plan.type} materials)` : `Armor crafting: the suit was lost (${f.plan.cost} g ${f.plan.type} materials)`);
    });
    patch({ done: true, phase: ok ? "made" : "lost" });
  };
  const close = () => { stop(); setRun(null); };

  const repairLabels = suit && { type: `${T[suit.type].label} · ${suit.name || "unnamed"}`, av: String(num(suit.av)), soak: `${run && run.kind === "repair" ? run.plan.soak + run.gained : rp.soak} / ${rp.max}`, extra: `${rp.die} · ${rp.cost} g` };
  const craftLabels = { type: cp.t.label, av: `${cp.finalAV}${cp.plusAV ? ` (+${cp.plusAV})` : ""}`, soak: `${cp.finalSoak}${cp.plusSoak ? ` (+${5 * cp.plusSoak})` : ""}`, extra: cp.plusAV || cp.plusSoak ? `${cp.dc}% to beat` : "None" };
  const shownType = mode === "repair" ? (suit ? suit.type : "medium") : cp.type;
  const shownSoak = run && run.kind === "repair" ? run.plan.soak + run.gained : rp ? rp.soak : 0;

  return html`
    <section class="frame ambench">
      <${Head} title=${mode === "repair" ? "Repairing armor" : "Crafting armor"} topic=${mode === "repair" ? "armorRepair" : "armorCraft"} />
      <p class="sub">${mode === "repair" ? "Pick a damaged suit and repair it. One check sets how many Repair Dice you roll; each die goes back into the Soak Pool." : "Set the suit the GM agreed on, then forge it. One roll against the difficulty; a failure leaves a flaw and you roll once more."}</p>
      <div class="seg two ammode" role="group" aria-label="Repair or craft">${[["repair", "Repair"], ["craft", "Craft"]].map(([k, n]) => html`<button aria-pressed=${mode === k} disabled=${busy} onClick=${() => { close(); setMode(k); }}>${n}</button>`)}</div>
      <div class="facts ptfacts">${[["Armor Maintenance", `${st.lvl}`], ["Modifier", `${st.mod}%`],
        ["Repair", st.repair ? (st.restore ? "Yes, broken suits too" : "Yes") : "From level 3"], ["Craft", st.craft ? (st.artisan ? "Mundane and Artisan" : "Mundane suits") : "From level 4"]].map(([k, v]) => html`<div class="fact"><span>${k}</span><b>${v}</b></div>`)}</div>

      <div class="ptgrid">
        <div class="ptstage amstage">
          ${mode === "repair" && !suit ? html`<p class="muted amempty">No armor yet. Add a suit on the Gear tab, or craft one.</p>` : html`
          <${ArmorFigure} type=${shownType} mode=${mode} run=${run} st=${st} focus=${mode === "craft" ? focus : null} onPick=${mode === "craft" ? setFocus : null}
            labels=${mode === "repair" ? repairLabels : craftLabels} broken=${rp && (run && run.kind === "repair" ? run.plan.broken && !run.gained : rp.broken)} marks=${mode === "repair" && rp ? amMarks(shownSoak, rp.max) : 0} />`}
          ${mode === "repair" && rp && html`<div class="amsoak" aria-hidden="true"><i style=${`width:${rp.max ? Math.min(100, (shownSoak / rp.max) * 100) : 0}%`}></i></div>`}
          <div class="ptforge">
            ${!run && mode === "repair" && suit && html`<button class="btn primary big forgebtn" disabled=${!!rp.block} onClick=${startRepair}>${HAMMER}${rp.broken ? "Rebuild" : "Repair"} · ${rp.cost} g</button>
              ${rp.block && html`<p class="muted ptwhy">${rp.block}</p>`}`}
            ${!run && mode === "craft" && html`<button class="btn primary big forgebtn" disabled=${!!cp.block} onClick=${startCraft}>${HAMMER}Forge the suit · ${cp.cost} g</button>
              ${cp.block && html`<p class="muted ptwhy">${cp.block}</p>`}`}
            ${run && html`<${AmReadout} run=${run} onClose=${close} />`}
          </div>
        </div>
        <div class="ptside">${mode === "repair" ? html`<${RepairSide} c=${c} suits=${suits} suit=${suit} rp=${rp} st=${st} busy=${busy} pick=${id => { close(); setSel(id); }} />`
          : html`<${CraftSide} c=${c} rc=${rc} cp=${cp} st=${st} focus=${focus} setFocus=${setFocus} setRc=${setRc} busy=${busy} />`}</div>
      </div>
    </section>

    <section class="frame"><h2 class="h"><span>Supplies</span><i class="orn" aria-hidden="true"></i></h2>
      <p class="sub">Armor materials are kept by the type of armor they mend. You also need a blacksmithing kit; heavy and plate armor need a forge, which most smiths will rent you.</p>
      <div class="ptsupplies">${Object.entries(T).map(([k, t]) => html`<div class="mini ptsup"><label for=${"am-" + k + c.id}>${t.label} materials (g)</label>
          <input id=${"am-" + k + c.id} type="number" min="0" step="100" value=${c.craft.supplies[k] ?? 0} onInput=${e => update(x => { x.craft.supplies[k] = Math.max(0, +e.target.value || 0); })} /></div>`)}
        <div class="mini ptsup"><label for=${"am-b" + c.id}>Other bonus (%)</label>
          <input id=${"am-b" + c.id} type="number" step="1" value=${ca.bonus ?? 0} onInput=${e => update(x => { x.craft.armor.bonus = +e.target.value || 0; })} /></div></div>
      <label class="amforge"><input type="checkbox" checked=${!!ca.forge} onChange=${e => update(x => { x.craft.armor.forge = e.target.checked; })} /> At a forge <span class="muted">(needed for heavy and plate)</span></label>
    </section>

    <section class="frame"><h2 class="h"><span>Ledger</span><i class="orn" aria-hidden="true"></i></h2>
      <p class="sub">Repairs and crafted suits, newest first. A crafted suit's flaws are the GM's to decide; note them here.</p>
      ${ca.ledger.length === 0 ? html`<p class="muted">No repairs or crafts yet.</p>` : html`<div class="ptledger">${ca.ledger.map((e, i) => html`<div class=${"pled" + (e.scrap ? " scrap" : "")}>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${e.name}</b>
          <button class="iconbtn" aria-label="Remove this entry" onClick=${() => update(x => { x.craft.armor.ledger.splice(i, 1); })}>×</button></div>
        <span class="muted">${new Date(e.t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}${e.rolls && e.rolls.length ? " · " + e.rolls.join(" · ") : ""}</span>
        ${e.det > 0 && html`<input class="inp" aria-label="Flaws" placeholder="What the flaw does (the GM decides)" value=${e.note} onInput=${ev => update(x => { x.craft.armor.ledger[i].note = ev.target.value; })} />`}</div>`)}</div>`}
    </section>`;
}
const HAMMER = html`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5l5-3 2.5 4-5 3z M8.8 8.3l7.7 8.2" /></svg>`;

function AmReadout({ run, onClose }) {
  const [spin, setSpin] = useState(0);
  useEffect(() => {
    if (run.phase !== "rolling" || reduceMotion()) return;
    const t = setInterval(() => setSpin(1 + Math.floor(Math.random() * 100)), 55);
    return () => clearInterval(t);
  }, [run.phase, (run.rolls || []).length]);
  if (run.kind === "repair") {
    const p = run.plan;
    if (run.done) return html`<div class=${"ptread end " + (run.gainedFinal ? "done" : "nothing")} role="status">
      <p class="ptbig">${run.gainedFinal ? `+${run.gainedFinal} Soak` : "No soak recovered"}</p>
      <p>${run.count ? `${run.count} × ${p.die}: ${run.dice.join(" + ")} = ${run.total}${run.total > run.gainedFinal ? ` (the suit was full at ${p.max})` : ""}` : "The check was too high for even one Repair Die."}</p>
      <p class="muted">${p.cost} g of ${p.mat} materials used · an hour's work.</p>
      <button class="btn primary" onClick=${onClose}>Back to the bench</button></div>`;
    return html`<div class="ptread" role="status" aria-live="polite">
      <div class="ptstep"><span class="lbl">${run.phase === "rolling" ? "Armor Maintenance check" : "Repair Dice"}</span>
        <b>${run.phase === "rolling" ? "Inspecting the damage…" : `${run.count} × ${p.die}`}</b></div>
      ${run.phase === "rolling" ? html`<div class="ptdice rolling"><span class="d100">${spin || "··"}</span><span class="ptmath">d100 − ${run.mod} · lower is better</span></div>`
        : html`<div class="ptdice ok"><span class="d100">${run.r}</span><span class="ptmath">${run.r} − ${run.mod} = <b>${run.check}</b> · Repair Count 10 − ${run.check} ÷ 10 → <b>${run.count}</b></span></div>`}
      ${run.count > 0 && run.phase !== "rolling" && html`<div class="amdice">${run.dice.map((v, i) => html`<span class=${"amdie" + (i < run.shown ? " on" : "")}>${i < run.shown ? v : ""}</span>`)}
        <b class="amsum">+${run.gained}</b></div>`}
    </div>`;
  }
  const p = run.plan, r = run.roll;
  if (run.done) return html`<div class=${"ptread end " + (run.phase === "made" ? "done" : "scrap")} role="status">
    <p class="ptbig">${run.phase === "made" ? "Forged" : "Lost in the forge"}</p>
    <p>${run.phase === "made" ? `${run.name}: ${p.t.label}, AV ${p.finalAV}, Soak ${p.finalSoak}${run.flaws ? ", with a flaw for the GM to decide" : ""}.` : "Two failures: the suit and every material in it are gone."}</p>
    ${run.phase === "made" && html`<p class="muted">Added to Armor on the Gear tab. Eight hours at the anvil.</p>`}
    <button class="btn primary" onClick=${onClose}>Back to the bench</button></div>`;
  return html`<div class="ptread" role="status" aria-live="polite">
    <div class="ptstep"><span class="lbl">Roll ${Math.min(2, (run.rolls || []).length + ((run.phase === "rolling" && !r) || run.phase === "flaw" ? 1 : 0)) || 1} of 2 at most</span>
      <b>${run.phase === "heat" ? "Heating the forge…" : run.phase === "flaw" ? "A flaw. One more try…" : `Under ${p.dc}%`}</b>
      <span class="ptdet">${[0, 1].map(i => html`<i class=${(i < run.flaws ? "on" : "") + (i === 1 ? " last" : "")}></i>`)}</span></div>
    ${run.phase !== "heat" && html`<div class=${"ptdice" + (run.phase === "rolling" && !r ? " rolling" : r ? (r.ok ? " ok" : " fail") : "")}>
      <span class="d100">${run.phase === "rolling" && !r ? spin || "··" : r ? r.r : "··"}</span>
      <span class="ptmath">${run.phase === "rolling" && !r ? html`d100 − ${run.mod} · under ${p.dc}` : r && html`${r.r} − ${run.mod} = <b>${r.total}</b> ${r.ok ? "<" : "≥"} ${p.dc}`}</span></div>`}
  </div>`;
}

function RepairSide({ c, suits, suit, rp, st, busy, pick }) {
  return html`<div class="ptpick">
    <h3 class="ptpickh"><span>Suits</span></h3>
    ${suits.length === 0 ? html`<p class="muted ptrule">Nothing to repair yet.</p>` : html`<div class="ptopts amsuits">${suits.map(a => { const p = R.repairPlan(c, a);
      return html`<button type="button" class="ptopt amsuit" aria-pressed=${suit && suit.id === a.id} disabled=${busy} onClick=${() => pick(a.id)}>
        <b>${a.name || "Unnamed armor"}${a.worn ? html` <span class="flag brass">Worn</span>` : ""}${p.broken ? html` <span class="flag bad">Broken</span>` : ""}</b>
        <span>${R.ARMOR[a.type].label} · AV ${num(a.av)} · Soak ${p.soak}/${p.max}</span>
        <i class="amtrack"><i style=${`width:${p.max ? (p.soak / p.max) * 100 : 0}%`}></i></i></button>`; })}</div>`}
    ${suit && html`<div class="ptplan"><h3 class="lbl">The repair</h3><ol>
      <li><span>Materials: ${rp.cost} g of ${R.ARMOR[suit.type].label.toLowerCase()} materials</span><span class="muted">${R.ARMOR[suit.type].repairPerAV} g × AV ${num(suit.av)}${rp.broken ? " × 2 to rebuild a broken suit (draft rule)" : ""}</span></li>
      <li><span>Check: d100 − ${st.mod}</span><span class="muted">Repair Count = 10 − check ÷ 10, rounded down, at most 10</span></li>
      <li><span>Roll ${rp.die} that many times</span><span class="muted">The total goes back into the Soak Pool (up to ${rp.max}). An hour per attempt.</span></li></ol>
      <p class="ptdc">Check 0 or less: 10 × ${rp.die} · check 40: 6 × ${rp.die} · check 90: 1 × ${rp.die}</p></div>`}
  </div>`;
}

function CraftSide({ c, rc, cp, st, focus, setFocus, setRc, busy }) {
  const T = R.ARMOR, t = cp.t;
  const Step = ({ label, value, min, max, onSet }) => html`<span class="ptstepper"><button class="iconbtn" aria-label=${`Lower ${label}`} disabled=${busy || value <= min} onClick=${() => onSet(value - 1)}>−</button>
    <button class="iconbtn" aria-label=${`Raise ${label}`} disabled=${busy || value >= max} onClick=${() => onSet(value + 1)}>+</button></span>`;
  let body;
  if (focus === "type") body = html`<p class="muted ptrule">The GM tells you what kind of suit can be made here.</p><div class="ptopts">${Object.entries(T).map(([k, x]) => html`<button type="button" class="ptopt" aria-pressed=${cp.type === k} disabled=${busy}
      onClick=${() => setRc(r => { r.type = k; r.av = x.av[0]; r.soak = 10 * x.av[0]; r.plusAV = 0; })}><b>${x.label} · AV ${x.av[0]}–${x.av[1]}</b>
      <span>${5 * x.repairPerAV} g × AV of ${x.label.toLowerCase()} materials${R.AM_FORGE.includes(k) ? " · needs a forge" : ""}</span></button>`)}</div>`;
  else if (focus === "av" || focus === "soak") body = html`<p class="muted ptrule">The suit's base numbers, from the GM.</p>
    <div class="row ptrate"><span><b>Armor Value ${cp.av}</b> · ${t.label} runs ${t.av[0]}–${t.av[1]}</span>
      <${Step} label="Armor Value" value=${cp.av} min=${t.av[0]} max=${t.av[1]} onSet=${v => setRc(r => { r.av = v; r.plusAV = Math.min(num(r.plusAV), t.av[1] - v); })} /></div>
    <div class="row ptrate"><span><b>Soak Pool ${cp.soak}</b> · usually 10 × AV</span>
      <span class="ptstepper"><button class="iconbtn" aria-label="Lower Soak Pool" disabled=${busy || cp.soak <= 5} onClick=${() => setRc(r => { r.soak = Math.max(5, cp.soak - 5); })}>−</button>
        <button class="iconbtn" aria-label="Raise Soak Pool" disabled=${busy} onClick=${() => setRc(r => { r.soak = cp.soak + 5; })}>+</button></span></div>
    <button type="button" class="btn small" style="margin-top:8px" disabled=${busy || cp.soak === 10 * cp.av} onClick=${() => setRc(r => { r.soak = 10 * cp.av; })}>Soak = 10 × AV</button>`;
  else body = html`<p class="muted ptrule">Optional. Each extra makes the roll harder, like the book's weapon table. Our reading.</p>
    <div class="ptopts">
      <div class=${"ptopt row-opt" + (cp.plusAV ? " on" : "")}><span class="ptcheck"><b>Armor Value +1 · −10% each</b><span>${cp.plusAV ? `+${cp.plusAV}: AV ${cp.finalAV}` : `Up to ${t.av[1]} for ${t.label.toLowerCase()} armor`}</span></span>
        <div class="ptrate"><${Step} label="extra Armor Value" value=${cp.plusAV} min=${0} max=${t.av[1] - cp.av} onSet=${v => setRc(r => { r.plusAV = v; })} /></div></div>
      <div class=${"ptopt row-opt" + (cp.plusSoak ? " on" : "")}><span class="ptcheck"><b>Soak Pool +5 · −5% each</b><span>${cp.plusSoak ? `+${5 * cp.plusSoak}: Soak ${cp.finalSoak}` : "Up to +50"}</span></span>
        <div class="ptrate"><${Step} label="extra Soak Pool" value=${cp.plusSoak} min=${0} max=${10} onSet=${v => setRc(r => { r.plusSoak = v; })} /></div></div></div>
    ${st.artisan ? html`<p class="ptlocked">Artisan properties (Armor Maintenance 8) aren't written in the book yet.</p>` : ""}`;
  return html`<div class="ptpick">
    <h3 class="ptpickh"><span>${AM_NAME[focus] || "Type"}</span><small>${focus === "type" ? t.label : focus === "extra" ? `${cp.dc}%` : focus === "av" ? `AV ${cp.finalAV}` : `Soak ${cp.finalSoak}`}</small></h3>
    ${body}
    <div class="ptplan"><h3 class="lbl">The craft</h3><ol>
      <li><span>Materials: ${cp.cost} g of ${t.label.toLowerCase()} materials</span><span class="muted">5 × repair cost (${t.repairPerAV} g × AV ${cp.finalAV})</span></li>
      <li><span>Roll under ${cp.dc}%</span><span class="muted">${cp.chance}% to land · a failure leaves a flaw and you roll again; two failures lose it all</span></li>
      <li><span>Eight hours${R.AM_FORGE.includes(cp.type) ? " at a forge" : ""}</span><span class="muted">The suit joins your Armor on the Gear tab.</span></li></ol>
      <div class="row ptbatch"><label for=${"amn-" + c.id}>Name</label>
        <input id=${"amn-" + c.id} class="inp" placeholder=${`${t.label} armor`} value=${rc.name || ""} disabled=${busy} onInput=${e => setRc(r => { r.name = e.target.value; })} /></div></div>
  </div>`;
}
/* ================= character creation ================= */
// "New character" offers two roads: a guided genesis, step by step, or an instant auto-generated sheet.

function NewChoice({ onClose, onGuide, onBlank }) {
  useEffect(() => { const k = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const draft = lsGet(GENESIS_KEY, null);
  return html`<div class="gx-veil" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="gx-choose" role="dialog" aria-label="Create a character">
      <button class="iconbtn gx-x" aria-label="Close" onClick=${onClose}>×</button>
      <h2 class="ornate">A new soul for the table</h2>
      <div class="gx-roads">
        <button class="gx-road main" onClick=${onGuide}>
          <i class="emblem sg-astro" aria-hidden="true"></i>
          <b>${draft ? "Continue character creation" : "Character creation"}</b>
          <span>${draft ? `Pick up ${draft.name ? draft.name + "'s" : "your"} creation where you left it.` : "Name them, give them a face, watch the dice decide their nature, then shape it yourself."}</span></button>
        <button class="gx-road" onClick=${onBlank}>
          <i class="emblem sg-note" aria-hidden="true"></i>
          <b>Blank character sheet</b>
          <span>Every attribute set to 10, nothing else filled in. For copying over an existing character or building one by hand.</span></button>
      </div>
    </div>
  </div>`;
}

const GENESIS_KEY = "cw-genesis";
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
const EMBLEM_SHAPES = ["astro", "gears", "attr", "skill", "weap", "sec", "note", "glyphs", "elements", "broken"];
const HUES = ["#d39d48", "#c9483c", "#6fb6d2", "#8cc06a", "#b48ade", "#e8e2d4", "#e07a3c", "#4fb3a2"];
const STEPS = ["Name", "Likeness", "Fate", "Choose", "Shape", "Awaken"];
const freshDraft = () => ({ step: 0, name: "", campaign: "", karma: 0, face: { mode: "sigil", shape: "astro", hue: HUES[0], url: "", asset: "" }, sets: [], chosen: 0, assign: {} });

function Genesis({ onClose, onDone }) {
  // The draft is kept in this browser, so closing the guide never loses (or re-rolls) your dice.
  const [g, setG] = useState(() => Object.assign(freshDraft(), lsGet(GENESIS_KEY, null) || {}));
  useEffect(() => lsSet(GENESIS_KEY, g), [g]);
  const up = patch => setG(x => Object.assign({}, x, typeof patch === "function" ? patch(x) : patch));
  const go = step => { up({ step }); const el = document.querySelector(".gx-body"); if (el) el.scrollTop = 0; };
  const twoSets = g.sets.length > 1;
  const stepOrder = twoSets ? [0, 1, 2, 3, 4, 5] : [0, 1, 2, 4, 5];
  const next = () => go(stepOrder[stepOrder.indexOf(g.step) + 1]);
  const back = () => go(stepOrder[Math.max(0, stepOrder.indexOf(g.step) - 1)]);
  const abandon = () => { lsSet(GENESIS_KEY, null); try { localStorage.removeItem(GENESIS_KEY); } catch {} onClose(); };
  const finish = () => {
    const set = g.sets[g.chosen] || [];
    const extra = twoSets ? 10 : 0, karma = Math.max(0, num(g.karma) - extra);
    onDone(c => {
      c.name = g.name.trim() || "Unnamed";
      c.campaign = g.campaign;
      R.ATTRS.forEach(a => { const v = set[g.assign[a.k]].total; c.attrs[a.k] = { base: v, value: v }; });
      c.karma = karma; c.pool = karma;   // nothing spent yet, so the pool is what's left to spend
      if (g.face.mode === "link" && g.face.url) c.portraitUrl = g.face.url.trim();
      else if (g.face.mode === "upload" && g.face.asset) c.portraitAsset = g.face.asset;
      else c.emblem = { shape: g.face.shape, hue: g.face.hue };
      const rolls = s => s.map(r => r.total).join(", ");
      c.log = [
        { t: Date.now(), m: `Created through character creation · starting Karma ${num(g.karma)}${extra ? `, −10 for a second set` : ""}` },
        ...g.sets.map((s, i) => ({ t: Date.now(), m: `${i ? "Second" : "First"} set rolled: ${rolls(s)}${twoSets && g.chosen === i ? " (kept)" : ""}` })),
      ];
    });
    try { localStorage.removeItem(GENESIS_KEY); } catch {}
  };
  const pos = stepOrder.indexOf(g.step);
  return html`<div class="genesis" role="dialog" aria-label="Character creation">
    <div class="gx-top">
      <ol class="gx-steps">${stepOrder.map((s, i) => html`<li class=${(i < pos ? "done " : "") + (i === pos ? "now" : "")}><span>${i + 1}</span>${STEPS[s]}</li>`)}</ol>
      <button class="iconbtn" aria-label="Close (your progress is kept)" title="Close. Your progress is kept." onClick=${onClose}>×</button>
    </div>
    <div class="gx-body">
      ${g.step === 0 && html`<${StepName} g=${g} up=${up} next=${next} abandon=${abandon} />`}
      ${g.step === 1 && html`<${StepFace} g=${g} up=${up} next=${next} back=${back} />`}
      ${g.step === 2 && html`<${StepRoll} g=${g} up=${up} next=${next} back=${back} />`}
      ${g.step === 3 && html`<${StepChoose} g=${g} up=${up} next=${next} back=${back} />`}
      ${g.step === 4 && html`<${StepShape} g=${g} up=${up} next=${next} back=${back} />`}
      ${g.step === 5 && html`<${StepAwaken} g=${g} back=${back} finish=${finish} />`}
    </div>
  </div>`;
}

const GxNav = ({ back, next, nextLabel = "Continue", disabled, hint }) => html`<div class="gx-nav">
  ${back ? html`<button class="btn" onClick=${back}>Back</button>` : html`<span></span>`}
  ${hint && html`<span class="muted">${hint}</span>`}
  ${next && html`<button class="btn primary big" disabled=${disabled} onClick=${next}>${nextLabel}</button>`}</div>`;

// A face for the preview: the chosen picture, or the sigil in its hue.
const GxFace = ({ face, name, big }) => html`<div class=${"gx-face" + (big ? " big" : "")}>
  ${face.mode === "link" && /^https?:\/\//.test(face.url) ? html`<img src=${face.url} alt="" onError=${e => { e.target.style.display = "none"; }} />`
    : face.mode === "upload" && face.asset && Store.assets && Store.assets.urlFor ? html`<img src=${Store.assets.urlFor(face.asset)} alt="" />`
    : face.mode === "upload" && face.asset ? html`<img src=${"/_blob/" + face.asset} alt="" />`
    : html`<i class=${"emblem sg-" + face.shape} style=${`--em:${face.hue}`}></i>`}
  ${name !== undefined && html`<b>${name || "Unnamed"}</b>`}</div>`;

function StepName({ g, up, next, abandon }) {
  const begun = g.sets.length > 0 || g.name;
  return html`<section class="gx-step">
    <p class="gx-kicker">Every tale begins with a name</p>
    <h2 class="gx-title">Who steps out of the smoke?</h2>
    <div class="gx-form">
      <div class="field"><label for="gx-name">Name</label><input id="gx-name" class="gx-big" value=${g.name} placeholder="Anne Domaltici of Tanisburg" onInput=${e => up({ name: e.target.value })} autofocus /></div>
      <div class="gx-two">
        <div class="field"><label for="gx-camp">Campaign</label><select id="gx-camp" value=${g.campaign} onChange=${e => up({ campaign: e.target.value })}>
          <option value="">—</option>${CAMPAIGNS.map(x => html`<option>${x}</option>`)}</select></div>
        <div class="field"><label for="gx-karma">Starting Karma</label><input id="gx-karma" type="number" min="0" value=${g.karma} onInput=${e => up({ karma: Math.max(0, Math.floor(+e.target.value || 0)) })} />
          <small class="muted">Your GM sets this for the campaign.</small></div>
      </div>
    </div>
    <${GxNav} next=${next} disabled=${!g.name.trim()} hint=${!g.name.trim() ? "Give them a name to continue." : ""} />
    ${begun && html`<button class="linkbtn gx-abandon" onClick=${abandon}>Abandon this character and start over</button>`}
  </section>`;
}

function StepFace({ g, up, next, back }) {
  const f = g.face, setF = patch => up(x => ({ face: Object.assign({}, x.face, patch) }));
  const fileRef = useRef(); const [busy, setBusy] = useState(false);
  const upload = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file || !Store.assets) return;
    setBusy(true);
    try { const r = await Store.assets.upload(file, f.asset); setF({ mode: "upload", asset: r.id }); } catch { toast("Couldn't upload that image. Try a PNG, JPG or WebP."); }
    setBusy(false);
  };
  return html`<section class="gx-step">
    <p class="gx-kicker">A face for the tale</p>
    <h2 class="gx-title">How will the table know ${g.name.trim() || "them"}?</h2>
    <div class="gx-facegrid">
      <${GxFace} face=${f} name=${g.name} big />
      <div>
        <div class="seg three gx-modes" role="group" aria-label="Likeness">
          <button aria-pressed=${f.mode === "sigil"} onClick=${() => setF({ mode: "sigil" })}>Sigil</button>
          <button aria-pressed=${f.mode === "link"} onClick=${() => setF({ mode: "link" })}>Image link</button>
          <button aria-pressed=${f.mode === "upload"} disabled=${!Store.assets} onClick=${() => setF({ mode: "upload" })}>Upload</button></div>
        ${f.mode === "sigil" && html`<p class="muted">Not ready for a portrait? Bear a sigil. You can add a picture any time from the sheet.</p>
          <div class="gx-sigils">${EMBLEM_SHAPES.map(s => html`<button class=${"gx-sigil" + (f.shape === s ? " on" : "")} aria-label=${`Sigil ${s}`} onClick=${() => setF({ shape: s })}><i class=${"emblem sg-" + s} style=${`--em:${f.hue}`}></i></button>`)}</div>
          <div class="gx-hues"><span class="lbl">Hue</span>${HUES.map(h => html`<button class=${"gx-hue" + (f.hue === h ? " on" : "")} style=${`background:${h}`} aria-label=${`Hue ${h}`} onClick=${() => setF({ hue: h })}></button>`)}
            <label class="gx-custom">Any colour<input type="color" value=${f.hue} onInput=${e => setF({ hue: e.target.value })} /></label></div>`}
        ${f.mode === "link" && html`<div class="field"><label for="gx-url">Image link</label><input id="gx-url" placeholder="https://…" value=${f.url} onInput=${e => setF({ url: e.target.value.trim() })} />
          <small class="muted">A public picture link. It also shows on your Tabletop Simulator sheet.</small></div>`}
        ${f.mode === "upload" && html`<div class="row"><button class="btn" disabled=${busy} onClick=${() => fileRef.current.click()}>${busy ? "Uploading…" : f.asset ? "Choose another picture" : "Choose a picture"}</button>
          <input ref=${fileRef} type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden onChange=${upload} /></div>`}
      </div>
    </div>
    <${GxNav} back=${back} next=${next} disabled=${(f.mode === "link" && !/^https?:\/\//.test(f.url)) || (f.mode === "upload" && !f.asset)} />
  </section>`;
}

// Three tumbling d8s for the roll in progress (or the last one rolled).
function DiceTray({ roll, rolling }) {
  const [flick, setFlick] = useState([1, 1, 1]);
  useEffect(() => {
    if (!rolling) return;
    const t = setInterval(() => setFlick([0, 0, 0].map(() => 1 + Math.floor(Math.random() * 8))), 70);
    return () => clearInterval(t);
  }, [rolling]);
  const faces = rolling ? flick : roll ? roll.dice : [8, 8, 8];
  return html`<div class=${"gx-tray" + (rolling ? " rolling" : "")}>
    <div class="gx-dice">${faces.map((d, i) => html`<div class=${"d8" + (!rolling && roll && roll.low === i ? " low" : "") + (!roll && !rolling ? " idle" : "")} style=${`--i:${i}`}><span>${d}</span></div>`)}</div>
    <div class=${"gx-sum" + (roll && !rolling ? " show" : "")}>${roll && !rolling ? html`<b class=${roll.total >= 15 ? "hi" : roll.total < 10 ? "lo" : ""}>${roll.total}</b>${roll.sum < 6 ? html`<small>${roll.sum}, raised to 6</small>` : html`<small>${roll.dice.filter((_, i) => i !== roll.low).join(" + ")}</small>`}` : ""}</div>
  </div>`;
}
const toneOf = t => (t >= 15 ? "hi" : t < 10 ? "lo" : "");

function StepRoll({ g, up, next, back }) {
  const [rolling, setRolling] = useState(false);
  const [last, setLast] = useState(null);
  const cur = g.sets.length ? g.sets[g.sets.length - 1] : [];
  const full = cur.length === 7;
  const canSecond = g.sets.length === 1 && full && num(g.karma) >= 10;
  const rollOne = () => new Promise(res => {
    setRolling(true);
    setTimeout(() => {
      const r = R.rollAttributeDetail();
      up(x => { const sets = x.sets.length ? x.sets.map(s => s.slice()) : [[]]; sets[sets.length - 1].push(r); return { sets }; });
      setLast(r); setRolling(false); res();
    }, 950);
  });
  const rollRest = async () => { const left = 7 - cur.length; for (let i = 0; i < left; i++) { await rollOne(); await new Promise(r => setTimeout(r, 450)); } };
  const second = () => { up(x => ({ sets: [...x.sets, []] })); setLast(null); };
  const setRow = (s, idx) => html`<div class="gx-set"><span class="lbl">${g.sets.length > 1 ? (idx ? "Second set" : "First set") : "Your rolls"}</span>
    <div class="gx-slots">${ROMAN.map((n, i) => html`<div class=${"gx-slot " + (s[i] ? "got " + toneOf(s[i].total) : "") + (i === s.length && !rolling && s === cur && !full ? " next" : "")}>
      <small>${n}</small><b>${s[i] ? s[i].total : "·"}</b></div>`)}</div>
    ${s.length === 7 && html`<span class="muted">Total ${s.reduce((a, r) => a + r.total, 0)}</span>`}</div>`;
  return html`<section class="gx-step">
    <p class="gx-kicker">Fate is cast in brass and bone</p>
    <h2 class="gx-title">Roll for ${g.name.trim() || "your character"}</h2>
    <p class="gx-lede">Seven rolls, one for each attribute. Each is three eight-sided dice: the lowest is set aside and the other two are added, never less than 6. Ten is the measure of common folk; you'll decide which roll goes where.</p>
    <${DiceTray} roll=${rolling ? null : last} rolling=${rolling} />
    <div class="gx-rollbtns">
      ${!full && html`<button class="btn primary big" disabled=${rolling} onClick=${rollOne}>${rolling ? "Rolling…" : `Roll ${ROMAN[cur.length] || "I"}`}</button>
        ${cur.length > 0 && html`<button class="btn" disabled=${rolling} onClick=${rollRest}>Roll the rest</button>`}`}
      ${canSecond && html`<button class="btn" onClick=${second}>Roll a second set (−10 Karma)</button>`}
    </div>
    ${g.sets.length === 1 && full && num(g.karma) < 10 && html`<p class="muted center">A second set costs 10 Karma; this character starts with ${num(g.karma)}.</p>`}
    ${g.sets.map((s, i) => setRow(s, i))}
    <${GxNav} back=${back} next=${full ? next : null} nextLabel=${g.sets.length > 1 ? "Choose a set" : "Keep these rolls"} hint=${full ? "" : "Roll all seven to continue."} />
  </section>`;
}

function StepChoose({ g, up, next, back }) {
  return html`<section class="gx-step">
    <p class="gx-kicker">Two fates, one life</p>
    <h2 class="gx-title">Which set will ${g.name.trim() || "they"} carry?</h2>
    <p class="gx-lede">The second set cost 10 Karma, whichever you keep.</p>
    <div class="gx-sets">${g.sets.map((s, i) => html`<button class=${"gx-pick" + (g.chosen === i ? " on" : "")} aria-pressed=${g.chosen === i} onClick=${() => up({ chosen: i, assign: {} })}>
      <span class="lbl">${i ? "Second set" : "First set"}</span>
      <div class="gx-vals">${s.map(r => r.total).sort((a, b) => b - a).map(t => html`<b class=${toneOf(t)}>${t}</b>`)}</div>
      <span class="muted">Total ${s.reduce((a, r) => a + r.total, 0)} · ${s.filter(r => r.total < 10).length} broken</span></button>`)}</div>
    <${GxNav} back=${back} next=${next} nextLabel="Shape this fate" />
  </section>`;
}

function StepShape({ g, up, next, back }) {
  const set = g.sets[g.chosen] || [];
  const [held, setHeld] = useState(null);   // index into the set of the roll in hand
  const placed = new Set(Object.values(g.assign));
  const order = set.map((r, i) => i).sort((a, b) => set[b].total - set[a].total);
  const place = k => {
    const at = g.assign[k];
    if (held === null) { if (at !== undefined) up(x => { const a = Object.assign({}, x.assign); delete a[k]; return { assign: a }; }); return; }
    up(x => { const a = Object.assign({}, x.assign); Object.keys(a).forEach(q => { if (a[q] === held) delete a[q]; }); a[k] = held; return { assign: a }; });
    setHeld(null);
  };
  const autoFill = () => { const free = order.filter(i => !placed.has(i)); const a = Object.assign({}, g.assign); R.ATTRS.forEach(at => { if (a[at.k] === undefined) a[at.k] = free.shift(); }); up({ assign: a }); };
  const done = R.ATTRS.every(a => g.assign[a.k] !== undefined);
  return html`<section class="gx-step">
    <p class="gx-kicker">The dice decide the clay; you decide the shape</p>
    <h2 class="gx-title">Shape ${g.name.trim() || "your character"}</h2>
    <p class="gx-lede">Tap a roll, then tap the attribute it belongs to. Tap a placed roll to take it back.</p>
    <div class="gx-hand" role="group" aria-label="Your rolls">${order.map(i => html`<button class=${"gx-chip " + toneOf(set[i].total) + (held === i ? " held" : "") + (placed.has(i) ? " used" : "")}
        aria-pressed=${held === i} disabled=${placed.has(i)} onClick=${() => setHeld(held === i ? null : i)}>${set[i].total}</button>`)}</div>
    <div class="gx-attrs">${R.ATTRS.map(a => { const at = g.assign[a.k], v = at !== undefined ? set[at].total : null;
      return html`<button class=${"gx-attr" + (v !== null ? " filled " + toneOf(v) : "") + (held !== null ? " target" : "")} onClick=${() => place(a.k)}>
        <span class="gx-an"><b>${a.n}</b><small>${R.ATTR_BLURB[a.k]}</small></span>
        <span class="gx-av">${v !== null ? html`<b>${v}</b><small>${v < 10 ? `broken · can rise to ${v + 10}` : v === 10 ? "median" : `+${v - 10}`}</small>` : html`<i>—</i>`}</span></button>`; })}</div>
    <div class="row gx-shapebtns">${!done && placed.size > 0 && html`<button class="btn small" onClick=${autoFill}>Fill the rest, highest first</button>`}
      ${placed.size > 0 && html`<button class="btn small" onClick=${() => { up({ assign: {} }); setHeld(null); }}>Clear all</button>`}</div>
    <${GxNav} back=${back} next=${next} disabled=${!done} nextLabel="Awaken" hint=${done ? "" : `${7 - placed.size} left to place`} />
  </section>`;
}

function StepAwaken({ g, back, finish }) {
  const set = g.sets[g.chosen] || [];
  const extra = g.sets.length > 1 ? 10 : 0;
  return html`<section class="gx-step gx-awaken">
    <p class="gx-kicker">The gears catch. A heart begins to tick.</p>
    <${GxFace} face=${g.face} big />
    <h2 class="gx-title gx-name">${g.name.trim()}</h2>
    <p class="muted">${[g.campaign, `${Math.max(0, num(g.karma) - extra)} Karma to spend`].filter(Boolean).join(" · ")}</p>
    <div class="gx-final">${R.ATTRS.map(a => { const v = set[g.assign[a.k]].total; return html`<div class=${"gx-fa " + toneOf(v)}><small>${a.n}</small><b>${v}</b></div>`; })}</div>
    <${GxNav} back=${back} next=${finish} nextLabel="Begin the tale" />
  </section>`;
}
/* ================= GM table ================= */
// Initiative is a deck: one card per combatant, a second card for anyone with Dexterity above 15.
// The deck is shuffled at the start of each round and drawn from the top. A combatant acts the first
// time one of their cards comes up; their extra card is skipped when it appears later that round.
const CAMPAIGNS = ["Tears of Eithos", "Talon Saga", "One-shot"];
const KIND_LABEL = { pc: "Character", enemy: "Enemy", effect: "Effect" };
const PLACEMENTS = [["shuffle", "Shuffle into the deck"], ["next", "Next card"], ["bottom", "Bottom of the deck"], ["later", "From next round"]];

function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const blankEncounter = () => ({ v: 1, round: 0, combatants: [], deck: [], drawn: [], current: null, acted: [], hist: [] });
const cardOwner = card => String(card).split(":")[0];

function combatantDex(comb, charMap) {
  if (comb.kind === "pc") { const ch = charMap[comb.charId]; return ch ? R.attr(norm(ch), "DEX") : 10; }
  return num(comb.dex);
}
function cardCount(comb, charMap) { return comb.kind === "effect" ? 1 : combatantDex(comb, charMap) > 15 ? 2 : 1; }
function cardsOf(comb, charMap) { return Array.from({ length: cardCount(comb, charMap) }, (_, k) => `${comb.id}:${k}`); }

// ---- deck operations: each takes a copy of the encounter and changes it in place
function newRound(e, charMap) {
  e.round = num(e.round) + 1; e.acted = []; e.drawn = []; e.current = null;
  e.deck = shuffled(e.combatants.filter(c => !c.out).flatMap(c => cardsOf(c, charMap)));
}
function drawNext(e, charMap) {
  // Draw until someone who hasn't acted comes up. If the deck runs out (or only extra cards are left),
  // shuffle a new round and keep drawing.
  e.current = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    if (!e.deck.length) newRound(e, charMap);
    while (e.deck.length) {
      const card = e.deck.shift(); const cid = cardOwner(card);
      const comb = e.combatants.find(c => c.id === cid);
      if (!comb || comb.out) continue;
      if (e.acted.includes(cid)) { e.drawn.push({ card, skip: true }); continue; }
      e.acted.push(cid); e.drawn.push({ card }); e.current = card;
      if (comb.kind === "effect" && !comb.recurring) comb.out = true;   // a one-off effect is spent once it fires
      return;
    }
  }
}
// Put a party member into the encounter (once) and deal their cards.
function addCharacter(e, ch, charMap, placement) {
  if (!ch || e.combatants.some(c => c.charId === ch.id)) return;
  const comb = { id: rid(), kind: "pc", charId: ch.id, name: ch.name };
  e.combatants.push(comb); placeCards(e, cardsOf(comb, charMap), placement);
}
function placeCards(e, cards, placement) {
  if (placement === "later" || !num(e.round)) return;   // before the first round, everyone joins the first shuffle anyway
  cards.forEach(card => {
    if (placement === "next") e.deck.unshift(card);
    else if (placement === "bottom") e.deck.push(card);
    else e.deck.splice(Math.floor(Math.random() * (e.deck.length + 1)), 0, card);
  });
}

/* ---------- lite character readout, shared by party cards and the initiative card ---------- */
function MiniBar({ label, cur, max, color, soft }) {
  const w = max ? R.clamp((cur / max) * 100, 0, 100) : 0;
  return html`<div class="mbar"><span class="lbl">${label}</span><span class="mtrack" style=${`background:${soft}`}><i style=${`width:${w}%;background:${color}`}></i></span><b>${cur}<small>/${max}</small></b></div>`;
}
function LiteStats({ c, updateChar, compact }) {
  const n = norm(c), d = derive(c), v = n.vitals, arm = R.wornArmor(n);
  const [amt, setAmt] = useState("");
  const hp = sign => { const k = Math.max(1, Math.floor(+amt || 1)); updateChar(c.id, x => { x.vitals.hp = R.clamp(d.cur.hp + sign * k, 0, d.max.hp); }); setAmt(""); };
  const wounds = Object.entries(v.wounds).filter(([, k]) => num(k) > 0).map(([k, cnt]) => `${cnt} ${k}`);
  const armCheck = arm ? R.armorCheck(n, arm) : null;
  return html`<div class="lite">
    <${MiniBar} label="HP" cur=${d.cur.hp} max=${d.max.hp} color="var(--blood)" soft="var(--blood-soft)" />
    ${!compact && html`<${MiniBar} label="Blood" cur=${d.cur.bp} max=${d.max.bp} color="var(--life)" soft="var(--life-soft)" />
    <${MiniBar} label="Tox" cur=${d.cur.tox} max=${d.max.tox} color="var(--tox)" soft="var(--tox-soft)" />`}
    <div class="hpctl row">
      <input class="inp" type="number" min="1" placeholder="1" aria-label=${`Amount for ${c.name}`} value=${amt} onInput=${e => setAmt(e.target.value)} />
      <button class="btn small" onClick=${() => hp(-1)}>Damage</button><button class="btn small" onClick=${() => hp(1)}>Heal</button>
      <span class="wbtns" role="group" aria-label="Wounds: left-click adds, right-click removes">${["light", "moderate", "mortal"].map(k => html`<button class="btn small" title=${`Left-click adds a ${k} wound, right-click removes one`} onClick=${() => updateChar(c.id, x => { x.vitals.wounds[k] = num(x.vitals.wounds[k]) + 1; })}
        onContextMenu=${e => { e.preventDefault(); if (num(c.vitals.wounds[k])) updateChar(c.id, x => { x.vitals.wounds[k] = Math.max(0, num(x.vitals.wounds[k]) - 1); addLog(x, `Treated a ${k} wound`); }); }}>± ${k === "moderate" ? "Mod." : k[0].toUpperCase() + k.slice(1)}</button>`)}</span>
    </div>
    <div class="litefacts">
      <span><span class="lbl">Wounds</span> ${wounds.length ? html`<b class="badtext">${wounds.join(" · ")} · bleeding ${d.bleedPerTurn}/turn</b>` : "None"}</span>
      <span><span class="lbl">Exhaustion</span> <b class=${num(v.exhaustion) >= 5 ? "badtext" : ""}>${num(v.exhaustion)}</b>${num(v.exhaustion) ? html` <small class="muted">${R.EXHAUSTION[num(v.exhaustion)]}</small>` : ""}</span>
      <span><span class="lbl">Armor</span> ${arm ? html`<b>${arm.name || R.ARMOR[arm.type].label}</b> <small class="muted">${R.ARMOR[arm.type].label} · AV ${num(arm.av)} · soak ${num(arm.soak)}/${armCheck.soakMax}</small>` : "None worn"}</span>
      <span><span class="lbl">Move</span> <b>${d.move} m</b>${d.enc.effective.defend ? html` <small class="muted">defend ${d.enc.effective.defend}%</small>` : ""}</span>
    </div>
    ${v.conditions.length > 0 && html`<div class="chips">${v.conditions.map((t, i) => html`<span class="cond">${t}<button aria-label=${`Remove ${t}`} onClick=${() => updateChar(c.id, x => { x.vitals.conditions.splice(i, 1); })}>×</button></span>`)}</div>`}
  </div>`;
}

const playedBy = c => { const names = playersOf(c).map(u => (Store.members.find(m => m.uid === u) || {}).name).filter(Boolean); return names.length ? ` · played by ${names.join(", ")}` : ""; };
function PartyCard({ c, inDeck, onAdd, updateChar, openChar }) {
  return html`<article class="pcard">
    <header class="row">
      <${Thumb} c=${c} lg />
      <span class="who" style="flex:1;min-width:0"><b>${c.name || "Unnamed"}</b><span class="muted">${subtitle(c)}${playedBy(c)}</span></span>
      <button class="btn small" onClick=${() => openChar(c.id)}>Sheet</button>
      <button class=${"btn small" + (inDeck ? "" : " primary")} disabled=${inDeck} onClick=${onAdd}>${inDeck ? "In deck" : "Add to deck"}</button>
    </header>
    <${LiteStats} c=${c} updateChar=${updateChar} />
  </article>`;
}

/* ---------- the initiative card that's up now ---------- */
function CurrentCard({ e, comb, charMap, updateChar, act, openChar }) {
  if (!comb) return html`<div class="icard empty"><div class="ornate">${num(e.round) ? `Round ${e.round} is over` : "The deck is waiting"}</div>
    <p class="muted">${num(e.round) ? "Shuffle the deck to start the next round." : e.combatants.length ? "Shuffle the deck to draw the first card." : "Add characters, enemies or effects below, then shuffle."}</p></div>`;
  const ch = comb.kind === "pc" ? charMap[comb.charId] : null;
  const twoCards = cardCount(comb, charMap) === 2;
  return html`<div class=${"icard kind-" + comb.kind}>
    <header class="row">
      ${comb.kind === "pc" ? html`<${Thumb} c=${ch} name=${comb.name} lg />` : html`<span class=${"kindmark " + comb.kind}>${comb.kind === "enemy" ? "E" : "✦"}</span>`}
      <span class="who" style="flex:1;min-width:0"><span class="lbl">${KIND_LABEL[comb.kind]}${twoCards ? " · 2 cards" : ""}</span><b class="iname">${ch ? ch.name : comb.name}${comb.kind === "enemy" && num(comb.count) > 1 ? ` ×${comb.count}` : ""}</b></span>
      ${ch && html`<button class="btn small" onClick=${() => openChar(ch.id)}>Sheet</button>`}
    </header>
    ${comb.kind === "pc" && (ch ? html`<${LiteStats} c=${ch} updateChar=${updateChar} />` : html`<p class="muted">This character was deleted.</p>`)}
    ${comb.kind === "enemy" && html`<${EnemyStats} comb=${comb} act=${act} />`}
    ${comb.kind === "effect" && html`<p class="effnote">${comb.note || "No description."}</p><p class="muted">${comb.recurring ? "Fires every round." : "Fires once, then leaves the deck."}</p>`}
  </div>`;
}
function EnemyStats({ comb, act, small }) {
  const [amt, setAmt] = useState("");
  const change = sign => { const k = Math.max(1, Math.floor(+amt || 1)); act(e => { const c = e.combatants.find(x => x.id === comb.id); c.hp = Math.max(0, num(c.hp) + sign * k); }); setAmt(""); };
  return html`<div class="lite">
    ${num(comb.hpMax) > 0 && html`<${MiniBar} label="HP" cur=${num(comb.hp)} max=${num(comb.hpMax)} color="var(--blood)" soft="var(--blood-soft)" />
    <div class="hpctl row"><input class="inp" type="number" min="1" placeholder="1" aria-label=${`Amount for ${comb.name}`} value=${amt} onInput=${ev => setAmt(ev.target.value)} />
      <button class="btn small" onClick=${() => change(-1)}>Damage</button><button class="btn small" onClick=${() => change(1)}>Heal</button></div>`}
    ${!small && comb.note && html`<p class="effnote">${comb.note}</p>`}
  </div>`;
}

/* ---------- add combatants ---------- */
function AddPanel({ e, party, charMap, act }) {
  const [kind, setKind] = useState("pc");
  const [f, setF] = useState({ name: "", count: 1, dex: 10, hp: "", note: "", recurring: false, placement: "shuffle" });
  const set = k => ev => setF(Object.assign({}, f, { [k]: ev.target.type === "checkbox" ? ev.target.checked : ev.target.value }));
  const inDeck = new Set(e.combatants.filter(c => c.kind === "pc").map(c => c.charId));
  const addPcs = ids => act(x => ids.forEach(id => addCharacter(x, charMap[id], charMap, f.placement)));
  const submit = ev => {
    ev.preventDefault();
    const name = f.name.trim(); if (!name) { toast(kind === "enemy" ? "Give the enemy a name first." : "Give the effect a name first."); return; }
    const comb = kind === "enemy"
      ? { id: rid(), kind: "enemy", name, count: Math.max(1, Math.floor(+f.count || 1)), dex: Math.floor(+f.dex || 10), hp: Math.floor(+f.hp || 0), hpMax: Math.floor(+f.hp || 0), note: f.note.trim() }
      : { id: rid(), kind: "effect", name, note: f.note.trim(), recurring: !!f.recurring };
    act(x => { x.combatants.push(comb); placeCards(x, cardsOf(comb, charMap), f.placement); });
    setF(Object.assign({}, f, { name: "", note: "", hp: "", count: 1 }));
    toast(`${name} added${num(e.round) && f.placement !== "later" ? ` (${PLACEMENTS.find(p => p[0] === f.placement)[1].toLowerCase()})` : ""}.`);
  };
  const free = party.filter(c => !inDeck.has(c.id));
  return html`<div class="addpanel">
    <div class="seg three" role="group" aria-label="What to add">
      ${[["pc", "Characters"], ["enemy", "Enemy"], ["effect", "Effect"]].map(([k, n]) => html`<button aria-pressed=${kind === k} onClick=${() => setKind(k)}>${n}</button>`)}</div>
    <div class="field"><label for="gm-place">Where the new cards go${num(e.round) ? "" : " (the first shuffle includes everyone)"}</label>
      <select id="gm-place" value=${f.placement} onChange=${set("placement")} disabled=${!num(e.round)}>${PLACEMENTS.map(([k, n]) => html`<option value=${k}>${n}</option>`)}</select></div>
    ${kind === "pc" ? html`<div class="chips">${free.map(c => html`<button class="btn small" onClick=${() => addPcs([c.id])}>+ ${c.name || "Unnamed"}</button>`)}
        ${free.length > 1 && html`<button class="btn small primary" onClick=${() => addPcs(free.map(c => c.id))}>+ Everyone shown</button>`}
        ${!free.length && html`<span class="muted">Everyone in this campaign is in the deck.</span>`}</div>`
      : html`<form class="addform" onSubmit=${submit}>
        <div class="field grow"><label for="gm-name">${kind === "enemy" ? "Enemy or group" : "Effect"}</label><input id="gm-name" value=${f.name} placeholder=${kind === "enemy" ? "Ash wolves" : "The bridge collapses"} onInput=${set("name")} /></div>
        ${kind === "enemy" ? html`
          <div class="field n"><label for="gm-count">How many</label><input id="gm-count" type="number" min="1" value=${f.count} onInput=${set("count")} /></div>
          <div class="field n"><label for="gm-dex">Dexterity</label><input id="gm-dex" type="number" min="0" max="20" value=${f.dex} onInput=${set("dex")} /></div>
          <div class="field n"><label for="gm-hp">HP</label><input id="gm-hp" type="number" min="0" placeholder="—" value=${f.hp} onInput=${set("hp")} /></div>`
        : html`<label class="row check"><input type="checkbox" checked=${f.recurring} onChange=${set("recurring")} />Every round</label>`}
        <div class="field grow full"><label for="gm-note">Notes</label><input id="gm-note" value=${f.note} placeholder=${kind === "enemy" ? "Weak to fire; flee at half HP" : "Everyone on the bridge rolls a Reflex save"} onInput=${set("note")} /></div>
        <button class="btn primary" type="submit">Add ${kind === "enemy" ? "enemy" : "effect"}${kind === "enemy" && +f.dex > 15 ? " · 2 cards" : ""}</button>
      </form>`}
  </div>`;
}

/* ---------- who is at the table (website only): roles and which characters each player sees ---------- */
function MembersPanel({ chars, updateChar }) {
  const [confirm, setConfirm] = useState(null);
  const [move, setMove] = useState(null);   // { from, to }: moving every character from one account to another
  const me = Store.table.uid;
  const members = Store.members.slice().sort((a, b) => (a.role === b.role ? (a.name || "").localeCompare(b.name || "") : a.role === "gm" ? -1 : 1));
  const give = (cid, uid) => updateChar(cid, x => { x.players = [...new Set([...playersOf(x), uid])]; });
  const take = (cid, uid) => updateChar(cid, x => { x.players = playersOf(x).filter(u => u !== uid); });
  const act = p => p.catch(() => toast("Couldn't change that just now. Try again."));
  const nobody = chars.filter(c => !playersOf(c).length);
  const nameOf = uid => (Store.members.find(m => m.uid === uid) || {}).name || "that account";
  // A forgotten password can't be reset (accounts have no real email), so the player makes a new account and the
  // GM moves everything across: every character and companion that lists the old account now lists the new one.
  const moveAll = async ({ from, to }) => {
    const list = chars.filter(c => playersOf(c).includes(from));
    try {
      for (const c of list) await updateChar(c.id, x => { x.players = [...new Set(playersOf(x).map(u => (u === from ? to : u)))]; });
      toast(`Moved ${list.length} ${list.length === 1 ? "character" : "characters"} to ${nameOf(to)}. You can remove ${nameOf(from)} from the table now.`);
    } catch { toast("Couldn't move them just now. Try again."); }
    setMove(null);
  };
  return html`<section class="frame"><${Sigils} seed="players" n=${1} lead="note" side="r" />
    <h2 class="h"><span>Players at the table</span><i class="orn" aria-hidden="true"></i></h2>
    <p class="sub">Players see only the characters you give them. GMs see everyone and run the deck.
      Forgot a password? The player makes a new account and joins with the table password, then you move their characters to it.</p>
    <div class="members">${members.map(m => { const mine = chars.filter(c => playersOf(c).includes(m.uid));
      return html`<div class="member">
        <div class="mhead"><b>${m.name}</b><span class=${"flag" + (m.role === "gm" ? " brass" : "")}>${m.role === "gm" ? "GM" : "Player"}</span>${m.uid === me && html`<span class="muted">you</span>`}
          ${m.uid !== me && html`<span class="mact">${confirm === m.uid
            ? html`<span class="muted">Remove ${m.name}?</span><button class="btn small danger" onClick=${() => { act(Store.table.remove(m.uid)); setConfirm(null); }}>Remove</button><button class="btn small" onClick=${() => setConfirm(null)}>Keep</button>`
            : html`<button class="btn small" onClick=${() => act(Store.table.setRole(m.uid, m.role === "gm" ? "player" : "gm"))}>${m.role === "gm" ? "Make player" : "Make GM"}</button>
              <button class="btn small danger" onClick=${() => setConfirm(m.uid)}>Remove</button>`}</span>`}</div>
        <div class="chips">${mine.map(c => html`<span class="cond">${c.name || "Unnamed"}<button aria-label=${`Take ${c.name || "this character"} from ${m.name}`} onClick=${() => take(c.id, m.uid)}>×</button></span>`)}
          <select class="inp give" aria-label=${`Give ${m.name} a character`} value="" onChange=${e => { const v = e.target.value; e.target.value = ""; if (v) give(v, m.uid); }}>
            <option value="">+ Give a character…</option>${chars.filter(c => !playersOf(c).includes(m.uid)).map(c => html`<option value=${c.id}>${c.name || "Unnamed"}${c.companionOf ? " (companion)" : ""}</option>`)}</select>
          ${mine.length > 0 && members.length > 1 && (!move || move.from !== m.uid) && html`<select class="inp give" aria-label=${`Move all of ${m.name}'s characters to another account`} value=""
            onChange=${e => { const v = e.target.value; e.target.value = ""; if (v) setMove({ from: m.uid, to: v }); }}>
            <option value="">Move all to…</option>${members.filter(o => o.uid !== m.uid).map(o => html`<option value=${o.uid}>${o.name}</option>`)}</select>`}</div>
        ${move && move.from === m.uid && html`<div class="mact">
          <span class="muted">Move ${mine.length} ${mine.length === 1 ? "character" : "characters"} from ${m.name} to ${nameOf(move.to)}?</span>
          <button class="btn small primary" onClick=${() => moveAll(move)}>Move</button><button class="btn small" onClick=${() => setMove(null)}>Cancel</button></div>`}
      </div>`; })}</div>
    ${nobody.length > 0 && html`<p class="muted">Not given to anyone yet: ${nobody.map(c => c.name || "Unnamed").join(", ")}.</p>`}
  </section>`;
}

/* ---------- backup and restore: every character (with portraits) in one file ---------- */
async function makeBackup(chars) {
  const portraits = {};
  for (const c of chars) {
    const src = portraitSrc(c); if (!src) continue;
    try { portraits[c.portraitAsset] = src.startsWith("data:") ? src : await shrinkImage(await (await fetch(src)).blob()); } catch {}
  }
  return JSON.stringify({ cw: "backup", v: 1, at: Date.now(), characters: Object.fromEntries(chars.map(c => [c.id, c])), portraits });
}
async function restoreBackup(b) {
  const moved = {};
  for (const [id, url] of Object.entries(b.portraits || {})) {
    if (!Store.assets) break;
    try { const blob = await (await fetch(url)).blob(); moved[id] = (await Store.assets.upload(new File([blob], id + ".jpg", { type: "image/jpeg" }))).id; } catch {}
  }
  for (const c of Object.values(b.characters)) {
    const x = clean(c); x.portraitAsset = moved[x.portraitAsset] || ""; x._rev = rid();
    await Store.flush(x);
  }
}
function BackupPanel({ chars }) {
  const fileRef = useRef(); const [busy, setBusy] = useState(""); const [pending, setPending] = useState(null);
  const download = async () => {
    setBusy("Packing…");
    try { await saveFile(`clockwork-backup-${new Date().toISOString().slice(0, 10)}.json`, await makeBackup(chars)); toast(`Saved ${chars.length} character${chars.length === 1 ? "" : "s"}.`); }
    catch { toast("Couldn't make the backup just now."); }
    setBusy("");
  };
  const pick = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    try { const b = JSON.parse(await f.text()); if (b.cw !== "backup" || !b.characters) throw 0; setPending(b); }
    catch { toast("That isn't a Clockwork backup file."); }
  };
  const restore = async () => {
    if (Store.readOnly) { toast("You can view these characters but not change them."); return; }
    const b = pending; setPending(null); setBusy("Restoring…");
    try { await restoreBackup(b); toast(`Restored ${Object.keys(b.characters).length} characters.`); }
    catch { toast("Couldn't finish restoring. Try again."); }
    setBusy("");
  };
  return html`<section class="frame"><h2 class="h"><span>Table backup</span><i class="orn" aria-hidden="true"></i></h2>
    <p class="sub">Every character and portrait in one file. Use it to keep a copy, or to move your table to another site.</p>
    ${pending ? html`<div class="confirm"><span>Restore ${Object.keys(pending.characters).length} characters? Any already here with the same ID are replaced.</span>
        <button class="btn small primary" onClick=${restore}>Restore</button><button class="btn small" onClick=${() => setPending(null)}>Cancel</button></div>`
      : html`<div class="row"><button class="btn" disabled=${!!busy || !chars.length} onClick=${download}>Download backup</button>
        <button class="btn" disabled=${!!busy} onClick=${() => fileRef.current.click()}>Restore from backup</button>
        <input ref=${fileRef} type="file" accept="application/json,.json" hidden onChange=${pick} />${busy && html`<span class="muted">${busy}</span>`}</div>`}
  </section>`;
}

/* ---------- the whole GM screen ---------- */
function GMView({ chars, updateChar, openChar }) {
  const [camp, setCamp] = useState(() => lsGet("cw-gm-camp", "all"));
  const [reveal, setReveal] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(false);
  useEffect(() => lsSet("cw-gm-camp", camp), [camp]);
  const charMap = Object.fromEntries(chars.map(c => [c.id, c]));
  const party = chars.filter(c => camp === "all" || (camp === "none" ? !c.campaign : c.campaign === camp));
  const e = Object.assign(blankEncounter(), Store.encounter || {});
  const act = fn => {
    if (Store.readOnly) { toast("You can watch the initiative deck but not change it."); return; }
    const x = clean(e); const snap = clean(e); delete snap.hist; delete snap.t;
    fn(x); x.hist = [snap, ...(e.hist || [])].slice(0, 10);
    Store.saveEncounter(x);
  };
  const undo = () => { if (!e.hist || !e.hist.length) return; quietUntil.current = performance.now() + 400; const [prev, ...rest] = e.hist; Store.saveEncounter(Object.assign({}, prev, { hist: rest })); };
  const comb = cid => e.combatants.find(c => c.id === cid);
  const nameOf = c => (c ? (c.kind === "pc" ? (charMap[c.charId] ? charMap[c.charId].name : c.name) : c.name + (c.kind === "enemy" && num(c.count) > 1 ? ` ×${c.count}` : "")) : "Removed");
  const current = e.current ? comb(cardOwner(e.current)) : null;
  const roundDone = num(e.round) > 0 && e.deck.every(card => { const o = cardOwner(card), cb = comb(o); return e.acted.includes(o) || !cb || cb.out; });
  const drawLabel = !num(e.round) ? "Shuffle and draw" : roundDone ? `Shuffle for round ${num(e.round) + 1}` : "Draw next card";
  const activeCount = e.combatants.filter(c => !c.out).length;
  // Motion (only for changes while the table is open, never on opening it): a drawn card flips over, a new round
  // riffles the deck, and each card drawn is dealt into "This round".
  // Undo steps back quietly.
  const cardRef = useRef(), roundRef = useRef(), leftRef = useRef(), drawnRef = useRef(), quietUntil = useRef(0);
  const moving = () => performance.now() > quietUntil.current;
  useChange(`${num(e.round)}:${e.current || ""}`, () => moving() && replay(cardRef.current, "flip"), "gm");   // same card opening a new round still flips
  useChange(num(e.round), (from, to) => { if (to > from && moving()) { replay(roundRef.current, "bump"); replay(leftRef.current, "riffle"); } }, "gm");
  // A new round empties "This round" before its first card goes in, so a shorter list means deal from the start.
  useChange(`${num(e.round)}:${e.drawn.length}`, (was, now) => {
    const ol = drawnRef.current; if (!ol || !moving()) return;
    const [r0, n0] = was.split(":").map(Number), [r1, n1] = now.split(":").map(Number);
    const start = r1 === r0 ? n0 : 0;
    for (let i = start; i < n1; i++) replay(ol.children[i], "dealt", (i - start) * 70);
  }, "gm");

  return html`<div class="tabpane gm">
    <div class="row campbar" role="group" aria-label="Campaign">
      <span class="lbl">Campaign</span>
      ${[["all", "All"], ...CAMPAIGNS.map(x => [x, x]), ["none", "No campaign"]].map(([k, n]) => html`<button class=${"btn small" + (camp === k ? " primary" : "")} aria-pressed=${camp === k} onClick=${() => setCamp(k)}>${n}</button>`)}
    </div>
    ${Store.table && html`<${MembersPanel} chars=${chars} updateChar=${updateChar} />`}
    <div class="gmgrid">
      <section class="frame"><${Sigils} seed="initiative deck" n=${1} lead="skill" side="r" />
        <h2 class="h"><span>Initiative deck</span><i class="orn" aria-hidden="true"></i></h2>
        <p class="sub">One card each, two for Dexterity above 15. Shuffled every round.</p>
        <div class="deckbar">
          <div class="stat"><b ref=${roundRef}>${num(e.round) || "—"}</b><span>Round</span></div>
          <div class="stat"><b>${num(e.round) ? e.combatants.filter(c => !c.out && !e.acted.includes(c.id)).length : activeCount}</b><span>Still to act</span></div>
          <div class="stat" ref=${leftRef}><b>${e.deck.length}</b><span>Cards left</span></div>
          <div class="deckbtns"><button class="btn primary big" disabled=${!activeCount} onClick=${() => act(x => drawNext(x, charMap))}>${drawLabel}</button>
            <button class="btn" disabled=${!(e.hist && e.hist.length)} onClick=${undo}>Undo</button></div>
        </div>
        <div class="icardwrap" ref=${cardRef}><${CurrentCard} e=${e} comb=${current} charMap=${charMap} updateChar=${updateChar} act=${act} openChar=${openChar} /></div>

        ${e.drawn.length > 0 && html`<div class="drawn"><span class="lbl">This round</span><ol ref=${drawnRef}>
          ${e.drawn.map(dd => { const c = comb(cardOwner(dd.card)); return html`<li class=${(dd.skip ? "skip " : "") + (dd.card === e.current ? "now " : "") + (c ? "k-" + c.kind : "")} title=${dd.skip ? "Extra card. They already acted this round." : ""}>${nameOf(c)}${dd.skip ? " · extra" : ""}</li>`; })}</ol></div>`}

        <div class="row" style="margin-top:14px;justify-content:space-between">
          <span class="lbl">The deck</span>
          <button class="btn small" disabled=${!e.deck.length} onClick=${() => setReveal(!reveal)}>${reveal ? "Hide upcoming cards" : "Peek at upcoming cards"}</button></div>
        ${reveal && e.deck.length > 0 && html`<ol class="upcoming">${e.deck.map((card, i) => { const c = comb(cardOwner(card)); const extra = e.acted.includes(cardOwner(card));
          return html`<li class=${(extra ? "skip " : "") + (c ? "k-" + c.kind : "")}><span>${nameOf(c)}${extra ? " · extra, will be skipped" : ""}</span>
            <span class="row"><button class="iconbtn" aria-label="Move up" disabled=${i === 0} onClick=${() => act(x => { [x.deck[i - 1], x.deck[i]] = [x.deck[i], x.deck[i - 1]]; })}>↑</button>
            <button class="iconbtn" aria-label="Move down" disabled=${i === e.deck.length - 1} onClick=${() => act(x => { [x.deck[i + 1], x.deck[i]] = [x.deck[i], x.deck[i + 1]]; })}>↓</button>
            <button class="iconbtn" aria-label="Remove this card" onClick=${() => act(x => { x.deck.splice(i, 1); })}>×</button></span></li>`; })}</ol>`}

        <div class="lbl" style="margin-top:18px">In this encounter</div>
        <div class="roster-list">${e.combatants.length ? e.combatants.map(c => html`<div class=${"crow k-" + c.kind + (c.out ? " out" : "")}>
            <span class=${"kindmark sm " + c.kind}>${c.kind === "pc" ? "C" : c.kind === "enemy" ? "E" : "✦"}</span>
            <span class="cname">${nameOf(c)}<small class="muted"> · ${c.kind === "effect" ? (c.recurring ? "every round" : c.out ? "spent" : "once") : `${cardCount(c, charMap) > 1 ? "2 cards" : "1 card"}, Dex ${combatantDex(c, charMap)}`}</small></span>
            ${c.kind === "enemy" && num(c.hpMax) > 0 && html`<span class="calc">${num(c.hp)}/${num(c.hpMax)} HP</span>`}
            <button class="btn small" onClick=${() => act(x => { const y = x.combatants.find(z => z.id === c.id); y.out = !y.out; if (y.out) x.deck = x.deck.filter(card => cardOwner(card) !== c.id); })}>${c.out ? "Return" : c.kind === "effect" ? "Disable" : "Out"}</button>
            <button class="iconbtn" aria-label=${`Remove ${nameOf(c)}`} onClick=${() => act(x => { x.combatants = x.combatants.filter(z => z.id !== c.id); x.deck = x.deck.filter(card => cardOwner(card) !== c.id); if (x.current && cardOwner(x.current) === c.id) x.current = null; })}>×</button>
          </div>`) : html`<p class="muted">No one yet.</p>`}</div>

        <div class="lbl" style="margin-top:18px">Add to the deck</div>
        <${AddPanel} e=${e} party=${party} charMap=${charMap} act=${act} />

        <div class="row" style="margin-top:18px">
          ${confirmEnd ? html`<span class="confirm">End the encounter and clear the deck for everyone?
              <button class="btn small danger" onClick=${() => { Store.saveEncounter(blankEncounter()); setConfirmEnd(false); setReveal(false); }}>End encounter</button>
              <button class="btn small" onClick=${() => setConfirmEnd(false)}>Keep</button></span>`
            : html`<button class="btn danger" disabled=${!e.combatants.length} onClick=${() => setConfirmEnd(true)}>End encounter</button>
              <button class="btn" disabled=${!e.combatants.length} onClick=${() => act(x => { x.round = 0; x.deck = []; x.drawn = []; x.current = null; x.acted = []; x.combatants.forEach(c => { if (c.kind === "effect" && !c.recurring) c.out = false; }); })}>Restart from round 1</button>`}
        </div>
      </section>

      <section class="frame"><${Sigils} seed="party" n=${1} lead="attr" side="l" />
        <h2 class="h"><span>Party</span><i class="orn" aria-hidden="true"></i></h2>
        <p class="sub">${party.length} character${party.length === 1 ? "" : "s"}${camp !== "all" ? ` in ${camp === "none" ? "no campaign" : camp}` : ""}. Damage, heal and add wounds right here.</p>
        <div class="partylist">${party.map(c => html`<${PartyCard} key=${c.id} c=${c} inDeck=${e.combatants.some(x => x.charId === c.id)} updateChar=${updateChar} openChar=${openChar}
            onAdd=${() => act(x => addCharacter(x, c, charMap, "shuffle"))} />`)}
          ${!party.length && html`<p class="muted">No characters here yet. Set a character's campaign on their sheet.</p>`}</div>
      </section>
    </div>
    <${BackupPanel} chars=${chars} />
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>

<style>
#cw-egg { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: rgb(8 6 4 / .82); backdrop-filter: blur(3px); }
#cw-egg .box { position: relative; width: min(720px, calc(100vw - 32px)); aspect-ratio: 3 / 2; max-height: calc(100vh - 32px); border: 2px solid #b88a3c; box-shadow: 0 0 0 4px #1b130b, 0 0 0 5px #6b4a1c, 0 20px 60px #000; background: #120d08; }
#cw-egg canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
#cw-egg .x { position: absolute; top: 6px; right: 8px; width: 32px; height: 32px; border: 1px solid #6b4a1c; background: #1b130b; color: #e9c27a; font: 20px/1 serif; cursor: pointer; }
#cw-egg .x:hover { border-color: #e9c27a; }
#cw-egg form { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 8px; background: #1b130b; border: 1px solid #b88a3c; }
#cw-egg form[hidden] { display: none; }
#cw-egg input { width: 150px; padding: 6px 8px; border: 1px solid #6b4a1c; background: #0d0905; color: #ffe2a8; font: 16px Georgia, serif; }
#cw-egg form button { padding: 6px 12px; border: 1px solid #e0b462; background: #8a2e1c; color: #ffe2a8; font: bold 14px Georgia, serif; cursor: pointer; }
#cw-egg form button:disabled { opacity: .5; cursor: default; }
</style>
<script>
/* Easter egg: "Skyward Boiler". Opened by clicking "Companion" in the header five times quickly,
   or by typing "steam" anywhere outside a text box. Self-contained; touches nothing in the app. */
(() => {
  const W = 720, H = 480;
  let open = false, raf = 0;
  const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  // Shared top-3 board in the site's Firestore (arcade/skyward-boiler/scores), same for every visitor.
  const scoresRef = () => {
    try { if (window.firebase && firebase.apps && firebase.apps.length) return firebase.firestore().collection("arcade").doc("skyward-boiler").collection("scores"); } catch {}
    return null;
  };

  function launch() {
    if (open || document.getElementById("cw-doom")) return; open = true;
    const wrap = document.createElement("div"); wrap.id = "cw-egg";
    wrap.innerHTML = `<div class="box" role="dialog" aria-label="Skyward Boiler, a hidden game"><canvas width="${W}" height="${H}"></canvas><button class="x" aria-label="Close">×</button>
      <form hidden><input maxlength="16" placeholder="Your name" aria-label="Your name for the high scores" autocomplete="nickname" /><button type="submit">Save</button></form></div>`;
    document.body.appendChild(wrap);
    const cv = wrap.querySelector("canvas"), g = cv.getContext("2d");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    let s, best = +store.get("cw-egg-best", 0) || 0;
    const form = wrap.querySelector("form"), nameBox = form.querySelector("input"), saveBtn = form.querySelector("button");
    const ref = scoresRef();
    let top = [], board = ref ? "loading" : "offline", pending = 0, note = "";
    const unsub = ref ? ref.orderBy("score", "desc").limit(3).onSnapshot(
      q => { top = q.docs.map(d => d.data()).map(x => ({ name: String(x.name || "?").slice(0, 16), score: +x.score || 0 })); board = "live"; },
      () => { board = "offline"; }) : null;
    const hideForm = () => { form.hidden = true; pending = 0; cv.focus(); };
    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = nameBox.value.trim().slice(0, 16);
      if (!name || !pending || !ref) return;
      saveBtn.disabled = true; note = "Saving…"; store.set("cw-egg-name", name);
      ref.add({ name, score: pending, at: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => { note = "Saved to the high scores."; hideForm(); })
        .catch(() => { note = "Couldn't save the score just now."; hideForm(); })
        .finally(() => { saveBtn.disabled = false; });
    });
    const reset = () => s = { state: "ready", y: H / 2, vy: 0, t: 0, score: 0, stacks: [], cogs: [], puffs: [], spawn: 0, speed: 3, shake: 0 };
    reset();
    const stars = Array.from({ length: 50 }, (_, i) => ({ x: (i * 137) % W, y: (i * 89) % (H * .6), r: (i % 3) * .5 + .5 }));
    const hills = Array.from({ length: 12 }, (_, i) => ({ x: i * 80, h: 40 + ((i * 53) % 60) }));

    const flap = () => {
      if (s.state === "over") { if (s.t > 30 && form.hidden) { reset(); note = ""; } return; }
      if (s.state === "ready") s.state = "fly";
      s.vy = -6.2;
      for (let i = 0; i < 4; i++) s.puffs.push({ x: 150, y: s.y + 14, vx: -1 - Math.random() * 2, vy: 1 + Math.random(), r: 4, a: .7 });
    };
    const close = () => { cancelAnimationFrame(raf); if (unsub) unsub(); wrap.remove(); removeEventListener("keydown", key, true); open = false; };
    const key = e => {
      if (e.target === nameBox) { if (e.key === "Escape") { e.preventDefault(); hideForm(); } return; }
      if (e.key === "Escape") { e.preventDefault(); close(); }
      else if (e.key === " " || e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); e.stopPropagation(); flap(); }
    };
    addEventListener("keydown", key, true);
    cv.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
    wrap.querySelector(".x").addEventListener("click", close);
    wrap.addEventListener("pointerdown", e => { if (e.target === wrap) close(); });

    const gear = (x, y, r, teeth, rot, fill) => {
      g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
      for (let i = 0; i < teeth * 2; i++) { const a = (i / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? r : r * 1.25; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      g.closePath(); g.fillStyle = fill; g.fill(); g.beginPath(); g.arc(0, 0, r * .4, 0, 7); g.fillStyle = "#120d08"; g.fill(); g.restore();
    };

    const crash = () => { if (s.state !== "fly") return; s.state = "over"; s.t = 0; s.shake = reduced ? 0 : 14; if (s.score > best) { best = s.score; store.set("cw-egg-best", best); }
      if (board === "live" && s.score > 0 && (top.length < 3 || s.score > top[top.length - 1].score)) {
        pending = s.score; form.hidden = false; nameBox.value = store.get("cw-egg-name", ""); setTimeout(() => nameBox.focus(), 0);
      } };
    const step = () => {
      s.t++;
      if (s.state === "fly") {
        s.vy = Math.min(s.vy + .32, 9); s.y += s.vy;
        s.speed = 3 + Math.min(3, s.score / 12);
        if (--s.spawn <= 0) {
          const gap = Math.max(130, 175 - s.score * 1.5), top = 60 + Math.random() * (H - 170 - gap);
          s.stacks.push({ x: W + 40, top, gap, passed: false });
          if (Math.random() < .6) s.cogs.push({ x: W + 40 + 120, y: 70 + Math.random() * (H - 180), got: false });
          s.spawn = Math.round(240 / s.speed * 1.6);
        }
        for (const p of s.stacks) {
          p.x -= s.speed;
          if (!p.passed && p.x + 30 < 130) { p.passed = true; s.score++; }
          const hitX = 112 < p.x + 32 && 168 > p.x - 32, hitY = s.y - 14 < p.top || s.y + 14 > p.top + p.gap;
          if (hitX && hitY) crash();
        }
        for (const c of s.cogs) { c.x -= s.speed; if (!c.got && Math.hypot(c.x - 140, c.y - s.y) < 26) { c.got = true; s.score += 3; } }
        s.stacks = s.stacks.filter(p => p.x > -60); s.cogs = s.cogs.filter(c => c.x > -30 && !c.got);
        if (s.y > H - 40 || s.y < 10) crash();
      } else if (s.state === "ready") s.y = H / 2 + Math.sin(s.t / 20) * 8;
      for (const p of s.puffs) { p.x += p.vx - (s.state === "fly" ? s.speed * .5 : 0); p.y += p.vy; p.r += .4; p.a -= .015; }
      s.puffs = s.puffs.filter(p => p.a > 0);
      if (s.shake) s.shake--;
    };

    const draw = () => {
      g.save();
      if (s.shake) g.translate((Math.random() - .5) * s.shake, (Math.random() - .5) * s.shake);
      const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1a1020"); sky.addColorStop(.6, "#4a2a1a"); sky.addColorStop(1, "#a85a22");
      g.fillStyle = sky; g.fillRect(-20, -20, W + 40, H + 40);
      g.fillStyle = "#f3d9a4"; for (const st of stars) { g.globalAlpha = .3 + .3 * Math.sin((s.t + st.x) / 30); g.fillRect(st.x, st.y, st.r, st.r); } g.globalAlpha = 1;
      gear(W - 110, 120, 50, 12, s.t / 300, "#3a2414"); gear(W - 40, 70, 26, 8, -s.t / 160, "#2c1b10");
      const off = (s.t * (s.state === "fly" ? s.speed * .3 : .5)) % 80;
      g.fillStyle = "#24160d"; g.beginPath(); g.moveTo(0, H);
      for (const h of hills) { g.lineTo(h.x - off, H - 30 - h.h); g.lineTo(h.x - off + 40, H - 30 - h.h); }
      g.lineTo(W + 80, H); g.fill();
      for (const p of s.stacks) {
        for (const [y0, y1] of [[0, p.top], [p.top + p.gap, H]]) {
          const gr = g.createLinearGradient(p.x - 30, 0, p.x + 30, 0); gr.addColorStop(0, "#5a3a18"); gr.addColorStop(.4, "#c99a4a"); gr.addColorStop(1, "#4a2e12");
          g.fillStyle = gr; g.fillRect(p.x - 26, y0, 52, y1 - y0);
          const lip = y0 === 0 ? y1 - 16 : y0; g.fillStyle = "#e0b462"; g.fillRect(p.x - 32, lip, 64, 16);
          g.fillStyle = "#3a2410"; for (let ry = y0 + 20; ry < y1 - 10; ry += 40) { g.beginPath(); g.arc(p.x - 18, ry, 2.5, 0, 7); g.arc(p.x + 18, ry, 2.5, 0, 7); g.fill(); }
        }
      }
      for (const c of s.cogs) gear(c.x, c.y, 10, 8, s.t / 15, "#ffd27a");
      for (const p of s.puffs) { g.globalAlpha = p.a; g.fillStyle = "#e8e2d6"; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); } g.globalAlpha = 1;
      // the airship
      g.save(); g.translate(140, s.y); g.rotate(Math.max(-.4, Math.min(.6, s.vy / 14)));

        g.font = "16px Georgia, serif"; g.fillStyle = "#e9c27a";

  // Trigger 1: five quick clicks on "Companion" in the header.
  let clicks = [];
  document.addEventListener("click", e => {
    if (!e.target.closest || !e.target.closest(".brand small")) return;

})();
</script>

<script>

  let ac = null; const SND = {}, SND_NAMES = ["shot", "m_alert", "m_die", "m_attack", "m_pain", "s_fire", "s_die", "door", "locked", "key", "pickup", "lever", "slam", "hurt", "click", "treasure"];

  const THEMES = [
    { base: "brick", alt: ["brick2", "brickskull"], floor: "stone2", deco: ["candles", "barrel", "torchstand"] },
    { base: "grey", alt: ["grey2", "greyvent"], floor: "stone", deco: ["barrel", "toxic", "plant"] },
    { base: "stone", alt: ["stone2", "moss", "gate"], floor: "stone2", deco: ["candles", "torchstand", "bones"] },
    { base: "teal", alt: ["teal2", "bars"], floor: "teal2", deco: ["plant", "barrel", "candles"] },
    { base: "earth", alt: ["earth2"], floor: "earth2", deco: ["bones", "barrel", "toxic"] },
    { base: "wood", alt: ["wood"], floor: "earth", deco: ["stove", "candles", "barrel"] },
    { base: "steel", alt: ["steel2", "steel3", "pipe"], floor: "steel3", deco: ["toxic", "stove", "barrel"] },
  ];
