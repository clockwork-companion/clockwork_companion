        ${[["Movement", `${d.move} m`], ["Climb · swim", `${d.climb} m`], ["Wound at", `${d.woundAt.light} / ${d.woundAt.moderate} / ${d.woundAt.mortal}`], ["Blood potency", d.potency],
           ["Rations per meal", d.rationsPerMeal], ["Rations per day", d.rationsPerDay], ["Cleanse die", d.cleanse], ["HP per long rest", d.hpRegen]].map(([k, val]) => html`<div class="fact"><span>${k}</span><b>${val}</b></div>`)}</div>
    </section>
  </div>`;
}

/* ================= skills & talents tab ================= */
// Every perk the character's skills have unlocked, as cards modelled on the rulebook's perk boxes (level and kind on the left,
// the usage icons above the text), plus talents of the player's own for whatever the rules don't cover.
const TYPE_SHORT = { P: "Passive", A: "Active", E: "Empow.", M: "Active" };
function unlockedPerks(c) {
  const out = [];
  const add = (name, lv, kind) => {
    const sd = SKILL_DATA.skills[name]; if (!sd || !lv) return;
    const got = [];
    sd.gs.forEach(g => g.p.forEach(p => { if (lv >= p.l) got.push(Object.assign({ key: `p:${name}:${p.l}`, group: g.n && g.n !== "Perks" ? g.n : "", flavor: g.f || "" }, p)); }));
    if (got.length) out.push({ name, lv, kind, attr: R.LEVELS[kind].attrOf(name), perks: got });
  };
  R.SKILL_GROUPS.forEach(g => g.skills.forEach(([n]) => add(n, num(c.skills[n]), "skill")));
  R.WEAPON_TYPES.forEach(([w]) => add(w, num(c.weaponSkills[w]), "weapon"));
  return out.sort((a, b) => b.lv - a.lv || a.name.localeCompare(b.name));
}
// Tick boxes for an ability's uses. Ticking box i marks i + 1 spent; unticking the last ticked box gives one back.
function UseBoxes({ c, ukey, uses, recharge, update, label }) {
  const max = Math.max(0, Math.floor(num(uses))); if (!max) return null;
  const spent = Math.min(max, num((c.uses || {})[ukey]));
  const set = n => update(x => { x.uses = x.uses || {}; if (n) x.uses[ukey] = n; else delete x.uses[ukey]; if (n > spent) addLog(x, `Used ${label}`); });
  return html`<div class="usebox"><span class="lbl">Uses</span>
    ${Array.from({ length: max }, (_, i) => html`<button type="button" class=${"usetick" + (i < spent ? " spent" : "")} aria-pressed=${i < spent}
      aria-label=${i < spent ? `Give back use ${i + 1} of ${label}` : `Spend use ${i + 1} of ${label}`} onClick=${() => set(i < spent ? i : i + 1)}></button>`)}
    <small class="muted">${spent >= max ? "All used · " : `${max - spent} left · `}${recharge ? `back on a ${recharge.toLowerCase()}` : "recharge not set"}</small></div>`;
}
function PerkCard({ c, p, update, skill }) {
  const t = p.t || "P";
  return html`<article class=${"perkcard t-" + t}>
    <div class="pbox"><b>${p.l}</b><small>${TYPE_SHORT[t]}</small></div>
    <div class="pmain"><div class="phead"><b class="pname">${p.group || skill}</b><${UsageLine} u=${p.u} /></div>
      <p>${p.x || "Not written yet."}</p>
      ${p.u && p.u.uses && html`<${UseBoxes} c=${c} ukey=${p.key} uses=${p.u.uses} recharge=${p.u.recharge} update=${update} label=${`${skill} ${p.l}`} />`}</div>
  </article>`;
}
const TALENT_TYPES = [["P", "Passive"], ["A", "Active"], ["E", "Empowerment"]];
function TalentCard({ c, t, i, update }) {
  const set = k => v => update(x => { x.talents[i][k] = v; });
  const u = { recharge: t.recharge || "", ap: t.ap === "" || t.ap == null ? "" : String(t.ap), uses: t.uses ? String(t.uses) : "", stamina: t.stamina ? String(t.stamina) : "", turns: t.turns ? String(t.turns) : "" };
  if (t.final) return html`<article class=${"perkcard talent t-" + (t.type || "P")}>
    <div class="pbox"><svg class="tstar" viewBox="0 0 20 20" aria-hidden="true">${TAB_ICONS.talents}</svg><small>${TYPE_SHORT[t.type || "P"]}</small></div>
    <div class="pmain"><div class="phead"><b class="pname">${t.name || "Unnamed talent"}</b><${UsageLine} u=${u} />
        <button type="button" class="iconbtn editbtn" aria-label=${`Edit ${t.name || "talent"}`} onClick=${() => update(x => { x.talents[i].final = false; })}>${PENCIL}</button></div>
      ${t.source && html`<i class="psource">${t.source}</i>`}
      <p>${t.text || "No description yet."}</p>
      ${t.uses > 0 && html`<${UseBoxes} c=${c} ukey=${"t:" + t.id} uses=${t.uses} recharge=${t.recharge} update=${update} label=${t.name || "talent"} />`}</div>
  </article>`;
  const id = k => `tl-${k}-${t.id}`;
  return html`<div class="wcard editing talentedit">
    <div class="title"><input aria-label="Talent name" placeholder="Talent name" value=${t.name} onInput=${e => set("name")(e.target.value)} /><span class="flag">Editing</span></div>
    <div class="grid2">
      <div class="mini"><label for=${id("type")}>Kind</label><select id=${id("type")} value=${t.type || "P"} onChange=${e => set("type")(e.target.value)}>${TALENT_TYPES.map(([k, n]) => html`<option value=${k}>${n}</option>`)}</select></div>
      <div class="mini"><label for=${id("src")}>Comes from</label><input id=${id("src")} placeholder="Runic tattoo" value=${t.source || ""} onInput=${e => set("source")(e.target.value)} /></div>
      ${t.type !== "P" && html`<${Mini} id=${id("uses")} label="Uses" min="0" value=${t.uses} onInput=${set("uses")} />
        <div class="mini"><label for=${id("rc")}>Recharges on</label><select id=${id("rc")} value=${t.recharge || ""} onChange=${e => set("recharge")(e.target.value)}>
          <option value="">—</option><option>Long rest</option><option>Short rest</option></select></div>
        <${Mini} id=${id("ap")} label="AP cost" min="0" value=${t.ap} onInput=${set("ap")} />
        <${Mini} id=${id("st")} label="Stamina cost" min="0" value=${t.stamina} onInput=${set("stamina")} />
        ${t.type === "E" && html`<${Mini} id=${id("tn")} label="Lasts (turns)" min="0" value=${t.turns} onInput=${set("turns")} />`}`}
    </div>
    <${AutoText} id=${id("text")} cls="inp" label="What it does" placeholder="What it does, when it works, and any catch." value=${t.text} onInput=${set("text")} />
    <div class="row" style="justify-content:space-between"><button class="btn small danger" onClick=${() => update(x => { x.talents.splice(i, 1); if (x.uses) delete x.uses["t:" + t.id]; })}>Remove</button>
      <button class="btn small primary" onClick=${() => update(x => { x.talents[i].final = true; })}>Done</button></div>
  </div>`;
}
function TalentsTab({ c, update, openSkill }) {
  const [filter, setFilter] = useState(() => lsGet("cw-perkfilter", "all"));
  useEffect(() => lsSet("cw-perkfilter", filter), [filter]);
  const all = unlockedPerks(c);
  const match = p => filter === "all" || (filter === "A" ? p.t === "A" || p.t === "M" : p.t === filter);
  const count = f => all.reduce((s, g) => s + g.perks.filter(p => f === "all" || (f === "A" ? p.t === "A" || p.t === "M" : p.t === f)).length, 0);
  const shown = all.map(g => Object.assign({}, g, { perks: g.perks.filter(match) })).filter(g => g.perks.length);
  const spentAny = Object.values(c.uses || {}).some(v => num(v));
  const addTalent = () => update(x => { x.talents.push({ id: rid(), name: "", source: "", type: "A", uses: 1, recharge: "Long rest", ap: "", stamina: "", turns: "", text: "", final: false }); });
  return html`<div class="tabpane">
    <section class="frame"><${Sigils} seed="perks" n=${1} lead="skill" side="r" /><${Head} title="Skills" topic="talents" />
      <p class="sub">Every perk unlocked so far. Tick a use when you spend one; rests recharge them. Click a skill's name for everything it grants.</p>
      <div class="row perkbar"><div class="seg" role="group" aria-label="Show perks">${[["all", "All"], ["A", "Active"], ["E", "Empowerment"], ["P", "Passive"]].map(([k, n]) => html`<button aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${n} <small>${count(k)}</small></button>`)}</div>
        ${spentAny && html`<button class="btn small" onClick=${() => update(x => { x.uses = {}; addLog(x, "Recharged every ability by hand"); })}>Recharge all</button>`}</div>
      ${shown.length ? shown.map(g => html`<div class="perkgroup">
        <h3><button type="button" class="sname" onClick=${() => openSkill(g.kind, g.name)}>${g.name}</button> <small>${g.kind === "weapon" ? R.proficiency(g.lv) : R.ATTR_NAME[g.attr]} · level ${g.lv}</small></h3>
        <div class="perkcards">${g.perks.map(p => html`<${PerkCard} key=${p.key} c=${c} p=${p} update=${update} skill=${g.name} />`)}</div></div>`)
      : html`<p class="muted emptyline">${all.length ? "No perks of that kind yet." : "No perks unlocked yet. A skill's first perk comes at level 3."}</p>`}
    </section>

    <section class="frame"><${Sigils} seed="talents" n=${1} lead="glyphs" side="l" /><${Head} title="Talents" />
      <p class="sub">Abilities the rules don't cover: a runic tattoo, a blessing, an heirloom's trick. Set one up, then press Done to turn it into a card.</p>
      <div class="perkcards">${c.talents.map((t, i) => html`<${TalentCard} key=${t.id} c=${c} t=${t} i=${i} update=${update} />`)}</div>
      <div class="row" style="margin-top:12px"><button class="btn" onClick=${addTalent}>+ Add talent</button></div>
    </section>
  </div>`;
}

/* ================= gear tab ================= */
function GearTab({ c, d, update }) {
  const e = d.enc;
  // needle position: 3 fifths of the bar cover 0→3×unit, then one fifth per tier
  const pos = (() => { const L = e.load, u = e.unit || 1; if (L <= 3 * u) return (L / (3 * u)) * 60; const extra = Math.min(4, (L - 3 * u) / u); return 60 + extra * 10; })();
  const addItem = () => update(x => { x.items.push({ id: rid(), name: "", qty: 1, size: "small" }); });
  const addWeapon = () => update(x => { x.weapons.push({ id: rid(), name: "", skill: "Slashing", hands: 1, size: "medium", damage: 6, crit: 5, accuracy: 0, dur: 100, durMax: 100, durDie: "d10", clip: 0, clipMax: 0, rangeOpt: 0, rangeMax: 0, reload: 0, props: "", where: "set", final: false }); });
  const addArmor = () => update(x => { x.armor.push({ id: rid(), name: "", type: "light", av: 2, soak: 30, soakMax: 30, worn: !x.armor.some(a => a.worn), where: "set" }); });
  const addProsthetic = () => update(x => { x.prosthetics.push({ id: rid(), name: "", type: R.PROSTHETIC_TYPES[0], props: "" }); });
  const it = (i, k) => v => update(x => { x.items[i][k] = v; });
  const ar = (i, k) => v => update(x => { x.armor[i][k] = v; });
  const pr = (i, k) => v => update(x => { x.prosthetics[i][k] = v; });
  const ef = e.effective;
  return html`<div class="tabpane">
    <section class="frame load"><${Sigils} seed="load" n=${1} side="r" /><${Head} title="Load" topic="load" />
      <p class="sub">Everything carried, counted in small-item slots. You slow down past ${e.capacity}.</p>
      <div class="row" style="justify-content:space-between"><span class="loadnum"><b>${e.load}</b> / ${e.capacity}</span>
        <span><b>${e.tier.name}</b>${e.ignored ? html` <span class="flag good">Strong Back ignores this</span>` : ""}</span></div>
      <div class="loadbar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><i class="needle" style=${`left:calc(${Math.min(99, pos)}% - 1px)`}></i></div>
      <div class="loadscale"><span>0</span><span>${e.limits[0]}</span><span>${e.limits[1]}</span><span>${e.limits[2]}</span><span>${e.limits[3]}</span></div>
      <div class="facts">${[["Travel", ef.explore === ef.day ? ef.explore : `${ef.explore} · ${ef.day} a day`], ["Defending", ef.defend == null ? "Can't defend" : ef.defend ? ef.defend + "%" : "No penalty"],
        ["Combat move", d.move + " m"], ["Weapon sets", `${e.setsUsed} of ${e.freeSets} free`]].map(([k, val]) => html`<div class="fact"><span>${k}</span><b>${val}</b></div>`)}</div>
    </section>

    <section class="frame"><${Head} title="Armor" topic="armor" /><p class="sub">Only one suit is worn at a time. Heavy armor counts as a large item, plate as huge.</p>
      <div class="cards">${c.armor.map((a, i) => { const chk = R.armorCheck(c, a); const t = R.ARMOR[a.type] || R.ARMOR.light;
        return html`<div class=${"wcard" + (a.worn ? " worn" : "")}>
          <div class="title"><input aria-label="Armor name" placeholder="Armor name" value=${a.name} onInput=${ev => ar(i, "name")(ev.target.value)} />
            <button class=${"btn small" + (a.worn ? " primary" : "")} onClick=${() => update(x => { x.armor.forEach((y, j) => (y.worn = j === i ? !y.worn : false)); })}>${a.worn ? "Worn" : "Wear"}</button></div>
          <div class="grid2">
            <div class="mini"><label for=${"at-" + a.id}>Type</label><select id=${"at-" + a.id} value=${a.type} onChange=${ev => ar(i, "type")(ev.target.value)}>${Object.entries(R.ARMOR).map(([k, x]) => html`<option value=${k}>${x.label}</option>`)}</select></div>
            <${Mini} id=${"av-" + a.id} label=${`AV ${t.av[0]}–${t.av[1]}`} value=${a.av} onInput=${ar(i, "av")} />
            <${Mini} id=${"sk-" + a.id} label="Soak" value=${a.soak} onInput=${ar(i, "soak")} />
            <${Mini} id=${"sm-" + a.id} label="Soak max" value=${a.soakMax} onInput=${ar(i, "soakMax")} />
          </div>
          <div class="track" style="background:var(--sunk)"><i style=${`width:${chk.soakMax ? Math.min(100, (num(a.soak) / chk.soakMax) * 100) : 0}%;background:var(--ink-2)`}></i></div>
          <div class="calc">Soak ${num(a.soak)}/${chk.soakMax}${chk.soakBonus ? ` (incl. +${chk.soakBonus} Armor Mastery)` : ""} · repair ${chk.repairCost} g, ${chk.repairDie}</div>
          ${!chk.ok && html`<div class="chips">${chk.problems.map(p => html`<span class="flag bad">${p}</span>`)}</div>`}
          <div class="row" style="justify-content:space-between"><span class="muted">${a.type === "light" ? "Casting −2×AV" : a.type === "medium" ? "Stealth −AV, casting −2×AV" : a.type === "heavy" ? "Dex skills −AV, Stealth disadv., Entrada −2×AV" : "Dex skills and saves −AV, Stealth disadv."}</span>
            <button class="btn small danger" onClick=${() => update(x => { x.armor.splice(i, 1); })}>Remove</button></div></div>`; })}
        <div class="wcard" style="place-content:center;border-style:dashed"><button class="btn" onClick=${addArmor}>+ Add armor</button></div></div>
    </section>

    <section class="frame"><${Head} title="Prosthetics" topic="prosthetics" />
      <p class="sub">Each prosthetic costs 7% Entrada and 4% Stealth, and needs one more ration a day.</p>
      ${c.prosthetics.length > 0 && html`<div class="tbl-wrap"><table class="ptable">
        <thead><tr><th>Name</th><th>Type</th><th>Unique properties</th><th></th></tr></thead>
        <tbody>${c.prosthetics.map((x, i) => html`<tr>
          <td><input class="inp" aria-label="Prosthetic name" placeholder="Brass forearm" value=${x.name} onInput=${ev => pr(i, "name")(ev.target.value)} /></td>
          <td><select class="inp" aria-label="Type" value=${x.type} onChange=${ev => pr(i, "type")(ev.target.value)}>${R.PROSTHETIC_TYPES.map(t => html`<option>${t}</option>`)}</select></td>
          <td class="wide"><${AutoText} cls="inp" label="Unique properties" placeholder="Hidden blade; grip strength +2" value=${x.props} onInput=${pr(i, "props")} /></td>
          <td><button class="iconbtn" aria-label=${`Remove ${x.name || "prosthetic"}`} onClick=${() => update(y => { y.prosthetics.splice(i, 1); })}>×</button></td></tr>`)}</tbody></table></div>`}
      <div class="row" style="margin-top:10px"><button class="btn" onClick=${addProsthetic}>+ Add prosthetic</button></div>
    </section>

    <section class="frame"><${Sigils} seed="weapons" n=${1} side="l" /><${Head} title="Weapons" topic="weapons" /><p class="sub">Two one-handed or one two-handed set ride free${e.freeSets > 2 ? ", plus a third from Strong Back" : ""}. Shields always count as large.</p>
      <div class="cards">${c.weapons.map((w, i) => html`<${WeaponCard} key=${w.id} c=${c} w=${w} i=${i} update=${update} />`)}
        <div class="wcard" style="place-content:center;border-style:dashed"><button class="btn" onClick=${addWeapon}>+ Add weapon</button></div></div>
    </section>

    <section class="frame"><${Head} title="Inventory" topic="load" />
      <p class="sub">Medium items take 2 slots, large 4, huge 8. Bundles (bandages, rope) fit 10 to a slot, ammo 50.</p>
      <div class="tbl-wrap"><table class="itable">
        <thead><tr><th>Item</th><th class="num">Qty</th><th>Size</th><th></th></tr></thead>
        <tbody>${c.items.map((x, i) => html`<tr>
          <td class="wide"><input class="inp" aria-label="Item name" placeholder="Item" value=${x.name} onInput=${ev => it(i, "name")(ev.target.value)} /></td>
          <td class="num"><input class="inp" style="width:60px;text-align:right" type="number" min="0" aria-label="Quantity" value=${x.qty} onInput=${ev => it(i, "qty")(+ev.target.value || 0)} /></td>
          <td><select class="inp" aria-label="Size" value=${R.ITEM_SIZE[x.size] ? x.size : "small"} onChange=${ev => update(y => { y.items[i].size = ev.target.value; delete y.items[i].per; })}>${R.ITEM_SIZES.map(([k, label]) => html`<option value=${k}>${label}</option>`)}</select></td>
          <td><button class="iconbtn" aria-label=${`Remove ${x.name || "item"}`} onClick=${() => update(y => { y.items.splice(i, 1); })}>×</button></td></tr>`)}
          ${!c.items.length && html`<tr><td colspan="4" class="muted">Nothing packed yet. Rations, rope, bandages and kits go here.</td></tr>`}</tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn" onClick=${addItem}>+ Add item</button>
        <button class="btn" onClick=${() => update(x => { [["Rations", 6, "small"], ["Bandages", 10, "bundle"], ["Rope (m)", 20, "bundle"], ["Camping kit", 1, "large"]].forEach(([n, q, sz]) => x.items.push({ id: rid(), name: n, qty: q, size: sz })); })}>+ Adventuring basics</button>
        <span class="coins"><label for=${"coins-" + c.id}>Coins</label><input id=${"coins-" + c.id} class="inp" type="number" min="0" value=${c.coins} onInput=${ev => update(x => { x.coins = +ev.target.value || 0; })} /><small class="muted">100 weigh one slot</small></span></div>
    </section>
  </div>`;
}

/* ================= weapon cards ================= */
// A weapon is set up in edit mode, then finalised into a compact card for play where only durability changes.
// The fields follow the weapon: melee weapons reach 2 m and have no clip; ranged weapons have a clip, ranges and
// a reload cost (rulebook, Weapon Combat); a shield blocks with Shield Mastery and always counts as large.
const PENCIL = html`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M11.5 2.5l2 2L6 12l-3 1 1-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
function WeaponCard({ c, w, i, update }) {
  const kind = R.weaponKind(w), wl = R.weaponLine(c, w);
  const set = (k, v) => update(x => { x.weapons[i][k] = v; });
  // Picking a skill keeps the card consistent: only ranged weapons keep a clip and ranges; a shield is always large.
  const setSkill = v => update(x => {
    const y = x.weapons[i]; y.skill = v; y.shield = v === "Shield";
    if (!R.RANGED_WEAPONS.includes(v)) Object.assign(y, { clip: 0, clipMax: 0, rangeOpt: 0, rangeMax: 0, reload: 0 });
    if (y.shield) Object.assign(y, { size: "large", accuracy: 0 });
  });
  const clipSize = num(w.clipMax), inClip = num(w.clip);
  const id = k => `w${k}-${w.id}`;
  const dur = num(w.dur), durMax = num(w.durMax);
  const reach = kind === "ranged" ? (num(w.rangeOpt) || num(w.rangeMax) ? `${num(w.rangeOpt)} / ${num(w.rangeMax)} m` : w.range || "—") : kind === "melee" ? "2 m" : "—";
  // Weapons saved before this existed count as finished once they have a name.
  const isFinal = w.final === true || (w.final === undefined && !!w.name);
  // Done settles the card into its finished form and the pencil unfolds it; firing recoils the clip, Reload sweeps it full.
  const card = useRef(), clipBox = useRef(), scope = w.id + animScope;
  useChange(isFinal, () => replay(card.current, isFinal ? "settle" : "unfold", 0, ["settle", "unfold"]), scope);
  useChange(inClip, (from, to) => replay(clipBox.current, to < from ? "recoil" : to === clipSize && to - from > 1 ? "reload" : "bump", 0, ["recoil", "reload", "bump"]), scope);
  if (isFinal) return html`<div ref=${card} class=${"wcard final kind-" + kind}>
    <div class="title"><b class="wname">${w.name || "Unnamed weapon"}</b>
      <span class="flag brass">${kind === "shield" ? "Shield" : wl.proficiency}</span>
      <button class="iconbtn" aria-label=${`Edit ${w.name || "weapon"}`} title="Edit" onClick=${() => set("final", false)}>${PENCIL}</button></div>
    <div class="wsub">${kind === "shield" ? "Shield · blocks with Shield Mastery" : `${w.skill} · ${kind === "ranged" ? "ranged" : "melee"}`} · ${num(w.hands) === 2 ? "two-handed" : "one-handed"} · ${w.where === "pack" ? "in the pack" : w.where === "stash" ? "stashed" : "in a set"}</div>
    <div class="wstats">
      <div><span>Damage</span><b>${num(w.damage)}</b></div>
      ${kind !== "shield" && html`<div><span>Crit</span><b>${wl.crit}%</b></div><div><span>Accuracy</span><b>${wl.accuracy >= 0 ? "+" : ""}${wl.accuracy}%</b></div>`}
      <div><span>${kind === "ranged" ? "Range" : "Reach"}</span><b>${reach}</b></div>
      ${kind === "ranged" && num(w.reload) ? html`<div><span>Reload</span><b>${num(w.reload)} AP</b></div>` : ""}
    </div>
    ${kind === "ranged" && html`<div class="wdur"><span class="lbl">Clip</span>
      <div class="row clipbox" ref=${clipBox}><button class="iconbtn" aria-label="Fire one" onClick=${() => set("clip", Math.max(0, inClip - 1))}>−</button>
        <input class="inp durin" type="number" min="0" max=${clipSize || undefined} aria-label="Rounds in the clip" value=${w.clip} onInput=${ev => set("clip", ev.target.value === "" ? "" : R.clamp(+ev.target.value, 0, clipSize || 999))} />
        <span class="muted">/ ${clipSize}</span>
        <button class="iconbtn" aria-label="Add one" onClick=${() => set("clip", Math.min(clipSize || 999, inClip + 1))}>+</button>
        <button class="btn small" disabled=${!clipSize || inClip >= clipSize} onClick=${() => set("clip", clipSize)}>Reload</button></div></div>`}
    <div class="wdur">
      <span class="lbl">Durability</span>
      <div class="track"><i style=${`width:${durMax ? R.clamp((dur / durMax) * 100, 0, 100) : 0}%;background:${dur <= 0 ? "var(--bad)" : "var(--ink-2)"}`}></i></div>
      <div class="row"><button class="iconbtn" aria-label="Lose 1 durability" onClick=${() => set("dur", Math.max(0, dur - 1))}>−</button>
        <input class="inp durin" type="number" min="0" aria-label="Durability" value=${w.dur} onInput=${ev => set("dur", ev.target.value === "" ? "" : Math.max(0, +ev.target.value))} />
        <span class="muted">/ ${durMax} · die ${w.durDie || "—"}</span>
        <button class="iconbtn" aria-label="Restore 1 durability" onClick=${() => set("dur", Math.min(durMax || Infinity, dur + 1))}>+</button></div>
      ${durMax > 0 && dur <= 0 && html`<span class="flag bad">Broken: gains a flaw</span>`}
    </div>
    ${w.props && html`<p class="wprops">${w.props}</p>`}
  </div>`;
  return html`<div ref=${card} class="wcard editing">
    <div class="title"><input aria-label="Weapon name" placeholder=${kind === "shield" ? "Shield name" : "Weapon name"} value=${w.name} onInput=${ev => set("name", ev.target.value)} />
      <span class="flag">Editing</span></div>
    <div class="grid2">
      <div class="mini"><label for=${id("s")}>Weapon skill</label><select id=${id("s")} value=${kind === "shield" ? "Shield" : w.skill} onChange=${ev => setSkill(ev.target.value)}>
        <optgroup label="Melee">${R.WEAPON_TYPES.filter(([t]) => !R.RANGED_WEAPONS.includes(t)).map(([t]) => html`<option>${t}</option>`)}</optgroup>
        <optgroup label="Ranged">${R.RANGED_WEAPONS.map(t => html`<option>${t}</option>`)}</optgroup>
        <optgroup label="Other"><option>Shield</option></optgroup></select></div>
      <div class="mini"><label for=${id("h")}>Hands</label><select id=${id("h")} value=${w.hands} onChange=${ev => set("hands", +ev.target.value)}><option value="1">One</option><option value="2">Two</option></select></div>
      ${kind !== "shield" && html`<div class="mini"><label for=${id("z")}>Size</label><select id=${id("z")} value=${w.size} onChange=${ev => set("size", ev.target.value)}>${Object.keys(R.SIZES).map(z => html`<option value=${z}>${z[0].toUpperCase() + z.slice(1)}</option>`)}</select></div>`}
      <div class="mini"><label for=${id("w")}>Carried</label><select id=${id("w")} value=${w.where || "set"} onChange=${ev => set("where", ev.target.value)}><option value="set">In a set</option><option value="pack">In the pack</option><option value="stash">Stashed</option></select></div>
    </div>
    <div class="wgroup"><span class="lbl">Combat</span><div class="grid2">
      <${Mini} id=${id("d")} label="Damage" value=${w.damage} onInput=${v => set("damage", v)} />
      ${kind !== "shield" && html`<${Mini} id=${id("c")} label="Crit %" value=${w.crit} onInput=${v => set("crit", v)} />
        <${Mini} id=${id("a")} label="Accuracy ±" value=${w.accuracy} onInput=${v => set("accuracy", v)} />`}
    </div></div>
    ${kind === "ranged" && html`<div class="wgroup"><span class="lbl">Ranged</span><div class="grid2">
      <${Mini} id=${id("cm")} label="Clip size" value=${w.clipMax} min="1" onInput=${v => update(x => { const y = x.weapons[i]; y.clipMax = v; if (num(y.clip) > num(v) || !num(y.clip)) y.clip = v; })} />
      <${Mini} id=${id("ro")} label="Optimal m" value=${w.rangeOpt} onInput=${v => set("rangeOpt", v)} />
      <${Mini} id=${id("rm")} label="Max range m" value=${w.rangeMax} onInput=${v => set("rangeMax", v)} />
      <${Mini} id=${id("rl")} label="Reload AP" value=${w.reload} onInput=${v => set("reload", v)} />
    </div></div>`}
    <p class="muted wnote">${kind === "melee" ? "Melee: reaches 2 m and has no clip." : kind === "ranged" ? "Ranged: attacks between the optimal and maximum range roll with disadvantage; beyond the maximum they miss." : "Shield: blocks with Shield Mastery and always counts as a large item."}</p>
    <div class="wgroup"><span class="lbl">Durability</span><div class="grid2">
      <${Mini} id=${id("du")} label="Current" value=${w.dur} onInput=${v => set("dur", v)} />
      <${Mini} id=${id("dm")} label="Maximum" value=${w.durMax} onInput=${v => set("durMax", v)} />
      <${Mini} id=${id("dd")} label="Die" type="text" value=${w.durDie} onInput=${v => set("durDie", v)} />
    </div></div>
    <div class="mini"><label for=${id("p")}>Properties and flaws</label>
      <${AutoText} id=${id("p")} value=${w.props} placeholder="Fast, Penetrating (2), Brittle (3)…" onInput=${v => set("props", v)} /></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn small danger" onClick=${() => update(x => { x.weapons.splice(i, 1); })}>Remove</button>
      <button class="btn small primary" onClick=${() => set("final", true)}>Done</button></div>
  </div>`;
}

/* ================= tabletop tab ================= */
function TableTab({ c, update, onDelete }) {
  const data = useMemo(() => R.toTabletop(c), [c]);
  const code = useMemo(() => JSON.stringify(data), [data]);
  const ta = useRef(); const [paste, setPaste] = useState(""); const [preview, setPreview] = useState(null); const [err, setErr] = useState(""); const [del, setDel] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(code); toast("Code copied. Paste it into the sheet's code box in Tabletop Simulator."); }
    catch { ta.current.focus(); ta.current.select(); toast("Selected the code. Press Ctrl+C (or Cmd+C) to copy it."); }
  };
  const save = async () => {
    try { await saveFile(`${(c.name || "character").replace(/[^\w-]+/g, "_")}.clockwork.json`, JSON.stringify(data, null, 2)); } catch {}
  };
  const check = () => {
    setErr(""); setPreview(null);
    try { const t = JSON.parse(paste.trim()); const n = R.fromTabletop(c, t);
      const dv = R.derived(n), dc = derive(c); const changes = [];
      const diff = (kind, names) => names.forEach(k => { const L = R.LEVELS[kind], was = L.get(c, k), now = L.get(n, k); if (was !== now) changes.push(`${kind === "attr" ? R.ATTR_NAME[k] : k} ${was} → ${now}`); });
      diff("attr", R.ATTRS.map(a => a.k)); diff("skill", Object.keys(R.SKILLS)); diff("weapon", R.WEAPON_TYPES.map(w => w[0])); diff("sec", R.SECONDARY.map(x => x.name));
      ["hp", "bp", "dp", "tox"].forEach(k => { if (dv.cur[k] !== dc.cur[k]) changes.push(`${k.toUpperCase()} ${dc.cur[k]} → ${dv.cur[k]}`); });
      if (num(n.vitals.exhaustion) !== num(c.vitals.exhaustion)) changes.push(`Exhaustion ${num(c.vitals.exhaustion)} → ${num(n.vitals.exhaustion)}`);
      if (num(n.karma) !== num(c.karma)) changes.push(`Karma ${num(c.karma)} → ${num(n.karma)}`);
      ["light", "moderate", "mortal"].forEach(k => { if (num(n.vitals.wounds[k]) !== num(c.vitals.wounds[k])) changes.push(`${k} wounds ${num(c.vitals.wounds[k])} → ${num(n.vitals.wounds[k])}`); });
      if (t.id && t.id !== c.id) changes.unshift(`Note: this code came from a different character (${t.name || "unnamed"}).`);
      setPreview({ n, changes });
    } catch (e) { setErr(e instanceof SyntaxError ? "That doesn't look like a complete code. Copy the whole text from the sheet's Export box." : e.message); }
  };
  return html`<div class="tabpane">
    <section class="two">
      <div class="frame"><${Sigils} seed="send to the table" n=${1} side="r" /><h2 class="h"><span>Send to the table</span><i class="orn" aria-hidden="true"></i></h2>
        <ol class="steps"><li>Copy this character's code.</li><li>In Tabletop Simulator, click <b>Load code</b> under your Clockwork sheet and paste it into the box.</li><li>Click <b>Apply</b>. Pips, vitals and your portrait fill in.</li></ol>
        <textarea ref=${ta} class="codebox" readonly aria-label="Tabletop code" value=${code} onFocus=${e => e.target.select()}></textarea>
        <div class="row"><button class="btn primary" onClick=${copy}>Copy code</button><button class="btn" onClick=${save}>Save as file</button>
          <span class="muted">${code.length.toLocaleString()} characters</span></div>
        ${!c.portraitUrl && html`<p class="muted">Tip: add a public image link under "Portrait link for Tabletop" so the sheet in TTS shows your art.</p>`}</div>
      <div class="frame"><h2 class="h"><span>Bring changes back</span><i class="orn" aria-hidden="true"></i></h2>
        <p class="muted" style="margin-top:0">After a session, click <b>Export</b> on the TTS sheet, copy its code and paste it here to update vitals, pips and Karma.</p>
        <textarea class="codebox" aria-label="Code from Tabletop Simulator" placeholder='{"cw":1, …}' value=${paste} onInput=${e => { setPaste(e.target.value); setPreview(null); setErr(""); }}></textarea>
        <div class="row"><button class="btn" disabled=${!paste.trim()} onClick=${check}>Check changes</button></div>
        ${err && html`<p style="color:var(--bad)">${err}</p>`}
        ${preview && html`<div class="panel" style="margin-top:10px">${preview.changes.length ? html`<div class="lbl">${preview.changes.length} change${preview.changes.length > 1 ? "s" : ""}</div>
          <ul style="margin:6px 0 10px;padding-left:18px">${preview.changes.slice(0, 30).map(x => html`<li>${x}</li>`)}</ul>
          <div class="row"><button class="btn primary" onClick=${() => { update(x => { Object.assign(x, preview.n, { id: x.id }); addLog(x, "Updated from Tabletop Simulator"); }); setPaste(""); setPreview(null); toast("Updated from the table."); }}>Apply changes</button>
            <button class="btn" onClick=${() => setPreview(null)}>Cancel</button></div>` : html`<p style="margin:0">Nothing differs from this character.</p>`}</div>`}
      </div>
    </section>
    <section class="frame"><h2 class="h"><span>Character</span><i class="orn" aria-hidden="true"></i></h2>
      ${del ? html`<div class="confirm"><span>Delete <b>${c.name || "this character"}</b> for everyone? This can't be undone.</span>
          <button class="btn small danger" onClick=${() => onDelete(c.id)}>Delete</button><button class="btn small" onClick=${() => setDel(false)}>Keep</button></div>`
        : html`<button class="btn danger" onClick=${() => setDel(true)}>Delete character</button>`}</section>
  </div>`;
}
/* ================= the Blackwall (Cyberpunk theme only) =================
   A living firewall of red and violet data, drawn with a WebGL fragment shader on a canvas behind the page.
   It only exists while the Cyberpunk theme is on. The pieces:
   - a curtain of vertical data streaks in three depths (a far, faintly pixelated violet layer behind red and magenta
     ones), each swaying and flickering at its own pace;
   - an upper edge that heaves in slow swells;
   - soft waves that ripple out from three points wandering slowly along the whole wall, bending the streaks;
   - now and then, for a fraction of a second, a few thin bands tear sideways, some briefly blocky.
   It is cheap by design: drawn at half resolution, capped at 30 frames a second, paused when the tab is hidden,
   and frozen into a single still frame for anyone who asks their device for reduced motion. Without WebGL, the
   theme's CSS stand-in (in app.css) is used instead. */
(function () {
  const FRAG = `
precision mediump float;
uniform vec2 res; uniform float t;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 3; i++) { v += a * noise(p); p = p * 2.07 + 13.1; a *= 0.5; } return v; }
// One layer of the curtain at depth z (0 = near, 1 = far). Far layers are denser, slower and dimmer.
float curtain(vec2 uv, float z, float rip) {
  float sc = mix(1.0, 2.4, z), sp = mix(1.0, 0.4, z);
  float warp = fbm(vec2(uv.x * 3.0 * sc, uv.y * 2.0 - t * 0.06 * sp + z * 7.0)) - 0.5;
  float x = uv.x + warp * 0.04 * (1.0 - 0.5 * z) + rip * 0.012 * (1.0 - z);
  float s1 = pow(abs(sin(x * 240.0 * sc + z * 5.0)), 22.0) * (0.45 + 0.55 * noise(vec2(x * 50.0 * sc, t * 0.7 * sp + z * 3.0)));
  float s2 = pow(abs(sin(x * 90.0 * sc + 1.3 + z * 2.0)), 34.0) * noise(vec2(x * 20.0 * sc + 5.0, t * 0.35 * sp + uv.y * 1.5));
  float s = s1 * 0.6 + s2 * 1.1;
  return s * (0.55 + 0.45 * noise(vec2(x * 80.0 * sc, uv.y * 14.0 + t * 1.2 * sp)));   // data packets running down
}
void main() {
  vec2 uv = gl_FragCoord.xy / res;
  float asp = res.x / res.y;
  // tearing: now and then, for a fraction of a second, a few thin horizontal bands slip sideways
  float ev = floor(t * 4.0);                                 // quarter-second slots
  float on = step(0.95, hash(vec2(ev, 3.1)));               // about one slot in twenty
  float band = floor(gl_FragCoord.y / (4.0 + 9.0 * hash(vec2(ev, 1.7))));
  float torn = on * step(0.72, hash(vec2(band, ev)));
  vec2 p = uv; p.x += torn * (hash(vec2(band + 3.0, ev)) - 0.5) * 0.035;
  // a little pixelation inside some torn bands
  float blocky = torn * step(0.75, hash(vec2(band + 9.0, ev)));
  vec2 cell = vec2(3.0) / res;
  p = mix(p, (floor(p / cell) + 0.5) * cell, blocky);
  // ripples from three sources that wander slowly along the whole wall; soft, no bright spot
  float rip = 0.0;
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    vec2 src = vec2(0.5 + 0.45 * sin(t * (0.021 + 0.009 * fi) + fi * 2.1), 0.10 + 0.06 * sin(t * 0.047 + fi * 1.3));
    float r = length((p - src) * vec2(asp, 1.0));
    rip += sin(r * 24.0 - t * (1.1 + 0.25 * fi) - fi * 2.0) * exp(-r * 2.6);
  }
  rip /= 3.0;
  // the heaving top edge
  float edge = 0.30 + 0.08 * fbm(vec2(p.x * 2.0 + t * 0.035, t * 0.05)) + 0.03 * sin(p.x * 7.0 - t * 0.45) + rip * 0.03;
  float body = smoothstep(edge + 0.18, edge - 0.08, p.y);
  // depth: a far, faintly pixelated violet layer, a middle layer, and a near layer that the ripples light up
  vec2 pf = (floor(p * res / 3.0) + 0.5) * 3.0 / res;
  float far = curtain(pf, 0.9, rip), mid = curtain(p + vec2(0.13, 0.0), 0.45, rip), near = curtain(p + vec2(0.37, 0.0), 0.0, rip);
  near *= 0.85 + 0.3 * rip;
  vec3 cFar = vec3(0.42, 0.22, 0.92), cMid = mix(vec3(0.85, 0.08, 0.3), vec3(0.9, 0.2, 0.65), p.x), cNear = mix(vec3(1.0, 0.1, 0.24), vec3(1.0, 0.28, 0.66), smoothstep(0.2, 1.0, p.x));
  float wF = far * 0.32, wM = mid * 0.55, wN = near * 0.85;
  float a = wF + wM + wN;

  a += 0.07 * (0.7 + 0.3 * rip) * smoothstep(0.0, 0.5, 1.0 - p.y);
  col = mix(col, vec3(0.3, 0.85, 1.0), torn * 0.35);      // torn bands flash faintly cyan
  float breathe = 0.85 + 0.15 * sin(t * 0.5) * sin(t * 0.19 + 1.0);
  a = clamp(a * body * breathe, 0.0, 1.0) * 0.6;         // kept in the background
  gl_FragColor = vec4(col * a, a);
}`;
  const VERT = "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }";
  let cv = null, gl = null, prog = null, raf = 0, last = 0, t0 = 0, uRes, uT;
  const still = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setup() {
    cv = document.createElement("canvas"); cv.className = "blackwall"; cv.setAttribute("aria-hidden", "true");
    gl = cv.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, powerPreference: "low-power" });
    if (!gl) { cv = null; return false; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const v = sh(gl.VERTEX_SHADER, VERT), f = sh(gl.FRAGMENT_SHADER, FRAG);
    if (!v || !f) { cv = null; return false; }

// A toothed wheel as one path: n teeth between radius r (tips) and r2 (roots), centred on cx, cy.
function gearPath(cx, cy, r, r2, n) {
  let d = "";
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, s = (Math.PI * 2) / n;
    const pts = [[r2, a], [r, a + s * 0.15], [r, a + s * 0.45], [r2, a + s * 0.6]];
    pts.forEach(([rr, aa], j) => (d += `${i === 0 && j === 0 ? "M" : "L"}${(cx + rr * Math.cos(aa)).toFixed(1)} ${(cy + rr * Math.sin(aa)).toFixed(1)} `));
  }
  return d + "Z";
}

const PT_LABEL = { coat: "Coat", tip: "Tips", area: "Area", core: "Core", status: "Status" };
const PT_RULE = {
  coat: "Every munition starts with its Coat, made from container materials. A batch has one Coat.",
  tip: "A batch can carry several Tips, made from container materials. Raising a Rating above your base makes it harder: −5% difficulty per step.",
  area: "Turns the munition into a blast. A batch has one Area, made from container materials. Rating = your Powdertinker.",
  core: "An elemental Core adds Rating extra damage of its element, made from element solution. Each step above your base: −10% difficulty.",
  status: "Status properties need a Core and must match its element. A batch can carry several, made from element solution.",
};
const ELEMENT_HUE = { Fire: "#ff7a2a", Cold: "#86d6ff", Electric: "#c9a6ff", Poison: "#7bd451", Acid: "#d4ec3c", Radiant: "#ffe28a", Necrotic: "#9b6ad6" };
const COAT_FILL = { Piercing: "url(#pt-copper)", Bludgeoning: "url(#pt-lead)", Slashing: "url(#pt-steel)" };
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } };

// What a recipe currently puts on each part, for the callout labels and the drawing.
function ptSummary(c, rc, st) {
  const m = R.MUNITION[rc.type] || R.MUNITIONS[0];
  const out = {};
  R.PT_PARTS.forEach(p => {
    const access = R.ptAccess(rc.type, p), open = st.unlock[p];
    let value = "", on = false;
    if (p === "coat") { value = m.shape === "grenade" ? "Casing" : m.shape === "flask" ? "Base oil" : (open && access ? rc.coat : "") || "Piercing"; on = true; }
    // Every munition has a base layer (coat, casing or base oil); only custom coats depend on the access table.
    if (p === "coat") { out[p] = { access: true, open, value, on: true, custom: access }; return; }
    if (p === "tip") { const t = R.TIPS.filter(([k]) => rc.tips && rc.tips[k] != null && rc.tips[k] !== false).map(([k, rated]) => rated ? `${k} ${st.base.tip + num(rc.tips[k])}` : k); value = t.join(", "); on = t.length > 0; }
    if (p === "area") { const a = rc.area && rc.area.k; if (a) { value = `${a === "Cone" ? `Cone ${rc.area.cone || 60}°` : a} ${st.base.area}`; on = true; } else if (m.shape === "grenade") { value = `Sphere ${st.base.area}`; on = true; } }
    if (p === "core") { const e = rc.core && rc.core.el; if (e) { value = `${e} ${st.base.core + num(rc.core.inc)}`; on = true; } }
    if (p === "status") { const e = rc.core && rc.core.el; const s = (rc.status || []).filter(n => { const S = R.STATUSES.find(x => x[0] === n); return S && S[1] === e; }); value = s.join(", "); on = s.length > 0; }
    out[p] = { access, open, value, on: on && access && (open || p === "coat" || (p === "area" && m.shape === "grenade" && !rc.area?.k)) };
  });
  return out;
}

function Powdertinkering({ c, update }) {
  const st = R.ptState(c);
  const cr = c.craft, rc = cr.recipe, type = R.MUNITION[rc.type] ? rc.type : "rifle", m = R.MUNITION[type];
  const [focus, setFocus] = useState("coat");
  const [forge, setForge] = useState(null);
  // The forge's state lives in a ref (read synchronously by the timed steps) and is mirrored into state for drawing.
  const fRef = useRef(null);
  const setF = f => { fRef.current = f; setForge(f); };
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  useEffect(() => { if (fRef.current && fRef.current.charId !== c.id) { timers.current.forEach(clearTimeout); setF(null); } }, [c.id]);
  const later = (fn, ms) => timers.current.push(setTimeout(fn, reduceMotion() ? Math.min(ms, 120) : ms));
  const setRc = fn => update(x => fn(x.craft.recipe));
  const steps = useMemo(() => R.ptSteps(c, rc), [c]);
  const sum = ptSummary(c, rc, st);
  const yieldNow = R.ptYield(c, type, st.maxFails);
  // Materials the whole craft needs if nothing fails.
  const need = {}; steps.forEach(s => (need[s.mat] = (need[s.mat] || 0) + R.PT_GRAMS));
  const short = Object.entries(need).filter(([k, g]) => num(cr.supplies[k]) < g);
  const matName = k => (k === "container" ? "container materials" : `${k.toLowerCase()} solution`);

  /* ---------- the forge: one roll per step, with a pause after every failure ---------- */
  const patch = p => { const f = fRef.current; if (f) setF(Object.assign({}, f, typeof p === "function" ? p(f) : p)); };
  const start = () => {
    const f = { charId: c.id, steps, idx: 0, res: {}, det: 0, ignored: 0, spent: {}, rolls: [], phase: "intro", roll: null, keepUsed: false, ignoreUsed: false, recipe: clean(rc), type, mod: st.mod, maxFails: st.maxFails };
    setF(f);
    later(() => attempt(0), 900);
  };
  const attempt = idx => {
    const f = fRef.current; if (!f) return;
    const s = f.steps[idx];
    // A Status needs the Core: if the Core never went in, its Status steps are skipped without a roll.
    if (s.part === "status" && !f.steps.some(x => x.part === "core" && (f.res[x.key] === "ok" || f.res[x.key] === "kept"))) {
      patch(g => ({ res: Object.assign({}, g.res, { [s.key]: "skip" }) })); next(idx); return;
    }
    const have = num(cr.supplies[s.mat]) - num(f.spent[s.mat]);
    if (have < R.PT_GRAMS) { patch({ idx, phase: "short", roll: null }); return; }
    patch(g => ({ idx, phase: "rolling", roll: null, spent: Object.assign({}, g.spent, { [s.mat]: num(g.spent[s.mat]) + R.PT_GRAMS }) }));
    later(() => {
      const r = R.rollDie(100), total = r - f.mod, ok = total < s.dc;
      patch(g => {
        const det = g.det + (ok ? 0 : 1);
        const roll = { key: s.key, label: s.label, r, total, dc: s.dc, ok };
        const res = Object.assign({}, g.res, { [s.key]: ok ? "ok" : "fail" });
        return { roll, rolls: [...g.rolls, roll], det, res, phase: ok ? "hit" : det - g.ignored > g.maxFails ? "scrapping" : "choice" };
      });
      const g = fRef.current;
      if (ok) later(() => next(idx), 750);
      else if (g.phase === "scrapping") later(() => finish(true), 1100);
    }, 1050);
  };
  const next = idx => { const f = fRef.current; if (!f) return; if (idx + 1 >= f.steps.length) finish(false); else { patch({ idx: idx + 1, phase: "next" }); later(() => attempt(idx + 1), 350); } };
  const skip = () => { const f = fRef.current; patch(g => ({ res: Object.assign({}, g.res, { [f.steps[f.idx].key]: g.res[f.steps[f.idx].key] === "fail" ? "fail" : "skip" }) })); next(f.idx); };
  const keepIt = () => { const f = fRef.current; patch(g => ({ keepUsed: true, res: Object.assign({}, g.res, { [f.steps[f.idx].key]: "kept" }) })); next(f.idx); };

    const name = R.ptName(f.type, done, f.recipe) + (det ? ` · ${det} Detriment${det > 1 ? "s" : ""}` : "");
    const spentTxt = Object.entries(f.spent).map(([k, g]) => `${g} g ${matName(k)}`).join(", ");
    update(x => {
      Object.entries(f.spent).forEach(([k, g]) => (x.craft.supplies[k] = Math.max(0, num(x.craft.supplies[k]) - g)));

      if (f.ignoreUsed) x.uses["p:Powdertinker:10"] = 1;
      if (made) {
        const it = x.items.find(i => i.name === name);
        if (it) it.qty = num(it.qty) + y.n; else x.items.push({ id: rid(), name, qty: y.n, size: (R.MUNITION[f.type] || {}).size || "small" });
      }

      addLog(x, scrap ? `Powdertinkering: the batch was scrapped (${spentTxt} lost)` : made ? `Powdertinkering: forged ${y.n} × ${name} (${spentTxt})` : `Powdertinkering: stopped before the coat held (${spentTxt} lost)`);

    <section class="frame ptbench">
      <${Head} title="Powdertinkering" topic="powdertinkering" />
      <p class="sub">Pick a munition, click a part of it to choose what goes there, then forge. Each part is one roll: d100 minus your modifier, under the difficulty.</p>
      <div class="facts ptfacts">${[
        ["Powdertinker", `${st.lvl}${st.lvl < 3 ? " · not proficient" : ""}`],
        ["Modifier", `${st.mod}%${st.bonus ? ` (incl. ${st.bonus >= 0 ? "+" : ""}${st.bonus})` : ""}`],

      ].map(([k, v]) => html`<div class="fact"><span>${k}</span><b>${v}</b></div>`)}</div>
      ${(st.keepFailed || st.ignoreOne) && html`<div class="chips" style="margin-top:10px">
        ${st.keepFailed && html`<span class=${"flag " + (st.used.keep ? "" : "brass")} title="Novice Tinker (Powdertinker 5): keep a property you failed, as well as its Detriment. Recharges on a long rest.">Novice Tinker · ${st.used.keep ? "used" : "ready"}</span>`}

      <div class="pttypes" role="radiogroup" aria-label="Munition">${R.MUNITIONS.map(x => html`<button type="button" role="radio" aria-checked=${x.k === type} disabled=${busy}
        onClick=${() => setRc(r => { r.type = x.k; })}><svg viewBox="0 0 24 24" aria-hidden="true">${TYPE_ICON[x.shape]}</svg><span>${x.n}</span></button>`)}</div>

      <div class="ptgrid">
        <div class="ptstage">
          <${Munition} m=${m} rc=${forge ? forge.recipe : rc} sum=${sum} st=${st} focus=${busy ? fStep && fStep.part : focus}

    <section class="frame"><h2 class="h"><span>Ledger</span><i class="orn" aria-hidden="true"></i></h2>
      <p class="sub">Finished batches go straight into the inventory on the Gear tab. Each Detriment is the GM's to decide; note it here.</p>
      ${cr.ledger.length === 0 ? html`<p class="muted">Nothing forged yet.</p>` : html`<div class="ptledger">${cr.ledger.map((e, i) => html`<div class=${"pled" + (e.scrap ? " scrap" : "")}>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${e.scrap ? "Scrapped" : e.qty ? `${e.qty} ×` : "Nothing made"} ${e.name}</b>
          <button class="iconbtn" aria-label="Remove this entry" onClick=${() => update(x => { x.craft.ledger.splice(i, 1); })}>×</button></div>
        <span class="muted">${new Date(e.t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}${e.rolls && e.rolls.length ? " · " + e.rolls.join(" · ") : ""}</span>
        ${e.det > 0 && !e.scrap && html`<input class="inp" aria-label="Detriments" placeholder=${`What the ${e.det > 1 ? `${e.det} Detriments do` : "Detriment does"} (the GM decides)`} value=${e.note}
          onInput=${ev => update(x => { x.craft.ledger[i].note = ev.target.value; })} />`}</div>`)}</div>`}
    </section>`;
}

/* ---------- the readout under the munition while forging ---------- */
function ForgeReadout({ f, st, matName, supplies, onRetry, onSkip, onKeep, onIgnore, onFinish, onClose }) {
  const s = f.steps[f.idx];
  const [spin, setSpin] = useState(0);
  useEffect(() => {
    if (f.phase !== "rolling" || reduceMotion()) return;
    const t = setInterval(() => setSpin(1 + Math.floor(Math.random() * 100)), 55);
    return () => clearInterval(t);
  }, [f.phase, f.idx, f.rolls.length]);
  const det = Math.max(0, f.det - f.ignored);
  const pips = html`<span class="ptdet" aria-label=${`${det} Detriment${det === 1 ? "" : "s"}, ${f.maxFails} allowed`}>${Array.from({ length: f.maxFails + 1 }, (_, i) =>
    html`<i class=${(i < det ? "on" : "") + (i === f.maxFails ? " last" : "")}></i>`)}</span>`;
  const done = ["done", "scrap", "nothing"].includes(f.phase);
  if (done) {
    const r = f.result || {};
    return html`<div class=${"ptread end " + f.phase} role="status">
      <p class="ptbig">${f.phase === "scrap" ? "Scrapped" : f.phase === "nothing" ? "Nothing made" : `${r.n} forged`}</p>
      <p>${f.phase === "scrap" ? "One Detriment too many: the batch and every material in it are lost." : f.phase === "nothing" ? "The coat never held, so there's no munition. The materials used are gone." : r.name}</p>
      ${f.phase === "done" && html`<p class="muted">Added to the inventory${r.det ? `. ${r.det} Detriment${r.det > 1 ? "s" : ""} for the GM to decide (note them in the Ledger)` : ""}.</p>`}
      <button class="btn primary" onClick=${onClose}>${f.phase === "done" ? "Back to the bench" : "Clear the bench"}</button></div>`;
  }
  const r = f.roll;
  const shown = f.phase === "rolling" ? (spin || "··") : r ? r.r : "··";
  return html`<div class="ptread" role="status" aria-live="polite">
    <div class="ptstep"><span class="lbl">Step ${f.idx + 1} of ${f.steps.length}</span><b>${f.phase === "intro" ? "Firing up the bench…" : s.label}</b>${pips}</div>
    ${f.phase !== "intro" && f.phase !== "short" && html`<div class=${"ptdice" + (f.phase === "rolling" ? " rolling" : r ? (r.ok ? " ok" : " fail") : "")}>
      <span class="d100">${shown}</span>
      <span class="ptmath">${f.phase === "rolling" ? html`d100 − ${f.mod} · under ${s.dc}` : r && html`${r.r} − ${f.mod} = <b>${r.total}</b> ${r.ok ? "<" : "≥"} ${s.dc} · ${r.ok ? "it holds" : "a Detriment"}`}</span></div>`}
    ${f.phase === "short" && html`<p class="flag bad">Out of ${matName(s.mat)}: ${Math.max(0, num(supplies[s.mat]) - num(f.spent[s.mat]))} g left, 200 g needed.</p>`}
    ${(f.phase === "choice" || f.phase === "short") && html`<div class="row ptchoices">
      ${f.phase === "choice" && html`<button class="btn primary" onClick=${onRetry}>Try again · 200 g</button>`}
      ${s.part !== "coat" && html`<button class="btn" onClick=${onSkip}>Go without it</button>`}
      ${f.phase === "choice" && st.keepFailed && !st.used.keep && !f.keepUsed && html`<button class="btn" title="Novice Tinker: keep the property as well as the Detriment. Once per long rest." onClick=${onKeep}>Keep it anyway</button>`}
      ${f.phase === "choice" && st.ignoreOne && !st.used.ignore && !f.ignoreUsed && html`<button class="btn" title="Master o' Munitions: ignore 1 Detriment. Once per long rest." onClick=${onIgnore}>Ignore the Detriment</button>`}
      <button class="btn" onClick=${onFinish}>${s.part === "coat" ? "Give up" : "Finish here"}</button></div>`}
    ${f.phase === "scrapping" && html`<p class="flag bad">Too many Detriments…</p>`}
  </div>`;
}

/* ---------- the picker beside the munition ---------- */
function PartPicker({ part, c, rc, st, m, sum, setRc, disabled }) {
  const s = sum[part];
  const lockedMsg = !s.access ? `${m.n} can't carry a ${PT_LABEL[part].replace(/s$/, "").toLowerCase()} (Component Access table).`
    : !s.open ? `Unlocks at Powdertinker ${st.unlockAt[part]}${part === "area" || part === "status" ? " (Expert Tinker)" : part === "coat" ? " (Tinkerling)" : " (Tinkerling)"}. ${c.name || "This character"} has ${st.lvl}.` : "";
  const chance = dc => R.ptChance(dc, st.mod);
  const Stepper = ({ value, max, onSet, label }) => html`<span class="ptstepper"><button class="iconbtn" aria-label=${`Lower ${label}`} disabled=${disabled || value <= 0} onClick=${() => onSet(value - 1)}>−</button>
    <button class="iconbtn" aria-label=${`Raise ${label}`} disabled=${disabled || value >= max} onClick=${() => onSet(value + 1)}>+</button></span>`;
  let body = null;
  if (lockedMsg && !(part === "coat")) body = html`<p class="ptlocked"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2 M3 7h10v7H3z" /></svg>${lockedMsg}</p>`;
  else if (part === "coat") {
    const free = s.custom && s.open;
    body = html`${m.shape === "grenade" || m.shape === "flask" ? html`<p class="muted">${m.n} start with a plain ${m.shape === "grenade" ? "casing" : "base oil"} instead of a custom coat: one roll at 60%.</p>` : html`<div class="ptopts">${R.COATS.map(([k, t]) => html`<button type="button" class="ptopt" aria-pressed=${(rc.coat || "Piercing") === k}
        disabled=${disabled || (!free && k !== "Piercing")} onClick=${() => setRc(r => { r.coat = k; })}><b>${k}</b><span>${t}</span></button>`)}</div>
      ${!free && html`<p class="muted">Custom coats unlock at Powdertinker 3 (Tinkerling). Until then munitions are piercing.</p>`}`}
      <p class="ptdc">Difficulty 60% · ${chance(60)}% to land</p>`;
  } else if (part === "tip") {
    body = html`<div class="ptopts">${R.TIPS.map(([k, rated, t]) => { const on = rc.tips && rc.tips[k] != null && rc.tips[k] !== false; const inc = num(rc.tips && rc.tips[k]); const dc = R.ptDifficulty("tip", rated ? inc : 0);
      return html`<div class=${"ptopt row-opt" + (on ? " on" : "")}>
        <button type="button" class="ptcheck" aria-pressed=${on} disabled=${disabled} onClick=${() => setRc(r => { r.tips = Object.assign({}, r.tips); if (on) delete r.tips[k]; else r.tips[k] = rated ? 0 : true; })}>
          <b>${k}${rated ? ` (${st.base.tip + (on ? inc : 0)})` : ""}</b><span>${t}</span></button>
        ${on && html`<div class="ptrate">${rated && html`<${Stepper} label=${k + " rating"} value=${inc} max=${7} onSet=${v => setRc(r => { r.tips = Object.assign({}, r.tips, { [k]: v }); })} />`}
          <span class="ptdc">${dc}% · ${chance(dc)}%</span></div>`}</div>`; })}</div>
      <p class="muted">Base Rating = your Powdertinker (${st.base.tip}).</p>`;
  } else if (part === "area") {
    const cur = rc.area && rc.area.k;
    const bomb = m.shape === "grenade";
    body = html`<div class="ptopts">
      ${!bomb && html`<button type="button" class="ptopt" aria-pressed=${!cur} disabled=${disabled} onClick=${() => setRc(r => { r.area = null; })}><b>None</b><span>A single target.</span></button>`}
      ${R.AREAS.map(([k, t]) => html`<button type="button" class="ptopt" aria-pressed=${cur === k || (bomb && !cur && k === "Sphere")} disabled=${disabled}
        onClick=${() => setRc(r => { r.area = bomb && k === "Sphere" ? null : { k, cone: (r.area && r.area.cone) || 60 }; })}><b>${k} (${st.base.area})${bomb && k === "Sphere" ? " · built in" : ""}</b><span>${t}</span></button>`)}</div>
      ${cur === "Cone" && html`<div class="seg three ptcone" role="group" aria-label="Cone angle">${[30, 60, 90].map(a => html`<button aria-pressed=${(rc.area.cone || 60) === a} disabled=${disabled} onClick=${() => setRc(r => { r.area = Object.assign({}, r.area, { cone: a }); })}>${a}°</button>`)}</div>`}
      <p class="ptdc">Difficulty 30% · ${chance(30)}% to land${bomb ? " · the sphere every bomb has needs no roll" : ""}</p>`;
  } else if (part === "core") {
    const el = rc.core && rc.core.el, inc = num(rc.core && rc.core.inc), dc = R.ptDifficulty("core", inc);
    body = html`<div class="ptels">
      <button type="button" class="ptel" aria-pressed=${!el} disabled=${disabled} onClick=${() => setRc(r => { r.core = null; })}><i style="background:var(--sunk)"></i>None</button>
      ${R.ELEMENTS.map(e => html`<button type="button" class="ptel" aria-pressed=${el === e} disabled=${disabled} onClick=${() => setRc(r => { r.core = { el: e, inc: r.core ? num(r.core.inc) : 0 }; })}><i style=${`background:${ELEMENT_HUE[e]}`}></i>${e}</button>`)}</div>
      ${el && html`<div class="row ptrate"><span><b>${el} (${st.base.core + inc})</b> · +${st.base.core + inc} ${el.toLowerCase()} damage</span>
        <${Stepper} label="core rating" value=${inc} max=${3} onSet=${v => setRc(r => { r.core = Object.assign({}, r.core, { inc: v }); })} /></div>`}
      <p class="ptdc">${el ? `Difficulty ${dc}% · ${chance(dc)}% to land` : "Pick an element"} · base Rating ${st.base.core} (half your Powdertinker)</p>`;
  } else if (part === "status") {
    const el = rc.core && rc.core.el;
    body = !el ? html`<p class="ptlocked">Status properties need a Core first. Pick an element on the Core.</p>` : html`<div class="ptopts">${R.STATUSES.filter(x => x[1] === el).map(([k, , t]) => { const on = (rc.status || []).includes(k);
      return html`<button type="button" class="ptopt" aria-pressed=${on} disabled=${disabled} onClick=${() => setRc(r => { const s = (r.status || []).filter(n => { const S = R.STATUSES.find(x => x[0] === n); return S && S[1] === el; }); r.status = on ? s.filter(n => n !== k) : [...s, k]; })}>
        <b>${k} (${st.base.status})</b><span>${t}</span></button>`; })}</div>
      <p class="ptdc">Difficulty 40% each · ${chance(40)}% to land · Rating ${st.base.status}</p>`;
  }
  return html`<div class=${"ptpick part-" + part}>
    <h3 class="ptpickh"><span>${PT_LABEL[part]}</span>${s.access && s.open && s.value ? html`<small>${s.value}</small>` : ""}</h3>
    <p class="muted ptrule">${PT_RULE[part]}</p>
    ${body}</div>`;
}

// Each shape: the parts drawn as SVG, and where each callout line lands (in a 360 × 460 drawing).
// side: which side its label sits on; y: the label's height.
const CALLOUTS = { tip: ["l", 62], coat: ["l", 188], area: ["l", 318], core: ["r", 126], status: ["r", 256] };

function cartridge(p) {
  const C = 180, { tip, R: r, neck, nhw, sh, hw, bot } = p;
  const og = tip + p.og;                         // where the ogive meets the straight body
  const bullet = `M${C} ${tip} C${C + r * 0.45} ${tip + p.og * 0.18} ${C + r} ${tip + p.og * 0.55} ${C + r} ${og} L${C + r} ${neck + 26} L${C - r} ${neck + 26} L${C - r} ${og} C${C - r} ${tip + p.og * 0.55} ${C - r * 0.45} ${tip + p.og * 0.18} ${C} ${tip} Z`;
  const capY = tip + p.og * 0.32;                // the tip cap covers the nose down to here
  const capW = r * 0.62;
  const cap = `M${C} ${tip} C${C + r * 0.32} ${tip + p.og * 0.12} ${C + capW} ${tip + p.og * 0.24} ${C + capW + 1} ${capY} L${C - capW - 1} ${capY} C${C - capW} ${tip + p.og * 0.24} ${C - r * 0.32} ${tip + p.og * 0.12} ${C} ${tip} Z`;
  const shTop = p.straight ? neck : sh, shBot = p.straight ? neck : sh + 22;
  const casePath = `M${C - nhw} ${neck} L${C + nhw} ${neck} L${C + nhw} ${shTop} L${C + hw} ${shBot} L${C + hw - 1.5} ${bot} L${C - hw + 1.5} ${bot} L${C - hw} ${shBot} L${C - nhw} ${shTop} Z`;
  const grooveY = bot, rimY = bot + 9;
  const win = { x: C - r * 0.42, y: Math.max(og - 10, capY + 14), w: r * 0.84, h: neck - Math.max(og - 10, capY + 14) - 6 };
  const band = shBot + 14;
  const glyph = { x: C, y: Math.round((band + 18 + bot) / 2) + 6 };
  return {
    outline: [bullet, casePath, `M${C - hw + 6} ${grooveY} h${2 * hw - 12} v9 h-${2 * hw - 12} z`, `M${C - hw} ${rimY} h${2 * hw} v11 h-${2 * hw} z`],
    anchors: { tip: [C - 3, tip + 10], coat: [C - r + 4, Math.min(og + 12, neck - 4)], core: [C + r * 0.2, win.y + win.h / 2], status: [C + hw - 2, band + 4], area: [C - 16, glyph.y] },
    draw: (S, coatFill, tipFill, core, status, area) => html`
      <g class=${"ptg ptg-coat " + S.coat}><path d=${bullet} fill=${coatFill} stroke="#3a2410" stroke-width="1.2" />
        ${coatFill === COAT_FILL.Slashing && html`<path d=${Array.from({ length: 5 }, (_, i) => `M${C - r + 2} ${og + 6 + i * 9} l${2 * r - 4} -7`).join(" ")} stroke="#5d656c" stroke-width="1.1" opacity=".7" clip-path="url(#pt-clip-bullet)" />`}
        <path d=${`M${C - r * 0.55} ${tip + p.og * 0.5} C${C - r * 0.6} ${og} ${C - r * 0.55} ${neck} ${C - r * 0.5} ${neck + 10}`} stroke="#fff" stroke-opacity=".38" stroke-width="3" fill="none" /></g>
      <g class=${"ptg ptg-core " + S.core}><rect x=${win.x} y=${win.y} width=${win.w} height=${win.h} rx=${win.w / 2} fill="#1b130c" stroke="#3a2410" />
        ${core && html`<rect class="ptglow" x=${win.x + 3} y=${win.y + 3} width=${win.w - 6} height=${win.h - 6} rx=${(win.w - 6) / 2} fill=${core} />`}</g>
      <g class=${"ptg ptg-tip " + S.tip}>${tipFill && html`<path d=${cap} fill=${tipFill === "impale" ? "#2d2f33" : tipFill} stroke="#1c1c1c" stroke-width="1" />`}
        ${tipFill === "impale" && html`<rect x=${C - capW - 1} y=${capY - 4} width=${2 * capW + 2} height="4" fill="#b8322a" />`}</g>
      <g class="ptg-case"><path d=${casePath} fill="url(#pt-brass)" stroke="#5a3a0e" stroke-width="1.3" />
        <path d=${`M${C - hw + 7} ${shBot + 4} L${C - hw + 7} ${bot - 4}`} stroke="#fff6d6" stroke-opacity=".5" stroke-width="4" />
        <rect x=${C - hw + 6} y=${grooveY} width=${2 * hw - 12} height="9" fill="#8a611f" stroke="#5a3a0e" />
        <rect x=${C - hw} y=${rimY} width=${2 * hw} height="11" rx="2" fill="url(#pt-brass)" stroke="#5a3a0e" /></g>
      <g class=${"ptg ptg-status " + S.status}><rect x=${C - hw + 0.5} y=${band - 3} width=${2 * hw - 1} height="14" fill=${status || "#9c7128"} stroke="#5a3a0e" />
        ${status && html`<path class="ptglow" d=${Array.from({ length: 5 }, (_, i) => `M${C - hw + 8 + i * (2 * hw - 16) / 4} ${band + 1} v6`).join(" ")} stroke="#fff" stroke-width="1.6" />`}</g>
      <g class=${"ptg ptg-area " + S.area}><circle cx=${glyph.x} cy=${glyph.y} r="17" fill="none" stroke="#5a3a0e" stroke-width="1.6" />${area && areaGlyph(area, glyph.x, glyph.y, 12, "#5a3a0e")}</g>`,
  };
}
// The etched mark for an Area shape.
function areaGlyph(a, x, y, s, col) {
  const k = a.k || a;
  if (k === "Sphere") return html`<circle cx=${x} cy=${y} r=${s * 0.75} fill=${col} opacity=".75" />`;
  if (k === "Plus") return html`<path d=${`M${x - s} ${y}h${2 * s} M${x} ${y - s}v${2 * s}`} stroke=${col} stroke-width="4" />`;
  if (k === "Cross") return html`<path d=${`M${x - s * 0.72} ${y - s * 0.72}l${1.44 * s} ${1.44 * s} M${x + s * 0.72} ${y - s * 0.72}l${-1.44 * s} ${1.44 * s}`} stroke=${col} stroke-width="4" />`;
  const ang = ((a.cone || 60) / 2) * Math.PI / 180;
  return html`<path d=${`M${x} ${y + s * 0.8} L${x - Math.sin(ang) * s * 1.6} ${y + s * 0.8 - Math.cos(ang) * s * 1.6} A${s * 1.6} ${s * 1.6} 0 0 1 ${x + Math.sin(ang) * s * 1.6} ${y + s * 0.8 - Math.cos(ang) * s * 1.6} Z`} fill=${col} opacity=".75" />`;
}

          <path d=${`M${C - hw + 6} ${top + 6} L${C} ${top + 22} L${C + hw - 6} ${top + 6} M${C} ${top - 1} V${top + 22} M${C - hw * 0.62} ${top + 1} L${C} ${top + 22} L${C + hw * 0.62} ${top + 1}`} stroke="#3b0f0c" stroke-width="1.4" fill="none" />
          <rect x=${C - 22} y=${top + 40} width="44" height="150" rx="10" fill=${coatFill} opacity=".22" /></g>
        <g class=${"ptg ptg-core " + S.core}><rect x=${C - 20} y=${top + 42} width="40" height="96" rx="8" fill="#1b130c" stroke="#3b0f0c" />
          ${Array.from({ length: 12 }, (_, i) => html`<circle class=${core ? "ptglow" : ""} cx=${C - 11 + (i % 3) * 11} cy=${top + 54 + Math.floor(i / 3) * 22} r="5" fill=${core || "#6d6f73"} stroke="#000" stroke-opacity=".4" />`)}</g>
        <g class="ptg-case"><rect x=${C - hw - 2} y=${base} width=${2 * hw + 4} height=${bot - base} fill="url(#pt-brass)" stroke="#5a3a0e" stroke-width="1.3" />

function Munition({ m, rc, sum, st, focus, partState, forging, phase, onPick }) {
  const shape = useMemo(() => SHAPES[m.shape](), [m.shape]);
  const S = {}; R.PT_PARTS.forEach(p => (S[p] = sum[p].access ? partState(p) : "na"));
  const show = p => !["off", "ghost", "miss", "na"].includes(S[p]);
  // What the drawing shows on each part, following the recipe.
  const coat = m.shape === "flask" || m.shape === "grenade" ? "Piercing" : (sum.coat.custom && sum.coat.open ? rc.coat : "") || "Piercing";
  const coatFill = m.shape === "grenade" ? "url(#pt-iron)" : COAT_FILL[coat];
  const tips = rc.tips || {}; const has = k => tips[k] != null && tips[k] !== false;
  const tipFill = show("tip") && sum.tip.access && sum.tip.open ? (has("Penetrating") ? "#34383d" : has("Precise") ? "url(#pt-silver)" : has("Impale") ? "impale" : null) : null;
  const el = rc.core && rc.core.el;
  const core = show("core") && el ? ELEMENT_HUE[el] : null;
  const status = show("status") && el ? ELEMENT_HUE[el] : null;
  const area = show("area") ? (rc.area && rc.area.k ? rc.area : m.shape === "grenade" ? { k: "Sphere" } : null) : null;
  const anchorFor = p => shape.anchors[p];
  const final = phase === "done", scrap = phase === "scrap" || phase === "scrapping";
  return html`<div class=${"ptmun" + (forging ? " forging" : "") + (final ? " final" : "") + (scrap ? " scrap" : "") + " shape-" + m.shape}>
    <svg class="ptsvg" viewBox="0 0 360 460" role="img" aria-label=${`${m.n}: ${R.PT_PARTS.filter(p => sum[p].access && sum[p].value).map(p => `${PT_LABEL[p]} ${sum[p].value}`).join(", ") || "plain"}`}>
      <defs>
        <linearGradient id="pt-brass" x1="0" x2="1"><stop offset="0" stop-color="#7a5418" /><stop offset=".28" stop-color="#f1cd77" /><stop offset=".55" stop-color="#c8963d" /><stop offset="1" stop-color="#6b4512" /></linearGradient>
        <linearGradient id="pt-copper" x1="0" x2="1"><stop offset="0" stop-color="#7a3a1a" /><stop offset=".3" stop-color="#e59a62" /><stop offset=".6" stop-color="#b8673a" /><stop offset="1" stop-color="#5e2a12" /></linearGradient>
        <linearGradient id="pt-lead" x1="0" x2="1"><stop offset="0" stop-color="#4a4e54" /><stop offset=".3" stop-color="#b7bcc2" /><stop offset=".6" stop-color="#858a91" /><stop offset="1" stop-color="#3c4045" /></linearGradient>
        <linearGradient id="pt-steel" x1="0" x2="1"><stop offset="0" stop-color="#5b636b" /><stop offset=".3" stop-color="#eef2f5" /><stop offset=".6" stop-color="#a8b1b9" /><stop offset="1" stop-color="#4d555c" /></linearGradient>
        <linearGradient id="pt-silver" x1="0" x2="1"><stop offset="0" stop-color="#8d949b" /><stop offset=".4" stop-color="#ffffff" /><stop offset="1" stop-color="#9aa1a8" /></linearGradient>
        <linearGradient id="pt-iron" x1="0" x2="1"><stop offset="0" stop-color="#2c2f33" /><stop offset=".35" stop-color="#6c7178" /><stop offset="1" stop-color="#25272a" /></linearGradient>
        <linearGradient id="pt-hull" x1="0" x2="1"><stop offset="0" stop-color="#5a1712" /><stop offset=".35" stop-color="#c2463a" /><stop offset="1" stop-color="#4b120e" /></linearGradient>
        <linearGradient id="pt-wood" x1="0" x2="1"><stop offset="0" stop-color="#5a3518" /><stop offset=".45" stop-color="#b07b45" /><stop offset="1" stop-color="#4f2e14" /></linearGradient>
        <linearGradient id="pt-glint" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".85" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
        <clipPath id="pt-clip-bullet"><path d=${shape.outline[0]} /></clipPath>
        <clipPath id="pt-clip-all">${shape.outline.map(d => html`<path d=${d} />`)}</clipPath>
      </defs>
      <g class="ptlines">${R.PT_PARTS.map(p => { const [side, ly] = CALLOUTS[p]; const [ax, ay] = anchorFor(p); const lx = side === "l" ? 112 : 248;
        return html`<g class=${"ptline" + (focus === p ? " on" : "") + (sum[p].access ? "" : " na") + (sum[p].access && !sum[p].open && p !== "coat" ? " locked" : "")}>
          <path d=${`M${lx} ${ly} H${side === "l" ? lx + 12 : lx - 12} L${ax} ${ay}`} /><circle cx=${ax} cy=${ay} r="3.6" /></g>`; })}</g>
      <g class="ptbody">${shape.draw(S, coatFill, tipFill, core, status, area)}</g>
      <g clip-path="url(#pt-clip-all)"><rect class="ptglint" x="-60" y="-40" width="80" height="540" fill="url(#pt-glint)" /></g>
      ${forging && focus && !["done", "scrap", "nothing", "scrapping"].includes(phase) && html`<g class=${"ptsparks" + (phase === "hit" ? " burst" : "")} transform=${`translate(${anchorFor(focus)[0]} ${anchorFor(focus)[1]})`}>
        ${Array.from({ length: 10 }, (_, i) => html`<line x1="0" y1="0" x2="0" y2="-9" style=${`--a:${i * 36 + 8}deg;--d:${(i % 3) * 60}ms`} />`)}</g>`}
      ${scrap && html`<path class="ptcrack" d="M150 120 l18 34 -12 22 26 40 -8 30 22 46 M210 230 l-14 26 16 30" />`}
      ${final && html`<g class="ptsteam">${[0, 1, 2, 3].map(i => html`<circle cx=${150 + i * 20} cy="420" r=${10 + (i % 2) * 4} style=${`--d:${i * 140}ms`} />`)}</g>`}
    </svg>
    ${R.PT_PARTS.map(p => { const [side, ly] = CALLOUTS[p]; const s = sum[p]; const locked = s.access && !s.open && p !== "coat";
      return html`<button type="button" class=${"ptlabel " + side + (focus === p ? " on" : "") + (s.access ? "" : " na") + (locked ? " locked" : "") + (forging ? " st-" + S[p] : "")}
        style=${`top:${(ly / 460) * 100}%`} disabled=${forging} aria-pressed=${focus === p} onClick=${() => onPick(p)}>
        <span class="k">${PT_LABEL[p]}${locked ? html` <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2 M3 7h10v7H3z" /></svg>` : ""}</span>
        <span class="v">${!s.access ? "Not on this munition" : locked ? `Powdertinker ${st.unlockAt[p]}` : s.value || (p === "status" && !(rc.core && rc.core.el) ? "Needs a core" : "None")}</span></button>`; })}
  </div>`;
}

      <path d="M138 106 Q180 128 222 106" stroke="#d6dbe0" stroke-width="5" fill="none" stroke-linecap="round" /></g>
    <g class="am-layer am-l3"><path d=${AM_PAULDRON} fill="url(#am-plate)" stroke="#23272b" stroke-width="1.6" /><path d=${amMirror(AM_PAULDRON)} fill="url(#am-plate)" stroke="#23272b" stroke-width="1.6" />
      <path d="M78 150 Q98 134 122 136 M75 140 Q96 120 118 122" stroke="#23272b" stroke-width="1.3" fill="none" /><path d=${amMirror("M78 150 Q98 134 122 136 M75 140 Q96 120 118 122")} stroke="#23272b" stroke-width="1.3" fill="none" />
      ${[[132, 122], [228, 122], [122, 200], [238, 200], [128, 286], [232, 286]].map(([x, y]) => html`<circle cx=${x} cy=${y} r="2.6" fill="#e8ecef" stroke="#555" stroke-width=".8" />`)}</g>`;
}

function ArmorFigure({ type, marks, broken, mode, run, labels, focus, onPick, st }) {
  const names = mode === "repair" ? Object.assign({}, AM_NAME, { type: "Suit", extra: "Repair" }) : AM_NAME;
  const ph = run && run.phase;
  const ghost = mode === "craft" && (!run || ["heat", "rolling", "flaw", "lost"].includes(ph));
  const made = mode === "craft" && ph === "made";
  const hammering = run && (ph === "strike" || (mode === "craft" && ph === "rolling"));
  return html`<div class=${"ptmun ammun" + (ghost ? " ghost" : "") + (made ? " made" : "") + (ph === "lost" ? " lost" : "") + (broken && mode === "repair" ? " broken" : "") + (run && run.done && mode === "repair" ? " mended" : "")}>
    <svg class="ptsvg" viewBox="0 0 360 460" role="img" aria-label=${`${(R.ARMOR[type] || R.ARMOR.light).label} armor on a stand${marks ? `, ${marks} dents` : ""}`}>
      <defs>
        <linearGradient id="am-cloth" x1="0" x2="1"><stop offset="0" stop-color="#8f6a3b" /><stop offset=".4" stop-color="#d9b67e" /><stop offset="1" stop-color="#8a6436" /></linearGradient>
        <linearGradient id="am-leather" x1="0" x2="1"><stop offset="0" stop-color="#3f2410" /><stop offset=".4" stop-color="#8a5530" /><stop offset="1" stop-color="#3a200d" /></linearGradient>
        <linearGradient id="am-steel" x1="0" x2="1"><stop offset="0" stop-color="#3f454b" /><stop offset=".45" stop-color="#9aa2aa" /><stop offset="1" stop-color="#3a3f45" /></linearGradient>
        <linearGradient id="am-plate" x1="0" x2="1"><stop offset="0" stop-color="#5a6168" /><stop offset=".38" stop-color="#f1f4f6" /><stop offset=".62" stop-color="#aab3bb" /><stop offset="1" stop-color="#4b5258" /></linearGradient>
        <linearGradient id="am-wood" x1="0" x2="1"><stop offset="0" stop-color="#4f2e14" /><stop offset=".45" stop-color="#a87442" /><stop offset="1" stop-color="#4a2b12" /></linearGradient>
        <radialGradient id="am-fire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95" /><stop offset=".45" stop-color="#ff7a2a" stop-opacity=".55" /><stop offset="1" stop-color="#ff4a1a" stop-opacity="0" /></radialGradient>
        <pattern id="am-rings" width="9" height="8" patternUnits="userSpaceOnUse">
          ${[[0, 0], [9, 0], [4.5, 4], [0, 8], [9, 8]].map(([x, y]) => html`<circle cx=${x} cy=${y} r="3.2" fill="none" stroke="#1f2327" stroke-opacity=".75" stroke-width="1.2" />`)}</pattern>
        <clipPath id="am-clip"><path d=${AM_TORSO} /></clipPath>
        <linearGradient id="am-glint" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".8" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
      </defs>
      ${mode === "craft" && html`<ellipse class=${"am-glow" + (run && ["heat", "rolling", "flaw"].includes(ph) ? " on" : "")} cx="180" cy="420" rx="150" ry="46" fill="url(#am-fire)" />`}
      <g class="am-stand"><rect x="175" y="370" width="10" height="58" fill="url(#am-wood)" /><ellipse cx="180" cy="432" rx="58" ry="10" fill="url(#am-wood)" />
        <rect x="172" y="80" width="16" height="26" fill="url(#am-wood)" /><circle cx="180" cy="62" r="22" fill="url(#am-wood)" /></g>
      ${labels && html`<g class="ptlines">${Object.keys(AM_LABELS).map(p => { const [side, ly] = AM_LABELS[p], [ax, ay] = AM_ANCHOR[p], lx = side === "l" ? 112 : 248;
        return html`<g class=${"ptline" + (focus === p ? " on" : "")}><path d=${`M${lx} ${ly} H${side === "l" ? lx + 12 : lx - 12} L${ax} ${ay}`} /><circle cx=${ax} cy=${ay} r="3.6" /></g>`; })}</g>`}
      <g class=${"am-suit" + (made ? " assemble" : "")}><${SuitArt} type=${type} /></g>
      ${mode === "craft" && run && run.flaws > 0 && html`<g class="am-flaw"><path d="M200 150 l-14 22 10 6 -16 28" /><path d="M150 250 l12 16 -8 6 14 18" style=${run.flaws > 1 ? "" : "display:none"} /></g>`}
      <g class="am-marks">${AM_SPOTS.slice(0, mode === "repair" ? marks : 0).map(([x, y], i) => html`<g class="am-dent" key=${i}>
        <ellipse cx=${x} cy=${y} rx="12" ry="7" fill="#000" fill-opacity=".3" /><path d=${`M${x - 10} ${y - 1} l5 4 l4 -6 l5 7 l4 -4`} stroke="#141414" stroke-width="1.7" fill="none" />
        <path d=${`M${x - 8} ${y + 5} q8 4 16 0`} stroke="#fff" stroke-opacity=".35" stroke-width="1.5" fill="none" /></g>`)}</g>
      ${broken && mode === "repair" && html`<path class="am-break" d="M196 112 l-18 40 14 10 -22 46 12 8 -16 52 10 30" />`}
      <g clip-path="url(#am-clip)"><rect class="am-glintbar" x="-60" y="60" width="70" height="340" fill="url(#am-glint)" /></g>
      ${hammering && html`<g transform="translate(318 250)"><g class="am-swing go" key=${run.strike != null ? "s" + run.strike : "r" + (run.flaws || 0)}>
        <rect x="-104" y="-4" width="104" height="8" rx="3" fill="url(#am-wood)" /><rect x="-124" y="-17" width="26" height="34" rx="3" fill="url(#am-steel)" stroke="#1d2024" /><rect x="-102" y="-6" width="7" height="12" fill="#3d4146" /></g></g>
        <g class="ptsparks burst" transform="translate(222 195)" key=${"sp" + (run.strike != null ? run.strike : run.flaws)}>${Array.from({ length: 9 }, (_, i) => html`<line x1="0" y1="0" x2="0" y2="-9" style=${`--a:${i * 40 + 10}deg;--d:220ms`} />`)}</g>`}
      ${run && ph === "strike" && run.dice[run.strike] != null && html`<text class="am-plus" key=${"t" + run.strike} x="236" y="182">+${run.dice[run.strike]}</text>`}
      ${(made || (run && run.done && mode === "repair")) && html`<g class="ptsteam">${[0, 1, 2, 3].map(i => html`<circle cx=${140 + i * 26} cy="380" r=${12 + (i % 2) * 5} style=${`--d:${i * 150}ms`} />`)}</g>`}
    </svg>
    ${labels && Object.keys(AM_LABELS).map(p => { const [side, ly] = AM_LABELS[p];
      return html`<button type="button" class=${"ptlabel " + side + (focus === p ? " on" : "")} style=${`top:${(ly / 460) * 100}%`} disabled=${!!run || !onPick} aria-pressed=${focus === p} onClick=${() => onPick && onPick(p)}>
        <span class="k">${names[p]}</span><span class="v">${labels[p]}</span></button>`; })}
  </div>`;
}

function ArmorUpkeep({ c, update }) {
  const st = R.amState(c);
  const ca = c.craft.armor;
  const [mode, setMode] = useState(() => lsGet("cw-am-mode", "repair"));
  useEffect(() => lsSet("cw-am-mode", mode), [mode]);
  const [selId, setSel] = useState("");
  const [focus, setFocus] = useState("type");
  const [run, setRunState] = useState(null);
  const runRef = useRef(null), timers = useRef([]);
  const setRun = r => { runRef.current = r; setRunState(r); };
  const patch = p => { const r = runRef.current; if (r) setRun(Object.assign({}, r, typeof p === "function" ? p(r) : p)); };
  const later = (fn, ms) => timers.current.push(setTimeout(fn, reduceMotion() ? Math.min(ms, 90) : ms));
  const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  useEffect(() => () => stop(), []);
  useEffect(() => { stop(); setRun(null); setSel(""); }, [c.id]);
  const busy = !!run && !run.done;
  // The suit to repair: the one picked, else the most damaged.
  const suits = c.armor;
  const byNeed = [...suits].sort((a, b) => R.repairPlan(c, b).missing - R.repairPlan(c, a).missing);
  const suit = suits.find(a => a.id === (run && run.kind === "repair" ? run.id : selId)) || byNeed[0] || null;
  const rp = suit ? R.repairPlan(c, suit) : null;
  const rc = ca.recipe, cp = R.craftPlan(c, rc);
  const setRc = fn => update(x => fn(x.craft.armor.recipe));
  const T = R.ARMOR;
  const addLedger = (x, e) => { x.craft.armor.ledger = [Object.assign({ id: rid(), t: Date.now(), note: "" }, e), ...x.craft.armor.ledger].slice(0, 20); };

  /* ---------- repair: one check, then one hammer strike per Repair Die ---------- */
  const startRepair = () => {
    if (!suit || rp.block) return;
    const plan = rp, id = suit.id; setSel(id);
    setRun({ kind: "repair", phase: "rolling", id, plan, dice: [], strike: null, shown: 0, gained: 0, mod: st.mod });
    later(() => {
      const r = R.rollDie(100), check = r - st.mod, count = R.repairCount(check);
      const dice = Array.from({ length: count }, () => R.rollDie(plan.sides));
      patch({ phase: "counted", r, check, count, dice });
      const strike = i => {
        if (i >= count) return later(() => finishRepair(), 450);
        patch({ phase: "strike", strike: i });
        later(() => patch(g => ({ shown: i + 1, gained: Math.min(plan.missing, g.gained + dice[i]) })), 230);
        later(() => strike(i + 1), 560);
      };
      later(() => strike(0), 1100);
    }, 1100);
  };
  const finishRepair = () => {
    const f = runRef.current; if (!f) return;
    const total = f.dice.reduce((s, x) => s + x, 0), gained = Math.min(f.plan.missing, total);
    update(x => {
      const a = x.armor.find(y => y.id === f.id); if (!a) return;
      a.soak = num(a.soak) + gained;
      x.craft.supplies[f.plan.mat] = Math.max(0, num(x.craft.supplies[f.plan.mat]) - f.plan.cost);
      const txt = `${a.name || T[a.type].label + " armor"}: Soak ${f.plan.soak} → ${f.plan.soak + gained}`;
      addLedger(x, { kind: "repair", name: f.plan.broken ? `Rebuilt ${txt}` : `Repaired ${txt}`, rolls: [`check ${f.r}−${f.mod}=${f.check} → ${f.count} × ${f.plan.die}${f.count ? ": " + f.dice.join(" + ") + " = " + total : ""}`] });
