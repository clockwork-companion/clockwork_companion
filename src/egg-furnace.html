<style>
#cw-doom { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: rgb(0 0 0 / .92); }
#cw-doom .box { position: relative; width: min(calc(100vw - 16px), calc((100vh - 16px) * 1.6)); aspect-ratio: 8 / 5; border: 2px solid #b88a3c; box-shadow: 0 0 0 3px #1b130b, 0 0 0 4px #6b4a1c, 0 20px 60px #000; background: #000; }
#cw-doom canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
#cw-doom .tb { position: absolute; top: 6px; right: 8px; display: flex; gap: 6px; z-index: 2; }
#cw-doom .tb button { width: 32px; height: 32px; border: 1px solid #6b4a1c; background: #1b130bcc; color: #e9c27a; font: 18px/1 serif; cursor: pointer; }
#cw-doom .tb button:hover { border-color: #e9c27a; }
#cw-doom .fire { display: none; position: absolute; right: 16px; bottom: 24%; width: 78px; height: 78px; border-radius: 50%; border: 2px solid #e0b462; background: #8a2e1ccc; color: #ffe2a8; font: bold 13px Georgia, serif; letter-spacing: .08em; touch-action: none; z-index: 2; }
@media (pointer: coarse) { #cw-doom .fire { display: block; } }
#cw-doom form { position: absolute; left: 50%; top: 71%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 8px; background: #1b130b; border: 1px solid #b88a3c; z-index: 3; }
#cw-doom form[hidden] { display: none; }
#cw-doom input { width: 160px; padding: 6px 8px; border: 1px solid #6b4a1c; background: #0d0905; color: #ffe2a8; font: 16px Georgia, serif; }
#cw-doom form button { padding: 6px 12px; border: 1px solid #e0b462; background: #8a2e1c; color: #ffe2a8; font: bold 14px Georgia, serif; cursor: pointer; }
#cw-doom form button:disabled { opacity: .5; cursor: default; }
</style>
<script>
/* Easter egg: "Furnace Below", a first-person hunt through generated halls, floor after floor.
   Art and sound are free CC0 assets (see egg/furnace/CREDITS.md), loaded from egg/furnace/.
   Opened by clicking "Clockwork" in the header five times quickly, or by typing "furnace" outside a text box.
   Scores go to the shared high-score list in Firestore (arcade/furnace-below/scores). Touches nothing in the app. */
(() => {
  const W = 480, H = 300, VH = 252, TS = 64, SL = 10, GW = 4, GH = 4, MW = GW * SL + 1, MH = GH * SL + 1;
  const BASE = "egg/furnace/";
  let open = false, ART = null, artLoading = null;

  // ---------- assets ----------
  const loadImg = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = BASE + src; });
  const pixels = img => { const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0);
    return new Uint32Array(x.getImageData(0, 0, img.width, img.height).data.buffer); };
  function loadArt() {
    if (ART) return Promise.resolve(ART);
    return artLoading || (artLoading = Promise.all([fetch(BASE + "frames.json").then(r => { if (!r.ok) throw 0; return r.json(); }), loadImg("walls.png"), loadImg("sprites.png"), loadImg("shotgun.png")])
      .then(([map, walls, sprites, gun]) => {
        const id = {}; map.walls.forEach((n, i) => id[n] = i);
        ART = { map, id, walls: pixels(walls), wallW: walls.width, spr: pixels(sprites), sprW: sprites.width, sprites, gun, gunN: map.shotgun };
        return ART; })
      .catch(e => { artLoading = null; throw e; }));
  }
  let ac = null; const SND = {}, SND_NAMES = ["shot", "m_alert", "m_die", "m_attack", "m_pain", "s_fire", "s_die", "door", "locked", "key", "pickup", "lever", "slam", "hurt", "click", "treasure"];
  const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch { ac = null; } return ac; };
  const loadSounds = () => { const a = audio(); if (!a) return;
    for (const n of SND_NAMES) if (!SND[n]) { SND[n] = "loading";
      fetch(`${BASE}sfx/${n}.mp3`).then(r => r.arrayBuffer()).then(b => new Promise((ok, bad) => a.decodeAudioData(b, ok, bad))).then(buf => SND[n] = buf).catch(() => { delete SND[n]; }); } };
  const play = (n, vol = 1, rate = 1) => { const b = SND[n]; if (!ac || !b || b === "loading") return;
    const s = ac.createBufferSource(), v = ac.createGain(); s.buffer = b; s.playbackRate.value = rate * (.94 + Math.random() * .12); v.gain.value = vol; s.connect(v).connect(ac.destination); s.start(); };
  const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const scoresRef = () => { try { if (window.firebase && firebase.apps && firebase.apps.length) return firebase.firestore().collection("arcade").doc("furnace-below").collection("scores"); } catch {} return null; };

  // ---------- level generator: rooms on a 4x4 grid of slots, joined by a random tree ----------
  const THEMES = [
    { base: "brick", alt: ["brick2", "brickskull"], floor: "stone2", deco: ["candles", "barrel", "torchstand"] },
    { base: "grey", alt: ["grey2", "greyvent"], floor: "stone", deco: ["barrel", "toxic", "plant"] },
    { base: "stone", alt: ["stone2", "moss", "gate"], floor: "stone2", deco: ["candles", "torchstand", "bones"] },
    { base: "teal", alt: ["teal2", "bars"], floor: "teal2", deco: ["plant", "barrel", "candles"] },
    { base: "earth", alt: ["earth2"], floor: "earth2", deco: ["bones", "barrel", "toxic"] },
    { base: "wood", alt: ["wood"], floor: "earth", deco: ["stove", "candles", "barrel"] },
    { base: "steel", alt: ["steel2", "steel3", "pipe"], floor: "steel3", deco: ["toxic", "stove", "barrel"] },
  ];
  // Interior layouts (9x9, "#" = pillar in the room's wall texture). Mirrored at random.
  const ROOMS = [
    [],
    ["2,2", "2,6", "6,2", "6,6"],
    ["2,2", "2,4", "2,6", "4,2", "4,6", "6,2", "6,4", "6,6"],
    ["3,3", "3,4", "3,5", "4,3", "4,5", "5,3", "5,4", "5,5", "4,4"],
    ["1,2", "3,2", "5,2", "7,2", "1,6", "3,6", "5,6", "7,6"],
    ["2,2", "2,3", "2,5", "2,6", "6,2", "6,3", "6,5", "6,6"],
    ["1,1", "1,7", "7,1", "7,7", "3,3", "3,5", "5,3", "5,5"],
    ["2,1", "2,2", "2,3", "6,5", "6,6", "6,7"],
  ];
  function generate(floorNo) {
    const id = ART.id, R = Math.random, ri = n => Math.floor(R() * n), pick = a => a[ri(a.length)];
    for (let attempt = 0; attempt < 40; attempt++) {
      const want = Math.min(16, 7 + floorNo + ri(2));
      const key = (x, y) => y * GW + x, rooms = new Map(), edges = [];
      const s0 = [ri(GW), ri(GH)]; rooms.set(key(...s0), { x: s0[0], y: s0[1] });
      for (let tries = 0; rooms.size < want && tries < 500; tries++) {
        const a = pick([...rooms.values()]), [dx, dy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]), nx = a.x + dx, ny = a.y + dy;
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || rooms.has(key(nx, ny))) continue;
        rooms.set(key(nx, ny), { x: nx, y: ny }); edges.push([key(a.x, a.y), key(nx, ny)]);
      }
      const adj = new Map([...rooms.keys()].map(k => [k, []])); edges.forEach(([a, b]) => { adj.get(a).push(b); adj.get(b).push(a); });
      const start = key(...s0), dist = new Map([[start, 0]]), q = [start];
      while (q.length) { const k = q.shift(); for (const n of adj.get(k)) if (!dist.has(n)) { dist.set(n, dist.get(k) + 1); q.push(n); } }
      const leaves = [...rooms.keys()].filter(k => k !== start && adj.get(k).length === 1);
      if (!leaves.length) continue;
      const exit = leaves.sort((a, b) => dist.get(b) - dist.get(a))[0];
      const others = [...rooms.keys()].filter(k => k !== start && k !== exit).sort((a, b) => dist.get(b) - dist.get(a));
      if (!others.length) continue;
      const keyRoom = others[ri(Math.max(1, Math.ceil(others.length / 2)))];
      // a loop or two (never into the exit room) so the layout isn't a pure tree
      for (const [k, r] of rooms) for (const [dx, dy] of [[1, 0], [0, 1]]) { const n = key(r.x + dx, r.y + dy);
        if (r.x + dx < GW && r.y + dy < GH && rooms.has(n) && k !== exit && n !== exit && !adj.get(k).includes(n) && R() < .18) { edges.push([k, n]); adj.get(k).push(n); adj.get(n).push(k); } }

      const grid = new Int16Array(MW * MH).fill(id.steel + 1), ftex = new Int16Array(MW * MH).fill(id.stone2), owner = new Int16Array(MW * MH).fill(-1);
      const at = (x, y) => y * MW + x, theme = new Map();
      for (const [k, r] of rooms) {
        const t = k === exit ? THEMES[6] : pick(THEMES); theme.set(k, t);
        for (let y = r.y * SL; y <= r.y * SL + SL; y++) for (let x = r.x * SL; x <= r.x * SL + SL; x++)
          grid[at(x, y)] = (R() < .12 ? id[pick(t.alt)] : id[t.base]) + 1;
      }
      for (const [k, r] of rooms) {
        const t = theme.get(k), layout = k === start || k === exit ? pick([ROOMS[0], ROOMS[1]]) : pick(ROOMS), fx = R() < .5, fy = R() < .5;
        for (let y = 1; y < SL; y++) for (let x = 1; x < SL; x++) { const c = at(r.x * SL + x, r.y * SL + y); grid[c] = 0; ftex[c] = id[t.floor]; owner[c] = k; }
        for (const p of layout) { let [py, px] = p.split(",").map(Number); if (fx) px = 8 - px; if (fy) py = 8 - py;
          grid[at(r.x * SL + 1 + px, r.y * SL + 1 + py)] = id[t.base] + 1; }
      }
      const DOOR = id.door + 1, LOCK = id.locked + 1, LEVER = id.lever + 1;
      let exitDoor = null;
      for (const [a, b] of edges) {
        const A = rooms.get(a), B = rooms.get(b), horiz = A.y === B.y, wx = horiz ? Math.max(A.x, B.x) * SL : A.x * SL + 5, wy = horiz ? A.y * SL + 5 : Math.max(A.y, B.y) * SL;
        const isExit = a === exit || b === exit, kind = isExit ? "lock" : R() < .22 ? "wide" : R() < .12 ? "open" : "door";
        if (kind === "door" || kind === "lock") { grid[at(wx, wy)] = kind === "lock" ? LOCK : DOOR; if (isExit) exitDoor = [wx, wy, horiz]; }
        else { const span = kind === "wide" ? 1 : 3;
          for (let d = -span; d <= span; d++) { const c = horiz ? at(wx, wy + d) : at(wx + d, wy); grid[c] = 0; ftex[c] = ftex[horiz ? at(wx - 1, wy) : at(wx, wy - 1)]; } }
      }
      // lever on the exit room's wall facing away from its door
      const E = rooms.get(exit), [dx0, dy0] = exitDoor;
      const cx = E.x * SL + 5, cy = E.y * SL + 5;
      const lever = dx0 === E.x * SL ? [E.x * SL + SL, cy] : dx0 === E.x * SL + SL ? [E.x * SL, cy] : dy0 === E.y * SL ? [cx, E.y * SL + SL] : [cx, E.y * SL];
      grid[at(...lever)] = LEVER;
      // reachability check from the start room centre, treating doors as passable
      const S = rooms.get(start), sx = S.x * SL + 5, sy = S.y * SL + 5;
      if (grid[at(sx, sy)]) grid[at(sx, sy)] = 0;
      const seen = new Uint8Array(MW * MH), st = [at(sx, sy)]; seen[st[0]] = 1;
      while (st.length) { const c = st.pop(), x = c % MW, y = (c - x) / MW;
        for (const n of [c + 1, c - 1, c + MW, c - MW]) { const nx = n % MW, ny = (n - nx) / MW; if (Math.abs(nx - x) + Math.abs(ny - y) !== 1 || seen[n]) continue;
          if (grid[n] === 0 || grid[n] === DOOR || grid[n] === LOCK) { seen[n] = 1; if (grid[n] === 0 || grid[n] === DOOR || grid[n] === LOCK) st.push(n); } } }
      const leverOk = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => { const n = at(lever[0] + a, lever[1] + b); return seen[n] && owner[n] === exit; });
      if (![...rooms.keys()].every(k => { const r = rooms.get(k); return seen[at(r.x * SL + 5, r.y * SL + 5)] || [...Array(81).keys()].some(i => seen[at(r.x * SL + 1 + i % 9, r.y * SL + 1 + Math.floor(i / 9))]); }) || !leverOk) continue;

      // fill the rooms
      const ents = [], used = new Set();
      const free = k => { const r = rooms.get(k), out = [];
        for (let y = 1; y < SL; y++) for (let x = 1; x < SL; x++) { const c = at(r.x * SL + x, r.y * SL + y);
          if (grid[c] === 0 && seen[c] && !used.has(c) && ![c + 1, c - 1, c + MW, c - MW].some(n => grid[n] === DOOR || grid[n] === LOCK || grid[n] === LEVER)) out.push(c); }
        return out; };
      const place = (k, kind, extra = {}) => { const f = free(k); if (!f.length) return null; const c = pick(f); used.add(c);
        const e = { kind, x: c % MW + .5 + (R() - .5) * .3, y: Math.floor(c / MW) + .5 + (R() - .5) * .3, alive: true, ...extra }; ents.push(e); return e; };
      const soldierP = Math.min(.6, .3 + floorNo * .06);
      for (const k of rooms.keys()) {
        const d = dist.get(k) ?? 1, t = theme.get(k);
        // decoration near the walls (does not block)
        for (let i = 0, n = 1 + ri(3); i < n; i++) { const f = free(k).filter(c => { const x = c % MW % SL, y = Math.floor(c / MW) % SL; return x === 1 || x === 9 || y === 1 || y === 9; });
          if (f.length) { const c = pick(f); used.add(c); ents.push({ kind: pick(t.deco), deco: true, x: c % MW + .5, y: Math.floor(c / MW) + .5, alive: true }); } }
        if (k === start) { place(k, "ammo", { item: true }); continue; }
        const nEn = Math.min(4, ri(2) + Math.floor(d / 2) + Math.floor((floorNo - 1) / 2) + (k === exit ? 1 : 0));
        for (let i = 0; i < nEn; i++) { const sol = R() < soldierP;
          place(k, sol ? "s" : "m", { foe: true, hp: (sol ? 30 : 45) + (floorNo - 1) * 6, awake: false, cd: 1 + R(), atk: 0, hurt: 0, anim: R() * 4, die: 0 }); }
        if (R() < .55) place(k, floorNo > 2 && R() < .3 ? "bigammo" : "ammo", { item: true });
        if (R() < .38) place(k, R() < .25 ? "bighealth" : "health", { item: true });
        if (R() < .33) place(k, pick(["cup", "cup", "crown", "chest"]), { item: true });
      }
      if (!place(keyRoom, "key", { item: true })) continue;
      // face the first way out of the start room
      const firstN = adj.get(start)[0], FN = rooms.get(firstN), ang = Math.atan2(FN.y - S.y, FN.x - S.x);
      return { grid, ftex, owner, ents, exit, start: { x: sx + .5, y: sy + .5, ang }, foes: ents.filter(e => e.foe).length, rooms: rooms.size };
    }
    throw new Error("level generation failed");
  }

  function launch() {
    if (open || document.getElementById("cw-egg")) return; open = true;
    const wrap = document.createElement("div"); wrap.id = "cw-doom";
    wrap.innerHTML = `<div class="box" role="dialog" aria-label="Furnace Below, a hidden game"><canvas width="${W}" height="${H}" tabindex="0"></canvas>
      <div class="tb"><button class="fs" aria-label="Full screen" title="Full screen">⛶</button><button class="x" aria-label="Close" title="Close">×</button></div>
      <button class="fire" aria-label="Fire">FIRE</button>
      <form hidden><input maxlength="16" placeholder="Your name" aria-label="Your name for the high scores" autocomplete="nickname" /><button type="submit">Save</button></form></div>`;
    document.body.appendChild(wrap);
    const cv = wrap.querySelector("canvas"), g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
    const img = g.createImageData(W, VH), buf = new Uint32Array(img.data.buffer), zbuf = new Float32Array(W);
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const keys = {}, touch = { f: 0, s: 0, fire: false }, pts = {};
    let L = null, P = null, bolts = [], st = { mode: "loading", t0: 0, msg: "", msgT: 0 }, raf = 0, last = 0, err = "";

    // high scores
    const form = wrap.querySelector("form"), nameBox = form.querySelector("input"), saveBtn = form.querySelector("button");
    const ref = scoresRef(); let top = [], board = ref ? "loading" : "offline", pending = null, note = "";
    const unsub = ref ? ref.orderBy("score", "desc").limit(3).onSnapshot(
      q => { top = q.docs.map(d => d.data()).map(x => ({ name: String(x.name || "?").slice(0, 16), score: +x.score || 0, floor: +x.floor || 1 })); board = "live"; },
      () => { board = "offline"; }) : null;
    const hideForm = () => { form.hidden = true; pending = null; cv.focus(); };
    form.addEventListener("submit", e => { e.preventDefault();
      const name = nameBox.value.trim().slice(0, 16); if (!name || !pending || !ref) return;
      saveBtn.disabled = true; store.set("cw-egg-name", name);
      ref.add({ name, score: pending.score, floor: pending.floor, at: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => { note = "Saved to the high scores."; hideForm(); }).catch(() => { note = "Couldn't save the score just now."; hideForm(); })
        .finally(() => { saveBtn.disabled = false; }); });

    const say = (m, t = 2.4) => { st.msg = m; st.msgT = t; };
    const newGame = () => { P = { x: 0, y: 0, dx: 1, dy: 0, cx: 0, cy: .66, hp: 100, ammo: 20, key: false, kills: 0, score: 0, floor: 1, bob: 0, recoil: 0, hurt: 0, glow: 0, floorT: 0, floorKills: 0, treasure: 0 };
      enterFloor(); note = ""; };
    const enterFloor = () => { L = generate(P.floor); bolts = []; P.key = false; P.floorT = 0; P.floorKills = 0; P.treasure = 0;
      P.x = L.start.x; P.y = L.start.y; P.dx = Math.cos(L.start.ang); P.dy = Math.sin(L.start.ang); P.cx = -P.dy * .66; P.cy = P.dx * .66;
      L.doors = new Map(); say(`Floor ${P.floor} · find the key, then the lever`, 3); };

    const cell = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? 1 : L.grid[y * MW + x];
    const solid = (x, y) => { const c = cell(Math.floor(x), Math.floor(y)); if (!c) return false; const d = L.doors.get(Math.floor(y) * MW + Math.floor(x)); return !(d && d.open >= 1); };
    const los = (ax, ay, bx, by) => { const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / .1); for (let i = 1; i < n; i++) if (solid(ax + (bx - ax) * i / n, ay + (by - ay) * i / n)) return false; return true; };
    const rotate = a => { const c = Math.cos(a), s = Math.sin(a); [P.dx, P.dy] = [P.dx * c - P.dy * s, P.dx * s + P.dy * c]; [P.cx, P.cy] = [P.cx * c - P.cy * s, P.cx * s + P.cy * c]; };
    const ID = () => ART.id;
    const use = (tx, ty) => {
      const c = cell(tx, ty) - 1, k = ty * MW + tx;
      if (c === ID().door || c === ID().locked) {
        if (L.doors.has(k)) return;
        if (c === ID().locked && !P.key) { if (st.msgT < 1) { say("Locked. The key is somewhere on this floor."); play("locked", .8); } return; }
        L.doors.set(k, { open: 0 }); play("door", .7); if (c === ID().locked) say("The key turns. The furnace room is open.");
      } else if (c === ID().lever && L.owner[Math.floor(P.y) * MW + Math.floor(P.x)] === L.exit) {
        play("lever", .9); play("slam", .6);
        const bonus = 500 * P.floor, tb = Math.max(0, Math.round(400 - P.floorT * 3)), all = P.floorKills >= L.foes ? 300 : 0;
        P.score += bonus + tb + all; st.clear = { bonus, tb, all, kills: P.floorKills, foes: L.foes, t: P.floorT, treasure: P.treasure };
        st.mode = "clear"; st.t0 = 0; unlock();
      }
    };
    const move = (mx, my) => { const r = .24, nx = P.x + mx, ny = P.y + my;
      const tx = Math.floor(nx + Math.sign(mx) * r), ty = Math.floor(ny + Math.sign(my) * r);
      if (mx) { if (!solid(nx + Math.sign(mx) * r, P.y)) P.x = nx; else use(tx, Math.floor(P.y)); }
      if (my) { if (!solid(P.x, ny + Math.sign(my) * r)) P.y = ny; else use(Math.floor(P.x), ty); } };
    const unlock = () => { if (document.pointerLockElement === cv) document.exitPointerLock(); };
    const hurt = n => { if (st.mode !== "play") return; P.hp -= n; P.hurt = .4; play("hurt", .8);
      if (P.hp <= 0) { P.hp = 0; st.mode = "dead"; st.t0 = 0; unlock(); play("m_die", .7, .7);
        if (board === "live" && P.score > 0 && (top.length < 3 || P.score > top[top.length - 1].score)) { pending = { score: P.score, floor: P.floor }; form.hidden = false; nameBox.value = store.get("cw-egg-name", ""); setTimeout(() => nameBox.focus(), 0); } } };

    const fire = () => {
      if (st.mode !== "play" || P.recoil > 0) return;
      if (P.ammo <= 0) { play("click"); say("Out of shells."); P.recoil = .3; return; }
      P.ammo--; P.recoil = .62; play("shot", .9);
      const ang = Math.atan2(P.dy, P.dx);
      for (const e of L.ents) if (e.foe && e.alive && Math.hypot(e.x - P.x, e.y - P.y) < 11) wake(e);
      // five pellets with a little spread
      const hits = new Map();
      for (let p = 0; p < 5; p++) { const a = ang + (p - 2) * .035 + (Math.random() - .5) * .02; let best = null, bd = 1e9;
        for (const e of L.ents) { if (!e.foe || !e.alive) continue;
          const d = Math.hypot(e.x - P.x, e.y - P.y); let da = Math.atan2(e.y - P.y, e.x - P.x) - a; da = Math.atan2(Math.sin(da), Math.cos(da));
